# Sentinel — its OWN compose project, deliberately.
#
# Operator commands and checkpoints live only in
# docs/sentinel-paper-activation.md. This file supplies the run-only CLI
# container; it does not define an activation sequence.
#
# `name:` keeps this out of the directory-derived project the Stocker compose
# files use, so `docker compose down --remove-orphans` on either side can never
# evict the other's containers — the same reasoning that gave the backtest stack
# `name: stocker-bt`, and the same accident it exists to prevent.
#
# The run-only manual surface remains behind the `cli` profile. The separately
# reviewed automation service is behind its own `automation` profile, so plain
# `docker compose up` still cannot start unattended orchestration. Its durable
# control row is initially disabled with the kill switch engaged; container
# presence and supervisor health are never execution authority.
#
# The handover is `migrate-account` and it REFUSES against a bound account, so a
# restart cannot re-attempt a liquidation. That is a property of the code and of
# a row in PostgreSQL — not, as it once was, of a file being present.
name: sentinel

services:
  sentinel-postgres:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 1g
    cpus: 1.5
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_POSTGRES_PASSWORD:?set SENTINEL_POSTGRES_PASSWORD}
      POSTGRES_DB: sentinel
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  sentinel:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
      network: host
    image: ${SENTINEL_RUNTIME_IMAGE_REF:-sentinel:latest}
    profiles: ["cli"]
    mem_limit: 4g
    cpus: 2.0
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      SENTINEL_STATE_DIR: /var/lib/sentinel
      SENTINEL_MAX_CYCLES: ${SENTINEL_MAX_CYCLES:-40}
      SENTINEL_POLL_SECONDS: ${SENTINEL_POLL_SECONDS:-5}
      SENTINEL_DATABASE_URL: postgresql://sentinel:${SENTINEL_POSTGRES_PASSWORD:?set SENTINEL_POSTGRES_PASSWORD}@sentinel-postgres:5432/sentinel
      SHARADAR_API_KEY: ${SHARADAR_API_KEY:-}
    volumes:
      - sentinel_state:/var/lib/sentinel
    depends_on:
      sentinel-postgres:
        condition: service_healthy

  sentinel-panel:
    build:
      context: .
      dockerfile: Dockerfile.sentinel
      network: host
    image: ${SENTINEL_RUNTIME_IMAGE_REF:-sentinel:latest}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["-m", "uvicorn", "sentinel.panel.app:app",
              "--host", "0.0.0.0", "--port", "8000"]
    entrypoint: ["python"]
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      SENTINEL_STATE_DIR: /var/lib/sentinel
      SENTINEL_DATABASE_URL: postgresql://sentinel:${SENTINEL_POSTGRES_PASSWORD:?set SENTINEL_POSTGRES_PASSWORD}@sentinel-postgres:5432/sentinel
      SENTINEL_REVIEWED_DEPLOYMENT_MODE: ${SENTINEL_REVIEWED_DEPLOYMENT_MODE:-}
      SENTINEL_SHADOW_OBSERVATION_ID: ${SENTINEL_SHADOW_OBSERVATION_ID:-primary}
      SENTINEL_SHADOW_STARTING_CASH: ${SENTINEL_SHADOW_STARTING_CASH:-100000}
      SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256: ${SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256:-}
      SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256: ${SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256:-}
      SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256: ${SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256:-}
      SENTINEL_GIT_COMMIT: ${SENTINEL_GIT_COMMIT:-}
      SENTINEL_RUNTIME_IMAGE_DIGEST: ${SENTINEL_RUNTIME_IMAGE_DIGEST:-}
    volumes:
      - sentinel_state:/var/lib/sentinel:ro
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      sentinel-postgres:
        condition: service_started

volumes:
  sentinel_state:
  sentinel_pgdata:
