# Owner-authorized PAPER iteration. No backup service or archive writes.
x-local-paper-environment: &local-paper-environment
  SENTINEL_LOCAL_PAPER_MODE: ${SENTINEL_LOCAL_PAPER_MODE:?owner authorization required}
  SENTINEL_LOCAL_PAPER_ACCOUNT_ID: ${SENTINEL_LOCAL_PAPER_ACCOUNT_ID:?exact paper account required}
  SENTINEL_TEST_IMAGE_DIGEST: ${SENTINEL_TEST_IMAGE_DIGEST:?actual local image required}

x-local-verification-environment: &local-verification-environment
  <<: *local-paper-environment
  SENTINEL_GIT_COMMIT: ${SENTINEL_GIT_COMMIT:?exact commit required}
  SENTINEL_RUNTIME_IMAGE_DIGEST: ${SENTINEL_RUNTIME_IMAGE_DIGEST:?exact image required}
  SENTINEL_REVIEWED_DEPLOYMENT_MODE: ${SENTINEL_REVIEWED_DEPLOYMENT_MODE:-}
  SENTINEL_SHADOW_OBSERVATION_ID: ${SENTINEL_SHADOW_OBSERVATION_ID:-primary}
  SENTINEL_SHADOW_STARTING_CASH: ${SENTINEL_SHADOW_STARTING_CASH:-50000}
  SENTINEL_SHADOW_PUBLICATION_TIMING_POLICY: ${SENTINEL_SHADOW_PUBLICATION_TIMING_POLICY:-ALPACA_OPENFIGI_VALIDATED_CLOSED_SESSION_V2}
  SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256: ${SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256:-}
  SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256: ${SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256:-}
  SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256: ${SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256:-}
  SENTINEL_REVIEWED_VALIDATION_BUNDLE_SHA256: ${SENTINEL_REVIEWED_VALIDATION_BUNDLE_SHA256:-}
  SENTINEL_PAPER_BUY_POLICY: ${SENTINEL_PAPER_BUY_POLICY:-}
  SENTINEL_PAPER_BUY_CAP_BPS: ${SENTINEL_PAPER_BUY_CAP_BPS:-}
  SENTINEL_PAPER_DEBUG_WINDOW: ${SENTINEL_PAPER_DEBUG_WINDOW:-}
  SENTINEL_STATE_DIR: /var/lib/sentinel

services:
  sentinel-postgres:
    command: ["postgres", "-c", "archive_mode=off", "-c", "archive_command="]
  sentinel:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-paper-environment
  sentinel-authorized-cli:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-paper-environment
  sentinel-automation:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-paper-environment
  sentinel-shadow:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-paper-environment
  sentinel-panel:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-verification-environment
  sentinel-alert-dispatcher:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-paper-environment
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""
  sentinel-verifier:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-verification-environment
  sentinel-execution-collector:
    image: ${SENTINEL_LOCAL_PAPER_IMAGE:?exact local image required}
    pull_policy: never
    environment:
      <<: *local-paper-environment
