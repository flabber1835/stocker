strategy_id: momentum_core_v3
description: "LIVE, 2026-08. A RANKING-LAYER rebuild from three independent lines of evidence\
  \ \u2014 no new mechanism, and the exit regime deliberately untouched.\n(1) liquidity is\
  \ an eligibility GATE, not alpha: our own marginal IC was negative in 6 of 6 windows and\
  \ two external studies agree, so its weight goes to 0 while universe.min_avg_dollar_volume_20d\
  \ keeps doing the real work.\n(2) a 252-session formation window is too slow: v1's own inline\
  \ comment, an external critique and an oracle-forensics study all point shorter, so the\
  \ blend moves [252,126] -> [126,63].\n(3) diluting momentum LOSES: every static blend tested\
  \ (breakout, trend-quality, acceleration) scored BELOW raw momentum, so the composite is\
  \ simplified rather than extended.\nearnings_surprise -> 0 for two reasons: our seasonal-random-walk\
  \ SUE is a weak stand-in for the estimate-revision data the signal actually wants, and at\
  \ weight 0 the wind tunnel can finally SCORE this config \u2014 the coverage gate refuses\
  \ any config weighting a factor Sharadar cannot reproduce, which is precisely why auto-promotion\
  \ has been paused.\nBook concentrated 35 -> 25: the decile curve is flat through its middle\
  \ and the top tier is what pays.\nEXIT REGIME UNCHANGED \u2014 target-diff exits, orphan\
  \ timer, no trailing stop, no crash brake. Those are being scored as challengers and have\
  \ no supporting evidence yet.\n\n2026-08 (second pass): EXIT REGIME SWITCHED to the auditor's\
  \ intended architecture \u2014 ranking picks entries, price manages exits. Target membership\
  \ no longer retires a holding (exit_policy=trailing_stop_only); a 30% trailing stop does,\
  \ with a 21-session cooldown rather than peak-recovery (clearing a 30% stop's peak needs\
  \ a ~43% rally, which is exclusion, not hysteresis). Drift rebalancing OFF so winners are\
  \ not trimmed back to target. selection_vol_aversion 0.2 -> 0 : book risk is vol_target's\
  \ job, and the premise here is that the ranking's top tier carries the signal.\nPREREQUISITE,\
  \ already applied: migration 0050 reconstructs position_episodes for the existing book.\
  \ Without it every peak would start at the activation date and a holding already far off\
  \ its high could never stop.\ncrash_brake ON. The live path now exists: the delta step evaluates\
  \ the state from the SAME shared module the tunnel uses, emits risk_reduce/risk_restore\
  \ intents, and both the risk gate and the executor accept them. risk_reduce is treated as\
  \ de-risking throughout (exempt from the turnover cap, ungated by staleness) because a gate\
  \ that refuses to let the book cut exposure during a market break works against its own\
  \ purpose. STILL THE THINNEST EVIDENCE in the config: calibrated on a 2014-2018 panel containing\
  \ no real crash. portfolio_drawdown_guard on in observe_only \u2014 it reports, never trades.\n\
  min_non_null_factors_scope: weighted, and the count lowered 4 -> 3 to match required_factors\
  \ exactly. Under the default 'all' scope the seven ZERO-WEIGHT factors still counted toward\
  \ eligibility, so liquidity and earnings_surprise could admit or reject a security while\
  \ contributing nothing to its score \u2014 incoherent once their weights went to 0. Eligibility\
  \ is now precisely 'has momentum, quality and value', which is what required_factors already\
  \ says; nothing hidden adds to it.\n
  \n2026-08-03 TEMPORARY CONVERGENCE WINDOW \u2014 exit_policy is target_diff, NOT
  \ trailing_stop_only. REVERT IT after the book reaches 25 names (expected 2 builds).\n
  \ Why: the live book was built by the OLD 35-name config, and stop-only has no
  \ migration path from a portfolio it did not build. Target membership retires
  \ nothing, so 23 held names sat permanently out of target while 13 target names
  \ \u2014 including ranks #2 and #5 \u2014 queued as `watch` behind a full book. The
  \ policy was frozen in the previous strategy while appearing to run this one, which
  \ would have invalidated every week of live evidence collected in the meantime.\n
  \ target_diff lets the orphan timer (orphan_confirmation_days=2) retire the 23 over
  \ two builds; the 13 entries then fill and the book IS the v3 book. The trailing stop
  \ stays ON throughout \u2014 both exits are additive, so nothing is unprotected during
  \ the window.\n
  \ REVERT: set delta_engine.exit_policy back to trailing_stop_only once the realized
  \ book is 25 names. Leaving it on target_diff silently cancels the stop-only
  \ experiment, because the orphan timer would keep retiring names on rank \u2014 the
  \ exact coupling this strategy exists to remove.\n"
universe:
  source: av_listing
  min_price: 5.0
  min_avg_dollar_volume_20d: 20000000
factor_engine:
  momentum_short_window: 21
  momentum_long_window: 126
  volatility_window: 252
  liquidity_window: 20
  pe_pb_cap: 50.0
  spy_price_lookback_days: 600
  quality_use_gross_profitability: true
  momentum_method: residual
  momentum_blend_windows:
  - 126
  - 63
  sue_method: seasonal_random_walk
regime_detection:
