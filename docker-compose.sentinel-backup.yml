# Required durability overlay for the canonical Sentinel database.
#
# SENTINEL_BACKUP_DIR must be an operator-owned path on a second durable target
# (NAS backup dataset, mounted backup share, or equivalent), never the repository
# or Docker's sentinel_pgdata volume. See docs/sentinel-deployment.md.
services:
  sentinel-postgres:
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300s
      - -c
      - 'archive_command=/bin/sh /usr/local/libexec/sentinel-archive-wal.sh "%p" "%f" /sentinel-backup/wal'
    volumes:
      - type: bind
        source: ./scripts/sentinel-archive-wal.sh
        target: /usr/local/libexec/sentinel-archive-wal.sh
        read_only: true
      - type: bind
        source: ${SENTINEL_BACKUP_DIR:?set SENTINEL_BACKUP_DIR to a second durable target}/wal
        target: /sentinel-backup/wal
      - type: bind
        source: ${SENTINEL_BACKUP_DIR:?set SENTINEL_BACKUP_DIR to a second durable target}/base
        target: /sentinel-backup/base
    # A bind mount can silently land on the underlying local directory when an
    # external filesystem failed to mount before Docker starts. The host backup
    # validator installs this marker only after proving the independent target.
    # Unattended broker/data services already wait for PostgreSQL health, so a
    # cold boot cannot acquire economic authority against a fallback directory.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U sentinel -h 127.0.0.1
          && test -f /sentinel-backup/wal/.sentinel-independent-durable-target-v1
          && test ! -L /sentinel-backup/wal/.sentinel-independent-durable-target-v1
          && grep -qx 'sentinel-independent-durable-target-v1' /sentinel-backup/wal/.sentinel-independent-durable-target-v1
          && test -f /sentinel-backup/base/.sentinel-independent-durable-target-v1
          && test ! -L /sentinel-backup/base/.sentinel-independent-durable-target-v1
          && grep -qx 'sentinel-independent-durable-target-v1' /sentinel-backup/base/.sentinel-independent-durable-target-v1
      interval: 5s
      timeout: 5s
      retries: 20
