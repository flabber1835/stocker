name: Backtester - causal split overrides verification

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-causal-split-overrides-verify.yml'
      - 'backtester/diagnostics/verify_causal_split_overrides.py'
      - 'backtester/causal_split_overrides.py'
      - 'backtester/data/causal-split-overrides-v1.json'
      - 'backtester/data/causal-split-overrides-v1.SHA256'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify frozen split adjudications
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-causal-split-overrides-verify.yml
            /backtester/diagnostics/verify_causal_split_overrides.py
            /backtester/causal_split_overrides.py
            /backtester/data/causal-split-overrides-v1.json
            /backtester/data/causal-split-overrides-v1.SHA256
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_*.csv.gz

      - name: Record research identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_LAB_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_SPLIT_OVERRIDE_VERIFY_OUTPUT=${GITHUB_WORKSPACE}/backtester-results/causal-split-overrides-verify.json" >> "${GITHUB_ENV}"

      - name: Check out exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - name: Verify exact main identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "c502d077cae9c494f8b74a41ee8be7f40b25837d"
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact main runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Compile verification sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backtester/causal_split_overrides.py
          python -m py_compile backtester/diagnostics/verify_causal_split_overrides.py
          python -m py_compile backtester/experiments/2026-08-27-sector-abc/run.py
          (cd backtester/data && sha256sum -c causal-split-overrides-v1.SHA256)

      - name: Exercise exact frozen-main normalization
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p backtester-results
          python backtester/diagnostics/verify_causal_split_overrides.py 2>&1 | tee backtester-causal-split-overrides-verify.log

      - name: Verify evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('backtester-results/causal-split-overrides-verify.json').read_text())
          frozen=json.loads(Path('backtester/data/causal-split-overrides-v1.json').read_text())
          expected_count=len(frozen['records'])
          if evidence.get('status')!='PASS' or evidence.get('override_count')!=expected_count:
              raise SystemExit(f"invalid split override verification: {evidence.get('status')} {evidence.get('override_count')} expected={expected_count}")
          print(json.dumps({'status':'PASS','override_count':expected_count,'sha256':evidence.get('split_override_sha256')},sort_keys=True))
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-causal-split-overrides-verify-${{ github.run_id }}
          path: |
            backtester-results/causal-split-overrides-verify.json
            backtester-causal-split-overrides-verify.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
