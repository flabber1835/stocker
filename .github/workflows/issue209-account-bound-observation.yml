name: Apply issue 209 account-bound observation

on:
  push:
    branches:
      - fix/issue-209-financial-grade-trial
    paths:
      - tools/issue209-account-bound-observation.py
      - .github/workflows/issue209-account-bound-observation.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/issue209-account-bound-observation.py
      - .github/workflows/issue209-account-bound-observation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: fix/issue-209-financial-grade-trial
      - name: Apply and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue209-account-bound-observation.py
          git diff --check
          python -m compileall -q sentinel/execution/contract.py sentinel/execution/alpaca.py sentinel/execution/simulator.py sentinel/execution/reconcile.py sentinel/execution/journal.py sentinel/schema.py tests/sentinel/test_issue209_account_bound_observation.py
      - name: Commit production patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sentinel/execution/contract.py sentinel/execution/alpaca.py sentinel/execution/simulator.py sentinel/execution/reconcile.py sentinel/execution/journal.py sentinel/schema.py tests/sentinel/test_issue209_account_bound_observation.py
          git rm -- tools/issue209-account-bound-observation.py .github/workflows/issue209-account-bound-observation.yml
          git commit -m 'Bind broker observations to account identity (#128 #209)'
          git pull --rebase origin fix/issue-209-financial-grade-trial
          git push origin HEAD:fix/issue-209-financial-grade-trial
