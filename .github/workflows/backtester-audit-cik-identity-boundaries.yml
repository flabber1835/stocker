name: Backtester - audit CIK identity boundaries

on:
  push:
    branches: [research/backtester]
    paths:
      - 'backtester/strict_pit_metadata.py'
      - 'backtester/production_public_reporting.py'
      - 'backtester/diagnostics/audit_cik_identity_boundaries.py'
      - 'tests/backtester/test_identity_reporting_regressions.py'
      - '.github/workflows/backtester-audit-cik-identity-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-audit-cik-identity-boundaries.yml
            /backtester/strict_pit_metadata.py
            /backtester/production_public_reporting.py
            /backtester/diagnostics/audit_cik_identity_boundaries.py
            /tests/backtester/test_identity_reporting_regressions.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /backtester/data/causal-terminal-terms-v1.json
            /sharadar/SHARADAR_SEP_*.csv.gz

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install audit dependencies
        run: python -m pip install pandas==3.0.5 pytest==8.4.2

      - name: Run identity and reporting regressions
        run: python -m pytest -q tests/backtester/test_identity_reporting_regressions.py

      - name: Audit all CIK identity boundaries
        env:
          BACKTESTER_LAB_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          mkdir -p backtester-results
          python -m backtester.diagnostics.audit_cik_identity_boundaries | tee cik-identity-boundary-audit.log

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cik-identity-boundary-audit-${{ github.run_id }}
          path: |
            backtester-results/cik-identity-boundary-audit.json
            backtester-results/cik-identity-boundaries.csv.gz
            cik-identity-boundary-audit.log
          if-no-files-found: warn
          retention-days: 30
