name: RETIRED - legacy combined strict PIT certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: HISTORICAL_EVIDENCE_ONLY
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse legacy certification authority
        shell: bash
        run: |
          {
            echo '## HISTORICAL_EVIDENCE_ONLY'
            echo
            echo 'This legacy combined replay is retired as a certification authority.'
            echo 'Use the official Production or Research backtest workflows; both terminate at the common PIT finalizer.'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
