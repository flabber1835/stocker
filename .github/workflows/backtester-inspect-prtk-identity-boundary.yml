name: Backtester - inspect PRTK identity boundary
on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-inspect-prtk-identity-boundary.yml'
      - 'backtester/diagnostics/inspect_prtk_identity_split_boundary.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-inspect-prtk-identity-boundary.yml
            /backtester/diagnostics/inspect_prtk_identity_split_boundary.py
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_2009.csv.gz
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pandas
        run: python -m pip install pandas==3.0.5
      - name: Inspect
        env:
          BACKTESTER_LAB_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p backtester-results
          python backtester/diagnostics/inspect_prtk_identity_split_boundary.py | tee prtk-identity-boundary.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prtk-identity-boundary-${{ github.run_id }}
          path: |
            backtester-results/prtk-identity-split-boundary.json
            prtk-identity-boundary.log
          retention-days: 30
