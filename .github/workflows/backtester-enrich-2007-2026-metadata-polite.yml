name: Backtester - polite parallel 2007-2026 metadata reconstruction
run-name: Polite parallel SEC metadata 2007-2026 — ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [research/enrich-pit-2007-2026-metadata]
    paths:
      - '.github/workflows/backtester-enrich-2007-2026-metadata-polite.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: reconstruct-2007-2026-historical-metadata
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare 2007-2026 candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANONICAL: backtester-results/canonical-pit-20y
      CANDIDATES: backtester-results/metadata-candidates-2007-2026
      POINTER: backtester/data/canonical-pit-20y.json
      EXISTING: research/sentinel-fastgate/pit-evidence/generated
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e shared

      - name: Verify reconstruction code and retained SEC inputs
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/prepare_historical_metadata_year_candidates.py \
            backtester/reconstruct_historical_metadata_year.py \
            backtester/run_reconstruct_historical_metadata_year_polite.py
          python -m unittest tests.backtester.test_reconstruct_historical_metadata_year -v
          (cd "${EXISTING}" && sha256sum -c SHA256SUMS.txt && sha256sum -c SEC_SIC_SHA256SUMS.txt)

      - name: Pull and authenticate frozen canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          CONTAINER=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true' EXIT
          rm -rf "${CANONICAL}" && mkdir -p "${CANONICAL}"
          docker cp "${CONTAINER}:/canonical-pit/." "${CANONICAL}"
          docker rm "${CONTAINER}"
          trap - EXIT
          python backtester/canonical_pit_package.py verify --pointer "${POINTER}" --dataset "${CANONICAL}"

      - name: Prepare per-year candidate shards with visible progress
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python backtester/prepare_historical_metadata_year_candidates.py \
            --canonical-dataset "${CANONICAL}" \
            --output "${CANDIDATES}" \
            --from-year 2007 \
            --through-year 2026

      - name: Acquire one SEC discovery index for all year runners
        run: |
          set -euo pipefail
          mkdir -p "${CANDIDATES}/discovery"
          curl --fail --location --retry 8 --retry-all-errors \
            --user-agent 'stocker-historical-metadata-certification/1.0 contact=m.bron01@gmail.com' \
            https://www.sec.gov/files/company_tickers.json \
            -o "${CANDIDATES}/discovery/sec_company_tickers.json"
          (
            cd "${CANDIDATES}"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload candidate shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-candidates-2007-2026-${{ github.sha }}
          path: backtester-results/metadata-candidates-2007-2026/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  harvest:
    name: SEC metadata ${{ matrix.year }} — LIVE PROGRESS
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    env:
      YEAR: ${{ matrix.year }}
      CANDIDATES: backtester-results/metadata-candidates-2007-2026
      EXISTING: research/sentinel-fastgate/pit-evidence/generated
      OUT: backtester-results/historical-metadata-${{ matrix.year }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Download authenticated candidate shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: metadata-candidates-2007-2026-${{ github.sha }}
          path: backtester-results/metadata-candidates-2007-2026

      - name: Verify candidate shard and harvester
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/reconstruct_historical_metadata_year.py \
            backtester/run_reconstruct_historical_metadata_year_polite.py
          (cd "${CANDIDATES}" && sha256sum -c SHA256SUMS.txt)
          test -s "${CANDIDATES}/candidates-${YEAR}.csv.gz"
          echo "::notice title=SEC pacing::At most 2 yearly runners at once. Each runner waits at least 4 seconds per SEC request. HTTP status and cooldown are printed live."

      - name: Harvest ${{ matrix.year }} SEC evidence — LIVE PROGRESS
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          python backtester/run_reconstruct_historical_metadata_year_polite.py \
            --target-year "${YEAR}" \
            --candidates "${CANDIDATES}/candidates-${YEAR}.csv.gz" \
            --existing-ticker-cik "${EXISTING}/sec_cik_change_events.csv.gz" \
            --discovery-tickers "${CANDIDATES}/discovery/sec_company_tickers.json" \
            --output "${OUT}/evidence" \
            --delay 4.0 \
            --progress-every 10 \
            2>&1 | tee "${OUT}/reconstruction.log"

      - name: Verify year evidence
        run: |
          set -euo pipefail
          (cd "${OUT}/evidence" && sha256sum -c SHA256SUMS.txt)

      - name: Upload ${{ matrix.year }} evidence and log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-year-${{ matrix.year }}-polite-${{ github.sha }}
          path: backtester-results/historical-metadata-${{ matrix.year }}/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
