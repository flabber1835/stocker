name: Backtester - RETIRED invalid 2007-2026 metadata V1
run-name: Retire invalid 2007-2026 metadata V1 — ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [research/enrich-pit-2007-2026-metadata]
    paths:
      - '.github/workflows/backtester-enrich-2007-2026-metadata-polite.yml'

permissions:
  contents: read

concurrency:
  group: reconstruct-2007-2026-historical-metadata
  cancel-in-progress: true

jobs:
  retire:
    name: V1 retired — no evidence produced
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retire invalid workflow
        run: |
          echo 'This V1 SEC metadata reconstruction workflow is retired.'
          echo 'It MUST NOT produce or publish certification evidence.'
          echo 'The replacement V2 architecture is implemented separately.'
