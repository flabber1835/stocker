name: ABC peer remote inventory
on:
  push:
    branches: [research/abc-peer-comparison-2026-08-27]
    paths: ['.github/workflows/abc-peer-remote-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download retained archives without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, requests
          repo='flabber1835/stocker'; ref='research/sentinel-fastgate-2026-08-24'
          paths=['docs/Sentinel_1_1_Frozen_Harness_Handoff.zip','docs/Sentinel_1_1_Faithful_Reproduction_Kit_NO_SHARADAR.zip','docs/Sentinel_1_1_Terminal_and_Issuer_Corrected.zip']
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'}
          for p in paths:
              u=f'https://api.github.com/repos/{repo}/contents/{p}?ref={ref}'
              r=requests.get(u,headers=h,timeout=120); r.raise_for_status()
              fn=p.split('/')[-1]; open(fn,'wb').write(r.content); print(fn,len(r.content))
          PY
      - name: Inventory
        run: |
          set -euo pipefail
          for z in *.zip; do
            echo "=== $z ==="
            unzip -l "$z" | grep -Ei '(\.py|\.csv|\.pkl|\.json|\.md)$' | head -n 1000 || true
          done
