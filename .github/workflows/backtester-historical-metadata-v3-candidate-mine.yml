name: Backtester - historical metadata V3 candidate mine
run-name: Historical metadata V3 candidate mine — ${{ github.sha }}

on:
  push:
    branches: [research/enrich-pit-2007-2026-metadata]
    paths:
      - '.github/workflows/backtester-historical-metadata-v3-candidate-mine.yml'
      - 'backtester/mine_historical_metadata_candidates_v3.py'
      - 'tests/backtester/test_metadata_v3_candidate_miner.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RAW_RUN_ID: '33468938050'
  RAW_SOURCE_SHA: '431686edffef158ff61c122c977ff2c7c18b7036'
  INVENTORY_RUN_ID: '33703864783'
  INVENTORY_ARTIFACT: historical-metadata-v2-unresolved-inventory-cba46936b0d2627b11fab09e465f261fc7c67659
  INVENTORY_ROOT: backtester-results/unresolved-inventory

jobs:
  gate:
    name: V3 candidate-miner fail-closed regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate-miner source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Compile and run evidence-only regression
        run: |
          set -euo pipefail
          python -m compileall -q backtester/mine_historical_metadata_candidates_v3.py tests/backtester/test_metadata_v3_candidate_miner.py
          python - <<'PY'
          import runpy, tempfile
          from pathlib import Path
          ns = runpy.run_path('tests/backtester/test_metadata_v3_candidate_miner.py')
          with tempfile.TemporaryDirectory() as td:
              ns['test_v3_candidate_miner_is_evidence_only_and_can_bootstrap_discovery_hint'](Path(td))
          print({'status':'PASS','contract':'candidate miner emits no admission decision'})
          PY

  mine:
    name: Mine frozen SEC shard ${{ matrix.shard }} (attempt ${{ matrix.attempt }})
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {shard: '00', attempt: 1}
          - {shard: '01', attempt: 1}
          - {shard: '02', attempt: 1}
          - {shard: '03', attempt: 1}
          - {shard: '04', attempt: 1}
          - {shard: '05', attempt: 1}
          - {shard: '06', attempt: 1}
          - {shard: '07', attempt: 1}
          - {shard: '08', attempt: 3}
          - {shard: '09', attempt: 1}
          - {shard: '10', attempt: 1}
          - {shard: '11', attempt: 1}
          - {shard: '12', attempt: 2}
          - {shard: '13', attempt: 2}
          - {shard: '14', attempt: 2}
          - {shard: '15', attempt: 2}
          - {shard: '16', attempt: 2}
          - {shard: '17', attempt: 3}
          - {shard: '18', attempt: 2}
          - {shard: '19', attempt: 2}
          - {shard: '20', attempt: 2}
          - {shard: '21', attempt: 1}
          - {shard: '22', attempt: 1}
          - {shard: '23', attempt: 1}
          - {shard: '24', attempt: 1}
          - {shard: '25', attempt: 1}
          - {shard: '26', attempt: 1}
          - {shard: '27', attempt: 1}
          - {shard: '28', attempt: 1}
          - {shard: '29', attempt: 1}
          - {shard: '30', attempt: 1}
          - {shard: '31', attempt: 1}
    env:
      SHARD_ROOT: backtester-results/raw-shard-${{ matrix.shard }}
      OUTPUT: backtester-results/v3-candidates-${{ matrix.shard }}
    steps:
      - name: Check out candidate-miner source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Download immutable unresolved inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.INVENTORY_ARTIFACT }}
          path: ${{ env.INVENTORY_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.INVENTORY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download one authoritative completed raw SEC shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: metadata-v2-resilient-shard-${{ matrix.shard }}-attempt-${{ matrix.attempt }}-${{ env.RAW_SOURCE_SHA }}
          path: ${{ env.SHARD_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RAW_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Mine exact-ticker identity, class, and SIC candidates
        run: |
          set -euo pipefail
          python -m backtester.mine_historical_metadata_candidates_v3 mine \
            --shard-root "${SHARD_ROOT}" \
            --inventory "${INVENTORY_ROOT}/unresolved_episode_analysis.csv.gz" \
            --output "${OUTPUT}" \
            --shard "${{ matrix.shard }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.load(open(Path(os.environ['OUTPUT'])/'summary.json'))
          assert s['status']=='PASS' and s['candidate_only'] is True and s['admission_effect']=='NONE'
          print(json.dumps(s, indent=2, sort_keys=True))
          PY
      - name: Upload shard candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-v3-candidates-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 90

  merge:
    name: Merge V3 evidence candidates and quantify recoverable episodes
    needs: mine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate-miner source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Download all small candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: metadata-v3-candidates-*-${{ github.sha }}
          path: backtester-results/v3-candidate-artifacts
          merge-multiple: false
      - name: Merge candidates without admitting them
        run: |
          set -euo pipefail
          python -m backtester.mine_historical_metadata_candidates_v3 merge \
            --inputs backtester-results/v3-candidate-artifacts \
            --output backtester-results/v3-candidate-merged \
            --expected-shards 32
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backtester-results/v3-candidate-merged/summary.json')
          s=json.load(open(p))
          assert s['status']=='PASS'
          assert s['candidate_only'] is True
          assert s['admission_effect']=='NONE'
          print(json.dumps(s, indent=2, sort_keys=True))
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as fh:
              fh.write('# V3 historical metadata candidate mine\n\n')
              fh.write(f"Candidate rows: **{s['candidate_rows']:,}**\n\n")
              fh.write(f"Discovery-hint episodes with strong exact-ticker identity candidate: **{s['discovery_hint_episodes_with_strong_identity_bootstrap_candidate']:,}**\n\n")
              fh.write(f"Episodes with current-form type candidate: **{s['episodes_with_current_form_type_candidate']:,}**\n\n")
              fh.write(f"Episodes with extended-form type candidate: **{s['episodes_with_extended_form_type_candidate']:,}**\n\n")
              fh.write(f"Episodes with SIC candidate: **{s['episodes_with_sic_candidates']:,}**\n\n")
              fh.write('**No candidate was admitted. A separate authority/allocation gate is required.**\n')
          PY
      - name: Upload merged V3 candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-v3-candidates-${{ github.sha }}
          path: backtester-results/v3-candidate-merged
          if-no-files-found: error
          retention-days: 90
