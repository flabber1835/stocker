name: Internal state harness

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      seeds:
        description: Generated campaign size
        type: number
        default: 128

permissions:
  contents: read

concurrency:
  group: internal-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install locked dependencies and real PostgreSQL tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Validate test ownership and reject new incident-named suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python tools/validate_test_responsibility.py --base "$BASE_SHA" --output artifacts/contract/test-responsibility.json
          else
            python tools/validate_test_responsibility.py --output artifacts/contract/test-responsibility.json
          fi
      - name: Run independent invariant and replay-contract checks once
        env:
          PYTEST_ADDOPTS: '-p tests.internal_state.ci_gate'
          INTERNAL_STATE_SUITE_EVIDENCE: artifacts/contract/suites
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract
          git rev-parse HEAD > artifacts/contract/tested-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/contract/tested-tree.txt
          python -m pytest tests/internal_state -q -ra --junitxml=artifacts/contract/junit.xml
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-contract-${{ matrix.scope }}
          path: artifacts/contract/
          if-no-files-found: error

  lifecycle:
    name: state-${{ matrix.scope }}-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
        shard: [0, 1, 2, 3]
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install locked dependencies and real PostgreSQL tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Run assigned composed lifecycle and seeded adversarial campaign
        env:
          CAMPAIGN_SEEDS: ${{ inputs.seeds || 16 }}
          CAMPAIGN_SHARD: ${{ matrix.shard }}
        run: python tools/internal_state_harness.py --seeds "$CAMPAIGN_SEEDS" --shard "$CAMPAIGN_SHARD" --shards 4 --output artifacts/lifecycle
      - name: Retain exact inputs, snapshots and first failing invariant
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-lifecycle-${{ matrix.scope }}-${{ matrix.shard }}
          path: artifacts/lifecycle/
          if-no-files-found: error

  core-infrastructure:
    name: core-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install locked dependencies and PostgreSQL
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Run explicitly owned small infrastructure suites
        run: python tools/core_infrastructure_suite.py
      - name: Retain core-infrastructure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-core-${{ matrix.scope }}
          path: artifacts/core-infrastructure/
          if-no-files-found: error

  complete-evidence:
    name: evidence-${{ matrix.scope }}
    needs: [contract, lifecycle, core-infrastructure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: internal-state-*-${{ matrix.scope }}*
          path: evidence
      - name: Require complete evidence for exactly this source tree
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          python tools/verify_internal_state_evidence.py evidence --commit "$commit" --tree "$tree" | tee verified-evidence.json
          cat verified-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-verdict-${{ matrix.scope }}
          path: verified-evidence.json
          if-no-files-found: error
