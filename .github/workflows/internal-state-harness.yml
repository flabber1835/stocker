name: Internal state harness

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      seeds:
        description: Generated campaign size
        type: number
        default: 128

permissions:
  contents: read

concurrency:
  group: internal-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_commit: ${{ steps.verifier-source.outputs.commit }}
      source_tree: ${{ steps.verifier-source.outputs.tree }}
      source_archive_sha256: ${{ steps.verifier-source.outputs.archive_sha256 }}
      source_run_id: ${{ steps.verifier-source.outputs.run_id }}
      source_run_attempt: ${{ steps.verifier-source.outputs.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["synthetic-merge"]' || '["exact-head"]') }}
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - name: Capture the tested verifier source for the final evidence gate
        id: verifier-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          archive=artifacts/contract/verifier-source.tar
          git archive --format=tar "$commit" tools/verify_internal_state_evidence.py sentinel/requirements.lock tests/requirements.lock > "$archive"
          checksum="$(sha256sum "$archive")"
          printf 'commit=%s\ntree=%s\narchive_sha256=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$commit" "$tree" "${checksum%% *}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            sentinel/requirements.lock
            tests/requirements.lock
      - name: Install locked dependencies and real PostgreSQL tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Validate test ownership and reject new incident-named suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python tools/validate_test_responsibility.py --base "$BASE_SHA" --output artifacts/contract/test-responsibility.json
          else
            python tools/validate_test_responsibility.py --output artifacts/contract/test-responsibility.json
          fi
      - name: Run independent invariant and replay-contract checks once
        env:
          PYTEST_ADDOPTS: '-p tests.internal_state.ci_gate'
          INTERNAL_STATE_SUITE_EVIDENCE: artifacts/contract/suites
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract
          git rev-parse HEAD > artifacts/contract/tested-commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/contract/tested-tree.txt
          python -m pytest tests/internal_state -q -ra --junitxml=artifacts/contract/junit.xml
          python tools/verify_test_owner_execution.py --owner internal-state.contract \
            --junit artifacts/contract/junit.xml \
            --output artifacts/contract/test-owner.json
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-contract-${{ matrix.scope }}
          path: artifacts/contract/
          if-no-files-found: error

  lifecycle:
    name: state-${{ matrix.scope }}-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["synthetic-merge"]' || '["exact-head"]') }}
        shard: [0, 1, 2, 3]
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            sentinel/requirements.lock
            tests/requirements.lock
      - name: Install locked dependencies and real PostgreSQL tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Run assigned composed lifecycle and seeded adversarial campaign
        env:
          CAMPAIGN_SEEDS: ${{ inputs.seeds || 16 }}
          CAMPAIGN_SHARD: ${{ matrix.shard }}
        run: python tools/internal_state_harness.py --seeds "$CAMPAIGN_SEEDS" --shard "$CAMPAIGN_SHARD" --shards 4 --output artifacts/lifecycle
      - name: Retain exact inputs, snapshots and first failing invariant
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-lifecycle-${{ matrix.scope }}-${{ matrix.shard }}
          path: artifacts/lifecycle/
          if-no-files-found: error

  core-infrastructure:
    name: core-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["synthetic-merge"]' || '["exact-head"]') }}
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            sentinel/requirements.lock
            tests/requirements.lock
      - name: Install locked dependencies and PostgreSQL
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Run explicitly owned small infrastructure suites
        run: |
          python tools/core_infrastructure_suite.py
          python tools/verify_test_owner_execution.py --owner core.infrastructure \
            --junit artifacts/core-infrastructure/junit.xml \
            --output artifacts/core-infrastructure/test-owner.json
      - name: Retain core-infrastructure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-core-${{ matrix.scope }}
          path: artifacts/core-infrastructure/
          if-no-files-found: error

  complete-evidence:
    name: evidence-${{ matrix.scope }}
    needs: [contract, lifecycle, core-infrastructure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["synthetic-merge"]' || '["exact-head"]') }}
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      EVIDENCE_SCOPE: ${{ matrix.scope }}
      SOURCE_COMMIT: ${{ needs.contract.outputs.source_commit }}
      SOURCE_TREE: ${{ needs.contract.outputs.source_tree }}
      SOURCE_ARCHIVE_SHA256: ${{ needs.contract.outputs.source_archive_sha256 }}
      SOURCE_RUN_ID: ${{ needs.contract.outputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.contract.outputs.source_run_attempt }}
    steps:
      - name: Require successful prerequisites and current-attempt source authority
        id: validate-source-authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          needs = json.loads(os.environ['NEEDS_JSON'])
          expected = {'contract', 'lifecycle', 'core-infrastructure'}
          if set(needs) != expected:
              raise SystemExit('Missing or extra prerequisite jobs')
          for name, dependency in needs.items():
              if dependency.get('result') != 'success':
                  raise SystemExit(f'Prerequisite {name} did not succeed: {dependency.get("result")}')
          if (os.environ['SOURCE_RUN_ID'] != os.environ['GITHUB_RUN_ID']
                  or os.environ['SOURCE_RUN_ATTEMPT'] != os.environ['GITHUB_RUN_ATTEMPT']):
              raise SystemExit('Verifier source belongs to a different workflow run or attempt')
          for name, length in [('SOURCE_COMMIT', 40), ('SOURCE_TREE', 40), ('SOURCE_ARCHIVE_SHA256', 64)]:
              if not re.fullmatch(f'[0-9a-f]{{{length}}}', os.environ[name]):
                  raise SystemExit(f'Missing or invalid verifier source authority: {name}')
          print('All prerequisites passed; verifier source is bound to the current run and attempt')
          PY
      - name: Download evidence from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: internal-state-*-${{ matrix.scope }}*
          path: evidence
      - name: Verify and restore the tested source without a repository checkout
        id: restore-verifier-source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, tarfile
          from pathlib import Path
          archive = Path('evidence') / f'internal-state-contract-{os.environ["EVIDENCE_SCOPE"]}' / 'verifier-source.tar'
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          if checksum != os.environ['SOURCE_ARCHIVE_SHA256']:
              raise SystemExit('Verifier source archive checksum mismatch')
          expected = ['sentinel/requirements.lock', 'tests/requirements.lock', 'tools/verify_internal_state_evidence.py']
          with tarfile.open(archive) as bundle:
              members = [member for member in bundle.getmembers() if not member.isdir()]
              if sorted(member.name for member in members) != expected or not all(member.isfile() for member in members):
                  raise SystemExit('Verifier source archive must contain exactly the verifier and two regular lockfiles')
              bundle.extractall('verifier-source', members=members, filter='data')
          print(f'Verified source commit={os.environ["SOURCE_COMMIT"]} tree={os.environ["SOURCE_TREE"]} archive_sha256={checksum}')
          PY
      - name: Require complete evidence for exactly this source tree
        id: verify-complete-evidence
        shell: bash
        run: |
          set -euo pipefail
          python verifier-source/tools/verify_internal_state_evidence.py evidence --commit "$SOURCE_COMMIT" --tree "$SOURCE_TREE" | tee verified-evidence.json
          cat verified-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-verdict-${{ matrix.scope }}
          path: verified-evidence.json
          if-no-files-found: error
