name: Internal state harness

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      seeds:
        description: Generated campaign size
        type: number
        default: 128

permissions:
  contents: read

concurrency:
  group: internal-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: state-${{ matrix.scope }}-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
        shard: [0, 1, 2, 3]
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install locked dependencies and real PostgreSQL tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Falsify replay and independent invariant checks
        run: python -m pytest tests/internal_state -q -ra --junitxml=artifacts/contract.xml
      - name: Run composed lifecycle and seeded adversarial campaign
        env:
          CAMPAIGN_SEEDS: ${{ inputs.seeds || 16 }}
          CAMPAIGN_SHARD: ${{ matrix.shard }}
        run: python tools/internal_state_harness.py --seeds "$CAMPAIGN_SEEDS" --shard "$CAMPAIGN_SHARD" --shards 4 --output artifacts/lifecycle
      - name: Retain exact inputs, snapshots and first failing invariant
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-${{ matrix.scope }}-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error

  full-suite:
    name: full-suite-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
    env:
      PYTHONPATH: shared
      ALPACA_HARNESS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Install supported dependencies and PostgreSQL
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Run all supported repository test suites
        env:
          PYTEST_ADDOPTS: '-p tests.internal_state.ci_gate'
          INTERNAL_STATE_SUITE_EVIDENCE: artifacts/suites
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/tested-commit.txt
          python tools/internal_state_full_suite.py 2>&1 | tee artifacts/full-suite.txt
      - name: Retain full suite result and existing golden exclusions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-state-full-suite-${{ matrix.scope }}
          path: artifacts/
          if-no-files-found: error
