name: issue-250-apply

on:
  push:
    branches:
      - codex/issue-250-sharadar-ingress

permissions:
  contents: write

concurrency:
  group: issue-250-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct transformer cardinality and apply
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_issue250_phase1.py")
          text = path.read_text()
          start = text.index(
              'replace_once(\n    "sentinel/feed/universe.py",\n'
              '    "      ORDER BY snapshot_date DESC,candidate DESC),NULL))[1]",')
          end_marker = (
              '# Same text appears twice (first and last bounds); replace the remaining copy.\n'
              'replace_once(\n    "sentinel/feed/universe.py",\n'
              '    "      ORDER BY snapshot_date DESC,candidate DESC),NULL))[1]",\n'
              '    "      ORDER BY candidate DESC,snapshot_date DESC),NULL))[1]",\n'
              ')\n')
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''target = Path("sentinel/feed/universe.py")
          text = target.read_text()
          old_order = "      ORDER BY snapshot_date DESC,candidate DESC),NULL))[1]"
          new_order = "      ORDER BY candidate DESC,snapshot_date DESC),NULL))[1]"
          if text.count(old_order) != 2:
              raise RuntimeError(
                  f"sentinel/feed/universe.py: expected two candidate-order clauses, "
                  f"found {text.count(old_order)}")
          target.write_text(text.replace(old_order, new_order))
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python tools/apply_issue250_phase1.py
      - name: Static validation
        run: |
          git diff --check
          python -m compileall -q sentinel tests/sentinel/test_issue_250_source_authority.py tests/sentinel/test_issue_246_identity_rebuild.py
      - name: Commit implementation and remove one-shot machinery
        run: |
          rm -f tools/apply_issue250_phase1.py .github/workflows/issue250-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feed: close Sharadar source and identity authority gaps"
          git push origin HEAD:codex/issue-250-sharadar-ingress
