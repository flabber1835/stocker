name: Backtester - historical metadata V4 external SEC canonical audit
run-name: Historical metadata V4 external SEC canonical audit — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-pit-corpus-recovery-v4]
    paths:
      - '.github/workflows/backtester-historical-metadata-v4-external-sec-known-issuer-canonical-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: backtester-historical-metadata-v4-external-sec-known-issuer-canonical-audit
  cancel-in-progress: true

env:
  V2_RUN_ID: '33701529865'
  V2_ARTIFACT: historical-metadata-v2-resilient-indexed-evidence-431686edffef158ff61c122c977ff2c7c18b7036-3556a6c9e01410bed6af02c0bd0d42eb718d2068
  V3_RUN_ID: '33704396721'
  V3_ARTIFACT: historical-metadata-v3-candidates-5d4d826c1c295cdc0a9dde5b80208a7cdf3e14f2
  CORRECTED_RUN_ID: '33710114749'
  CORRECTED_ARTIFACT: historical-metadata-v3-corrected-topology-recovery-4834767c842adb1155b6a2244ec3c4cc33aca886
  BASELINE_RUN_ID: '33711744625'
  BASELINE_ARTIFACT: historical-metadata-v3-corrected-canonical-observation-audit-9536ee216f0d8ef2299530a02e0fa1f41154fce1
  LATEST_RUN_ID: '33720489684'
  LATEST_ARTIFACT: historical-metadata-v4-ownership-strict-canonical-audit-126e276c67d7ce577744edccc8ee2ae22ead18f6
  MERGE_RUN_ID: '33757998991'
  MERGE_SOURCE_SHA: '235939a93b3044dbfa8c2a4219318e480dd8d494'
  MERGE_ARTIFACT: historical-metadata-v4-external-sec-known-issuer-merged-235939a93b3044dbfa8c2a4219318e480dd8d494
  V2_ROOT: backtester-results/v2
  V3_ROOT: backtester-results/v3
  CORRECTED_ROOT: backtester-results/corrected
  BASELINE_ROOT: backtester-results/baseline-audit
  LATEST_ROOT: backtester-results/latest-ownership-strict-audit
  MERGED_ROOT: backtester-results/external-merged-package
  V4_ROOT: backtester-results/external-merged-package/v4-ownership-strict-plus-external
  EXTERNAL_ROOT: backtester-results/external-merged-package/v4-external-sec-known-issuer-merged
  CANONICAL: backtester-results/canonical-pit-20y
  POINTER: backtester/data/canonical-pit-20y.json
  OUTPUT: backtester-results/v4-external-sec-known-issuer-canonical-audit

jobs:
  audit:
    name: Allocate external SEC authority and audit all canonical observations
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/
            /tests/backtester/test_rebuild_corrected_canonical_metadata_v4.py
            /tests/backtester/test_rebuild_corrected_canonical_metadata_v4_ownership_strict.py
            /.github/workflows/backtester-historical-metadata-v4-external-sec-known-issuer-canonical-audit.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run complete ownership-strict audit regressions
        run: |
          set -euo pipefail
          python -m compileall -q \
            backtester/rebuild_corrected_canonical_metadata_v4.py \
            backtester/run_rebuild_corrected_canonical_metadata_v4_ownership_strict.py \
            backtester/mine_historical_metadata_candidates_v4_ownership_strict.py \
            tests/backtester/test_rebuild_corrected_canonical_metadata_v4.py \
            tests/backtester/test_rebuild_corrected_canonical_metadata_v4_ownership_strict.py
          python - <<'PY'
          import runpy
          for path in ('tests/backtester/test_rebuild_corrected_canonical_metadata_v4.py','tests/backtester/test_rebuild_corrected_canonical_metadata_v4_ownership_strict.py'):
              ns=runpy.run_path(path)
              for name in sorted(ns):
                  if name.startswith('test_'):
                      ns[name]()
          print({'status':'PASS','contract':'strict prior; issuerCik binding; issuerTradingSymbol XML only on Forms 3/4/5; CIK never defines security episode boundaries'})
          PY

      - name: Wait for exact merged external authority package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 480); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MERGE_RUN_ID}" --jq '.status+":"+(.conclusion // "")')
            echo "external merge ${MERGE_RUN_ID}: ${state}"
            case "${state}" in
              completed:success) break ;;
              completed:*) exit 1 ;;
            esac
            sleep 15
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MERGE_RUN_ID}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MERGE_RUN_ID}" --jq '.head_sha')" = "${MERGE_SOURCE_SHA}"

      - name: Download V2 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: ${{ env.V2_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V2_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download original V3 candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.V3_ARTIFACT }}
          path: ${{ env.V3_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V3_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download corrected topology
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.CORRECTED_ARTIFACT }}
          path: ${{ env.CORRECTED_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CORRECTED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download definitive V3 baseline audit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: ${{ env.BASELINE_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest ownership-strict audit baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.LATEST_ARTIFACT }}
          path: ${{ env.LATEST_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.LATEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download merged retained plus external candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.MERGE_ARTIFACT }}
          path: ${{ env.MERGED_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MERGE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate immutable metadata and external-authority inputs
        run: |
          set -euo pipefail
          python -m backtester.historical_metadata_reconstruction_v2 verify --root "${V2_ROOT}"
          python -m backtester.historical_metadata_reconstruction_v2 verify --root "${CORRECTED_ROOT}"
          (cd "${BASELINE_ROOT}" && sha256sum -c SHA256SUMS.txt)
          (cd "${LATEST_ROOT}" && sha256sum -c SHA256SUMS.txt)
          (cd "${EXTERNAL_ROOT}" && sha256sum -c SHA256SUMS.txt)
          (cd "${V4_ROOT}" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import csv,gzip,hashlib,json,os
          from pathlib import Path
          v3=Path(os.environ['V3_ROOT']); v4=Path(os.environ['V4_ROOT']); baseline=Path(os.environ['BASELINE_ROOT']); latest=Path(os.environ['LATEST_ROOT']); external=Path(os.environ['EXTERNAL_ROOT'])
          assert hashlib.sha256((v3/'candidate_evidence.csv.gz').read_bytes()).hexdigest()=='989b58576dd684301cac88bebeb2d7107e1cfbb3fbc28e1b1e2a1a5df2372247'
          bs=json.load(open(baseline/'summary.json'))
          assert bs['status']=='PASS' and bs['unresolved_after_corrected_overlay']['episodes']==10795
          ls=json.load(open(latest/'summary.json')); lu=ls['unresolved_after_v4']
          assert ls['status']=='PASS' and lu['episodes']==10600 and lu['unknown_type_observations']==8985891 and lu['missing_sector_observations']==12001922 and lu['unknown_issuer_observations']==11865597
          es=json.load(open(external/'summary.json'))
          assert es['status']=='PASS' and es['candidate_only'] is True and es['episodes']==4037 and es['source_run_id']=='33757920177' and es['source_sha']=='d7df715277e02e8add2782b84582adc449285fa7'
          vs=json.load(open(v4/'summary.json'))
          assert vs['schema']=='backtester.historical-metadata-reconstruction-v4.ownership-strict-candidate-merge/1'
          assert vs['status']=='PASS' and vs['candidate_only'] is True and vs['merged_shards']==32 and vs['external_authority_extension'] is True
          assert vs['external_authority_episodes']==4037 and vs['retained_candidate_sha256']=='76a3dfa83a1dc565dea70157bfab443e2bdc1730908809dad080a8da30f467cb'
          rows=list(csv.DictReader(gzip.open(v4/'candidate_evidence.csv.gz','rt')))
          bad=[r for r in rows if r.get('form') in {'3','3/A','4','4/A','5','5/A'} and r.get('candidate_kind')=='IDENTITY_EXACT_TICKER' and r.get('candidate_quality')!='SEC_OWNERSHIP_ISSUER_TRADING_SYMBOL_XML']
          assert not bad
          print({'status':'PASS','candidate_rows':len(rows),'candidate_sha256':hashlib.sha256((v4/'candidate_evidence.csv.gz').read_bytes()).hexdigest(),'external_episodes':es['episodes']})
          PY

      - name: Reclaim runner space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Pull and authenticate frozen canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          CONTAINER=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true' EXIT
          rm -rf "${CANONICAL}" && mkdir -p "${CANONICAL}"
          docker cp "${CONTAINER}:/canonical-pit/." "${CANONICAL}"
          docker rm "${CONTAINER}"
          trap - EXIT
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=json.load(open(os.environ['POINTER'])); root=Path(os.environ['CANONICAL']); mpath=root/'manifest.json'; m=json.load(open(mpath))
          assert hashlib.sha256(mpath.read_bytes()).hexdigest()==p['manifest_sha256']
          assert m['dataset_hash']==p['dataset_hash']=='f9fb220871ad4152549d31a5da6e0dbcdd327dc7b05843764511b0e800ddb19b'
          assert m['counts']['observation_rows']==31820893
          print({'status':'PASS','dataset_hash':m['dataset_hash']})
          PY

      - name: Run authoritative external-extended 31.8M-row audit
        run: |
          set -euo pipefail
          rm -rf "${OUTPUT}"
          python -m backtester.run_rebuild_corrected_canonical_metadata_v4_ownership_strict \
            --canonical-dataset "${CANONICAL}" \
            --v2-root "${V2_ROOT}" \
            --v3-root "${V3_ROOT}" \
            --corrected-topology-root "${CORRECTED_ROOT}" \
            --baseline-audit-root "${BASELINE_ROOT}" \
            --v4-root "${V4_ROOT}" \
            --output "${OUTPUT}"

      - name: Enforce monotonic fail-closed result against 10,600 baseline
        run: |
          set -euo pipefail
          (cd "${OUTPUT}" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUTPUT']); latest=Path(os.environ['LATEST_ROOT']); v4=Path(os.environ['V4_ROOT'])
          s=json.load(open(root/'summary.json')); u=s['unresolved_after_v4']; l=json.load(open(latest/'summary.json'))['unresolved_after_v4']
          assert s['status']=='PASS' and s['canonical_price_dataset_rewritten'] is False
          assert s['causal_rule']=='usable_after < decision_session' and s['unknown_never_means_ineligible'] is True
          assert u['episodes']<=l['episodes']==10600
          assert u['unknown_type_observations']<=l['unknown_type_observations']==8985891
          assert u['missing_sector_observations']<=l['missing_sector_observations']==12001922
          assert u['unknown_issuer_observations']<=l['unknown_issuer_observations']==11865597
          lineage={
            'schema':'backtester.historical-metadata-v4.external-sec-audit-lineage/1',
            'merge_run_id':os.environ['MERGE_RUN_ID'],'merge_source_sha':os.environ['MERGE_SOURCE_SHA'],'merge_artifact':os.environ['MERGE_ARTIFACT'],
            'combined_candidate_sha256':hashlib.sha256((v4/'candidate_evidence.csv.gz').read_bytes()).hexdigest(),
            'prior_authoritative_audit_run_id':os.environ['LATEST_RUN_ID'],
            'canonical_dataset_hash':'f9fb220871ad4152549d31a5da6e0dbcdd327dc7b05843764511b0e800ddb19b',
          }
          lineage_path=root/'external_input_lineage.json'; lineage_path.write_text(json.dumps(lineage,indent=2,sort_keys=True)+'\n')
          with (root/'SHA256SUMS.txt').open('a',encoding='utf-8') as fh: fh.write(f"{hashlib.sha256(lineage_path.read_bytes()).hexdigest()}  external_input_lineage.json\n")
          print(json.dumps(s,indent=2,sort_keys=True)); print(json.dumps(lineage,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh: fh.write((root/'SUMMARY.md').read_text())
          PY
          (cd "${OUTPUT}" && sha256sum -c SHA256SUMS.txt)

      - name: Upload authoritative external-extended V4 audit
        if: ${{ always() && hashFiles('backtester-results/v4-external-sec-known-issuer-canonical-audit/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-v4-external-sec-known-issuer-canonical-audit-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 90
