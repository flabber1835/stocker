name: Apply issue 209 session-effective metadata

on:
  push:
    branches:
      - fix/issue-209-financial-grade-trial
    paths:
      - tools/issue209-session-effective-metadata.py
      - .github/workflows/issue209-session-effective-metadata.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/issue209-session-effective-metadata.py
      - .github/workflows/issue209-session-effective-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: fix/issue-209-financial-grade-trial
      - name: Apply and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue209-session-effective-metadata.py
          python - <<'PY'
          from pathlib import Path
          p = Path('sentinel/core/loader.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('as_of: str | None = None', 'as_of: Optional[str] = None')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          python -m compileall -q sentinel/core/loader.py sentinel/core/production.py tests/sentinel/test_issue209_session_effective_metadata.py
      - name: Commit production patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sentinel/core/loader.py sentinel/core/production.py tests/sentinel/test_issue209_session_effective_metadata.py
          git rm -- tools/issue209-session-effective-metadata.py .github/workflows/issue209-session-effective-metadata.yml
          git commit -m 'Make production TICKERS metadata session-effective (#193 #209)'
          git pull --rebase origin fix/issue-209-financial-grade-trial
          git push origin HEAD:fix/issue-209-financial-grade-trial
