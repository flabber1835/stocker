name: Wealth Core V5 EX3 V6 equivalence

on:
  push:
    branches: [codex/wealth-core-v5-ex3-v6-production]
    paths:
      - '.github/workflows/v5-equivalence.yml'
      - 'Dockerfile.sentinel'
      - 'Dockerfile.sentinel-test'
      - '.dockerignore'
      - 'sentinel/**'
      - 'shared/**'
      - 'tools/median5_*.py'
      - 'tools/v5_*.py'
      - 'tests/v5/**'
      - 'tests/median5/**'
      - 'tests/requirements.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-equivalence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-pit-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'

      - name: Bind the checkout and independent research dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/median5-evidence"
          python - <<'PY'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'median5-evidence'
          (output / 'checkout.json').write_text(json.dumps({
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }, indent=2) + '\n')
          PY
          git fetch --depth=1 --filter=blob:none --no-tags origin 27bb992087182c42c3c051e62bf837895f5d2ab7
          git fetch --depth=1 --filter=blob:none --no-tags origin ba74e79490beb8950611b1d17f5d124833b3d91e
          git fetch --depth=1 --filter=blob:none --no-tags origin 1c66096c1e3bd650233c630d4e9f71104ac8fc32
          python tools/median5_reference.py \
            --output "$RUNNER_TEMP/median5-reference" \
            | tee "$RUNNER_TEMP/median5-evidence/reference.json"

      - name: Extract the immutable data-only image without starting it
        shell: bash
        run: |
          set -euo pipefail
          MEDIAN5_DATA_IMAGE='ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c'
          docker pull "$MEDIAN5_DATA_IMAGE"
          MEDIAN5_DATA_CONTAINER="$(docker create "$MEDIAN5_DATA_IMAGE" /unused)"
          trap 'docker rm "$MEDIAN5_DATA_CONTAINER"' EXIT
          mkdir -p "$RUNNER_TEMP/median5-data"
          docker cp "$MEDIAN5_DATA_CONTAINER:/canonical-pit/." "$RUNNER_TEMP/median5-data/"

      - name: Build the existing pinned runtime and test lens
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg SOURCE_GIT_SHA="$GITHUB_SHA" \
            -f Dockerfile.sentinel -t sentinel:median5 .
          docker build --build-arg SENTINEL_IMAGE=sentinel:median5 \
            --build-arg SOURCE_GIT_SHA="$GITHUB_SHA" \
            -f Dockerfile.sentinel-test -t sentinel-test:median5 .
          docker image inspect sentinel:median5 sentinel-test:median5 \
            > "$RUNNER_TEMP/median5-evidence/images.json"

      - name: Compare all 5176 sessions and periodic JSON restarts
        shell: bash
        run: |
          set -euo pipefail
          chmod 0777 "$RUNNER_TEMP/median5-evidence"
          docker run --rm --network none --entrypoint python \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
            -v "$GITHUB_WORKSPACE:/work/median5-repo:ro" \
            -v "$RUNNER_TEMP/median5-reference:/reference:ro" \
            -v "$RUNNER_TEMP/median5-data:/data:ro" \
            -v "$RUNNER_TEMP/median5-evidence:/evidence" \
            sentinel-test:median5 -u /work/median5-repo/tools/v5_equivalence.py \
            --research-root /reference --dataset /data \
            --output /evidence/equivalence --restart-every 251 \
            2>&1 | tee "$RUNNER_TEMP/median5-evidence/replay.log"
          python - <<'PY'
          import json, os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'median5-evidence'
          result = json.loads((output / 'equivalence/RESULT.json').read_text())
          assert result['status'] == 'PASS_FULL_PIT_EQUIVALENCE', result['status']
          assert result['sessions'] == 5176 and result['measured_sessions'] == 5032
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Wealth Core V5 / EX3 V6 R40 -4 REC8 full PIT equivalence: **PASS**.\n\n')
              summary.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY

      - name: Retain exact-commit results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v5-equivalence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/median5-evidence
          if-no-files-found: error
          retention-days: 90
