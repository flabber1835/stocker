name: Backtester - causal terminal boundary verification (superseded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    name: Superseded by expanded terminal integration verification
    runs-on: ubuntu-24.04
    steps:
      - name: Explain certification replacement
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          This historical workflow replayed only through 2001-06-04 and assumed
          the frozen terminal bundle contained only LIT1 and CIT.A/TYC.

          The frozen bundle now also contains GPU effective 2001-11-07. The
          strict causal loader correctly rejects a November event when supplied
          a replay axis ending in June, so the old workflow is no longer a valid
          automatic certification check.

          Current certification is provided by:
            .github/workflows/backtester-causal-terminal-terms-verify.yml
            .github/workflows/backtester-causal-terminal-integration-verify.yml
            .github/workflows/backtester-gpu-terminal-verify.yml

          The integration workflow exercises the original CIT/TYC next-open
          boundary and the expanded GPU settlement under the exact pinned
          production source.
          EOF
