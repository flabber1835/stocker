name: Backtester - historical metadata V4 external SEC known issuer merge
run-name: Historical metadata V4 external SEC merge — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-pit-corpus-recovery-v4]
    paths:
      - '.github/workflows/backtester-historical-metadata-v4-external-sec-known-issuer-merge.yml'
      - 'backtester/merge_historical_metadata_external_v4.py'
      - 'tests/backtester/test_merge_historical_metadata_external_v4.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: backtester-historical-metadata-v4-external-sec-known-issuer-merge
  cancel-in-progress: true

env:
  HARVEST_RUN_ID: '33757920177'
  HARVEST_SOURCE_SHA: 'd7df715277e02e8add2782b84582adc449285fa7'
  RETAINED_RUN_ID: '33720380653'
  RETAINED_ARTIFACT: historical-metadata-v4-ownership-strict-retained-sec-candidates-1cef44c743913dbeac0b7136a717781068adbfc7
  RETAINED_CANDIDATE_SHA256: '76a3dfa83a1dc565dea70157bfab443e2bdc1730908809dad080a8da30f467cb'
  SHARD_ROOT: backtester-results/v4-external-sec-shards
  RETAINED_ROOT: backtester-results/v4-retained-ownership-strict
  EXTERNAL_ROOT: backtester-results/v4-external-sec-known-issuer-merged
  COMBINED_ROOT: backtester-results/v4-ownership-strict-plus-external
  PYTHONUNBUFFERED: '1'

jobs:
  merge:
    name: Authenticate, merge, and extend candidate authority
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact merge source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/__init__.py
            /backtester/merge_historical_metadata_external_v4.py
            /tests/backtester/test_merge_historical_metadata_external_v4.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run merge and authority-boundary regressions
        run: |
          set -euo pipefail
          python -m compileall -q backtester/merge_historical_metadata_external_v4.py tests/backtester/test_merge_historical_metadata_external_v4.py
          python - <<'PY'
          import runpy, tempfile
          from pathlib import Path
          ns=runpy.run_path('tests/backtester/test_merge_historical_metadata_external_v4.py')
          for name in sorted(ns):
              if name.startswith('test_'):
                  with tempfile.TemporaryDirectory() as td:
                      ns[name](Path(td))
          print({'status':'PASS','contract':'strict-prior; full shard coverage; every frozen source hashed; ownership XML-only; non-ownership exchange-qualified ticker normalization'})
          PY

      - name: Wait for exact external SEC harvest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 480); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${HARVEST_RUN_ID}" --jq '.status+":"+(.conclusion // "")')
            echo "external SEC harvest ${HARVEST_RUN_ID}: ${state}"
            case "${state}" in
              completed:success) break ;;
              completed:*) exit 1 ;;
            esac
            sleep 15
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${HARVEST_RUN_ID}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${HARVEST_RUN_ID}" --jq '.head_sha')" = "${HARVEST_SOURCE_SHA}"

      - name: Download all eight frozen external SEC shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: historical-metadata-v4-external-sec-known-issuer-shard-*-${{ env.HARVEST_SOURCE_SHA }}
          path: ${{ env.SHARD_ROOT }}/backtester-results
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ env.HARVEST_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce complete downloaded shard topology
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['SHARD_ROOT'])/'backtester-results'
          plans=sorted(root.glob('v4-external-sec-plan-*'))
          evidence=sorted(root.glob('v4-external-sec-evidence-*'))
          assert len(plans)==8 and len(evidence)==8, (plans,evidence)
          assert {p.name.rsplit('-',1)[-1] for p in plans}=={str(i) for i in range(8)}
          assert {p.name.rsplit('-',1)[-1] for p in evidence}=={str(i) for i in range(8)}
          print({'status':'PASS','plan_shards':len(plans),'evidence_shards':len(evidence)})
          PY

      - name: Download immutable retained ownership-strict candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.RETAINED_ARTIFACT }}
          path: ${{ env.RETAINED_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RETAINED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and authenticate frozen external evidence
        run: |
          set -euo pipefail
          rm -rf "${EXTERNAL_ROOT}" "${COMBINED_ROOT}"
          python -m backtester.merge_historical_metadata_external_v4 merge-external \
            --inputs "${SHARD_ROOT}" \
            --output "${EXTERNAL_ROOT}" \
            --expected-shards 8 \
            --expected-cohort 4037 \
            --source-run-id "${HARVEST_RUN_ID}" \
            --source-sha "${HARVEST_SOURCE_SHA}"
          (cd "${EXTERNAL_ROOT}" && sha256sum -c SHA256SUMS.txt)

      - name: Extend ownership-strict candidate corpus
        run: |
          set -euo pipefail
          python -m backtester.merge_historical_metadata_external_v4 combine \
            --retained-root "${RETAINED_ROOT}" \
            --external-root "${EXTERNAL_ROOT}" \
            --output "${COMBINED_ROOT}" \
            --expected-retained-sha256 "${RETAINED_CANDIDATE_SHA256}"
          (cd "${COMBINED_ROOT}" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          external=json.load(open(Path(os.environ['EXTERNAL_ROOT'])/'summary.json'))
          combined=json.load(open(Path(os.environ['COMBINED_ROOT'])/'summary.json'))
          assert external['status']=='PASS' and external['episodes']==4037 and external['merged_shards']==8
          assert external['candidate_only'] is True and external['canonical_price_dataset_rewritten'] is False
          assert combined['status']=='PASS' and combined['candidate_only'] is True
          assert combined['external_authority_extension'] is True and combined['external_authority_episodes']==4037
          assert combined['retained_candidate_sha256']==os.environ['RETAINED_CANDIDATE_SHA256']
          print(json.dumps(external,indent=2,sort_keys=True))
          print(json.dumps(combined,indent=2,sort_keys=True))
          PY

      - name: Upload merged frozen external authority package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-v4-external-sec-known-issuer-merged-${{ github.sha }}
          path: |
            ${{ env.EXTERNAL_ROOT }}
            ${{ env.COMBINED_ROOT }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
