name: Sentinel protected publication

on:
  workflow_run:
    workflows: [Sentinel safety]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  attestations: write
  contents: read
  packages: write
  id-token: write

jobs:
  publish-tested-main-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.workflow_id == 333697638 &&
      github.event.workflow_run.path == '.github/workflows/sentinel-safety.yml' &&
      github.event.workflow_run.repository.id == 1233957439 &&
      github.event.workflow_run.head_repository.id == 1233957439 &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact tested main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download the exact tested runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sentinel-tested-image-${{ github.event.workflow_run.head_sha }}
          path: /tmp/sentinel-tested-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and load the exact tested runtime
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cd /tmp/sentinel-tested-image
          python - <<'PY'
          import re
          from pathlib import Path
          rows = Path("SHA256SUMS").read_text(encoding="utf-8").splitlines()
          expected = {"sentinel-runtime.tar", "COMMIT", "software-certification-input.json"}
          found = set()
          for row in rows:
              match = re.fullmatch(r"[0-9a-f]{64}  ([A-Za-z0-9._-]+)", row)
              if match is None:
                  raise SystemExit("REFUSED: non-portable image checksum row")
              found.add(match.group(1))
          if found != expected or len(rows) != len(expected):
              raise SystemExit("REFUSED: incomplete image checksum manifest")
          PY
          sha256sum --strict --check SHA256SUMS
          test "$(cat COMMIT)" = "$TESTED_SHA"
          docker load --input sentinel-runtime.tar
          test "$(docker image inspect sentinel:ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = "$TESTED_SHA"

      - name: Compute immutable registry digest through the pinned loopback registry
        id: subject
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          LOOPBACK_REGISTRY_IMAGE: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        run: |
          set -euo pipefail
          docker run --detach --name sentinel-promotion-registry \
            --publish 127.0.0.1:5000:5000 "$LOOPBACK_REGISTRY_IMAGE"
          ready=false
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/v2/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          subject_name="ghcr.io/${GITHUB_REPOSITORY}/sentinel"
          final_ref="${subject_name}:${TESTED_SHA}"
          local_repository="127.0.0.1:5000/sentinel"
          local_tag="${local_repository}:${TESTED_SHA}"
          docker tag sentinel:ci "$local_tag"
          docker push "$local_tag" 2>&1 | tee /tmp/loopback-push.log
          digest="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' /tmp/loopback-push.log | tail -n 1)"
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo 'REFUSED: loopback push did not return an immutable digest' >&2; exit 1 ;;
          esac
          {
            echo "subject_name=$subject_name"
            echo "final_ref=$final_ref"
            echo "local_repository=$local_repository"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Verify required exact-head CI job conclusions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}/jobs?per_page=100" \
            > /tmp/sentinel-safety-jobs.json
          test -s /tmp/sentinel-safety-jobs.json

      - name: Re-observe publication authority and finalize certification
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          TEST_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SUBJECT_NAME: ${{ steps.subject.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sentinel-provenance
          python tools/sentinel_ci_certification_input_binding.py \
            --root . \
            --input /tmp/sentinel-tested-image/software-certification-input.json \
            --expected-commit "$TESTED_SHA" \
            --expected-workflow-run "$TEST_RUN_ID" \
            --expected-workflow-attempt "$TEST_RUN_ATTEMPT" \
            --image-ref sentinel:ci
          certified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python tools/sentinel_ci_certification_manifest.py finalize \
            --input /tmp/sentinel-tested-image/software-certification-input.json \
            --jobs /tmp/sentinel-safety-jobs.json \
            --subject-name "$SUBJECT_NAME" \
            --image-digest "$SUBJECT_DIGEST" \
            --publication-run "$GITHUB_RUN_ID" \
            --publication-attempt "$GITHUB_RUN_ATTEMPT" \
            --certified-at "$certified_at" \
            --output /tmp/sentinel-provenance/certification.json
          python tools/sentinel_ci_certification_manifest.py verify \
            /tmp/sentinel-provenance/certification.json

      - name: Create durable Sigstore build provenance
        id: attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.subject.outputs.subject_name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: false

      - name: Assemble retained certification provenance
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          TEST_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TEST_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          SUBJECT_NAME: ${{ steps.subject.outputs.subject_name }}
          SUBJECT_DIGEST: ${{ steps.subject.outputs.digest }}
          ATTESTATION_ID: ${{ steps.attestation.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE"
          test -n "$ATTESTATION_ID"
          test -n "$ATTESTATION_URL"
          cp "$ATTESTATION_BUNDLE" /tmp/sentinel-provenance/attestation.sigstore.json
          python - <<'PY'
          import base64, hashlib, json, os
          with open(os.environ["ATTESTATION_BUNDLE"], encoding="utf-8") as source:
              bundle = json.load(source)
          envelope = bundle.get("dsseEnvelope") if isinstance(bundle, dict) else None
          if not isinstance(envelope, dict) or not envelope.get("signatures"):
              raise SystemExit("REFUSED: incomplete Sigstore attestation bundle")
          try:
              statement = json.loads(base64.b64decode(envelope["payload"], validate=True))
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit("REFUSED: malformed Sigstore DSSE payload") from exc
          algorithm, separator, digest = os.environ["SUBJECT_DIGEST"].partition(":")
          expected_subject = [{"name": os.environ["SUBJECT_NAME"], "digest": {algorithm: digest}}]
          if (separator != ":" or algorithm != "sha256" or not digest
                  or statement.get("_type") != "https://in-toto.io/Statement/v1"
                  or statement.get("predicateType") != "https://slsa.dev/provenance/v1"
                  or statement.get("subject") != expected_subject):
              raise SystemExit("REFUSED: Sigstore payload does not bind the runtime subject")
          certification_path = "/tmp/sentinel-provenance/certification.json"
          with open(certification_path, "rb") as source:
              certification_hash = hashlib.sha256(source.read()).hexdigest()
          evidence = {
              "schema": "sentinel.exact-sha-provenance/4",
              "state": "EVIDENCE_DURABLE_BEFORE_RUNTIME_PUBLICATION",
              "commit": os.environ["TESTED_SHA"],
              "test_workflow_run": int(os.environ["TEST_RUN_ID"]),
              "test_workflow_id": int(os.environ["TEST_WORKFLOW_ID"]),
              "test_workflow_path": os.environ["TEST_WORKFLOW_PATH"],
              "publication_workflow_run": int(os.environ["GITHUB_RUN_ID"]),
              "publication_workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "subject_name": os.environ["SUBJECT_NAME"],
              "tested_image_digest": os.environ["SUBJECT_DIGEST"],
              "immutable_runtime": os.environ["SUBJECT_NAME"] + "@" + os.environ["SUBJECT_DIGEST"],
              "digest_source": "RUNNER_LOOPBACK_REGISTRY",
              "loopback_registry_image": "registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373",
              "certification_manifest_sha256": certification_hash,
              "attestation_id": os.environ["ATTESTATION_ID"],
              "attestation_url": os.environ["ATTESTATION_URL"],
          }
          with open("/tmp/sentinel-provenance/provenance.json", "w", encoding="utf-8") as out:
              json.dump(evidence, out, sort_keys=True, separators=(",", ":"))
              out.write("\n")
          PY
          cd /tmp/sentinel-provenance
          sha256sum certification.json provenance.json attestation.sigstore.json > SHA256SUMS
          sha256sum --strict --check SHA256SUMS

      - name: Retain signed certification evidence
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-provenance-${{ github.event.workflow_run.head_sha }}
          path: /tmp/sentinel-provenance
          if-no-files-found: error
          retention-days: 90

      - name: Install the pinned manifest-preserving publication client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Publish exact runtime and durable certification referrer
        shell: bash
        env:
          FINAL_REF: ${{ steps.subject.outputs.final_ref }}
          SUBJECT_NAME: ${{ steps.subject.outputs.subject_name }}
          LOCAL_REPOSITORY: ${{ steps.subject.outputs.local_repository }}
          SUBJECT_DIGEST: ${{ steps.subject.outputs.digest }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/sentinel-provenance
          sha256sum --strict --check SHA256SUMS
          echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras cp --from-plain-http "${LOCAL_REPOSITORY}@${SUBJECT_DIGEST}" "$FINAL_REF"
          final_digest="$(oras resolve "$FINAL_REF")"
          test "$final_digest" = "$SUBJECT_DIGEST"
          oras attach \
            --artifact-type application/vnd.stocker.sentinel.software-certification.v1 \
            --annotation "org.opencontainers.image.revision=${TESTED_SHA:-${{ github.event.workflow_run.head_sha }}}" \
            --format json \
            "${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            certification.json:application/vnd.stocker.sentinel.software-certification.v1+json \
            provenance.json:application/vnd.stocker.sentinel.provenance.v4+json \
            attestation.sigstore.json:application/vnd.dev.sigstore.bundle.v0.3+json \
            SHA256SUMS:text/plain \
            > /tmp/sentinel-certification-referrer.json
          certification_digest="$(python - <<'PY'
          import json
          with open('/tmp/sentinel-certification-referrer.json', encoding='utf-8') as source:
              value = json.load(source)
          digest = value.get('digest')
          if not isinstance(digest, str) or not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('REFUSED: certification referrer has no immutable digest')
          print(digest)
          PY
          )"
          oras discover \
            --artifact-type application/vnd.stocker.sentinel.software-certification.v1 \
            --format json "${SUBJECT_NAME}@${SUBJECT_DIGEST}" \
            > /tmp/sentinel-certification-discovery.json
          CERTIFICATION_DIGEST="$certification_digest" python - <<'PY'
          import json, os
          with open('/tmp/sentinel-certification-discovery.json', encoding='utf-8') as source:
              value = json.load(source)
          refs = value.get('referrers') if isinstance(value, dict) else None
          expected = os.environ['CERTIFICATION_DIGEST']
          if not isinstance(refs, list) or expected not in {
              item.get('digest') for item in refs if isinstance(item, dict)
          }:
              raise SystemExit('REFUSED: certification referrer is not discoverable')
          PY
          {
            echo '### Protected Sentinel publication'
            echo
            printf -- '- image: `%s`\n' "$FINAL_REF"
            printf -- '- trusted runtime digest: `%s`\n' "$SUBJECT_DIGEST"
            printf -- '- certification referrer digest: `%s`\n' "$certification_digest"
            printf -- '- retained evidence: %s\n' "$EVIDENCE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the runner-local promotion registry
        if: always()
        shell: bash
        run: docker rm --force sentinel-promotion-registry >/dev/null 2>&1 || true
