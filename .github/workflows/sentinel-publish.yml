name: Sentinel protected publication

on:
  workflow_run:
    workflows: [Sentinel safety]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  attestations: write
  contents: read
  packages: write
  id-token: write

jobs:
  publish-tested-main-images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.workflow_id == 333697638 &&
      github.event.workflow_run.path == '.github/workflows/sentinel-safety.yml' &&
      github.event.workflow_run.repository.id == 1233957439 &&
      github.event.workflow_run.head_repository.id == 1233957439 &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact tested main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download the exact tested image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sentinel-tested-image-${{ github.event.workflow_run.head_sha }}
          path: /tmp/sentinel-tested-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and load the exact tested images
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cd /tmp/sentinel-tested-image
          python - <<'PY'
          import re
          from pathlib import Path
          rows = Path("SHA256SUMS").read_text(encoding="utf-8").splitlines()
          expected = {
              "sentinel-runtime.tar",
              "sentinel-authorized.tar",
              "COMMIT",
              "software-certification-input.json",
          }
          found = set()
          for row in rows:
              match = re.fullmatch(r"[0-9a-f]{64}  ([A-Za-z0-9._-]+)", row)
              if match is None:
                  raise SystemExit("REFUSED: non-portable image checksum row")
              found.add(match.group(1))
          if found != expected or len(rows) != len(expected):
              raise SystemExit("REFUSED: incomplete image checksum manifest")
          PY
          sha256sum --strict --check SHA256SUMS
          test "$(cat COMMIT)" = "$TESTED_SHA"
          docker load --input sentinel-runtime.tar
          docker load --input sentinel-authorized.tar
          test "$(docker image inspect sentinel:latest \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = "$TESTED_SHA"
          test "$(docker image inspect sentinel-authorized:ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" \
            = "$TESTED_SHA"
          test "$(docker image inspect sentinel:latest --format '{{.Id}}')" \
            != "$(docker image inspect sentinel-authorized:ci --format '{{.Id}}')"

      - name: Compute immutable registry digests through the pinned loopback registry
        id: subjects
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REGISTRY: ghcr.io
          IMAGE_ROOT: ${{ github.repository }}
          LOOPBACK_REGISTRY_IMAGE: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        run: |
          set -euo pipefail
          docker run --detach --name sentinel-promotion-registry \
            --publish 127.0.0.1:5000:5000 \
            "$LOOPBACK_REGISTRY_IMAGE"
          registry_ready=false
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:5000/v2/ >/dev/null; then
              registry_ready=true
              break
            fi
            sleep 1
          done
          test "$registry_ready" = true

          push_local() {
            source_ref="$1"
            repository="$2"
            log="$3"
            tag="${repository}:${TESTED_SHA}"
            docker tag "$source_ref" "$tag"
            docker push "$tag" 2>&1 | tee "$log"
            digest="$(sed -nE \
              's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' \
              "$log" | tail -n 1)"
            case "$digest" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo 'REFUSED: loopback push did not return an immutable digest' >&2; exit 1 ;;
            esac
            printf '%s' "$digest"
          }

          ordinary_local_repository="127.0.0.1:5000/sentinel"
          authorized_local_repository="127.0.0.1:5000/sentinel-authorized"
          ordinary_digest="$(push_local sentinel:latest "$ordinary_local_repository" /tmp/ordinary-push.log)"
          authorized_digest="$(push_local sentinel-authorized:ci "$authorized_local_repository" /tmp/authorized-push.log)"
          test "$ordinary_digest" != "$authorized_digest"

          ordinary_subject_name="${REGISTRY}/${IMAGE_ROOT}/sentinel"
          authorized_subject_name="${REGISTRY}/${IMAGE_ROOT}/sentinel-authorized"
          {
            echo "ordinary_subject_name=$ordinary_subject_name"
            echo "ordinary_final_ref=${ordinary_subject_name}:${TESTED_SHA}"
            echo "ordinary_local_repository=$ordinary_local_repository"
            echo "ordinary_digest=$ordinary_digest"
            echo "authorized_subject_name=$authorized_subject_name"
            echo "authorized_final_ref=${authorized_subject_name}:${TESTED_SHA}"
            echo "authorized_local_repository=$authorized_local_repository"
            echo "authorized_digest=$authorized_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Verify required exact-head CI job conclusions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}/jobs?per_page=100" \
            > /tmp/sentinel-safety-jobs.json
          test -s /tmp/sentinel-safety-jobs.json

      - name: Re-observe publication authority and finalize certification
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          TEST_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          ORDINARY_SUBJECT: ${{ steps.subjects.outputs.ordinary_subject_name }}
          ORDINARY_DIGEST: ${{ steps.subjects.outputs.ordinary_digest }}
          AUTHORIZED_SUBJECT: ${{ steps.subjects.outputs.authorized_subject_name }}
          AUTHORIZED_DIGEST: ${{ steps.subjects.outputs.authorized_digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sentinel-provenance
          python tools/sentinel_ci_certification_input_binding.py \
            --root . \
            --input /tmp/sentinel-tested-image/software-certification-input.json \
            --expected-commit "$TESTED_SHA" \
            --expected-workflow-run "$TEST_RUN_ID" \
            --expected-workflow-attempt "$TEST_RUN_ATTEMPT" \
            --ordinary-image-ref sentinel:latest \
            --authorized-image-ref sentinel-authorized:ci
          certified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python tools/sentinel_ci_certification_manifest.py finalize \
            --input /tmp/sentinel-tested-image/software-certification-input.json \
            --jobs /tmp/sentinel-safety-jobs.json \
            --ordinary-subject-name "$ORDINARY_SUBJECT" \
            --ordinary-image-digest "$ORDINARY_DIGEST" \
            --authorized-subject-name "$AUTHORIZED_SUBJECT" \
            --authorized-image-digest "$AUTHORIZED_DIGEST" \
            --publication-run "$GITHUB_RUN_ID" \
            --publication-attempt "$GITHUB_RUN_ATTEMPT" \
            --certified-at "$certified_at" \
            --output /tmp/sentinel-provenance/certification.json
          python tools/sentinel_ci_certification_manifest.py verify \
            /tmp/sentinel-provenance/certification.json

      - name: Create ordinary-runtime Sigstore build provenance
        id: ordinary_attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.subjects.outputs.ordinary_subject_name }}
          subject-digest: ${{ steps.subjects.outputs.ordinary_digest }}
          push-to-registry: false

      - name: Create authorized-runtime Sigstore build provenance
        id: authorized_attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.subjects.outputs.authorized_subject_name }}
          subject-digest: ${{ steps.subjects.outputs.authorized_digest }}
          push-to-registry: false

      - name: Assemble retained dual-runtime provenance bundle
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
          TEST_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TEST_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          ORDINARY_SUBJECT: ${{ steps.subjects.outputs.ordinary_subject_name }}
          ORDINARY_DIGEST: ${{ steps.subjects.outputs.ordinary_digest }}
          AUTHORIZED_SUBJECT: ${{ steps.subjects.outputs.authorized_subject_name }}
          AUTHORIZED_DIGEST: ${{ steps.subjects.outputs.authorized_digest }}
          ORDINARY_ATTESTATION_ID: ${{ steps.ordinary_attestation.outputs.attestation-id }}
          ORDINARY_ATTESTATION_URL: ${{ steps.ordinary_attestation.outputs.attestation-url }}
          ORDINARY_ATTESTATION_BUNDLE: ${{ steps.ordinary_attestation.outputs.bundle-path }}
          AUTHORIZED_ATTESTATION_ID: ${{ steps.authorized_attestation.outputs.attestation-id }}
          AUTHORIZED_ATTESTATION_URL: ${{ steps.authorized_attestation.outputs.attestation-url }}
          AUTHORIZED_ATTESTATION_BUNDLE: ${{ steps.authorized_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ORDINARY_ATTESTATION_BUNDLE"
          test -s "$AUTHORIZED_ATTESTATION_BUNDLE"
          test -n "$ORDINARY_ATTESTATION_ID"
          test -n "$AUTHORIZED_ATTESTATION_ID"
          cp "$ORDINARY_ATTESTATION_BUNDLE" \
            /tmp/sentinel-provenance/ordinary-attestation.sigstore.json
          cp "$AUTHORIZED_ATTESTATION_BUNDLE" \
            /tmp/sentinel-provenance/authorized-attestation.sigstore.json
          python - <<'PY'
          import base64, hashlib, json, os

          def validate(path, subject, subject_digest):
              with open(path, encoding="utf-8") as source:
                  bundle = json.load(source)
              envelope = bundle.get("dsseEnvelope") if isinstance(bundle, dict) else None
              if not isinstance(envelope, dict) or not envelope.get("signatures"):
                  raise SystemExit("REFUSED: incomplete Sigstore attestation bundle")
              try:
                  statement = json.loads(base64.b64decode(
                      envelope["payload"], validate=True))
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit("REFUSED: malformed Sigstore DSSE payload") from exc
              algorithm, separator, digest = subject_digest.partition(":")
              expected = [{"name": subject, "digest": {algorithm: digest}}]
              if (separator != ":" or algorithm != "sha256" or not digest
                      or statement.get("_type") != "https://in-toto.io/Statement/v1"
                      or statement.get("predicateType") != "https://slsa.dev/provenance/v1"
                      or statement.get("subject") != expected):
                  raise SystemExit("REFUSED: Sigstore payload has the wrong runtime subject")

          validate(
              os.environ["ORDINARY_ATTESTATION_BUNDLE"],
              os.environ["ORDINARY_SUBJECT"], os.environ["ORDINARY_DIGEST"])
          validate(
              os.environ["AUTHORIZED_ATTESTATION_BUNDLE"],
              os.environ["AUTHORIZED_SUBJECT"], os.environ["AUTHORIZED_DIGEST"])
          certification_path = "/tmp/sentinel-provenance/certification.json"
          with open(certification_path, "rb") as source:
              certification_hash = hashlib.sha256(source.read()).hexdigest()
          evidence = {
              "schema": "sentinel.exact-sha-provenance/5",
              "state": "EVIDENCE_DURABLE_BEFORE_RUNTIME_PUBLICATION",
              "commit": os.environ["TESTED_SHA"],
              "test_workflow_run": int(os.environ["TEST_RUN_ID"]),
              "test_workflow_id": int(os.environ["TEST_WORKFLOW_ID"]),
              "test_workflow_path": os.environ["TEST_WORKFLOW_PATH"],
              "publication_workflow_run": int(os.environ["GITHUB_RUN_ID"]),
              "publication_workflow_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "ordinary_runtime": {
                  "subject_name": os.environ["ORDINARY_SUBJECT"],
                  "digest": os.environ["ORDINARY_DIGEST"],
                  "immutable_ref": os.environ["ORDINARY_SUBJECT"] + "@" + os.environ["ORDINARY_DIGEST"],
                  "attestation_id": os.environ["ORDINARY_ATTESTATION_ID"],
                  "attestation_url": os.environ["ORDINARY_ATTESTATION_URL"],
              },
              "authorized_runtime": {
                  "subject_name": os.environ["AUTHORIZED_SUBJECT"],
                  "digest": os.environ["AUTHORIZED_DIGEST"],
                  "immutable_ref": os.environ["AUTHORIZED_SUBJECT"] + "@" + os.environ["AUTHORIZED_DIGEST"],
                  "attestation_id": os.environ["AUTHORIZED_ATTESTATION_ID"],
                  "attestation_url": os.environ["AUTHORIZED_ATTESTATION_URL"],
              },
              "digest_source": "RUNNER_LOOPBACK_REGISTRY",
              "loopback_registry_image": (
                  "registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373"),
              "certification_manifest_sha256": certification_hash,
          }
          with open("/tmp/sentinel-provenance/provenance.json", "w", encoding="utf-8") as out:
              json.dump(evidence, out, sort_keys=True, separators=(",", ":"))
              out.write("\n")
          PY
          cd /tmp/sentinel-provenance
          sha256sum certification.json provenance.json \
            ordinary-attestation.sigstore.json \
            authorized-attestation.sigstore.json > SHA256SUMS
          sha256sum --strict --check SHA256SUMS

      - name: Retain signed certification evidence
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-provenance-${{ github.event.workflow_run.head_sha }}
          path: /tmp/sentinel-provenance
          if-no-files-found: error
          retention-days: 90

      - name: Install the pinned manifest-preserving publication client
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Publish exact runtimes and durable certification referrers
        shell: bash
        env:
          ORDINARY_FINAL_REF: ${{ steps.subjects.outputs.ordinary_final_ref }}
          ORDINARY_SUBJECT: ${{ steps.subjects.outputs.ordinary_subject_name }}
          ORDINARY_LOCAL_REPOSITORY: ${{ steps.subjects.outputs.ordinary_local_repository }}
          ORDINARY_DIGEST: ${{ steps.subjects.outputs.ordinary_digest }}
          AUTHORIZED_FINAL_REF: ${{ steps.subjects.outputs.authorized_final_ref }}
          AUTHORIZED_SUBJECT: ${{ steps.subjects.outputs.authorized_subject_name }}
          AUTHORIZED_LOCAL_REPOSITORY: ${{ steps.subjects.outputs.authorized_local_repository }}
          AUTHORIZED_DIGEST: ${{ steps.subjects.outputs.authorized_digest }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/sentinel-provenance
          sha256sum --strict --check SHA256SUMS
          echo "$GITHUB_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          oras cp --from-plain-http \
            "${ORDINARY_LOCAL_REPOSITORY}@${ORDINARY_DIGEST}" "$ORDINARY_FINAL_REF"
          oras cp --from-plain-http \
            "${AUTHORIZED_LOCAL_REPOSITORY}@${AUTHORIZED_DIGEST}" "$AUTHORIZED_FINAL_REF"
          test "$(oras resolve "$ORDINARY_FINAL_REF")" = "$ORDINARY_DIGEST"
          test "$(oras resolve "$AUTHORIZED_FINAL_REF")" = "$AUTHORIZED_DIGEST"

          attach_and_verify() {
            subject="$1"
            digest="$2"
            label="$3"
            output="/tmp/${label}-certification-referrer.json"
            discovery="/tmp/${label}-certification-discovery.json"
            oras attach \
              --artifact-type application/vnd.stocker.sentinel.software-certification.v1 \
              --annotation "org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}" \
              --format json \
              "${subject}@${digest}" \
              certification.json:application/vnd.stocker.sentinel.software-certification.v1+json \
              provenance.json:application/vnd.stocker.sentinel.provenance.v5+json \
              ordinary-attestation.sigstore.json:application/vnd.dev.sigstore.bundle.v0.3+json \
              authorized-attestation.sigstore.json:application/vnd.dev.sigstore.bundle.v0.3+json \
              SHA256SUMS:text/plain > "$output"
            referrer_digest="$(python - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as source:
              value = json.load(source)
          digest = value.get('digest')
          if not isinstance(digest, str) or not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('REFUSED: certification referrer has no immutable digest')
          print(digest)
          PY
            )"
            oras discover \
              --artifact-type application/vnd.stocker.sentinel.software-certification.v1 \
              --format json "${subject}@${digest}" > "$discovery"
            CERTIFICATION_DIGEST="$referrer_digest" DISCOVERY="$discovery" python - <<'PY'
          import json, os
          with open(os.environ['DISCOVERY'], encoding='utf-8') as source:
              value = json.load(source)
          refs = value.get('referrers') if isinstance(value, dict) else None
          expected = os.environ['CERTIFICATION_DIGEST']
          if not isinstance(refs, list) or expected not in {
              item.get('digest') for item in refs if isinstance(item, dict)
          }:
              raise SystemExit('REFUSED: certification referrer is not discoverable')
          PY
            printf '%s' "$referrer_digest"
          }

          ordinary_certification="$(attach_and_verify "$ORDINARY_SUBJECT" "$ORDINARY_DIGEST" ordinary)"
          authorized_certification="$(attach_and_verify "$AUTHORIZED_SUBJECT" "$AUTHORIZED_DIGEST" authorized)"
          {
            echo '### Protected Sentinel publication'
            echo
            printf -- '- ordinary runtime: `%s@%s`\n' "$ORDINARY_SUBJECT" "$ORDINARY_DIGEST"
            printf -- '- ordinary certification referrer: `%s`\n' "$ordinary_certification"
            printf -- '- authorized runtime: `%s@%s`\n' "$AUTHORIZED_SUBJECT" "$AUTHORIZED_DIGEST"
            printf -- '- authorized certification referrer: `%s`\n' "$authorized_certification"
            printf -- '- retained evidence: %s\n' "$EVIDENCE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the runner-local promotion registry
        if: always()
        shell: bash
        run: docker rm --force sentinel-promotion-registry >/dev/null 2>&1 || true
