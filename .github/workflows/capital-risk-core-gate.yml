name: Capital risk canonical C V gate

on:
  push:
    branches: [codex/capital-risk-research]
    paths:
      - 'research/capital_risk/core-gate-request.json'

permissions:
  contents: read

concurrency:
  group: capital-risk-canonical-core-gate
  cancel-in-progress: false

jobs:
  canonical-gate:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
          fetch-depth: 1
      - name: Install hash-locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Verify research guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -v'
      - name: Authenticate frozen inputs and retained runtime
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/core-gate-staging.json'
      - name: Build private source copies and qualify canonical operations
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/core_gate_job.py --request research/capital_risk/core-gate-request.json --staging-receipt artifacts/capital-risk/core-gate-staging.json --output artifacts/capital-risk/core-gate.json'
      - name: Preserve only encrypted evidence and nonfinancial receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-risk-canonical-core-gate-${{ github.sha }}
          path: |
            artifacts/capital-risk/core-gate-staging.json
            artifacts/capital-risk/core-gate.json
            artifacts/capital-risk/core-gate.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
