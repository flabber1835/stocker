name: Backtester - historical metadata V2 unresolved inventory
run-name: Historical metadata V2 unresolved inventory — ${{ github.sha }}

on:
  push:
    branches: [research/enrich-pit-2007-2026-metadata]
    paths:
      - '.github/workflows/backtester-historical-metadata-v2-unresolved-inventory.yml'
      - 'backtester/analyze_unresolved_metadata_v2.py'
      - 'tests/backtester/test_unresolved_episode_inventory.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '33701529865'
  SOURCE_RUN_SHA: '3556a6c9e01410bed6af02c0bd0d42eb718d2068'
  ECONOMIC_SOURCE_SHA: '4c11413f8dbb8b263367022c658a303035d9156b'
  SOURCE_ARTIFACT: historical-metadata-v2-resilient-indexed-evidence-431686edffef158ff61c122c977ff2c7c18b7036-3556a6c9e01410bed6af02c0bd0d42eb718d2068
  PACKAGE: backtester-results/historical-metadata-v2-package
  OUTPUT: backtester-results/unresolved-metadata-analysis

jobs:
  inventory:
    name: Classify all unresolved metadata episodes without changing admission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run fail-closed inventory regression
        run: |
          set -euo pipefail
          python -m compileall -q backtester/analyze_unresolved_metadata_v2.py tests/backtester/test_unresolved_episode_inventory.py
          python - <<'PY'
          import runpy
          import tempfile
          from pathlib import Path
          namespace = runpy.run_path('tests/backtester/test_unresolved_episode_inventory.py')
          with tempfile.TemporaryDirectory() as directory:
              namespace['test_analyze_routes_and_never_converts_unknown_to_ineligible'](Path(directory))
          print({'status': 'PASS', 'regression': 'unresolved episodes remain non-admitted'})
          PY

      - name: Download completed authenticated V2 evidence package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ env.PACKAGE }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify package and immutable source binding
        run: |
          set -euo pipefail
          python -m backtester.historical_metadata_reconstruction_v2 verify --root "${PACKAGE}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['PACKAGE'])
          binding = json.load(open(root / 'recovery_binding.json'))
          evidence = json.load(open(root / 'evidence_manifest.json'))
          timeline = json.load(open(root / 'timeline' / 'timeline_coverage.json'))
          assert binding['status'] == 'PASS'
          assert binding['economic_source_sha'] == os.environ['ECONOMIC_SOURCE_SHA']
          assert int(binding['source_run_id']) == 33468938050
          assert evidence['source_sha'] == os.environ['ECONOMIC_SOURCE_SHA']
          assert timeline['status'] == 'PASS'
          assert int(timeline['unresolved_episode_records']) == 8353
          print({
              'status': 'PASS',
              'economic_source_sha': binding['economic_source_sha'],
              'source_run_id': binding['source_run_id'],
              'unresolved_episode_records': timeline['unresolved_episode_records'],
          })
          PY

      - name: Build unresolved-episode resolution inventory
        run: |
          set -euo pipefail
          python -m backtester.analyze_unresolved_metadata_v2 \
            --package-root "${PACKAGE}" \
            --output "${OUTPUT}"
          cat "${OUTPUT}/SUMMARY.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce diagnostic does not certify unresolved episodes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.load(open(Path(os.environ['OUTPUT']) / 'unresolved_analysis_summary.json'))
          assert summary['status'] == 'PASS'
          assert summary['admission_status'] == 'REVIEW_REQUIRED'
          assert summary['unresolved_episode_records'] == 8353
          assert summary['policy']['unknown_never_means_ineligible'] is True
          assert summary['policy']['triage_priority_does_not_change_admission'] is True
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload unresolved-episode inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-v2-unresolved-inventory-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 90
