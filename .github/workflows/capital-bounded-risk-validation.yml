name: Locked two-candidate risk validation
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/risk-validation-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: bounded-risk-selected-validation-001
  cancel-in-progress: false
jobs:
  validation:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows
          fetch-depth: 2
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/risk-search-requirements.lock
      - name: Verify pure transport and research guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -q'
      - name: Authenticate original encrypted inputs and runtime
        timeout-minutes: 7
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/validation-staging.json'
      - name: Fetch exact price evidence and committed selected ciphertexts
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40706014951 --repo flabber1835/stocker --name holding-action-price-64f241d49c8d3fc5128a54deda0d435498d50089 --dir "$RUNNER_TEMP/validation-price"
          "$RUNNER_TEMP/transfer-python/bin/python" -B - <<'PY'
          import json,pathlib,os,subprocess,sys
          sys.path.insert(0,'research/capital_risk')
          from risk_validation_job import validate_request
          r=json.loads(pathlib.Path('research/capital_risk/risk-validation-request.json').read_bytes());s=validate_request(r)
          for identifier in s['selected']:
              subprocess.run(['gh','run','download',str(s['search_run_id']),'--repo','flabber1835/stocker','--name','risk-profile-'+identifier+'-'+s['search_head'],'--dir',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'validation-selected'/identifier)],check=True)
          PY
      - name: Authenticate selected books and prove exact own-boundary continuation
        timeout-minutes: 25
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/risk_validation_job.py --request research/capital_risk/risk-validation-request.json --staging-receipt artifacts/capital-risk/validation-staging.json --price-download "$RUNNER_TEMP/validation-price" --selected-download "$RUNNER_TEMP/validation-selected" --output artifacts/capital-risk/risk-selected-validation.json'
      - name: Preserve encrypted compact evidence and restart proofs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: risk-selected-validation-${{ github.sha }}
          path: |
            artifacts/capital-risk/validation-staging.json
            artifacts/capital-risk/risk-selected-validation.json
            artifacts/capital-risk/risk-selected-validation.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
