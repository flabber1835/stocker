name: Backtester - causal terminal terms verification

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-causal-terminal-terms-verify.yml'
      - 'backtester/causal_terminal_terms.py'
      - 'backtester/data/causal-terminal-terms-v1.json'
      - 'backtester/data/causal-terminal-terms-v1.SHA256'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify current frozen terminal bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out frozen research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/causal_terminal_terms.py
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256

      - name: Check out exact production source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Verify bundle checksum schema and exact terms
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/main-src/shared
        run: |
          set -euo pipefail
          (cd backtester/data && sha256sum -c causal-terminal-terms-v1.SHA256)
          python - <<'PY'
          import json
          from pathlib import Path

          from backtester.causal_terminal_terms import load_frozen_terminal_terms
          from stock_strategy_shared.wealth_core.feed import SecurityMeta
          from stock_strategy_shared.wealth_core.terminal import TerminalKind, TerminalTerms

          expected_digest = 'ba679ba200941ebec19520436753b2782b91ba3a4ab2605039c30e8457b67dd4'
          identity = {
              'LIT1':'120448', 'CIT.A':'122131', 'TYC':'573113',
              'GPU':'121383', 'ARXX':'185929', 'EFD1':'182962',
              'CYTC':'173247', 'HOLX':'198055', 'TRB':'165469',
          }
          meta = {
              sid: SecurityMeta(security_id=sid, ticker=ticker, permaticker=sid, related_tickers=())
              for ticker, sid in identity.items()
          }
          terms, digest = load_frozen_terminal_terms(
              Path('backtester/data/causal-terminal-terms-v1.json'),
              Path('backtester/data/causal-terminal-terms-v1.SHA256'),
              sessions=['2001-05-30','2001-06-01','2001-11-07','2007-08-15','2007-09-12','2007-10-22','2007-12-20'],
              resolve_identity=lambda ticker, session: identity.get(ticker),
              meta=meta, TerminalTerms=TerminalTerms, TerminalKind=TerminalKind)
          if digest != expected_digest:
              raise SystemExit(f'wrong terminal digest: {digest}')

          lit = terms['2001-05-30'][0]
          cit = terms['2001-06-01'][0]
          gpu = terms['2001-11-07'][0]
          arxx = terms['2007-08-15'][0]
          efd = terms['2007-09-12'][0]
          cytc = terms['2007-10-22'][0]
          trb = terms['2007-12-20'][0]
          if lit.security_id != '120448' or lit.kind is not TerminalKind.CASH_MERGER or lit.cash_per_share != 80.0:
              raise SystemExit(f'wrong LIT terms: {lit}')
          if (cit.security_id != '122131' or cit.kind is not TerminalKind.CONVERSION
                  or cit.delivered_security_id != '573113' or cit.delivered_ticker != 'TYC'
                  or cit.exchange_ratio != 0.6907
                  or cit.cash_in_lieu_price_per_delivered_share != 57.45):
              raise SystemExit(f'wrong CIT terms: {cit}')
          if gpu.security_id != '121383' or gpu.kind is not TerminalKind.CASH_MERGER or gpu.cash_per_share != 36.5:
              raise SystemExit(f'wrong GPU terms: {gpu}')
          if arxx.security_id != '185929' or arxx.kind is not TerminalKind.CASH_MERGER or arxx.cash_per_share != 14.5:
              raise SystemExit(f'wrong ARXX terms: {arxx}')
          if efd.security_id != '182962' or efd.kind is not TerminalKind.CASH_MERGER or efd.cash_per_share != 36.5:
              raise SystemExit(f'wrong EFD terms: {efd}')
          if (cytc.security_id != '173247' or cytc.kind is not TerminalKind.CASH_PLUS_STOCK
                  or cytc.cash_per_share != 16.5 or cytc.exchange_ratio != 0.52
                  or cytc.delivered_security_id != '198055'
                  or cytc.cash_in_lieu_price_per_delivered_share != 65.63):
              raise SystemExit(f'wrong CYTC terms: {cytc}')
          if trb.security_id != '165469' or trb.kind is not TerminalKind.CASH_MERGER or trb.cash_per_share != 34.0:
              raise SystemExit(f'wrong TRB terms: {trb}')

          raw = json.loads(Path('backtester/data/causal-terminal-terms-v1.json').read_text())
          gpu_raw = next(r for r in raw['records'] if r['security_id'] == '121383')
          arxx_raw = next(r for r in raw['records'] if r['security_id'] == '185929')
          efd_raw = next(r for r in raw['records'] if r['security_id'] == '182962')
          cytc_raw = next(r for r in raw['records'] if r['security_id'] == '173247')
          trb_raw = next(r for r in raw['records'] if r['security_id'] == '165469')
          if gpu_raw['effective_session'] != '2001-11-07' or gpu_raw['known_by'] != '2001-11-06':
              raise SystemExit(f'wrong GPU causal dates: {gpu_raw}')
          if arxx_raw['effective_session'] != '2007-08-15' or arxx_raw['known_by'] != '2007-08-15':
              raise SystemExit(f'wrong ARXX causal dates: {arxx_raw}')
          if efd_raw['effective_session'] != '2007-09-12' or efd_raw['known_by'] != '2007-06-27':
              raise SystemExit(f'wrong EFD causal dates: {efd_raw}')
          if cytc_raw['effective_session'] != '2007-10-22' or cytc_raw['known_by'] != '2007-10-22':
              raise SystemExit(f'wrong CYTC causal dates: {cytc_raw}')
          if trb_raw['effective_session'] != '2007-12-20' or trb_raw['known_by'] != '2007-12-20':
              raise SystemExit(f'wrong TRB causal dates: {trb_raw}')

          print(json.dumps({
              'status':'PASS',
              'terminal_terms_sha256':digest,
              'events':[
                  {'security_id':'120448','ticker':'LIT1','kind':'CASH_MERGER','cash_per_share':80.0},
                  {'security_id':'122131','ticker':'CIT.A','kind':'CONVERSION','exchange_ratio':0.6907},
                  {'security_id':'121383','ticker':'GPU','kind':'CASH_MERGER','cash_per_share':36.5,'known_by':'2001-11-06'},
                  {'security_id':'185929','ticker':'ARXX','kind':'CASH_MERGER','cash_per_share':14.5,'effective_session':'2007-08-15'},
                  {'security_id':'182962','ticker':'EFD1','kind':'CASH_MERGER','cash_per_share':36.5,'effective_session':'2007-09-12','known_by':'2007-06-27'},
                  {'security_id':'173247','ticker':'CYTC','kind':'CASH_PLUS_STOCK','cash_per_share':16.5,'exchange_ratio':0.52,'effective_session':'2007-10-22'},
                  {'security_id':'165469','ticker':'TRB','kind':'CASH_MERGER','cash_per_share':34.0,'effective_session':'2007-12-20'},
              ],
          }, indent=2, sort_keys=True))
          PY
