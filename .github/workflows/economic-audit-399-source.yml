name: Economic audit 399 source evidence
on:
  push:
    branches: [audit/economic-399-evidence]
    paths: [.github/workflows/economic-audit-399-source.yml]
permissions:
  contents: read
  issues: read
concurrency:
  group: economic-audit-399-source
  cancel-in-progress: true
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aff4461d9af6d4a7367018768fda18d948958b49
          persist-credentials: false
          fetch-depth: 1
      - name: Export and verify exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = aff4461d9af6d4a7367018768fda18d948958b49
          test "$(git rev-parse HEAD^{tree})" = 56790bb69b1c65b981ffee94c2a58542916b3b52
          mkdir -p "$RUNNER_TEMP/economic-audit-399"
          git ls-tree -r -l HEAD > "$RUNNER_TEMP/economic-audit-399/git-tree.txt"
          git show -s --format=fuller HEAD > "$RUNNER_TEMP/economic-audit-399/commit.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'economic-audit-399'
          raw = subprocess.check_output(['git','ls-tree','-r','-l','-z','HEAD'])
          rows = []
          code = {'.py','.sql','.sh','.bash','.ps1','.bat','.cmd','.js','.ts','.tsx','.jsx','.css','.html','.htm','.yaml','.yml','.toml','.ini','.cfg','.conf','.c','.cpp','.h'}
          text = {'.md','.rst','.txt','.lock','.json','.csv','.xml','.env','.example','.sample','.ipynb'}
          with tarfile.open(out/'source.tar.gz','w:gz',compresslevel=6) as archive:
              for entry in raw.split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t',1)
                  mode, kind, sha, size = metadata.decode().split()
                  path = pathlib.Path(os.fsdecode(name))
                  selected = kind == 'blob' and (path.suffix in code or ((path.suffix in text or not path.suffix or len(path.parts)==1) and int(size)<=2000000))
                  rows.append({'path':str(path),'mode':mode,'type':kind,'sha':sha,'size':size,'selected':selected})
                  if selected:
                      data = os.readlink(path).encode() if path.is_symlink() else path.read_bytes()
                      actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                      if actual != sha:
                          raise RuntimeError(f'blob mismatch: {path}')
                      archive.add(path,arcname=str(path),recursive=False)
          (out/'inventory.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('Tracked:',len(rows),'Exported:',sum(row['selected'] for row in rows))
          print('Selected bytes:',sum(int(r['size']) for r in rows if r['selected']))
          print('Archive bytes:',(out/'source.tar.gz').stat().st_size)
          print('Omitted files are individually identified in inventory.json')
          PY
      - name: Retain prior audit ledgers and change inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/economic-audit-399"
          for issue in 364 373; do
            gh api "repos/flabber1835/stocker/issues/$issue" > "issue-$issue.json"
            gh api --paginate --slurp "repos/flabber1835/stocker/issues/$issue/comments?per_page=100" > "issue-$issue-comments.json"
          done
          gh api "repos/flabber1835/stocker/compare/09dde38d270ad069a006ee3cb458037d42ade316...aff4461d9af6d4a7367018768fda18d948958b49" > prior-baseline-comparison.json
          sha256sum source.tar.gz git-tree.txt commit.txt inventory.json issue-*.json prior-baseline-comparison.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: economic-audit-399-source-aff4461d
          path: ${{ runner.temp }}/economic-audit-399/
          retention-days: 7
          if-no-files-found: error
