name: P01 source-bound action-clock qualification
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/p01_action_clock_request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: system-optimization-002-p01-action-clock
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/capital_risk
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/wwe-transfer-requirements.lock
      - name: Verify own438 and exact proposal and source closure
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/p01_action_clock_probe.py --request research/capital_risk/p01_action_clock_request.json'
      - name: Authenticate frozen inputs and offline runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/full-core-staging.json'
      - name: Observe bounded Sep30 and Oct1 component from own438
        timeout-minutes: 38
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/p01_action_clock_job.py --request research/capital_risk/p01_action_clock_request.json --staging artifacts/capital-risk/full-core-staging.json --output artifacts/capital-risk/p01-action-clock.json'
      - name: Preserve nonfinancial notes and encrypted known-stopped qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-p01-action-clock-${{ github.sha }}
          path: |
            artifacts/capital-risk/full-core-staging.json
            artifacts/capital-risk/p01-action-clock-phase.json
            artifacts/capital-risk/p01-action-clock-export-qualification.json
            artifacts/capital-risk/p01-action-clock.json
            artifacts/capital-risk/p01-action-clock.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
