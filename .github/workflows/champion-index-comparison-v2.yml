name: Research Champion - exact SPY IWV comparison V2
run-name: RESEARCH NOT CERTIFIED - exact SPY IWV 2x2 V2 - ${{ github.sha }}
on:
  push:
    branches: [research/champion-market-risk-controller-robustness]
    paths:
      - '.github/workflows/champion-index-comparison-v2.yml'
      - 'backtester/research_champion_index_comparison_v2.py'
      - 'tests/backtester/test_research_champion_index_comparison_v2.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'
  INDEX_BASELINE_DIR: '/tmp/comparison-baseline'
  INDEX_IWV_CSV: '/tmp/comparison-iwv/iwv-cutoff-through-2026-07-31.csv'
  INDEX_VIX_CSV: '/tmp/comparison-vix/vix-cboe-cutoff-through-2026-07-31.csv'
jobs:
  preflight:
    name: V2 regression and finalization preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/**
            /tests/backtester/test_research_champion_index_comparison_v2.py
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/strategy9-e3-broad-stability/**
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install frozen runtime and bind source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/backtester" >> "$GITHUB_ENV"
          echo "INDEX_PREFLIGHT_OUTPUT=${GITHUB_WORKSPACE}/index-preflight" >> "$GITHUB_ENV"
          (cd backtester/data && sha256sum -c champion-best-effort-security-types-v1.SHA256)
          test "$(sha256sum backtester/data/champion-historical-security-type-corrections-v1.csv | cut -d' ' -f1)" = 30f1e7223bc088714e4ee17b131f90da61bcbaf0684bfcb9c3331c9d1bc06db3
      - name: Retrieve retained baseline and observation witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/comparison-baseline /tmp/comparison-iwv /tmp/comparison-vix
          gh run download 34007704385 -R "$GITHUB_REPOSITORY" -n champion-corrected-classification-34007704385-1 -D /tmp/comparison-baseline
          gh run download 34011322722 -R "$GITHUB_REPOSITORY" -n champion-r3000-proxy-screen-v2-34011322722-1 -D /tmp/comparison-iwv
          gh run download 34010233044 -R "$GITHUB_REPOSITORY" -n champion-market-risk-screen-34010233044-1 -D /tmp/comparison-vix
      - name: Validate all four cells and exercise finalization
        run: |
          set -euo pipefail
          mkdir -p index-preflight
          python - <<'PY' 2>&1 | tee index-preflight/preflight.log
          import json, os, sys, unittest
          from pathlib import Path
          suite=unittest.defaultTestLoader.discover('tests/backtester',pattern='test_research_champion_index_comparison_v2.py')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          passed=result.wasSuccessful() and result.testsRun>=13 and not result.skipped
          report={'status':'PASS' if passed else 'FAIL','source_sha':os.environ['GITHUB_SHA'],'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped)}
          Path('index-preflight/preflight-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          sys.exit(0 if passed else 1)
          PY
          cat index-preflight/preflight-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-index-v2-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: index-preflight/
          retention-days: 90
          if-no-files-found: error
  replay:
    name: Exact V2 - ${{ matrix.proxy }} - ${{ matrix.parameters }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        proxy: [SPY, IWV]
        parameters: [spy-center, iwv-center]
    env:
      OUT: index-comparison/${{ matrix.proxy }}-${{ matrix.parameters }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/**
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/strategy9-e3-broad-stability/**
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install and bind frozen replay runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          mkdir -p "$OUT"
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/backtester" >> "$GITHUB_ENV"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "$GITHUB_ENV"
          (cd backtester/data && sha256sum -c champion-best-effort-security-types-v1.SHA256)
          test "$(sha256sum backtester/data/champion-historical-security-type-corrections-v1.csv | cut -d' ' -f1)" = 30f1e7223bc088714e4ee17b131f90da61bcbaf0684bfcb9c3331c9d1bc06db3
      - name: Retrieve retained witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/comparison-baseline /tmp/comparison-iwv /tmp/comparison-vix
          gh run download 34007704385 -R "$GITHUB_REPOSITORY" -n champion-corrected-classification-34007704385-1 -D /tmp/comparison-baseline
          gh run download 34011322722 -R "$GITHUB_REPOSITORY" -n champion-r3000-proxy-screen-v2-34011322722-1 -D /tmp/comparison-iwv
          gh run download 34010233044 -R "$GITHUB_REPOSITORY" -n champion-market-risk-screen-34010233044-1 -D /tmp/comparison-vix
      - name: Authenticate immutable canonical package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          POINTER=backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "${PACKAGE}" = 'ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c'
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE"
          cid=$(docker create "$PACKAGE" /bin/true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "${cid}:/canonical-pit/." canonical-pit/
          python backtester/canonical_pit_package.py verify --pointer "$POINTER" --dataset canonical-pit > "$OUT/package-integrity.json"
      - name: Run exact chronological 20-year replay and frozen-path validation
        run: |
          set -euo pipefail
          python backtester/research_champion_index_comparison_v2.py \
            --output "$OUT" --market-proxy '${{ matrix.proxy }}' --parameter-set '${{ matrix.parameters }}' \
            --baseline-daily "$INDEX_BASELINE_DIR/daily.csv.gz" --iwv-csv "$INDEX_IWV_CSV" --vix-csv "$INDEX_VIX_CSV" \
            2>&1 | tee "$OUT/replay.log"
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          cat "$OUT/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-index-v2-${{ matrix.proxy }}-${{ matrix.parameters }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve compact comparison evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-index-v2-summary-${{ matrix.proxy }}-${{ matrix.parameters }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUT }}/daily.csv.gz
            ${{ env.OUT }}/metrics.csv
            ${{ env.OUT }}/REPORT.md
            ${{ env.OUT }}/index-comparison-v2-manifest.json
            ${{ env.OUT }}/frozen-path-validation.json
          retention-days: 90
          if-no-files-found: error
  comparison:
    name: Compare exact index and parameter effects
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Retrieve completed compact evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p comparison-input comparison-results
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p "champion-index-v2-summary-*-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -D comparison-input
      - name: Assemble 5 10 15 20-year results and controlled attribution
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          root=Path('comparison-input'); out=Path('comparison-results'); rows=[]; manifests=[]
          for p in sorted(root.rglob('metrics.csv')):
              manifest=json.loads((p.parent/'index-comparison-v2-manifest.json').read_text())
              assert manifest['source_sha']==os.environ['GITHUB_SHA']
              assert manifest['frozen_path_validation']['status']=='PASS'
              manifests.append(manifest)
              rows.extend(r for r in csv.DictReader(p.open()) if r['variant']=='RESEARCH' and r['window_years'] in ('5','10','15','20'))
          assert len(manifests)==4 and len(rows)==16, 'incomplete 2x2 comparison'
          cells={(m['market_proxy'],m['parameter_set']) for m in manifests}
          assert cells=={(p,s) for p in ('SPY','IWV') for s in ('spy-center','iwv-center')}
          with (out/'exact-index-comparison-metrics.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          long={ (r['market_observation_proxy'],r['index_parameter_set']):r for r in rows if r['window_years']=='20'}
          effects=[]
          for settings in ('spy-center','iwv-center'):
              a=long['SPY',settings];b=long['IWV',settings]
              effects.append({'contrast':'IWV minus SPY','fixed_parameter_set':settings,'cagr_difference_pp':100*(float(b['cagr'])-float(a['cagr'])),'max_drawdown_difference_pp':100*(float(b['max_drawdown'])-float(a['max_drawdown']))})
          for proxy in ('SPY','IWV'):
              a=long[proxy,'spy-center'];b=long[proxy,'iwv-center']
              effects.append({'contrast':'IWV-center settings minus SPY-center settings','fixed_index':proxy,'cagr_difference_pp':100*(float(b['cagr'])-float(a['cagr'])),'max_drawdown_difference_pp':100*(float(b['max_drawdown'])-float(a['max_drawdown']))})
          (out/'controlled-attribution.json').write_text(json.dumps(effects,indent=2)+'\n')
          lines=['# Exact SPY/IWV V2 comparison','','RESEARCH / NOT CERTIFIED','','| Index | Settings | Years | CAGR | Max drawdown | Sharpe | Ending multiple |','|---|---|---:|---:|---:|---:|---:|']
          for r in rows:
              lines.append(f"| {r['market_observation_proxy']} | {r['index_parameter_set']} | {r['window_years']} | {float(r['cagr']):.2%} | {float(r['max_drawdown']):.2%} | {float(r['sharpe']):.3f} | {float(r['ending_multiple']):.3f}x |")
          lines+=['','All four replays passed frozen-path validation. Stock selection, Native Sentinel, cash mechanics and SPY benchmark retain the corrected baseline.','','Index contrasts hold settings fixed. Parameter contrasts hold the index fixed. Positive signed drawdown differences indicate shallower drawdowns.','','The full 20-year interval was used in research and parameter selection. The result is an in-sample comparison; historical-vintage and strategy-path PIT certification remain pending.']
          (out/'REPORT.md').write_text('\n'.join(lines)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines));print(json.dumps(effects,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-index-v2-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparison-results/
          retention-days: 90
          if-no-files-found: error
