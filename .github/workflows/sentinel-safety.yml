name: Sentinel safety

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certification-and-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # PR runs check out GitHub's synthetic merge commit.  Two commits
          # retain its first parent so whitespace validation covers the actual
          # proposed diff instead of the already-clean working tree.
          fetch-depth: 2

      - name: Build the pinned Sentinel runtime and test images
        run: |
          docker build -f Dockerfile.sentinel -t sentinel:latest .
          docker build -f Dockerfile.sentinel-test -t sentinel-test:ci .

      - name: Build the production bt-engine and its pinned test lens
        run: |
          docker build -f Dockerfile.base -t stocker-base:latest .
          docker build -f services/bt-engine/Dockerfile -t stocker-bt-engine:ci .
          docker build \
            --build-arg BT_ENGINE_IMAGE=stocker-bt-engine:ci \
            -f services/bt-engine/Dockerfile.test \
            -t stocker-bt-engine-test:ci .

      - name: Run the complete Sentinel suite without network access
        run: |
          docker run --rm --network none sentinel-test:ci tests/sentinel -q

      - name: Run the changed bt-engine boundary without network access or skips
        run: |
          set -o pipefail
          docker run --rm --network none stocker-bt-engine-test:ci \
            tests/bt_engine/test_wealth_core_api.py \
            tests/bt_engine/test_wealth_core_warmup.py \
            -q -rA | tee /tmp/bt-engine-focused.txt
          if grep -Eq '[0-9]+ skipped' /tmp/bt-engine-focused.txt; then
            echo 'REFUSED: the merge-critical bt-engine run skipped tests' >&2
            exit 1
          fi

      - name: Validate shell and Compose surfaces
        env:
          SENTINEL_POSTGRES_PASSWORD: ci-not-a-production-secret
          SENTINEL_BACKUP_DIR: /tmp/sentinel-ci-backup
        run: |
          bash -n scripts/sentinel-certify.sh scripts/sentinel-archive-wal.sh
          mkdir -p "$SENTINEL_BACKUP_DIR/wal" "$SENTINEL_BACKUP_DIR/base"
          docker compose \
            -f docker-compose.sentinel.yml \
            -f docker-compose.sentinel-backup.yml \
            config --quiet
          git diff --check HEAD^ HEAD
