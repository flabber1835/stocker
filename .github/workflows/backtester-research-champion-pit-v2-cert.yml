name: Backtester - Research Champion formal PIT v2 certification
run-name: Research Champion formal PIT v2 certification - ${{ github.sha }}

on:
  push:
    branches:
      - research/research-champion
    paths:
      - '.github/workflows/backtester-research-champion-pit-v2-cert.yml'
      - 'backtester/certify_backtest_result_v2.py'
      - 'backtester/research_champion_terminal_leadership_overlay.py'
      - 'backtester/run_research_champion_strict_pit_20y_v2.py'
      - 'backtester/future_leak_certification_pinned_runtime.py'
      - 'backtester/pinned_runtime_test_compat.py'
      - 'backtester/render_research_champion_report.py'
      - 'tests/backtester/test_research_champion_pit_v2_fixes.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: read

concurrency:
  group: backtester-research-champion-pit-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  PIT_OFFICIAL_BACKTEST: '1'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'
  PIT_RUNTIME_MAIN_SHA: '887f479b15ad861313da666ad698034d3847121c'
  PIT_POINTER: 'backtester/data/canonical-pit-20y.json'
  PYTHONUNBUFFERED: '1'

jobs:
  certify:
    name: Exact-head Champion replay + schema-v2 certification + retained report
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact Research Champion source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-research-champion-pit-v2-cert.yml
            /backtester
            /tests
            /services/backtester
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/strategy9-e3-broad-stability

      - name: Record immutable Champion identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/research-champion"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "PIT_SOURCE_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "PIT_STRATEGY_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Check out pinned runtime authority read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PIT_RUNTIME_MAIN_SHA }}
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared

      - name: Verify pinned runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C main-src rev-parse HEAD)" = "${PIT_RUNTIME_MAIN_SHA}"
          test -z "$(git -C main-src status --porcelain)"
          test -f services/backtester/app/__init__.py
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/services/backtester:${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen runtime and test closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          python -m pip install -r services/backtester/requirements.txt
          python -m pip install pytest==8.4.2

      - name: Compile and self-test corrected Champion entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/certify_backtest_result_v2.py \
            backtester/research_champion_terminal_leadership_overlay.py \
            backtester/run_research_champion_strict_pit_20y_v2.py \
            backtester/future_leak_certification_pinned_runtime.py \
            backtester/pinned_runtime_test_compat.py \
            backtester/render_research_champion_report.py
          python -m unittest tests.backtester.test_research_champion_pit_v2_fixes -v
          python backtester/run_research_champion_strict_pit_20y_v2.py --self-test-imports

      - name: Pull and verify immutable canonical PIT v2 package
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE=$(python -c "import json; print(json.load(open('${PIT_POINTER}'))['package'])")
          test "${PACKAGE#*@sha256:}" != "${PACKAGE}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          rm -rf backtester-results/canonical-pit-20y && mkdir -p backtester-results/canonical-pit-20y
          cid=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/canonical-pit/." backtester-results/canonical-pit-20y
          docker rm "${cid}"; trap - EXIT
          python backtester/canonical_pit_package.py verify \
            --pointer "${PIT_POINTER}" --dataset backtester-results/canonical-pit-20y
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backtester/data/canonical-pit-20y.json').read_text())
          m=json.loads(Path('backtester-results/canonical-pit-20y/manifest.json').read_text())
          assert p['status']=='PASS'
          assert m['status']=='PASS'
          assert m['schema']=='backtester.canonical-pit-dataset/2'
          assert m['dataset_hash']==p['dataset_hash']
          assert m['reconstruction_code_sha']==p['reconstruction_code_sha']
          print('[CANONICAL_V2] PASS',p['dataset_hash'],p['package'])
          PY
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/backtester-results/canonical-pit-20y" >> "${GITHUB_ENV}"

      - name: Freeze one exact experiment identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backtester-results/pit-v2 backtester-results/research-champion-20y backtester-results/final
          PARAMS='{"entrypoint":"run_research_champion_strict_pit_20y_v2.py","mode":"fullpit","profile":"strategy9-e3-research-champion-v1","LDRC_REC":8,"LDRC_R20":-0.085,"LDRC_V":0.11,"LDRC_DD":-0.10,"divergence_spy_floor":0.0,"full_recovery_r40_floor":0.0,"FAST_damaged":0.88,"healthy_damaged_ceiling":0.63,"runtime_main_sha":"887f479b15ad861313da666ad698034d3847121c","terminal_grace":true,"certification_contract":"backtester.pit-certification/1"}'
          echo "PIT_PARAMETERS_JSON=${PARAMS}" >> "${GITHUB_ENV}"
          python backtester/certify_backtest_result_v2.py identity \
            --mode research --source-sha "${GITHUB_SHA}" --strategy-sha "${GITHUB_SHA}" \
            --workflow-sha "${GITHUB_SHA}" --pointer "${PIT_POINTER}" \
            --parameters-json "${PARAMS}" --source-root . \
            --output backtester-results/pit-v2/experiment-identity.json

      - name: Run complete financial and causality test closure
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backtester tests/backtester tests/support
          python -m pytest -q -p backtester.pinned_runtime_test_compat tests/backtester \
            2>&1 | tee backtester-results/pit-v2/tests-backtester.log

      - name: Audit exact schema-v2 canonical dataset
        shell: bash
        run: |
          set -euo pipefail
          python backtester/certify_backtest_result_v2.py audit-dataset \
            --dataset backtester-results/canonical-pit-20y --pointer "${PIT_POINTER}" \
            --output backtester-results/pit-v2/dataset-audit.json \
            2>&1 | tee backtester-results/pit-v2/dataset-audit.log
          python - <<'PY'
          import json
          a=json.load(open('backtester-results/pit-v2/dataset-audit.json'))
          assert all(v=='PASS' for v in a['checks'].values()), a['checks']
          assert a['universe_resolution']['unresolved']==0
          assert a['terminal_accounting']['complete'] is True
          print('[DATASET_AUDIT_V2] PASS')
          PY

      - name: Run bounded real-corpus future poison and truncation certification
        shell: bash
        run: |
          set -euo pipefail
          python backtester/future_leak_certification_pinned_runtime.py \
            --dataset backtester-results/canonical-pit-20y \
            --output backtester-results/pit-v2/dynamic-future-leak.json \
            --require-real-replay \
            2>&1 | tee backtester-results/pit-v2/dynamic-future-leak.log
          python - <<'PY'
          import json
          d=json.load(open('backtester-results/pit-v2/dynamic-future-leak.json'))
          assert d['status']=='PASS', d
          print('[DYNAMIC_FUTURE_LEAK] PASS')
          PY

      - name: Seal mandatory suite evidence
        shell: bash
        run: |
          set -euo pipefail
          python backtester/certify_backtest_result_v2.py collect-tests \
            --identity backtester-results/pit-v2/experiment-identity.json \
            --dataset-audit backtester-results/pit-v2/dataset-audit.json \
            --static-forward-bias PASS --dynamic-future-leak PASS \
            --runtime-causal-read-boundary PASS --financial-semantics PASS \
            --checkpoint-resume PASS \
            --diagnostics backtester-results/pit-v2/dynamic-future-leak.json \
            --output backtester-results/pit-v2/pit-test-evidence.json
          python - <<'PY'
          import json
          t=json.load(open('backtester-results/pit-v2/pit-test-evidence.json'))
          assert t['status']=='PASS', t['checks']
          PY

      - name: Run frozen Research Champion for the full 20 years
        shell: bash
        run: |
          set -euo pipefail
          python backtester/run_research_champion_strict_pit_20y_v2.py \
            --mode fullpit --output backtester-results/research-champion-20y \
            2>&1 | tee research-champion-20y.log

      - name: Verify Champion promotion, canonical consumption, and financial grade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          pointer=json.loads(Path('backtester/data/canonical-pit-20y.json').read_text())
          root=Path('backtester-results/research-champion-20y')
          research=json.loads((root/'summary.json').read_text())
          audit=json.loads((root/'metadata_authority_audit.json').read_text())
          champion=json.loads((root/'research-champion-identity.json').read_text())
          assert research.get('status')=='PASS'
          assert research.get('canonical_pit_dataset_hash')==pointer.get('dataset_hash')
          assert champion.get('profile')=='strategy9-e3-research-champion-v1'
          assert champion.get('status')=='PASS'
          assert champion.get('authoritative_output',{}).get('promoted_from')=='A'
          assert audit.get('current_SHARADAR_TICKERS_economically_active_fields')==[]
          expected={'dividend_lag_sessions':15,'missing_leadership_return_policy':'FAIL_CLOSED','requires_resolved_nav':True,'terminal_grace_integrated':True}
          assert (audit.get('financial_grade') or {})==expected, audit.get('financial_grade')
          print('[CHAMPION_REPLAY] PASS')
          PY

      - name: Seal replay evidence
        shell: bash
        run: |
          set -euo pipefail
          python backtester/certify_backtest_result_v2.py collect-replay \
            --identity backtester-results/pit-v2/experiment-identity.json \
            --output-root backtester-results/research-champion-20y \
            --checkpoint-resume PASS \
            --output backtester-results/pit-v2/pit-replay-evidence.json

      - name: Authoritative PIT finalizer
        shell: bash
        run: |
          set -euo pipefail
          python backtester/certify_backtest_result_v2.py finalize \
            --identity backtester-results/pit-v2/experiment-identity.json \
            --dataset backtester-results/canonical-pit-20y --pointer "${PIT_POINTER}" \
            --replay-evidence backtester-results/pit-v2/pit-replay-evidence.json \
            --test-evidence backtester-results/pit-v2/pit-test-evidence.json \
            --replay-job-result success --tests-job-result success \
            --output backtester-results/final/pit-certificate.json \
            --summary-output backtester-results/final/PIT_CERTIFICATION.txt \
            --github-step-summary "${GITHUB_STEP_SUMMARY}"
          grep -q '^PIT CERTIFIED$' backtester-results/final/PIT_CERTIFICATION.txt
          python - <<'PY'
          import json
          c=json.load(open('backtester-results/final/pit-certificate.json'))
          assert c['status']=='PIT_CERTIFIED', c['blockers']
          print('[PIT_CERTIFIED]',c['certificate_hash'])
          PY

      - name: Generate final backtest report and PDF
        shell: bash
        run: |
          set -euo pipefail
          python backtester/render_research_champion_report.py \
            --replay-root backtester-results/research-champion-20y \
            --certificate backtester-results/final/pit-certificate.json \
            --output-json backtester-results/final/research-champion-20y-report.json \
            --output-pdf backtester-results/final/research-champion-20y-report.pdf
          test -s backtester-results/final/research-champion-20y-report.pdf
          head -c 8 backtester-results/final/research-champion-20y-report.pdf | grep -q '%PDF-1.4'
          if command -v pdftoppm >/dev/null 2>&1; then
            pdftoppm -f 1 -singlefile -png -r 72 \
              backtester-results/final/research-champion-20y-report.pdf /tmp/champion-report >/dev/null
            test -s /tmp/champion-report.png
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths=[
            Path('backtester-results/pit-v2/experiment-identity.json'),
            Path('backtester-results/pit-v2/pit-test-evidence.json'),
            Path('backtester-results/pit-v2/pit-replay-evidence.json'),
            Path('backtester-results/final/pit-certificate.json'),
            Path('backtester-results/final/research-champion-20y-report.json'),
            Path('backtester-results/final/research-champion-20y-report.pdf'),
            Path('backtester-results/research-champion-20y/summary.json'),
            Path('backtester-results/research-champion-20y/metrics.csv'),
            Path('backtester-results/research-champion-20y/research-champion-identity.json'),
            Path('backtester-results/research-champion-20y/metadata_authority_audit.json'),
          ]
          out=[]
          for p in paths:
            h=hashlib.sha256(p.read_bytes()).hexdigest(); out.append(f'{h}  {p.as_posix()}')
          Path('backtester-results/final/SHA256SUMS.txt').write_text('\n'.join(out)+'\n')
          PY

      - name: Upload immutable final certification bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-champion-pit-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backtester/data/canonical-pit-20y.json
            backtester-results/pit-v2/**
            backtester-results/research-champion-20y/**
            backtester-results/final/**
            research-champion-20y.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Retain certified evidence on Research Champion branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          DEST="research/research-champion/certification/${GITHUB_SHA}"
          mkdir -p "${DEST}"
          cp backtester/data/canonical-pit-20y.json "${DEST}/canonical-pit-20y.json"
          cp backtester-results/pit-v2/experiment-identity.json "${DEST}/experiment-identity.json"
          cp backtester-results/pit-v2/pit-test-evidence.json "${DEST}/pit-test-evidence.json"
          cp backtester-results/pit-v2/pit-replay-evidence.json "${DEST}/pit-replay-evidence.json"
          cp backtester-results/final/pit-certificate.json "${DEST}/pit-certificate.json"
          cp backtester-results/final/PIT_CERTIFICATION.txt "${DEST}/PIT_CERTIFICATION.txt"
          cp backtester-results/final/research-champion-20y-report.json "${DEST}/research-champion-20y-report.json"
          cp backtester-results/final/research-champion-20y-report.pdf "${DEST}/research-champion-20y-report.pdf"
          cp backtester-results/final/SHA256SUMS.txt "${DEST}/SHA256SUMS.txt"
          cp backtester-results/research-champion-20y/summary.json "${DEST}/summary.json"
          cp backtester-results/research-champion-20y/metrics.csv "${DEST}/metrics.csv"
          cp backtester-results/research-champion-20y/research-champion-identity.json "${DEST}/research-champion-identity.json"
          cp backtester-results/research-champion-20y/metadata_authority_audit.json "${DEST}/metadata_authority_audit.json"
          git fetch origin research/research-champion:refs/remotes/origin/research/research-champion
          test "$(git rev-parse origin/research/research-champion)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "${DEST}"
          git commit -m "docs(certification): retain Research Champion PIT evidence ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:research/research-champion
