name: Backtester - historical metadata V3 corrected canonical observation audit
run-name: Historical metadata V3 corrected canonical observation audit — ${{ github.sha }}

on:
  push:
    branches: [research/enrich-pit-2007-2026-metadata]
    paths:
      - '.github/workflows/backtester-historical-metadata-v3-corrected-canonical-observation-audit.yml'
      - 'backtester/rebuild_corrected_canonical_metadata_v3.py'
      - 'tests/backtester/test_corrected_canonical_metadata_v3.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

env:
  V2_RUN_ID: '33701529865'
  V2_ARTIFACT: historical-metadata-v2-resilient-indexed-evidence-431686edffef158ff61c122c977ff2c7c18b7036-3556a6c9e01410bed6af02c0bd0d42eb718d2068
  V3_RUN_ID: '33704396721'
  V3_ARTIFACT: historical-metadata-v3-candidates-5d4d826c1c295cdc0a9dde5b80208a7cdf3e14f2
  CORRECTED_RUN_ID: '33710114749'
  CORRECTED_ARTIFACT: historical-metadata-v3-corrected-topology-recovery-4834767c842adb1155b6a2244ec3c4cc33aca886
  V2_ROOT: backtester-results/historical-metadata-v2-package
  V3_ROOT: backtester-results/historical-metadata-v3-candidates
  CORRECTED_ROOT: backtester-results/historical-metadata-v3-corrected-topology
  CANONICAL: backtester-results/canonical-pit-20y
  POINTER: backtester/data/canonical-pit-20y.json
  OUTPUT: backtester-results/historical-metadata-v3-corrected-canonical-observation-audit

jobs:
  audit:
    name: Rebuild corrected metadata overlay and audit all canonical observations
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-historical-metadata-v3-corrected-canonical-observation-audit.yml
            /backtester/rebuild_corrected_canonical_metadata_v3.py
            /backtester/rebuild_historical_metadata_identity_topology_v3.py
            /backtester/historical_metadata_reconstruction_v2.py
            /backtester/data/canonical-pit-20y.json
            /tests/backtester/test_corrected_canonical_metadata_v3.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run fail-closed corrected-overlay regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:backtester/rebuild_historical_metadata_identity_topology_v3.py)" = "ce605a3ad635d6e81705c28b522864cf7a7c7850"
          python -m compileall -q \
            backtester/rebuild_corrected_canonical_metadata_v3.py \
            backtester/rebuild_historical_metadata_identity_topology_v3.py \
            backtester/historical_metadata_reconstruction_v2.py \
            tests/backtester/test_corrected_canonical_metadata_v3.py
          python - <<'PY'
          import runpy
          import tempfile
          from pathlib import Path
          ns=runpy.run_path('tests/backtester/test_corrected_canonical_metadata_v3.py')
          with tempfile.TemporaryDirectory() as td:
              ns['test_corrected_observation_audit_is_strict_prior_and_fail_closed'](Path(td))
          ns['test_exact_sec_source_key_is_ticker_scoped']()
          print({'status':'PASS','contract':'strict-prior observation audit; unknown never means ineligible; SEC source keys are ticker-scoped'})
          PY

      - name: Download authenticated V2 evidence package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: ${{ env.V2_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V2_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download authenticated V3 candidate corpus
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.V3_ARTIFACT }}
          path: ${{ env.V3_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V3_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download corrected identity topology
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.CORRECTED_ARTIFACT }}
          path: ${{ env.CORRECTED_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CORRECTED_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable metadata inputs
        run: |
          set -euo pipefail
          python -m backtester.historical_metadata_reconstruction_v2 verify --root "${V2_ROOT}"
          python -m backtester.historical_metadata_reconstruction_v2 verify --root "${CORRECTED_ROOT}"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          v2=Path(os.environ['V2_ROOT'])
          v3=Path(os.environ['V3_ROOT'])
          corrected=Path(os.environ['CORRECTED_ROOT'])
          v3_summary=json.load(open(v3/'summary.json'))
          corrected_summary=json.load(open(corrected/'summary.json'))
          assert v3_summary['status']=='PASS' and v3_summary['candidate_only'] is True and v3_summary['candidate_rows']==22140
          assert hashlib.sha256((v3/'candidate_evidence.csv.gz').read_bytes()).hexdigest()=='989b58576dd684301cac88bebeb2d7107e1cfbb3fbc28e1b1e2a1a5df2372247'
          assert corrected_summary['status']=='PASS'
          assert corrected_summary['blocking_identity_conflicts']==0
          assert corrected_summary['candidate_mapping_anomalies']==0
          assert corrected_summary['security_type_conflict_episodes']==0
          assert corrected_summary['prospective_unresolved_corrected_topology']==7612
          coverage=json.load(open(v2/'canonical_coverage.json'))
          assert coverage['totals']['unknown_type_observations']==9302460
          assert coverage['totals']['missing_sector_observations']==17230953
          print({'status':'PASS','prospective_unresolved':7612,'v3_candidate_sha256':'989b58576dd684301cac88bebeb2d7107e1cfbb3fbc28e1b1e2a1a5df2372247'})
          PY

      - name: Reclaim hosted-runner space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Pull and authenticate frozen canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          CONTAINER=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true' EXIT
          rm -rf "${CANONICAL}" && mkdir -p "${CANONICAL}"
          docker cp "${CONTAINER}:/canonical-pit/." "${CANONICAL}"
          docker rm "${CONTAINER}"
          trap - EXIT
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          pointer=json.load(open(os.environ['POINTER']))
          root=Path(os.environ['CANONICAL'])
          manifest_path=root/'manifest.json'
          manifest=json.load(open(manifest_path))
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest()==pointer['manifest_sha256']
          assert manifest['status']=='PASS'
          assert manifest['dataset_hash']==pointer['dataset_hash']=='f9fb220871ad4152549d31a5da6e0dbcdd327dc7b05843764511b0e800ddb19b'
          assert manifest['counts']['observation_rows']==31820893
          assert manifest['counts']['unknown_security_type_observations']==9302460
          assert manifest['window']['warmup_start']=='2006-01-03' and manifest['window']['end']=='2026-07-31'
          print({'status':'PASS','dataset_hash':manifest['dataset_hash'],'observations':manifest['counts']['observation_rows']})
          PY

      - name: Rebuild corrected metadata overlay and audit every observation
        run: |
          set -euo pipefail
          rm -rf "${OUTPUT}"
          python -m backtester.rebuild_corrected_canonical_metadata_v3 \
            --canonical-dataset "${CANONICAL}" \
            --v2-root "${V2_ROOT}" \
            --v3-candidate-root "${V3_ROOT}" \
            --corrected-topology-root "${CORRECTED_ROOT}" \
            --output "${OUTPUT}"

      - name: Enforce exact observation-level result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUTPUT'])
          s=json.load(open(root/'summary.json'))
          assert s['status']=='PASS'
          assert s['canonical_observation_rows']==31820893
          assert s['old_security_ids_mapped']==18948
          assert s['baseline']['unknown_type_observations']==9302460
          assert s['baseline']['missing_sector_observations']==17230953
          assert s['unknown_never_means_ineligible'] is True
          assert s['corrected_metadata_overlay_built'] is True
          assert s['canonical_price_dataset_rewritten'] is False
          assert s['unresolved_after_corrected_overlay']['episodes'] >= 0
          print(json.dumps(s, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write((root/'SUMMARY.md').read_text(encoding='utf-8'))
          PY

      - name: Upload corrected canonical metadata audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-v3-corrected-canonical-observation-audit-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
