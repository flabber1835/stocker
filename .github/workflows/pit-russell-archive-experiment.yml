name: PIT Russell archive experiment

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - 'research/pit_russell_archive/**'
      - 'tools/pit_russell_archive_probe.py'
      - 'tools/pit_russell_wayback_nav_probe.py'
      - 'tools/pit_russell_legacy_content_probe.py'
      - 'tests/scripts/test_pit_russell_archive_probe.py'
      - 'tests/scripts/test_pit_russell_wayback_nav_probe.py'
      - 'tests/scripts/test_pit_russell_legacy_content_probe.py'
      - '.github/workflows/pit-russell-archive-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Verify isolated deterministic parsers
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/pit-russell-archive-reconstruction"
          python -m unittest \
            tests.scripts.test_pit_russell_archive_probe \
            tests.scripts.test_pit_russell_wayback_nav_probe \
            tests.scripts.test_pit_russell_legacy_content_probe \
            -v

  legacy-content-probe:
    needs: deterministic-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: r3000-additions
            url: 'http://www.russell.com/indexes/membership/Reconstitution/Recon_3000_Additions.asp'
          - label: r3000-deletions
            url: 'http://www.russell.com/indexes/membership/Reconstitution/Recon_3000_Deletions.asp'
          - label: membership-nav
            url: 'http://www.russell.com/US/Indexes/US/membership.asp'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Recover archived Russell content
        run: |
          set -euo pipefail
          out="/tmp/russell-legacy-${{ matrix.label }}"
          rm -rf "$out"
          python tools/pit_russell_legacy_content_probe.py \
            --from-year 2005 \
            --to-year 2009 \
            --max-pages-per-year 2 \
            --timeout 12 \
            --attempts 2 \
            --delay 0.25 \
            --url '${{ matrix.url }}' \
            --output-dir "$out"
      - name: Publish evidence summary
        if: always()
        run: |
          report="/tmp/russell-legacy-${{ matrix.label }}/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload derived evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pit-russell-${{ matrix.label }}-${{ github.sha }}
          path: |
            /tmp/russell-legacy-${{ matrix.label }}/manifest.json
            /tmp/russell-legacy-${{ matrix.label }}/report.md
          if-no-files-found: warn
          retention-days: 30
