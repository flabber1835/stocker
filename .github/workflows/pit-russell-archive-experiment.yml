name: PIT Russell archive experiment

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - 'research/pit_russell_archive/**'
      - 'tools/pit_russell_archive_probe.py'
      - 'tools/pit_russell_wayback_nav_probe.py'
      - 'tools/pit_russell_legacy_content_probe.py'
      - 'tests/scripts/test_pit_russell_archive_probe.py'
      - 'tests/scripts/test_pit_russell_wayback_nav_probe.py'
      - 'tests/scripts/test_pit_russell_legacy_content_probe.py'
      - '.github/workflows/pit-russell-archive-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Verify isolated deterministic parsers
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/pit-russell-archive-reconstruction"
          python -m unittest \
            tests.scripts.test_pit_russell_archive_probe \
            tests.scripts.test_pit_russell_wayback_nav_probe \
            tests.scripts.test_pit_russell_legacy_content_probe \
            -v

  legacy-content-probe:
    needs: deterministic-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Recover archived membership and reconstitution delta content
        run: |
          set -euo pipefail
          rm -rf /tmp/russell-legacy-content
          python tools/pit_russell_legacy_content_probe.py \
            --from-year 2005 \
            --to-year 2009 \
            --max-pages-per-year 8 \
            --timeout 20 \
            --attempts 3 \
            --delay 0.4 \
            --url 'http://www.russell.com/indexes/membership/Reconstitution/Recon_3000_Additions.asp' \
            --url 'http://www.russell.com/indexes/membership/Reconstitution/Recon_3000_Deletions.asp' \
            --url 'http://www.russell.com/indexes/membership/reconstitution/recon_3000_additions.asp' \
            --url 'http://www.russell.com/indexes/membership/reconstitution/recon_3000_deletions.asp' \
            --url 'http://www.russell.com/US/Indexes/US/membership.asp' \
            --url 'http://www.russell.com/us/indexes/us/membership.asp' \
            --url 'http://www.russell.com/US/Indexes/US/Reconstitution/recon_additions.asp' \
            --url 'http://www.russell.com/US/Indexes/US/Reconstitution/recon_deletions.asp' \
            --output-dir /tmp/russell-legacy-content
      - name: Publish legacy evidence summary
        if: always()
        run: |
          if [ -f /tmp/russell-legacy-content/report.md ]; then
            cat /tmp/russell-legacy-content/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload derived legacy evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pit-russell-legacy-content-${{ github.sha }}
          path: |
            /tmp/russell-legacy-content/manifest.json
            /tmp/russell-legacy-content/report.md
          if-no-files-found: warn
          retention-days: 30
