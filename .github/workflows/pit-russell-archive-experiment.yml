name: PIT Russell archive experiment

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - 'research/pit_russell_archive/**'
      - 'tools/pit_russell_archive_probe.py'
      - 'tests/scripts/test_pit_russell_archive_probe.py'
      - '.github/workflows/pit-russell-archive-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Verify isolation and deterministic probe tests
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/pit-russell-archive-reconstruction"
          python -m unittest tests.scripts.test_pit_russell_archive_probe -v

  old-site-discovery:
    needs: deterministic-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: old-us-indexes-us-upper
            query: 'http://www.russell.com/US/Indexes/US/*3000*'
          - label: old-us-indexes-us-lower
            query: 'http://www.russell.com/us/indexes/us/*3000*'
          - label: old-us-indexes-upper
            query: 'http://www.russell.com/US/Indexes/*3000*'
          - label: old-us-indexes-lower
            query: 'http://www.russell.com/us/indexes/*3000*'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Discover archived pre-2009 Russell URLs
        run: |
          set -euo pipefail
          out="/tmp/${{ matrix.label }}"
          rm -rf "$out"
          python tools/pit_russell_archive_probe.py \
            --from-year 2005 \
            --to-year 2008 \
            --max-downloads-per-year 3 \
            --timeout 20 \
            --attempts 3 \
            --delay 0.4 \
            --url '${{ matrix.query }}' \
            --output-dir "$out"
      - name: Publish discovery summary
        if: always()
        run: |
          report="/tmp/${{ matrix.label }}/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload provenance evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pit-russell-${{ matrix.label }}-${{ github.sha }}
          path: |
            /tmp/${{ matrix.label }}/manifest.json
            /tmp/${{ matrix.label }}/summary.json
            /tmp/${{ matrix.label }}/captures.csv
            /tmp/${{ matrix.label }}/report.md
          if-no-files-found: warn
          retention-days: 30
