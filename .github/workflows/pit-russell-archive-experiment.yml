name: PIT Russell archive experiment

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - 'research/pit_russell_archive/**'
      - 'tools/pit_russell_archive_probe.py'
      - 'tests/scripts/test_pit_russell_archive_probe.py'
      - '.github/workflows/pit-russell-archive-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify isolation and deterministic probe tests
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/pit-russell-archive-reconstruction"
          python -m unittest tests.scripts.test_pit_russell_archive_probe -v

      - name: Probe Russell 3000 primary membership endpoint
        run: |
          set -euo pipefail
          rm -rf /tmp/pit-russell-3000
          python tools/pit_russell_archive_probe.py \
            --from-year 2005 \
            --to-year 2014 \
            --max-downloads-per-year 1 \
            --timeout 6 \
            --attempts 2 \
            --delay 0.25 \
            --url 'http://www.russell.com/indexes/documents/Membership/Russell3000_Membership_List.pdf' \
            --url 'https://www.russell.com/indexes/documents/Membership/Russell3000_Membership_List.pdf' \
            --output-dir /tmp/pit-russell-3000

      - name: Probe Russell 1000 component endpoint
        run: |
          set -euo pipefail
          rm -rf /tmp/pit-russell-1000
          python tools/pit_russell_archive_probe.py \
            --from-year 2005 \
            --to-year 2009 \
            --max-downloads-per-year 1 \
            --timeout 6 \
            --attempts 2 \
            --delay 0.25 \
            --url 'http://www.russell.com/indexes/documents/Membership/Russell1000_Membership_List.pdf' \
            --url 'https://www.russell.com/indexes/documents/Membership/Russell1000_Membership_List.pdf' \
            --output-dir /tmp/pit-russell-1000

      - name: Probe Russell 2000 component endpoint
        run: |
          set -euo pipefail
          rm -rf /tmp/pit-russell-2000
          python tools/pit_russell_archive_probe.py \
            --from-year 2005 \
            --to-year 2009 \
            --max-downloads-per-year 1 \
            --timeout 6 \
            --attempts 2 \
            --delay 0.25 \
            --url 'http://www.russell.com/indexes/documents/Membership/Russell2000_Membership_List.pdf' \
            --url 'https://www.russell.com/indexes/documents/Membership/Russell2000_Membership_List.pdf' \
            --output-dir /tmp/pit-russell-2000

      - name: Publish evidence summaries
        if: always()
        run: |
          for index in 3000 1000 2000; do
            report="/tmp/pit-russell-${index}/report.md"
            if [ -f "$report" ]; then
              echo >> "$GITHUB_STEP_SUMMARY"
              echo "## Russell ${index}" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload provenance evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pit-russell-archive-evidence-${{ github.sha }}
          path: |
            /tmp/pit-russell-3000/manifest.json
            /tmp/pit-russell-3000/summary.json
            /tmp/pit-russell-3000/captures.csv
            /tmp/pit-russell-3000/report.md
            /tmp/pit-russell-1000/manifest.json
            /tmp/pit-russell-1000/summary.json
            /tmp/pit-russell-1000/captures.csv
            /tmp/pit-russell-1000/report.md
            /tmp/pit-russell-2000/manifest.json
            /tmp/pit-russell-2000/summary.json
            /tmp/pit-russell-2000/captures.csv
            /tmp/pit-russell-2000/report.md
          if-no-files-found: warn
          retention-days: 30
