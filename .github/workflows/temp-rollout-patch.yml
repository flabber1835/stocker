name: temp-rollout-patch

on:
  push:
    branches: [fix/rollout-certificate-rotation-chain-v2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/rollout-certificate-rotation-chain-v2

      - name: Apply exact validator patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sentinel/schema.py")
          s = p.read_text(encoding="utf-8")
          old = '''        if from_mode != prior_mode or to_mode not in {
                  "PINNED_1_00", "CONTROLLER"} or to_mode == from_mode:
              raise _operator_refusal(
                  f"rollout event version {event_version} breaks the mode chain")
'''
          new = '''        if from_mode != prior_mode or to_mode not in {
                  "PINNED_1_00", "CONTROLLER"}:
              raise _operator_refusal(
                  f"rollout event version {event_version} breaks the mode chain")
          # A signed certificate renewal is a rollout-generation change even
          # when the exposure controller mode itself does not change. Accept
          # only that meaningful same-mode transition: CONTROLLER with a new,
          # non-null certificate. No-op same-certificate and PINNED renewals
          # remain invalid history.
          if to_mode == from_mode and not (
                  to_mode == "CONTROLLER"
                  and prior_certificate is not None
                  and event_certificate is not None
                  and event_certificate != prior_certificate):
              raise _operator_refusal(
                  f"rollout event version {event_version} breaks the mode chain")
'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"target block count={count}, expected 1")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Commit exact patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-rollout-patch.yml
          git add sentinel/schema.py
          git commit -m "sentinel: accept meaningful controller certificate rotations"
          git push origin HEAD:refs/heads/fix/rollout-certificate-rotation-chain-v2
