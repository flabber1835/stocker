name: Champion PIT terminal integration plan
run-name: Champion PIT terminal integration plan - ${{ github.sha }}

on:
  push:
    branches: [research/champion-pit-metadata-closure]
    paths:
      - '.github/workflows/champion-pit-terminal-integration-plan.yml'
      - 'backtester/plan_champion_terminal_integration.py'
      - 'tests/backtester/test_plan_champion_terminal_integration.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

env:
  STAGE2_RUN_ID: '33997777847'
  STAGE2_ARTIFACT: champion-pit-terminal-closure-stage2-33997777847-1

jobs:
  plan:
    name: Bind accepted terminal authority to canonical identities
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact planning source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run integration planner tests
        run: python -W error::ResourceWarning -m unittest tests.backtester.test_plan_champion_terminal_integration -v

      - name: Download exact accepted stage-two evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.STAGE2_ARTIFACT }}
          path: inputs/stage2
          repository: ${{ github.repository }}
          run-id: ${{ env.STAGE2_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package=$(python -c "import json; print(json.load(open('backtester/data/canonical-pit-20y.json'))['package'])")
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${package}"
          cid=$(docker create "${package}" /bin/true)
          mkdir -p inputs/canonical
          docker cp "${cid}:/canonical-pit/." inputs/canonical/
          docker rm "${cid}"
          (cd inputs/canonical && sha256sum -c SHA256SUMS.txt)

      - name: Build exact integration plan
        run: |
          set -euo pipefail
          (cd inputs/stage2 && sha256sum -c SHA256SUMS.txt)
          python backtester/plan_champion_terminal_integration.py \
            --evidence inputs/stage2/accepted-terminal-events.json \
            --dataset inputs/canonical \
            --output results/integration
          (cd results/integration && sha256sum -c SHA256SUMS.txt)

      - name: Upload immutable integration plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-pit-terminal-integration-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/integration
          if-no-files-found: error
          retention-days: 90
