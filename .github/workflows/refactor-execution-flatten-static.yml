name: Apply static execution flattening

on:
  push:
    branches:
      - codex/flatten-execution-remediation

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical execution path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/sentinel/test_alpaca_postclose_candidates.py')
          text = path.read_text()
          old = '''from sentinel.execution.alpaca_remediation_final import (
              ACTIVITY_FILL_INTERVAL_SEMANTICS,
              ACTIVITY_FILL_INTERVAL_SOURCE,
          )'''
          new = '''from sentinel.execution.alpaca import (
              ACTIVITY_FILL_INTERVAL_SEMANTICS,
              ACTIVITY_FILL_INTERVAL_SOURCE,
          )'''
          if text.count(old) != 1:
              raise RuntimeError('post-close candidate remediation import seam changed')
          path.write_text(text.replace(old, new, 1))
          PY
          python tools/refactor_execution_flatten.py
          python -m py_compile \
            sentinel/execution/__init__.py \
            sentinel/execution/_alpaca_base.py \
            sentinel/execution/alpaca.py \
            sentinel/execution/alpaca_asset_id.py \
            sentinel/execution/authority_gate.py \
            sentinel/execution/broker_cash.py \
            sentinel/execution/executor.py \
            sentinel/execution/guarded.py \
            sentinel/execution/journal.py \
            sentinel/execution/reconcile.py \
            tests/sentinel/test_issue222_import_order.py \
            tests/sentinel/test_alpaca_boundary_overlay.py \
            tests/sentinel/test_alpaca_postclose_candidates.py
          git diff --check
          git rm tools/refactor_execution_flatten.py
          git rm .github/workflows/refactor-execution-flatten-static.yml
      - name: Commit canonical execution path
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(execution): flatten broker remediation stack"
          git push origin HEAD:codex/flatten-execution-remediation
