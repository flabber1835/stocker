name: Apply static execution flattening

on:
  push:
    branches:
      - codex/flatten-execution-remediation

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical execution path
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import textwrap
          from pathlib import Path

          ROOT = Path('.')

          def node_source(text: str, node: ast.AST) -> str:
              lines = text.splitlines(keepends=True)
              return textwrap.dedent(''.join(lines[node.lineno - 1:node.end_lineno]))

          def nested_node(path: str, name: str, kind):
              text = Path(path).read_text()
              tree = ast.parse(text)
              install = next(
                  node for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == 'install')
              node = next(
                  child for child in install.body
                  if isinstance(child, kind) and child.name == name)
              return node_source(text, node)

          def top_node(path: str, name: str, kind):
              text = Path(path).read_text()
              tree = ast.parse(text)
              node = next(
                  child for child in tree.body
                  if isinstance(child, kind) and child.name == name)
              return node_source(text, node)

          def replace_top_function(path: str, name: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              tree = ast.parse(text)
              node = next(
                  child for child in tree.body
                  if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and child.name == name)
              lines = text.splitlines(keepends=True)
              before = ''.join(lines[:node.lineno - 1])
              after = ''.join(lines[node.end_lineno:])
              p.write_text(before + replacement.rstrip() + '\n\n' + after.lstrip('\n'))

          # -----------------------------------------------------------------
          # Alpaca: retain the reviewed transport as a private base and express
          # the final certified adapter as ordinary static inheritance in the
          # canonical public module. No installer mutates another module.
          # -----------------------------------------------------------------
          public_alpaca = Path('sentinel/execution/alpaca.py')
          base_alpaca = Path('sentinel/execution/_alpaca_base.py')
          if base_alpaca.exists():
              raise RuntimeError('_alpaca_base.py already exists')
          public_alpaca.rename(base_alpaca)

          base_text = base_alpaca.read_text()
          old_fp = '''        order.broker_order_id, order.client_key or "",
                  order.instrument.security_id, order.side.value, str(order.quantity),'''
          new_fp = '''        order.broker_order_id, order.client_key or "",
                  order.instrument.security_id, order.instrument.broker_id or "",
                  order.side.value, str(order.quantity),'''
          if old_fp not in base_text:
              raise RuntimeError('base Alpaca fingerprint shape changed')
          base_alpaca.write_text(base_text.replace(old_fp, new_fp, 1))

          first = 'sentinel/execution/alpaca_remediation.py'
          final = 'sentinel/execution/alpaca_remediation_final.py'
          integrity = 'sentinel/execution/alpaca_remediation_integrity.py'
          restart = 'sentinel/execution/alpaca_remediation_restart_fence.py'

          account_bound = nested_node(first, 'AccountBoundObservation', ast.ClassDef)
          native_fill = nested_node(first, 'NativeBrokerFill', ast.ClassDef)
          hardened_alpaca = nested_node(
              first, 'HardenedAlpacaExecutionBroker', ast.ClassDef)
          financial_alpaca = nested_node(
              final, 'FinancialGradeAlpacaExecutionBroker', ast.ClassDef)
          activity_correction = top_node(
              final, 'ActivityCorrectionRequiresRecovery', ast.ClassDef)
          restore_deferred = top_node(
              final, 'RestoreGradeIncreaseDeferred', ast.ClassDef)
          loads_state = top_node(final, '_loads_state', ast.FunctionDef)
          sse_events = top_node(final, '_sse_events', ast.FunctionDef)
          integrity_json = top_node(integrity, '_json', ast.FunctionDef)

          database_incarnation = nested_node(
              final, 'database_incarnation', ast.FunctionDef)
          base_restore = nested_node(
              final, 'restore_increase_fence_reason', ast.FunctionDef)
          base_restore = base_restore.replace(
              'def restore_increase_fence_reason(',
              'def _base_restore_increase_fence_reason(', 1)
          upgrade_restore = nested_node(
              integrity, 'upgrade_restore_reason', ast.FunctionDef)
          postmaster_fence = nested_node(
              restart, 'postmaster_day_order_fence_reason', ast.FunctionDef)

          strict_names = (
              'provenance_name', 'witness_name', 'load_provenance',
              'durable_covers_observed', 'completion_proof',
              'strict_checkpoint', 'strict_floor', 'strict_advance',
          )
          strict_sources = [nested_node(integrity, name, ast.FunctionDef)
                            for name in strict_names]

          new_alpaca = f'''"""Canonical Alpaca PAPER execution adapter.

          The final broker semantics are expressed by ordinary classes and
          functions in this module. Importing :mod:`sentinel.execution` does not
          patch broker, journal, reconciliation, authority, or executor modules.
          The private ``_alpaca_base`` module retains the reviewed transport
          implementation; the two classes below statically compose the hardened
          observation boundary and the final financial-grade adapter.
          """
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import dataclass, replace
          from datetime import date, datetime, timezone
          from decimal import Decimal
          from typing import Mapping, Optional, Sequence
          from urllib.parse import quote

          from sentinel.execution import _alpaca_base as alpaca
          from sentinel.execution import broker_cash, contract, journal
          from sentinel.execution.broker_cash import (
              BrokerCashActivity, BrokerCashActivityBatch,
              RECOGNIZED_ACTIVITY_TYPES,
          )
          from sentinel.execution.guarded import BrokerAuthorityRefused
          from sentinel.execution.identity import is_sentinel_key
          from sentinel.execution.states import CommandState, TERMINAL
          from sentinel.feed import calendar

          # Preserve the public helper/exception surface of the original module.
          # This copies references only; it never mutates the retained base.
          for _name in dir(alpaca):
              if not _name.startswith("__"):
                  globals().setdefault(_name, getattr(alpaca, _name))

          _ACTIVITY_BUSINESS_TIME_FLOOR = datetime(1970, 1, 1, tzinfo=timezone.utc)
          ACTIVITY_FILL_INTERVAL_SOURCE = "alpaca_trading_activity_sse_candidate"
          ACTIVITY_FILL_INTERVAL_SEMANTICS = (
              "ALPACA_ACCOUNT_ACTIVITY_FIXED_EVENT_FRONTIER_UNACCEPTED_V1")
          _OBSERVATION_PREFIX = "broker-observation:v2:"
          _WITNESS_PREFIX = "terminal-recovery-witness:v3:"
          _PROVENANCE_PREFIX = _OBSERVATION_PREFIX
          _DB_INCARCERATION_CURSOR = "broker-recovery-db-incarnation:v1"
          _DB_CURSOR = _DB_INCARCERATION_CURSOR

          {activity_correction}

          {restore_deferred}

          {loads_state}

          {sse_events}

          {integrity_json}

          {account_bound}

          {native_fill}

          OriginalAlpaca = alpaca.AlpacaExecutionBroker

          {hardened_alpaca}

          CurrentAlpaca = HardenedAlpacaExecutionBroker

          {financial_alpaca}

          # Public adapter identity. Existing importers continue to ask for
          # AlpacaExecutionBroker and receive the complete final class directly.
          AlpacaExecutionBroker = FinancialGradeAlpacaExecutionBroker

          {database_incarnation}

          {base_restore}

          {upgrade_restore}

          {postmaster_fence}

          {''.join(source + chr(10) for source in strict_sources)}

          def execution_increase_fence_reason(*, conn, deployment, today) -> str:
              """Return the first Alpaca increase fence in certified order."""
              if deployment.broker != "alpaca":
                  return ""
              return (
                  _base_restore_increase_fence_reason(conn, deployment, today)
                  or upgrade_restore_reason(conn)
                  or postmaster_day_order_fence_reason(conn, today)
              )


          def restore_increase_fence_reason(conn, deployment, today) -> str:
              """Operator diagnostic preserving the prior public precedence."""
              return (
                  postmaster_day_order_fence_reason(conn, today)
                  or upgrade_restore_reason(conn)
                  or _base_restore_increase_fence_reason(conn, deployment, today)
              )


          __all__ = [
              "AccountBoundObservation", "ActivityCorrectionRequiresRecovery",
              "AlpacaExecutionBroker", "FinancialGradeAlpacaExecutionBroker",
              "NativeBrokerFill", "RestoreGradeIncreaseDeferred",
              "database_incarnation", "execution_increase_fence_reason",
              "postmaster_day_order_fence_reason",
              "restore_increase_fence_reason", "strict_advance",
              "strict_checkpoint", "strict_floor",
          ]
          '''
          # Dedent only the template's framing. Inserted AST source is already
          # top-level and remains valid after the common framing indentation.
          public_alpaca.write_text(textwrap.dedent(new_alpaca))

          # -----------------------------------------------------------------
          # Guarded broker: make the Alpaca asset-id re-resolution a direct
          # production invariant. Incomplete non-Alpaca test doubles keep their
          # own capability contracts naturally because the check is typed.
          # -----------------------------------------------------------------
          guarded = Path('sentinel/execution/guarded.py')
          guarded_text = guarded.read_text()
          needle = '''        await self._authorize_mutation(BrokerOperation.SUBMIT)
                  return await self._inner.submit(
                      client_key=client_key, instrument=instrument,
                      side=side, quantity=quantity)
          '''
          replacement = '''        from sentinel.execution.alpaca import AlpacaExecutionBroker

                  if (isinstance(self._inner, AlpacaExecutionBroker)
                          and self.capabilities.instrument_identity):
                      if not instrument.broker_id:
                          raise PreTransportAuthorityRefused(
                              "durable command has no broker-native instrument identity")
                      try:
                          current = await self.resolve_instrument(
                              security_id=instrument.security_id,
                              symbol=instrument.symbol)
                      except BrokerAuthorityRefused as exc:
                          raise PreTransportAuthorityRefused(
                              f"instrument identity unavailable before submit: {{exc}}") from exc
                      except Exception as exc:                  # noqa: BLE001
                          raise PreTransportAuthorityRefused(
                              "instrument identity unavailable before submit: "
                              f"{{type(exc).__name__}}: {{exc}}") from exc
                      if (current.security_id != instrument.security_id
                              or current.symbol != instrument.symbol
                              or current.broker_id != instrument.broker_id):
                          raise PreTransportAuthorityRefused(
                              "broker-native instrument identity changed before submit; "
                              f"durable={{instrument}}, current={{current}}")

                  await self._authorize_mutation(BrokerOperation.SUBMIT)
                  return await self._inner.submit(
                      client_key=client_key, instrument=instrument,
                      side=side, quantity=quantity)
          '''
          needle = textwrap.dedent(needle).replace('\n', '\n')
          replacement = textwrap.dedent(replacement)
          # Restore method indentation after dedent.
          needle = textwrap.indent(needle, '    ')[4:]
          replacement = textwrap.indent(replacement, '    ')[4:]
          if needle not in guarded_text:
              raise RuntimeError('Guarded submit seam changed')
          guarded.write_text(guarded_text.replace(needle, replacement, 1))

          # -----------------------------------------------------------------
          # Authority and cash taxonomy: encode the final values directly.
          # -----------------------------------------------------------------
          authority_gate = Path('sentinel/execution/authority_gate.py')
          text = authority_gate.read_text()
          marker = '    BrokerOperation.ACCOUNT_FILL_INTERVAL_EVIDENCE,\n'
          if '    BrokerOperation.ACCOUNT_CASH_ACTIVITIES,\n' not in text:
              if marker not in text:
                  raise RuntimeError('authority read-operation seam changed')
              text = text.replace(
                  marker,
                  marker + '    BrokerOperation.ACCOUNT_CASH_ACTIVITIES,\n', 1)
          authority_gate.write_text(text)

          broker_cash = Path('sentinel/execution/broker_cash.py')
          text = broker_cash.read_text()
          start = text.index('INTERNAL_ACTIVITY_TYPES = frozenset({')
          end = text.index('RECOGNIZED_ACTIVITY_TYPES =', start)
          final_taxonomy = '''INTERNAL_ACTIVITY_TYPES = frozenset({
              "DIV", "SPLIT", "SPIN", "MA", "NC", "REORG", "VOF", "FIMAT",
              "DIVNRA", "OPCA", "OPASN", "OPEXC", "OPEXP", "OPTRD", "OPCSH",
              "FEE", "INT", "WH",
              "CFEE", "INTNRA", "INTTW", "DIVCGL", "DIVCGS", "DIVFEE",
              "DIVFT", "DIVROC", "DIVTW", "DIVTXEX", "CGD", "PTC", "PTR",
          })
          '''
          broker_cash.write_text(
              text[:start] + textwrap.dedent(final_taxonomy) + text[end:])

          # -----------------------------------------------------------------
          # Journal: native fill identity and account-bound observation
          # provenance are canonical persistence behavior.
          # -----------------------------------------------------------------
          fill_function = '''def fill_fingerprint(fill: BrokerFill) -> str:
              """Return the broker-native fill identity when one is available."""
              activity_id = getattr(fill, "activity_id", None)
              if activity_id:
                  payload = {
                      "kind": "broker-native-fill/v1",
                      "activity_id": str(activity_id),
                  }
                  return hashlib.sha256(
                      json.dumps(
                          payload, sort_keys=True, separators=(",", ":"))
                      .encode("utf-8")).hexdigest()
              blob = "|".join((
                  str(fill.broker_order_id), str(fill.quantity), str(fill.price),
                  fill.filled_at.isoformat() if fill.filled_at else "",
              ))
              return hashlib.sha256(blob.encode("utf-8")).hexdigest()[:24]
          '''
          replace_top_function(
              'sentinel/execution/journal.py', 'fill_fingerprint',
              textwrap.dedent(fill_function))

          observation_function = '''def record_observation(conn, observation: BrokerObservation,
                                 runtime_state: str = "") -> int:
              """Persist broker evidence plus its account/asset provenance."""
              account_identity = observation.account_identity
              if account_identity is not None:
                  broker_name, account_id, _ = _terminal_recovery_binding(conn)
                  if (account_identity.broker != broker_name
                          or account_identity.account_id != account_id):
                      raise RuntimeError(
                          "broker observation account identity does not match the "
                          "durable account binding; refusing journal mutation")

              with conn.cursor() as cur:
                  cur.execute(
                      "INSERT INTO sentinel_observations (observed_at,"
                      " terminal_recovery_through, completeness, positions, orders,"
                      " runtime_state) VALUES (%s,%s,%s,%s,%s,%s) RETURNING seq",
                      (observation.observed_at,
                       observation.terminal_recovery_through,
                       observation.completeness.value,
                       json.dumps({k: str(v) for k, v in
                                  sorted(observation.positions_by_security().items())}),
                       json.dumps([{"id": o.broker_order_id, "key": o.client_key,
                                    "security_id": o.instrument.security_id,
                                    "broker_instrument_id": o.instrument.broker_id,
                                    "side": o.side.value, "state": o.state.value,
                                    "qty": str(o.quantity),
                                    "filled": str(o.filled_quantity)}
                                   for o in observation.orders]),
                       runtime_state))
                  seq = int(cur.fetchone()[0])
                  if account_identity is not None:
                      position_identity = [{
                          "security_id": p.instrument.security_id,
                          "symbol": p.instrument.symbol,
                          "broker_instrument_id": p.instrument.broker_id,
                          "quantity": str(p.quantity),
                      } for p in observation.positions]
                      cur.execute(
                          "INSERT INTO sentinel_observation_provenance"
                          " (observation_seq,broker,broker_account_id,observed_at,positions)"
                          " VALUES (%s,%s,%s,%s,%s)",
                          (seq, account_identity.broker,
                           account_identity.account_id,
                           observation.observed_at,
                           json.dumps(position_identity, sort_keys=True)))
              conn.commit()

              if account_identity is not None:
                  payload = {
                      "kind": "broker-observation/v2",
                      "observation_seq": seq,
                      "broker": str(account_identity.broker),
                      "account_id": str(account_identity.account_id),
                      "observed_at": observation.observed_at.astimezone(
                          timezone.utc).isoformat(),
                      "terminal_recovery_through": (
                          observation.terminal_recovery_through.astimezone(
                              timezone.utc).isoformat()
                          if observation.terminal_recovery_through is not None
                          else None),
                      "completeness": observation.completeness.value,
                      "positions": [
                          {"security_id": p.instrument.security_id,
                           "symbol": p.instrument.symbol,
                           "broker_id": p.instrument.broker_id,
                           "quantity": str(p.quantity)}
                          for p in observation.positions
                      ],
                      "orders": [
                          {"broker_order_id": o.broker_order_id,
                           "client_key": o.client_key,
                           "security_id": o.instrument.security_id,
                           "symbol": o.instrument.symbol,
                           "broker_id": o.instrument.broker_id,
                           "side": o.side.value,
                           "state": o.state.value,
                           "quantity": str(o.quantity),
                           "filled_quantity": str(o.filled_quantity),
                           "filled_average_price": (
                               str(o.filled_average_price)
                               if o.filled_average_price is not None else None)}
                          for o in observation.orders
                      ],
                  }
                  cursor_name = f"broker-observation:v2:{seq}"
                  with conn.cursor() as cur:
                      cur.execute(
                          "INSERT INTO sentinel_processed_sessions"
                          " (cursor_name,session,state) VALUES (%s,%s,%s::jsonb)"
                          " ON CONFLICT (cursor_name) DO NOTHING",
                          (cursor_name, observation.observed_at.date().isoformat(),
                           json.dumps(payload, sort_keys=True)))
                      if cur.rowcount != 1:
                          raise RuntimeError(
                              f"broker observation provenance {seq} already exists; "
                              "observation identities must be append-only")
                  conn.commit()
              return seq
          '''
          replace_top_function(
              'sentinel/execution/journal.py', 'record_observation',
              textwrap.dedent(observation_function))

          # -----------------------------------------------------------------
          # Reconciliation: select strict Alpaca recovery explicitly. Generic
          # journal helpers remain legacy-compatible outside Alpaca reconcile.
          # -----------------------------------------------------------------
          reconcile = Path('sentinel/execution/reconcile.py')
          text = reconcile.read_text()
          insertion_anchor = '_POSITION_LAG_PREFIX = "broker-position-lag:v2:"\n'
          helper = '''

          def _is_broker_instance(broker, broker_type: type) -> bool:
              """Recognize a concrete adapter through guarded wrappers."""
              seen: set[int] = set()
              while broker is not None and id(broker) not in seen:
                  seen.add(id(broker))
                  if isinstance(broker, broker_type):
                      return True
                  broker = getattr(broker, "_inner", None)
              return False
          '''
          if '_is_broker_instance(' not in text:
              if insertion_anchor not in text:
                  raise RuntimeError('reconcile helper anchor changed')
              text = text.replace(
                  insertion_anchor,
                  insertion_anchor + textwrap.dedent(helper), 1)

          old_recovery = '''        recovery_checkpoint = journal.terminal_recovery_checkpoint(conn)
                  recovery_floor = journal.terminal_recovery_floor(conn)
                  observation = await broker.observe_with_terminal_recovery(
                      submitted_after=recovery_floor,
                      processed_through=recovery_checkpoint)
          '''
          new_recovery = '''        from sentinel.execution import alpaca as alpaca_adapter
                  strict_recovery = _is_broker_instance(
                      broker, alpaca_adapter.AlpacaExecutionBroker)
                  recovery_checkpoint = (
                      alpaca_adapter.strict_checkpoint(conn)
                      if strict_recovery
                      else journal.terminal_recovery_checkpoint(conn))
                  recovery_floor = (
                      alpaca_adapter.strict_floor(conn)
                      if strict_recovery
                      else journal.terminal_recovery_floor(conn))
                  observation = await broker.observe_with_terminal_recovery(
                      submitted_after=recovery_floor,
                      processed_through=recovery_checkpoint)
          '''
          old_recovery = textwrap.indent(textwrap.dedent(old_recovery), '    ')[4:]
          new_recovery = textwrap.indent(textwrap.dedent(new_recovery), '    ')[4:]
          if old_recovery not in text:
              raise RuntimeError('reconcile recovery seam changed')
          text = text.replace(old_recovery, new_recovery, 1)
          old_advance = '''        journal.advance_terminal_recovery_watermark(
                  conn, recovery_through)
          '''
          new_advance = '''        if strict_recovery:
                      alpaca_adapter.strict_advance(conn, recovery_through)
                  else:
                      journal.advance_terminal_recovery_watermark(
                          conn, recovery_through)
          '''
          old_advance = textwrap.indent(textwrap.dedent(old_advance), '    ')[4:]
          new_advance = textwrap.indent(textwrap.dedent(new_advance), '    ')[4:]
          if old_advance not in text:
              raise RuntimeError('reconcile watermark seam changed')
          reconcile.write_text(text.replace(old_advance, new_advance, 1))

          # -----------------------------------------------------------------
          # Executor: Alpaca recovery fences are direct, while the generic
          # extension registry remains available to tests/future adapters.
          # -----------------------------------------------------------------
          executor = Path('sentinel/execution/executor.py')
          text = executor.read_text()
          old_fence = '''        fence_reason = next((reason for reason in (
                      check(conn=conn, deployment=deployment, today=today)
                      for check in _INCREASE_FENCE_REASONS) if reason), "")
          '''
          new_fence = '''        adapter_fence_reason = ""
                  if deployment.broker == "alpaca":
                      from sentinel.execution import alpaca as alpaca_adapter
                      adapter_fence_reason = alpaca_adapter.execution_increase_fence_reason(
                          conn=conn, deployment=deployment, today=today)
                  fence_reason = adapter_fence_reason or next((reason for reason in (
                      check(conn=conn, deployment=deployment, today=today)
                      for check in _INCREASE_FENCE_REASONS) if reason), "")
          '''
          old_fence = textwrap.indent(textwrap.dedent(old_fence), '    ')[4:]
          new_fence = textwrap.indent(textwrap.dedent(new_fence), '    ')[4:]
          if old_fence not in text:
              raise RuntimeError('executor fence seam changed')
          executor.write_text(text.replace(old_fence, new_fence, 1))

          # -----------------------------------------------------------------
          # Execution package becomes declarative. Importing it installs no
          # behavior. Delete all retired remediation installers.
          # -----------------------------------------------------------------
          init = Path('sentinel/execution/__init__.py')
          text = init.read_text()
          marker = '# Install the explicit broker-boundary hardening'
          if marker not in text:
              raise RuntimeError('execution package installer seam changed')
          init.write_text(text.split(marker, 1)[0].rstrip() + '\n')

          # Update the one test helper import to its canonical owner.
          for test in Path('tests').rglob('*.py'):
              text = test.read_text()
              text = text.replace(
                  'from sentinel.execution import alpaca_remediation_compat as compat',
                  'from sentinel.execution import reconcile as compat')
              text = text.replace(
                  'from sentinel.execution.alpaca_remediation_restart_fence import ',
                  'from sentinel.execution.alpaca import ')
              test.write_text(text)

          for retired in (
              'sentinel/execution/alpaca_remediation.py',
              'sentinel/execution/alpaca_remediation_final.py',
              'sentinel/execution/alpaca_remediation_integrity.py',
              'sentinel/execution/alpaca_remediation_restart_fence.py',
              'sentinel/execution/alpaca_remediation_compat.py',
          ):
              Path(retired).unlink()

          # The decision log describes the historical overlay by name; source
          # and tests must contain no live dependency on any retired installer.
          live_hits = []
          for root in (Path('sentinel'), Path('tests')):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.md'}:
                      content = path.read_text(errors='ignore')
                      if 'alpaca_remediation' in content:
                          live_hits.append(str(path))
          if live_hits:
              raise RuntimeError(
                  'retired remediation references remain: ' + ', '.join(live_hits))
          PY

          python -m py_compile \
            sentinel/execution/__init__.py \
            sentinel/execution/_alpaca_base.py \
            sentinel/execution/alpaca.py \
            sentinel/execution/alpaca_asset_id.py \
            sentinel/execution/authority_gate.py \
            sentinel/execution/broker_cash.py \
            sentinel/execution/executor.py \
            sentinel/execution/guarded.py \
            sentinel/execution/journal.py \
            sentinel/execution/reconcile.py \
            tests/sentinel/test_issue222_import_order.py \
            tests/sentinel/test_alpaca_boundary_overlay.py

          git diff --check
          git rm .github/workflows/refactor-execution-flatten-static.yml

      - name: Commit canonical execution path
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(execution): flatten broker remediation stack"
