name: Champion dividend-lag-1 recertification
run-name: Champion dividend-lag-1 recertification - ${{ github.sha }}
on:
  push:
    branches: [research/champion-dividend-lag-1-recertification]
    paths:
      - '.github/workflows/champion-dividend-lag-1-recertification.yml'
      - 'backtester/production_equivalent_economic_overlay.py'
      - 'backtester/champion_production_equivalent_build.py'
      - 'backtester/champion_production_equivalent_final_replay.py'
      - 'backtester/tests/test_production_equivalent_dividend_lag.py'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: 2006-01-03
  CERTIFICATION_MEASUREMENT_START: 2006-07-31
  CERTIFICATION_END_SESSION: 2026-07-31
jobs:
  recertify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: audit-src, fetch-depth: 1, filter: blob:none, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 27bb992087182c42c3c051e62bf837895f5d2ab7, path: certified-src, fetch-depth: 1, filter: blob:none, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: ba74e79490beb8950611b1d17f5d124833b3d91e, path: candidate-src, fetch-depth: 1, filter: blob:none, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 887f479b15ad861313da666ad698034d3847121c, path: main-src, fetch-depth: 1, filter: blob:none, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14', check-latest: false}
      - name: Install frozen runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" >> "$GITHUB_ENV"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "$GITHUB_ENV"
      - name: Stage exact overlays
        run: |
          set -euo pipefail
          for f in champion_economic_prefix_audit.py champion_full_classification_control.py champion_security_truth_audit_v2.py champion_security_truth_overlay_v2.py champion_final_security_truth.py champion_final_truth_corpus_validator.py production_equivalent_economic_overlay.py champion_production_equivalent_build.py champion_production_equivalent_final_replay.py; do cp "audit-src/backtester/$f" certified-src/backtester/; done
          cp audit-src/backtester/data/champion-security-truth-factual-batch-v2.json certified-src/backtester/data/
          cp candidate-src/backtester/research_champion_corrected_classification.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_best_effort_classification.py certified-src/backtester/
          cp candidate-src/backtester/data/champion-*security-types-v1* certified-src/backtester/data/
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R audit-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/
      - name: Fail-closed semantic tests and source preflight
        run: |
          set -euo pipefail
          cd certified-src
          PYTHONPATH=. pytest -q "${GITHUB_WORKSPACE}/audit-src/backtester/tests/test_production_equivalent_dividend_lag.py"
          python backtester/champion_final_truth_corpus_validator.py --manual research/champion-economic-integrity/security-truth/manual-review