name: Backtester - continuous S&P 500 best-effort PIT LD-RC
run-name: Continuous S&P 500 LD-RC 1997-2026 — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-run-sp500-continuous.yml'
      - 'backtester/run_sp500_ldrc_continuous.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DIR: backtester-results/sp500-pit-source
  MEMBERSHIP_DIR: backtester-results/sp500-pit-membership
  IDENTITY_DIR: backtester-results/sp500-pit-identity
  ALIAS_DIR: backtester-results/sp500-pit-alias
  COVERAGE_DIR: backtester-results/sp500-pit-coverage
  TRADING_GAP_DIR: backtester-results/sp500-pit-trading-gaps
  WEB_ALIAS_DIR: backtester-results/sp500-pit-web-alias
  CIK_ALIAS_DIR: backtester-results/sp500-pit-cik-alias
  UNIVERSE_DIR: backtester-results/sp500-best-effort-universe-continuous
  RESULT_DIR: backtester-results/sp500-continuous-1997-2026
  SOURCE_URL: https://raw.githubusercontent.com/fja05680/sp500/c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff/sp500_ticker_start_end.csv

jobs:
  continuous:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-run-sp500-continuous.yml
            /backtester/run_sp500_ldrc_continuous.py
            /backtester/run_sp500_ldrc_sealed_oos.py
            /backtester/sp500_best_effort_universe.py
            /backtester/sp500_pit_corpus.py
            /backtester/sp500_pit_identity.py
            /backtester/sp500_pit_alias_resolution.py
            /backtester/sp500_pit_alias_resolution_v2.py
            /backtester/sp500_pit_coverage_audit.py
            /backtester/sp500_pit_trading_gap_filter.py
            /backtester/sp500_pit_web_alias_resolution.py
            /backtester/sp500_pit_cik_alias_resolution.py
            /backtester/strict_pit_metadata.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/sp500_official_overlay_2026.csv
            /backtester/data/sp500_web_alias_evidence.csv
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/GS3M_1996-12_2007-05.csv
            /backtester/evidence/sp500_ldrc_oos_1998_2005.json
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install replay dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Compile continuous S&P modules
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/sp500_best_effort_universe.py \
            backtester/run_sp500_ldrc_sealed_oos.py \
            backtester/run_sp500_ldrc_continuous.py

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat \
            sharadar/SFP/SHARADAR_SFP.zip.001 \
            sharadar/SFP/SHARADAR_SFP.zip.002 \
            sharadar/SFP/SHARADAR_SFP.zip.003 \
            sharadar/SFP/SHARADAR_SFP.zip.004 \
            > sharadar/SHARADAR_SFP.zip
          unzip -t sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Rebuild pinned S&P membership and causal identities
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          curl --fail --location --retry 4 --retry-all-errors \
            "$SOURCE_URL" --output "$SOURCE_DIR/sp500_ticker_start_end.csv"
          rm -rf "$MEMBERSHIP_DIR" "$IDENTITY_DIR"
          python -m backtester.sp500_pit_corpus \
            --source "$SOURCE_DIR/sp500_ticker_start_end.csv" \
            --overlay backtester/data/sp500_official_overlay_2026.csv \
            --output "$MEMBERSHIP_DIR" \
            --start 1996-01-02 --end 2026-09-03
          python -m backtester.sp500_pit_identity \
            --membership-root "$MEMBERSHIP_DIR" \
            --sharadar-root sharadar \
            --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz \
            --output "$IDENTITY_DIR" \
            --start-year 1997 --end-year 2026

      - name: Reuse green pinned Stage-3 identity diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$ALIAS_DIR" "$COVERAGE_DIR" "$TRADING_GAP_DIR" "$WEB_ALIAS_DIR" "$CIK_ALIAS_DIR"
          gh run download 33823947011 \
            --repo flabber1835/stocker \
            --name sp500-pit-alias-v2-30dce7f2adedc8196bc14f73d8943786631922bb \
            --dir backtester-results
          for d in "$ALIAS_DIR" "$COVERAGE_DIR" "$TRADING_GAP_DIR" "$WEB_ALIAS_DIR" "$CIK_ALIAS_DIR"; do
            test -f "$d/SHA256SUMS.txt"
            (cd "$d" && sha256sum -c SHA256SUMS.txt)
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          t=json.loads((Path(os.environ['TRADING_GAP_DIR'])/'trading-gap-summary.json').read_text())
          assert t['status']=='TRADING_GAP_FILTER_COMPLETE'
          assert t['market_session_end'] >= '2026-07-31'
          print(json.dumps({
              'pinned_stage3_run':33823947011,
              'pinned_artifact_id':9919553500,
              'pinned_artifact_zip_sha256':'01e56bc8fe3d495765d583f25594f59ef75e18eb6d4e688acd8e27e63f26f80d',
              'market_session_end':t['market_session_end'],
              'true_trading_gap_intervals':t['output_gap_intervals'],
          },indent=2,sort_keys=True))
          PY

      - name: Materialize continuous best-effort S&P universe
        run: |
          set -euo pipefail
          rm -rf "$UNIVERSE_DIR"
          python -m backtester.sp500_best_effort_universe \
            --membership-root "$MEMBERSHIP_DIR" \
            --identity-root "$IDENTITY_DIR" \
            --alias-root "$ALIAS_DIR" \
            --trading-gap-root "$TRADING_GAP_DIR" \
            --web-alias-root "$WEB_ALIAS_DIR" \
            --cik-alias-root "$CIK_ALIAS_DIR" \
            --sharadar-root sharadar \
            --output "$UNIVERSE_DIR" \
            --window-start 1997-12-31 \
            --window-end 2026-07-31
          (cd "$UNIVERSE_DIR" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['UNIVERSE_DIR'])/'best-effort-summary.json').read_text())
          assert s['status']=='BEST_EFFORT_RUNNABLE'
          assert s['window_start']=='1997-12-31' and s['window_end']=='2026-07-31'
          assert s['membership_dataset_hash']=='1981828b71073be4d0fcf4addb37a56c844a29219090eb0c8fbc535d393bdb2d'
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Run one continuous LD-RC path
        run: |
          set -euo pipefail
          rm -rf "$RESULT_DIR"
          python -m backtester.run_sp500_ldrc_continuous \
            --universe-root "$UNIVERSE_DIR" \
            --output "$RESULT_DIR"
          (cd "$RESULT_DIR" && sha256sum -c SHA256SUMS.txt)

      - name: Validate 5 10 15 20 Max and seamless OOS seam
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RESULT_DIR'])
          s=json.loads((root/'summary.json').read_text())
          assert s['status']=='PASS'
          assert s['continuous_state_path'] is True
          assert s['pre2006_seam_witness']['matches_sealed_oos_exactly'] is True
          assert s['pre2006_seam_witness']['state_reset'] is False
          assert list(s['windows'].keys()) == ['10','15','20','5','Max'] or set(s['windows']) == {'5','10','15','20','Max'}
          print(json.dumps({
              'pre2006_seam_witness':s['pre2006_seam_witness'],
              'windows':s['windows'],
              'universe_daily_constituents':s['universe']['daily_constituents'],
              'excluded_source_sessions':s['universe']['excluded_source_sessions'],
              'exclusion_fraction':s['universe']['exclusion_fraction_of_source_membership_sessions'],
          },indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### Continuous S&P 500 best-effort PIT LD-RC\n')
              fh.write(f"- Continuous tape: {s['window'][0]} through {s['window'][1]}\n")
              fh.write(f"- First invested: {s['first_invested_session']}\n")
              fh.write(f"- Pre-2006 seam exact: {s['pre2006_seam_witness']['matches_sealed_oos_exactly']}\n")
              for w in ['5','10','15','20','Max']:
                  b=s['windows'][w]
                  fh.write(f"- {w}y LD-RC CAGR: {b['ld_rc']['cagr']:.4%}; SPY: {b['spy']['cagr']:.4%}; spread: {b['cagr_spread_ldrc_minus_spy']:.4%}\n")
              fh.write('\n**Status:** best-effort PIT viability result; formal PIT certification not claimed.\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sp500-continuous-1997-2026-${{ github.sha }}
          path: |
            ${{ env.UNIVERSE_DIR }}
            ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 90
