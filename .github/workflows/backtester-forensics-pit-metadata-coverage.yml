name: Backtester - PIT metadata calibration coverage
run-name: PIT metadata calibration coverage — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-forensics-pit-metadata-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-forensics-pit-metadata-coverage.yml
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6
      - name: Measure strict-prior CIK/SIC coverage and FF12 geometry
        run: |
          set -euo pipefail
          mkdir -p backtester-results/pit-metadata-coverage
          python - <<'PY'
          import bisect, json, zipfile
          from pathlib import Path
          from collections import Counter,defaultdict
          import pandas as pd

          def norm(v):
              if v is None or pd.isna(v): return None
              try: return str(int(float(v)))
              except: return str(v).strip() or None
          with zipfile.ZipFile('sharadar/SHARADAR_TICKERS.zip') as z:
              name=[n for n in z.namelist() if n.lower().endswith('.csv')][0]
              with z.open(name) as f:
                  t=pd.read_csv(f,usecols=['table','permaticker','ticker','category','sector','firstpricedate','lastpricedate'],low_memory=False)
          t=t[t.table.astype(str).eq('SEP') & t.ticker.notna() & t.permaticker.notna()].copy()
          t['sid']=t.permaticker.map(norm); t['ticker']=t.ticker.astype(str)
          t['first']=t.firstpricedate.fillna('0001-01-01').astype(str).str[:10]
          t['last']=t.lastpricedate.fillna('9999-12-31').astype(str).str[:10]
          t['common']=t.category.fillna('').astype(str).map(lambda c:'Common Stock' in c and 'Warrant' not in c and 'Preferred' not in c)

          cik=pd.read_csv('research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz',compression='gzip',low_memory=False)
          sic=pd.read_csv('research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz',compression='gzip',low_memory=False)
          cd=defaultdict(list); cv=defaultdict(list)
          for r in cik.sort_values(['ticker','filing_date']).itertuples(index=False):
              c=norm(r.issuer_cik); date=str(r.filing_date)[:10]; tick=str(r.ticker)
              if c and date and tick: cd[tick].append(date); cv[tick].append(c)
          sd=defaultdict(list); sv=defaultdict(list)
          for r in sic.sort_values(['cik','filed']).itertuples(index=False):
              c=norm(r.cik); date=str(r.filed)[:10]
              if not c or not date or pd.isna(r.sic): continue
              try: s=int(float(r.sic))
              except: continue
              sd[c].append(date); sv[c].append(s)
          def prior(ds,vs,date):
              i=bisect.bisect_left(ds,date)-1
              return vs[i] if i>=0 else None
          ranges={
          '01 NoDur':((100,999),(2000,2399),(2700,2749),(2770,2799),(3100,3199),(3940,3989)),
          '02 Durbl':((2500,2519),(2590,2599),(3630,3659),(3710,3711),(3714,3714),(3716,3716),(3750,3751),(3792,3792),(3900,3939),(3990,3999)),
          '03 Manuf':((2520,2589),(2600,2699),(2750,2769),(3000,3099),(3200,3569),(3580,3629),(3700,3709),(3712,3713),(3715,3715),(3717,3749),(3752,3791),(3793,3799),(3830,3839),(3860,3899)),
          '04 Enrgy':((1200,1399),(2900,2999)),'05 Chems':((2800,2829),(2840,2899)),
          '06 BusEq':((3570,3579),(3660,3692),(3694,3699),(3810,3829),(7370,7379)),
          '07 Telcm':((4800,4899),),'08 Utils':((4900,4949),),'09 Shops':((5000,5999),(7200,7299),(7600,7699)),
          '10 Hlth':((2830,2839),(3693,3693),(3840,3859),(8000,8099)),'11 Money':((6000,6999),)}
          def ff12(s):
              for label,rs in ranges.items():
                  if any(lo<=s<=hi for lo,hi in rs): return label
              return '12 Other'
          dates=['2006-07-31','2010-06-30','2011-10-03','2015-08-25','2018-12-19','2020-02-28','2022-05-17','2025-12-31','2026-07-31']
          rows=[]
          for date in dates:
              a=t[(t['first']<=date)&(t['last']>=date)&t['common']].copy()
              bysid=a.sort_values(['sid','last','ticker']).drop_duplicates('sid',keep='last')
              have_cik=have_sic=0; groups=Counter(); current_sectors=Counter()
              for r in bysid.itertuples(index=False):
                  c=prior(cd.get(r.ticker,()),cv.get(r.ticker,()),date)
                  if c is None: groups['UNKNOWN']+=1; continue
                  have_cik+=1
                  s=prior(sd.get(c,()),sv.get(c,()),date)
                  if s is None: groups['UNKNOWN']+=1; continue
                  have_sic+=1; groups[ff12(s)]+=1
              for v in bysid.sector.fillna('UNKNOWN_CURRENT').astype(str): current_sectors[v]+=1
              rows.append({'date':date,'active_common_security_ids':len(bysid),'strict_prior_cik':have_cik,'strict_prior_sic':have_sic,
                           'cik_coverage':have_cik/len(bysid) if len(bysid) else None,'sic_coverage':have_sic/len(bysid) if len(bysid) else None,
                           'unknown_ff12':groups['UNKNOWN'],'ff12_groups':dict(groups),'current_sector_group_count':len(current_sectors)})
          out={'status':'PASS','method':'active current-TICKERS common/listing projection; strict-prior SEC CIK/SIC coverage','snapshots':rows}
          p=Path('backtester-results/pit-metadata-coverage/coverage.json'); p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pit-metadata-calibration-coverage-${{ github.sha }}
          path: backtester-results/pit-metadata-coverage
          if-no-files-found: error
          retention-days: 90
