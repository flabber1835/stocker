name: Sentinel backup E2E

on:
  push:
    branches:
      - main
      - 'stabilization/**'
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-backup-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-base-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Exercise actual production backup scripts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-sentinel-base-backup-e2e.sh
