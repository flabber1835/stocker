name: Backtester - Wealth Core overflow capacity diagnostic
run-name: WC overflow capacity diagnostic — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-broad-slot-opportunity-diagnostic]
    paths:
      - '.github/workflows/backtester-wc-overflow-capacity-diagnostic.yml'
      - 'backtester/diagnose_wc_overflow_capacity.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  ATTR_RUN_ID: '33943672769'
  ATTR_HEAD: 'ab5a9b9ba8c09bb99ad95fda554b332749756bad'
  ATTR_ARTIFACT: 'e3-broad-vs-r3000-attribution-ab5a9b9ba8c09bb99ad95fda554b332749756bad'
  ATTR_DIGEST: 'sha256:22f1cc9bd78eb325c89204a89c7e43358db41805e9907077111fad3ed78b1467'
  SLOT_RUN_ID: '33947807175'
  SLOT_HEAD: '1057d244b03e1b997edfb9d38ed655396f6764cc'
  SLOT_ARTIFACT: 'broad-slot-opportunity-v2-1057d244b03e1b997edfb9d38ed655396f6764cc'
  SLOT_DIGEST: 'sha256:42cd4b224b9b70ce578e48f02e5b44ea3ef9d0fafc8bbad20e436fcbfc837338'
  OUT_DIR: '${{ github.workspace }}/backtester-results/wc-overflow-capacity'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-wc-overflow-capacity-diagnostic.yml
            /backtester/diagnose_wc_overflow_capacity.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Authenticate source artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          check_artifact() {
            local run="$1" head="$2" name="$3" digest="$4"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.head_sha')" = "${head}"
            observed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq ".artifacts[] | select(.name == \"${name}\") | .digest")
            test "${observed}" = "${digest}"
          }
          check_artifact "$ATTR_RUN_ID" "$ATTR_HEAD" "$ATTR_ARTIFACT" "$ATTR_DIGEST"
          check_artifact "$SLOT_RUN_ID" "$SLOT_HEAD" "$SLOT_ARTIFACT" "$SLOT_DIGEST"

      - name: Download immutable accepted broad attribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ATTR_ARTIFACT }}
          path: accepted-attribution
          repository: ${{ github.repository }}
          run-id: ${{ env.ATTR_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download immutable blocked-leader diagnostic
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.SLOT_ARTIFACT }}
          path: slot-diagnostic
          repository: ${{ github.repository }}
          run-id: ${{ env.SLOT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate source contents
        run: |
          set -euo pipefail
          (cd accepted-attribution && sha256sum -c BROAD_R3000_ATTRIBUTION_SHA256SUMS.txt)
          (cd slot-diagnostic && sha256sum -c BROAD_SLOT_OPPORTUNITY_SHA256SUMS.txt)
          test -s accepted-attribution/broad_r3000_daily_position_marks.csv.gz
          test -s slot-diagnostic/broad_slot_opportunity_episodes.csv

      - name: Run zero-budget capacity diagnostic
        run: |
          set -euo pipefail
          python -m py_compile backtester/diagnose_wc_overflow_capacity.py
          rm -rf "$OUT_DIR"
          python backtester/diagnose_wc_overflow_capacity.py \
            --attribution-root accepted-attribution \
            --slot-root slot-diagnostic \
            --output "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum -c OVERFLOW_CAPACITY_SHA256SUMS.txt)

      - name: Validate diagnostic contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT_DIR'])
          s=json.load(open(out/'overflow_capacity_summary.json'))
          e=pd.read_csv(out/'overflow_capacity_blocked_episodes.csv')
          f=pd.read_csv(out/'overflow_capacity_full_slot_sessions.csv.gz',compression='gzip')
          assert s['status']=='PASS' and s['zero_budget_diagnostic'] is True
          assert s['strategy_mechanics_changed'] is False
          assert s['source_attribution']['head']==os.environ['ATTR_HEAD']
          assert s['source_slot_diagnostic']['head']==os.environ['SLOT_HEAD']
          assert len(e)==107 and len(f)==366
          assert (e.close_cash>=-1).all() and (f.close_cash>=-1).all()
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Publish diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['OUT_DIR']); p=out/'overflow_capacity_summary.json'
          if not p.exists(): raise SystemExit(0)
          s=json.load(open(p))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Wealth Core overflow-capacity diagnostic\n\n')
              f.write(f"Full-slot sessions: **{s['full_slot_sessions']}**  \n")
              f.write(f"Full-slot sessions able to fund a normal 4% entry: **{s['full_slot_sessions_funding_full_4pct']}**  \n")
              f.write(f"Blocked-leader episodes: **{s['blocked_leader_episodes']}**  \n")
              f.write(f"Blocked episodes able to fund a normal 4% entry: **{s['blocked_episodes_funding_full_4pct']}**  \n")
              c=s['blocked_episode_cash_fraction']; u=s['hypothetical_sessions_until_natural_exit_restores_25']
              f.write(f"Median close cash: **{c['median']:.3%} of equity**; max **{c['max']:.3%}**  \n")
              f.write(f"Hypothetical overflow duration: median **{u['median']:.0f} sessions**, 90th percentile **{u['p90']:.0f}**  \n")
              f.write(f"Decision: **{s['decision']}**\n")
          PY

      - name: Upload immutable capacity bundle
        if: ${{ always() && hashFiles('backtester-results/wc-overflow-capacity/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wc-overflow-capacity-${{ github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
