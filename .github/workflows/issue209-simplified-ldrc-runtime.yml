name: Apply issue 209 simplified LD-RC runtime

on:
  push:
    branches:
      - fix/issue-209-financial-grade-trial
    paths:
      - tools/issue209-simplified-ldrc-runtime.py
      - .github/workflows/issue209-simplified-ldrc-runtime.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/issue209-simplified-ldrc-runtime.py
      - .github/workflows/issue209-simplified-ldrc-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: fix/issue-209-financial-grade-trial
      - name: Apply simplified LD-RC runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue209-simplified-ldrc-runtime.py
          git diff --check
          python -m compileall -q sentinel/paper.py tests/sentinel/test_issue209_simplified_ldrc_runtime.py
      - name: Commit production patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sentinel/paper.py tests/sentinel/test_issue209_simplified_ldrc_runtime.py
          git rm -- tools/issue209-simplified-ldrc-runtime.py .github/workflows/issue209-simplified-ldrc-runtime.yml
          git commit -m 'Run paper on simplified three-signal LD-RC (#209)'
          git pull --rebase origin fix/issue-209-financial-grade-trial
          git push origin HEAD:fix/issue-209-financial-grade-trial

# contents-api trigger for the self-removing bootstrap
