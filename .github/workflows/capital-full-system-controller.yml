name: Full system bounded controller values
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/full-system-controller-request.json']
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      arms: ${{ steps.plan.outputs.arms }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/capital_risk
      - id: plan
        run: |
          python3 - <<'PY'
          import json,os
          arms=list(json.load(open('research/capital_risk/full-system-controller-request.json'))['core_artifacts'])
          assert arms and set(arms)<=set(('B','C1','C2','C3')) and len(arms)==len(set(arms))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('arms='+json.dumps(arms)+'\n')
          PY
  controller:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.plan.outputs.arms) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/capital_risk
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Authenticate existing frozen archive and runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/full-controller-staging.json'
      - name: Complete canonical controller values and independent stopped review
        timeout-minutes: 30
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/full_system_math_job.py --request research/capital_risk/full-system-controller-request.json --staging artifacts/capital-risk/full-controller-staging.json --arm ${{ matrix.arm }} --output artifacts/capital-risk/full-controller-${{ matrix.arm }}.json'
      - name: Preserve exact encrypted stopped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-system-controller-${{ matrix.arm }}-${{ github.sha }}
          path: |
            artifacts/capital-risk/full-controller-staging.json
            artifacts/capital-risk/full-controller-${{ matrix.arm }}.json
            artifacts/capital-risk/full-controller-${{ matrix.arm }}.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
