name: Research - Wealth Core V1 10bp plus EX3
run-name: Wealth Core V1 10bp plus EX3 - ${{ github.sha }}

on:
  push:
    branches: [research/wealth-core-v1-10bp-ex3-v1]
    paths:
      - '.github/workflows/wealth-core-v1-10bp-ex3-v1.yml'
      - 'research/wealth-core-v1-10bp-ex3-v1/analyze_ex3_layer.py'
      - 'research/wealth-core-v1-10bp-ex3-v1/EXPERIMENT.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wealth-core-v1-10bp-ex3-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify and extract EX3 layered result
        run: |
          set -euo pipefail
          python research/wealth-core-v1-10bp-ex3-v1/analyze_ex3_layer.py | tee research/wealth-core-v1-10bp-ex3-v1/output/run.log
          cat research/wealth-core-v1-10bp-ex3-v1/output/RESULT.json

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wealth-core-v1-10bp-ex3-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/wealth-core-v1-10bp-ex3-v1/output/
          retention-days: 90
          if-no-files-found: error

      - name: Commit durable result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/wealth-core-v1-10bp-ex3-v1/output
          if git diff --cached --quiet; then
            echo 'No result changes.'
            exit 0
          fi
          git commit -m 'research: preserve 10bp Wealth Core plus EX3 result'
          git push origin HEAD:research/wealth-core-v1-10bp-ex3-v1
