name: Research Champion - corrected historical classification replay
run-name: Champion corrected common-stock reconstruction - ${{ github.sha }}

on:
  push:
    branches: [research/champion-pit-metadata-closure]
    paths:
      - '.github/workflows/champion-corrected-classification-20y.yml'
      - 'backtester/research_champion_corrected_classification.py'
      - 'backtester/research_champion_best_effort_classification.py'
      - 'backtester/audit_champion_decision_relevant_inferred_common.py'
      - 'backtester/data/champion-historical-security-type-corrections-v1.csv'
      - 'backtester/data/champion-best-effort-security-types-v1*'
      - 'backtester/data/champion-reviewed-security-types-v1.csv'
      - 'tests/backtester/test_research_champion_corrected_classification.py'
      - 'tests/backtester/test_research_champion_best_effort_classification.py'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  replay:
    name: NOT YET CERTIFIED - corrected historical security types
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      PIT_OFFICIAL_BACKTEST: '0'
      CERTIFICATION_WARMUP_START: '2006-01-03'
      CERTIFICATION_MEASUREMENT_START: '2006-07-31'
      CERTIFICATION_END_SESSION: '2026-07-31'
      OUT: corrected-classification/reviewed_18_plus_historical_corrections
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/**
            /tests/backtester/test_research_champion_best_effort_classification.py
            /tests/backtester/test_research_champion_corrected_classification.py
            /tests/backtester/test_research_terminal_lifecycle.py
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/strategy9-e3-broad-stability/**
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Bind source, runtime and immutable ledgers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          (cd backtester/data && sha256sum -c champion-best-effort-security-types-v1.SHA256)
          test "$(sha256sum backtester/data/champion-historical-security-type-corrections-v1.csv | cut -d' ' -f1)" = 30f1e7223bc088714e4ee17b131f90da61bcbaf0684bfcb9c3331c9d1bc06db3
          mkdir -p "${OUT}"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "${GITHUB_ENV}"
      - name: Install frozen replay dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
      - name: Regression tests and full replay assembly
        run: |
          set -euo pipefail
          python -m unittest tests.backtester.test_research_champion_best_effort_classification -v
          python -m unittest tests.backtester.test_research_champion_corrected_classification -v
          python -m unittest tests.backtester.test_research_terminal_lifecycle -v
          python backtester/research_champion_corrected_classification.py --output "${OUT}/assembly" --self-test
      - name: Authenticate immutable canonical package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          POINTER=backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "${PACKAGE#*@sha256:}" != "${PACKAGE}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          cid=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "${cid}:/canonical-pit/." canonical-pit/
          python backtester/canonical_pit_package.py verify --pointer "${POINTER}" --dataset canonical-pit > "${OUT}/package-integrity.json"
      - name: Run chronological corrected classification replay
        run: |
          set -euo pipefail
          python backtester/research_champion_corrected_classification.py --output "${OUT}" 2>&1 | tee "${OUT}/replay.log"
      - name: Build decision-relevant inferred-common audit worklist
        run: |
          set -euo pipefail
          python backtester/audit_champion_decision_relevant_inferred_common.py \
            --replay "${OUT}" \
            --ledger backtester/data/champion-best-effort-security-types-v1.csv \
            --output "${OUT}/decision-relevant-inferred-common-audit.csv" \
            | tee "${OUT}/decision-relevant-inferred-common-audit.log"
          sha256sum "${OUT}/decision-relevant-inferred-common-audit.csv" \
            "${OUT}/decision-relevant-inferred-common-audit.json" \
            > "${OUT}/decision-relevant-inferred-common-audit.SHA256"
      - name: Upload corrected replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-corrected-classification-${{ github.run_id }}-${{ github.run_attempt }}
          path: corrected-classification/reviewed_18_plus_historical_corrections/
          retention-days: 90
          if-no-files-found: error
