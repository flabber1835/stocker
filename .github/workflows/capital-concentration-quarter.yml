name: Capital concentration bounded quarter

on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/concentration-quarter-request.json']

permissions:
  contents: read

concurrency:
  group: capital-concentration-quarter-001
  cancel-in-progress: false

jobs:
  concentration:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows/capital-concentration-quarter.yml
          fetch-depth: 1
      - name: Install hash-locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Check research guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -q'
      - name: Authenticate frozen inputs and runtime
        timeout-minutes: 5
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/concentration-staging.json'
      - name: Run only the bounded B B0 C quarter
        timeout-minutes: 37
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/concentration_job.py --request research/capital_risk/concentration-quarter-request.json --staging-receipt artifacts/capital-risk/concentration-staging.json --output artifacts/capital-risk/concentration-quarter.json'
      - name: Preserve stopped encrypted evidence and nonfinancial receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-concentration-quarter-${{ github.sha }}
          path: |
            artifacts/capital-risk/concentration-staging.json
            artifacts/capital-risk/concentration-quarter.json
            artifacts/capital-risk/concentration-quarter-*.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
