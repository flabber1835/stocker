name: Synthetic selective launcher proof only
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/selective-proof-request.json']
permissions:
  contents: read
concurrency:
  group: selective-launcher-proof-001
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Pure and static guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -q'
      - name: Authenticate existing input and offline runtime
        timeout-minutes: 7
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/selective-proof-staging.json'
      - name: Synthetic composed account and exact launcher export
        timeout-minutes: 4
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/selective_proof_job.py --request research/capital_risk/selective-proof-request.json --staging-receipt artifacts/capital-risk/selective-proof-staging.json --output artifacts/capital-risk/selective-launcher-proof.json'
      - name: Preserve encrypted synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selective-launcher-proof-${{ github.sha }}
          path: |
            artifacts/capital-risk/selective-proof-staging.json
            artifacts/capital-risk/selective-launcher-proof.json
            artifacts/capital-risk/selective-launcher-proof.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
