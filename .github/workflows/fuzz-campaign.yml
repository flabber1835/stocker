name: certification-fuzz

on:
  workflow_dispatch:
  push:
    branches: [audit/fuzz-campaign]
    paths:
      - 'tests/fuzz/**'
      - '.github/workflows/fuzz-campaign.yml'
      - 'sentinel/**'
      - 'shared/**'
      - 'Dockerfile.sentinel'
      - 'Dockerfile.sentinel-test'

jobs:
  pure-financial-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Use the exact deployment/test image path rather than recreating the
      # dependency graph on the GitHub host. This makes fuzz verdicts describe
      # the same Python/runtime layers that the Sentinel certification suite
      # exercises and avoids a second, drifting package-install recipe.
      - name: Build certified Sentinel runtime image
        run: docker build -f Dockerfile.sentinel -t sentinel:latest .

      - name: Build certified Sentinel test lens
        run: docker build -f Dockerfile.sentinel-test -t sentinel-test:latest .

      - name: Run deterministic adversarial properties
        run: |
          docker run --rm sentinel-test:latest tests/fuzz/test_financial_properties.py -q --tb=short
