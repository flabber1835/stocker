name: Research - V5 EX3 historical company names v2

on:
  push:
    branches: [research/v5-ex3-r40-m04-rec8-holdings-report-v1]
    paths:
      - '.github/workflows/v5-ex3-holdings-sec-company-names-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Install resolver dependencies
        shell: bash
        run: python -m pip install pandas==2.3.2

      - name: Wait for exact holdings telemetry artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=34412446236
          TARGET="v5-ex3-r40-m04-rec8-holdings-v2-${RUN_ID}-1"
          for i in $(seq 1 70); do
            JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/flabber1835/stocker/actions/runs/${RUN_ID}/artifacts?per_page=100")
            URL=$(python -c 'import json,sys; d=json.load(sys.stdin); target=sys.argv[1]; print(next((a["archive_download_url"] for a in d.get("artifacts",[]) if a.get("name")==target),""))' "$TARGET" <<<"$JSON")
            if [ -n "$URL" ]; then
              echo "$URL" > /tmp/artifact-url.txt
              break
            fi
            echo "Waiting for holdings artifact: attempt $i/70"
            sleep 60
          done
          test -s /tmp/artifact-url.txt
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$(cat /tmp/artifact-url.txt)" -o holdings.zip
          mkdir holdings-art
          unzip -q holdings.zip -d holdings-art
          test -s holdings-art/holdings-results/engine/holdings-daily.csv
          test -s holdings-art/holdings-results/metadata-timeline.csv.gz

      - name: Download public-name fallback map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/flabber1835/stocker/actions/artifacts/10127485131/zip -o fallback.zip
          mkdir fallback
          unzip -q fallback.zip -d fallback
          test -s fallback/company-names.csv

      - name: Resolve names from canonical issuer CIK and SEC name history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time, urllib.request
          from pathlib import Path
          import pandas as pd

          h=pd.read_csv('holdings-art/holdings-results/engine/holdings-daily.csv', dtype={'security_id':str,'ticker':str})
          h['date']=pd.to_datetime(h['date'])
          m=pd.read_csv('holdings-art/holdings-results/metadata-timeline.csv.gz', dtype={'security_id':str,'ticker':str,'issuer_id':str})
          m['effective_session']=pd.to_datetime(m['effective_session'])
          fb=pd.read_csv('fallback/company-names.csv').fillna('')
          fallback={str(r.ticker):str(r.company_name).strip() for r in fb.itertuples() if str(r.company_name).strip()}

          # Historical-label fallbacks for legacy/delisted display aliases that do not
          # necessarily exist as current exchange symbols.
          manual={
            'ACLI':'American Commercial Lines Inc.', 'AGN1':'Allergan, Inc.', 'ALO1':'Alio Gold Inc.',
            'ANRZQ':'Alpha Natural Resources, Inc.', 'APKT':'Acme Packet, Inc.', 'APOL':'Apollo Education Group, Inc.',
            'APTS':'Preferred Apartment Communities, Inc.', 'ATML':'Atmel Corporation', 'AUXL':'Auxilium Pharmaceuticals, Inc.',
            'AVL1':'Avalon Rare Metals Inc.', 'BRL':'Barr Pharmaceuticals, Inc.', 'BUD1':'Anheuser-Busch Companies, Inc.',
            'CBST':'Cubist Pharmaceuticals, Inc.', 'CEPH':'Cephalon, Inc.', 'CHAP1':'Chaparral Energy, Inc.',
            'CHNG':'Change Healthcare Inc.', 'CMCSK':'Comcast Corporation - Class A Special', 'CNQR':'Concur Technologies, Inc.',
            'COCOQ':'Corinthian Colleges, Inc.', 'CVTX':'CV Therapeutics, Inc.', 'DEN':'Denbury Inc.',
            'DMND':'Diamond Foods, Inc.', 'DRC':'Dresser-Rand Group Inc.', 'DRS1':'DRS Technologies, Inc.',
            'DTGF':'Dollar Thrifty Automotive Group, Inc.', 'EDO':'EDO Corporation', 'ENDPQ':'Endo International plc',
            'EV1':'Eaton Vance Corp.', 'FALB':'Falconbridge Limited', 'FDRY':'Foundry Networks, Inc.',
            'FSYS':'Fuel Systems Solutions, Inc.', 'FTI1':'FMC Technologies, Inc.', 'GAS1':'AGL Resources Inc.',
            'GEN1':'GenOn Energy, Inc.', 'GMCR':'Green Mountain Coffee Roasters, Inc.', 'GOLD1':'Randgold Resources Limited',
            'GPRO1':'GoPro, Inc.', 'GR':'Goodrich Corporation', 'HCR1':'Manor Care, Inc.',
            'HMIN':'Home Inns & Hotels Management Inc.', 'HNT':'Health Net, Inc.', 'IIN':'IntriCon Corporation',
            'IKN':'IKON Office Solutions, Inc.', 'IMCL':'ImClone Systems Incorporated', 'IPHS':'Innophos Holdings, Inc.',
            'ISLN':'Isilon Systems, Inc.', 'JNY':'The Jones Group Inc.', 'JRCCQ':'James River Coal Company',
            'KMR':'Kinder Morgan Management, LLC', 'LCC':'US Airways Group, Inc.', 'LDG':'Longs Drug Stores Corporation',
            'LFCHY':'China Life Insurance Company Limited', 'LGF.B':'Lions Gate Entertainment Corp. - Class B',
            'LTMAY':'LATAM Airlines Group S.A.', 'LVGO':'Livongo Health, Inc.', 'MDVN':'Medivation, Inc.',
            'MEE':'Massey Energy Company', 'MIR2':'Mirant Corporation', 'MMI1':'Motorola Mobility Holdings, Inc.',
            'MMR':'McMoRan Exploration Co.', 'MRTX':'Mirati Therapeutics, Inc.', 'NLC':'Nalco Holding Company',
            'NUVL':'Nuvalent, Inc.', 'OCR':'Omnicare, Inc.', 'ONXX':'Onyx Pharmaceuticals, Inc.',
            'PALM':'Palm, Inc.', 'PCYC':'Pharmacyclics, Inc.', 'PIRRQ':'Pier 1 Imports, Inc.',
            'PRE1':'PartnerRe Ltd.', 'PWRD1':'Perfect World Co., Ltd.', 'PYCR':'Paycor HCM, Inc.',
            'QCOR':'Questcor Pharmaceuticals, Inc.', 'QIHU':'Qihoo 360 Technology Co. Ltd.', 'SAIL1':'SailPoint Technologies Holdings, Inc.',
            'SICPQ':'Silvergate Capital Corporation', 'SPSX':'Superior Essex Inc.', 'SQNM':'Sequenom, Inc.',
            'STEC1':'STEC, Inc.', 'STRZA':'Starz', 'SUG':'Southern Union Company',
            'SWAV':'Shockwave Medical, Inc.', 'SWCH':'Switch, Inc.', 'TBSIQ':'TBS International plc',
            'THOR1':'Thoratec Corporation', 'TMX':'Terminix Global Holdings, Inc.', 'TRA':'Terra Industries Inc.',
            'TSG1':'The Stars Group Inc.', 'UB':'UnionBanCal Corporation', 'UNTCQ':'Unit Corporation',
            'UST1':'UST Inc.', 'VAL1':'The Valspar Corporation', 'VCI':'Valassis Communications, Inc.',
            'VMED':'Virgin Media Inc.', 'VOLT2':'Volt Information Sciences, Inc.', 'VRUS1':'Pharmasset, Inc.',
            'VRX1':'Valeant Pharmaceuticals International, Inc.', 'VSEA':'Varian Semiconductor Equipment Associates, Inc.',
            'VTNRQ':'Vertex Energy, Inc.', 'WCRX':'Warner Chilcott plc', 'WEBX1':'WebEx Communications, Inc.',
            'WGHTQ':'WW International, Inc.', 'WLTGQ':'Walter Energy, Inc.', 'XCOOQ':'EXCO Resources, Inc.'
          }

          first=h.groupby(['ticker','security_id'],as_index=False)['date'].min().rename(columns={'date':'first_held_date'})

          def issuer_asof(sec, dt):
              z=m[(m.security_id==sec)&(m.effective_session<=dt)]
              if z.empty:
                  z=m[m.security_id==sec]
              if z.empty: return ''
              return str(z.sort_values('effective_session').iloc[-1].get('issuer_id',''))

          first['issuer_id']=[issuer_asof(r.security_id,r.first_held_date) for r in first.itertuples()]
          ciks=sorted({int(x.split(':',1)[1]) for x in first.issuer_id if str(x).startswith('SEC_CIK:') and x.split(':',1)[1].isdigit()})
          sec={}
          ua='stocker historical holdings research github-actions contact github.com/flabber1835/stocker'
          for i,cik in enumerate(ciks,1):
              url=f'https://data.sec.gov/submissions/CIK{cik:010d}.json'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Encoding':'gzip, deflate','Host':'data.sec.gov'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      sec[cik]=json.loads(r.read().decode('utf-8'))
              except Exception as e:
                  print('SEC fetch failed',cik,repr(e),flush=True)
              if i%25==0: print('SEC progress',i,'/',len(ciks),flush=True)
              time.sleep(0.12)

          def normalize(n):
              n=re.sub(r'\s+',' ',str(n or '')).strip()
              return n

          def historical_name(cik, dt):
              d=sec.get(cik)
              if not d: return '', ''
              day=pd.Timestamp(dt).date()
              former=d.get('formerNames') or []
              containing=[]
              for f in former:
                  try:
                      fr=pd.Timestamp(f.get('from')).date() if f.get('from') else None
                      to=pd.Timestamp(f.get('to')).date() if f.get('to') else None
                  except Exception:
                      continue
                  if (fr is None or fr<=day) and (to is None or day<=to):
                      containing.append((to or day, normalize(f.get('name'))))
              if containing:
                  containing.sort()
                  return containing[-1][1], 'SEC submissions formerNames exact-date'
              # If the holding predates the current name, choose the closest former
              # name whose period ends at or after the holding date.
              future=[]
              for f in former:
                  try:
                      to=pd.Timestamp(f.get('to')).date() if f.get('to') else None
                  except Exception:
                      continue
                  nm=normalize(f.get('name'))
                  if to and to>=day and nm: future.append((to,nm))
              if future:
                  future.sort()
                  return future[0][1], 'SEC submissions formerNames nearest historical'
              return normalize(d.get('name')), 'SEC submissions issuer name'

          detail=[]
          for r in first.itertuples():
              iid=str(r.issuer_id)
              name=''; src=''
              if iid.startswith('SEC_CIK:') and iid.split(':',1)[1].isdigit():
                  name,src=historical_name(int(iid.split(':',1)[1]),r.first_held_date)
              if not name and r.ticker in manual:
                  name=manual[r.ticker]; src='historical manual fallback'
              if not name and r.ticker in fallback:
                  name=fallback[r.ticker]; src='public exact-symbol fallback'
              if not name:
                  name='Company name unavailable'; src='unresolved'
              detail.append({'ticker':r.ticker,'security_id':r.security_id,'first_held_date':r.first_held_date.date().isoformat(),'issuer_id':iid,'company_name':name,'name_source':src})
          ddf=pd.DataFrame(detail).sort_values(['ticker','first_held_date','security_id'])
          ddf.to_csv('company-names-by-security.csv',index=False)

          summary=[]
          for t,g in ddf.groupby('ticker',sort=True):
              names=[]
              for n in g.company_name:
                  if n not in names: names.append(n)
              summary.append({'ticker':t,'company_name':' / '.join(names),'security_ids':' | '.join(g.security_id.astype(str)),'issuer_ids':' | '.join(dict.fromkeys(g.issuer_id.astype(str))),'first_held_date':g.first_held_date.min(),'name_sources':' | '.join(dict.fromkeys(g.name_source.astype(str)))})
          sdf=pd.DataFrame(summary).sort_values('ticker')
          sdf.to_csv('company-names-historical.csv',index=False)
          unresolved=sdf[sdf.company_name.str.contains('unavailable',case=False,na=False)].ticker.tolist()
          Path('company-names-historical-summary.json').write_text(json.dumps({'ticker_count':len(sdf),'security_rows':len(ddf),'issuer_cik_count':len(ciks),'sec_responses':len(sec),'unresolved':unresolved},indent=2,sort_keys=True)+'\n')
          print(Path('company-names-historical-summary.json').read_text())
          PY

      - name: Upload historical name map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-ex3-company-names-historical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            company-names-by-security.csv
            company-names-historical.csv
            company-names-historical-summary.json
          retention-days: 30
          if-no-files-found: error
