name: PR3 paper root inventory

on:
  push:
    branches:
      - 'fix/pr3-paper-test-canonical-owners-ci'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe951a213d495a4c3e4e4022e16d87065 # v4.2.2
      - name: Inventory private sentinel.paper test coupling
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('.').resolve()
          tests = root / 'tests'
          public = {
              'DEFENSIVE_SYMBOL', 'ExecutionResult', 'PaperAccountInspection',
              'PaperActivationRefused', 'PaperRetryableRefused',
              'PreOpenShareUnitAuthorityUnavailable', 'PreparationResult',
              'build_security_resolver', 'current_paper_plan',
              'execute_automated_paper_plan', 'execute_paper_plan',
              'inspect_paper_account', 'prepare_paper_plan',
              'recover_automated_paper_cycle', 'reconciliation',
          }
          violations = []
          for path in sorted(tests.rglob('*.py')):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              paper_aliases = set()
              sentinel_aliases = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom):
                      if node.module == 'sentinel':
                          for alias in node.names:
                              if alias.name == 'paper':
                                  paper_aliases.add(alias.asname or alias.name)
                      elif node.module == 'sentinel.paper':
                          for alias in node.names:
                              if alias.name not in public:
                                  violations.append((str(path), node.lineno, 'import', alias.name))
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name == 'sentinel.paper' and alias.asname:
                              paper_aliases.add(alias.asname)
                          elif alias.name == 'sentinel':
                              sentinel_aliases.add(alias.asname or 'sentinel')
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Attribute):
                      continue
                  binding = None
                  if isinstance(node.value, ast.Name) and node.value.id in paper_aliases:
                      binding = node.attr
                  elif (isinstance(node.value, ast.Attribute)
                        and node.value.attr == 'paper'
                        and isinstance(node.value.value, ast.Name)
                        and node.value.value.id in sentinel_aliases):
                      binding = node.attr
                  if binding is not None and binding not in public:
                      violations.append((str(path), node.lineno, 'access', binding))
          for row in violations:
              print('|'.join(map(str, row)))
          print(f'PR3_PRIVATE_ROOT_VIOLATIONS={len(violations)}')
          raise SystemExit(1 if violations else 0)
          PY
