name: Research Champion - observation-only market-risk screen v2
run-name: RESEARCH NOT CERTIFIED - observation-only screen v2 - ${{ github.sha }}

on:
  push:
    branches: [research/champion-market-risk-controller-robustness]
    paths:
      - '.github/workflows/champion-market-risk-controller-screen-v2.yml'
      - 'backtester/research_champion_market_risk_screen_v2.py'
      - 'backtester/research_champion_r3000_proxy_screen_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  screen:
    name: RESEARCH NOT CERTIFIED - observation-only coarse screen v2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      BASELINE_RUN_ID: '34007704385'
      BASELINE_ARTIFACT: 'champion-corrected-classification-34007704385-1'
      BASELINE_DAILY_SHA256: 'fbc8a18d2e6f01bbc5154fe359990633bbe93e28b4dbeba57da0be149f4811a8'
      VIX_RUN_ID: '34010233044'
      VIX_ARTIFACT: 'champion-market-risk-screen-34010233044-1'
      VIX_CUTOFF_SHA256: '9bf13a7d758cd0727e3fb68d50a32715d6201ed7f0cd220841ecfe2a4901ee4b'
      OUT: 'market-risk-controller/observation-only-screen-v2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/research_champion_market_risk_screen_v2.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install pinned analysis dependencies
        run: python -m pip install 'numpy==2.3.2' 'pandas==2.3.2'
      - name: Fetch authenticated frozen witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline /tmp/vix
          gh run download "${BASELINE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${BASELINE_ARTIFACT}" --dir /tmp/baseline
          gh run download "${VIX_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${VIX_ARTIFACT}" --dir /tmp/vix
          test "$(sha256sum /tmp/baseline/daily.csv.gz | cut -d' ' -f1)" = "${BASELINE_DAILY_SHA256}"
          test "$(sha256sum /tmp/vix/vix-cboe-cutoff-through-2026-07-31.csv | cut -d' ' -f1)" = "${VIX_CUTOFF_SHA256}"
      - name: Run observation-only coarse screen
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          python backtester/research_champion_market_risk_screen_v2.py \
            --baseline-daily /tmp/baseline/daily.csv.gz \
            --vix-csv /tmp/vix/vix-cboe-cutoff-through-2026-07-31.csv \
            --output "${OUT}" | tee "${OUT}/screen-v2.log"
          cat "${OUT}/family-summary-v2.csv"
      - name: Upload observation-only screen evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-market-risk-screen-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-risk-controller/observation-only-screen-v2/
          retention-days: 90
          if-no-files-found: error

  r3000_proxy:
    name: RESEARCH NOT CERTIFIED - IWV Russell 3000 proxy coarse screen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      BASELINE_RUN_ID: '34007704385'
      BASELINE_ARTIFACT: 'champion-corrected-classification-34007704385-1'
      BASELINE_DAILY_SHA256: 'fbc8a18d2e6f01bbc5154fe359990633bbe93e28b4dbeba57da0be149f4811a8'
      OUT: 'market-risk-controller/r3000-proxy-screen-v2'
      IWV_URL: 'https://query1.finance.yahoo.com/v8/finance/chart/IWV?period1=946684800&period2=1785542400&interval=1d&events=div%2Csplits&includeAdjustedClose=true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/research_champion_r3000_proxy_screen_v2.py
            /backtester/research_champion_market_risk_screen_v2.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install pinned analysis dependencies
        run: python -m pip install 'numpy==2.3.2' 'pandas==2.3.2'
      - name: Fetch frozen baseline and broad-index witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline /tmp/iwv
          gh run download "${BASELINE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${BASELINE_ARTIFACT}" --dir /tmp/baseline
          test "$(sha256sum /tmp/baseline/daily.csv.gz | cut -d' ' -f1)" = "${BASELINE_DAILY_SHA256}"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 stocker-research' "${IWV_URL}" -o /tmp/iwv/iwv-yahoo.json
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          p='/tmp/iwv/iwv-yahoo.json'
          j=json.load(open(p))
          r=j['chart']['result'][0]
          ts=r['timestamp']
          adj=r['indicators'].get('adjclose',[{}])[0].get('adjclose')
          close=r['indicators']['quote'][0]['close']
          vals=adj if adj is not None else close
          with open('/tmp/iwv/iwv.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['Date','Close'])
              for t,v in zip(ts,vals):
                  if v is not None:
                      w.writerow([datetime.fromtimestamp(t,timezone.utc).date().isoformat(),format(float(v),'.12g')])
          PY
          test "$(wc -l < /tmp/iwv/iwv.csv)" -gt 4000
          head -5 /tmp/iwv/iwv.csv
          sha256sum /tmp/iwv/iwv-yahoo.json /tmp/iwv/iwv.csv
      - name: Run Russell 3000 proxy observation screen
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          cp /tmp/iwv/iwv-yahoo.json "${OUT}/iwv-yahoo-source.json"
          PYTHONPATH=backtester python backtester/research_champion_r3000_proxy_screen_v2.py \
            --baseline-daily /tmp/baseline/daily.csv.gz \
            --iwv-csv /tmp/iwv/iwv.csv \
            --output "${OUT}" | tee "${OUT}/screen-r3000-v2.log"
          cat "${OUT}/family-summary-r3000-v2.csv"
      - name: Upload Russell 3000 proxy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-r3000-proxy-screen-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-risk-controller/r3000-proxy-screen-v2/
          retention-days: 90
          if-no-files-found: error
