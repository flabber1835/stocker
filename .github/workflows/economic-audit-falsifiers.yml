name: Economic audit 373 pinned-runtime falsifiers
on:
  push:
    branches: [audit/economic-373-snapshot]
    paths:
      - .github/workflows/economic-audit-falsifiers.yml
      - audit_evidence/economic_373/**
permissions:
  contents: read
concurrency:
  group: economic-audit-373-falsifiers
  cancel-in-progress: false
jobs:
  falsifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read audit-only probes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          persist-credentials: false
      - name: Read exact audited production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 09dde38d270ad069a006ee3cb458037d42ade316
          path: production
          persist-credentials: false
      - name: Build exact production runtime and test lens
        working-directory: production
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 09dde38d270ad069a006ee3cb458037d42ade316
          test "$(git rev-parse HEAD^{tree})" = d80c655c42e1abfef83b2d031766bf295a2c9181
          docker build --build-arg SOURCE_GIT_SHA=09dde38d270ad069a006ee3cb458037d42ade316 -f Dockerfile.sentinel -t sentinel:ci .
          docker build --build-arg SENTINEL_IMAGE=sentinel:ci --build-arg SOURCE_GIT_SHA=09dde38d270ad069a006ee3cb458037d42ade316 -f Dockerfile.sentinel-test -t sentinel-test:ci .
      - name: Reproduce economic defects under pinned Python and dependencies
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker run --rm --network none --entrypoint python sentinel-test:ci -c 'import sys,json,importlib.metadata as m; assert sys.version_info[:3] == (3,12,13); print(json.dumps({"python":sys.version,"dependencies":{n:m.version(n) for n in ("numpy","pandas","exchange_calendars","pydantic","psycopg")}},indent=2))' > evidence/runtime.json
          for probe in conversion_aggregation noninteger_reverse_split; do
            docker run --rm --network none --entrypoint python -v "$PWD/audit/audit_evidence/economic_373:/audit:ro" sentinel-test:ci "/audit/$probe.py" > "evidence/$probe.json"
            cat "evidence/$probe.json"
          done
          printf '%s\n' 'PASS means the named defect was reproduced; economic correctness remains blocked.' > evidence/VERDICT.txt
      - name: Verify frozen numerical and restart tests in their required runtime
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python sentinel-test:ci -m pytest -q tests/median5/test_components.py tests/median5/test_features.py tests/wealth_core/test_restart_matrix.py tests/sentinel/test_combined_event_economics.py tests/wealth_core/test_exact_corporate_action_economics.py | tee evidence/required-runtime-tests.log
      - name: Retain exact-runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: economic-audit-373-falsifiers-09dde38
          path: evidence/
          if-no-files-found: error
          retention-days: 30
