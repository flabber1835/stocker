name: Backtester - R1000 IWB archive probe
run-name: R1000 IWB archive probe — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-r1000-iwb-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe historical IWB holdings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.parse, urllib.request
          base='https://www.ishares.com/us/products/239707/ishares-russell-1000-etf/1467271812596.ajax'
          dates=['20060929','20080630','20180629','20220630','20250731']
          out=[]
          for d in dates:
              q=urllib.parse.urlencode({'fileType':'json','tab':'all','asOfDate':d})
              req=urllib.request.Request(base+'?'+q,headers={'User-Agent':'Mozilla/5.0 R1000-PIT-research/1.0','Accept':'application/json,text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(); status=getattr(r,'status',200); ctype=r.headers.get('content-type','')
              sha=hashlib.sha256(raw).hexdigest()
              prefix=raw[:180].decode('utf-8-sig','replace')
              parsed=None; rows=None; asof=None
              try:
                  parsed=json.loads(raw.decode('utf-8-sig'))
                  if isinstance(parsed,dict):
                      rows=parsed.get('aaData') or parsed.get('data')
                      asof=parsed.get('asOfDate') or parsed.get('as_of_date')
                  elif isinstance(parsed,list):
                      rows=parsed
              except Exception as exc:
                  parsed=f'{type(exc).__name__}: {exc}'
              out.append({'requested':d,'http_status':status,'content_type':ctype,'bytes':len(raw),'sha256':sha,'json_type':type(parsed).__name__,'row_count':len(rows) if isinstance(rows,list) else None,'asof':asof,'prefix':prefix})
          print(json.dumps(out,indent=2))
          assert len({x['sha256'] for x in out})==len(out), out
          assert all((x['row_count'] or 0)>900 for x in out), out
          PY
