name: Capital risk research probe

on:
  push:
    branches: [codex/capital-risk-research]
    paths:
      - '.github/workflows/capital-risk-research.yml'
      - 'research/capital_risk/probe.py'
      - 'research/capital_risk/request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capital-risk-research-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
          fetch-depth: 1
      - name: Verify research guards
        run: python3 -m unittest discover -s research/capital_risk/tests -p test_probe.py -v
      - name: Probe isolated hosted capacity
        run: python3 research/capital_risk/probe.py --request research/capital_risk/request.json --output artifacts/capital-risk/probe.json
      - name: Retain only the nonfinancial probe report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-risk-capacity-${{ github.sha }}
          path: artifacts/capital-risk/probe.json
          if-no-files-found: error
          retention-days: 1
