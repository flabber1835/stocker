name: Inspect surviving May 2007 Russell capture links

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - '.github/workflows/pit-russell-2007-may-html-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Fetch exact May capture and print links
        run: |
          python - <<'PY'
          import html.parser, urllib.request
          ts='20070514113435'
          source='http://www.russell.com/us/Indexes/US/Reconstitution/R3000.pdf'
          url=f'https://web.archive.org/web/{ts}id_/{source}'
          req=urllib.request.Request(url,headers={'User-Agent':'stocker-pit-russell-research/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read().decode('utf-8','replace')
                  print('HTTP',r.status,'BYTES',len(body),'FINAL',r.geturl(),flush=True)
          except Exception as exc:
              print('ERROR',type(exc).__name__,str(exc),flush=True); raise SystemExit(0)
          class P(html.parser.HTMLParser):
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for key in ('href','src','action'):
                      value=d.get(key)
                      if not value: continue
                      low=value.lower()
                      if any(k in low for k in ('reconstit','r3000','russell3000','membership','addition','deletion','.pdf')):
                          print(tag.upper(),key.upper(),value,flush=True)
          P().feed(body)
          print('--- TEXT MARKERS ---')
          text=' '.join(body.split())
          for term in ('Reconstitution','Membership','Additions','Deletions','Russell 3000'):
              idx=text.lower().find(term.lower())
              if idx>=0:
                  print(term, text[max(0,idx-500):idx+1200],flush=True)
          PY
