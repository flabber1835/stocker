name: Backtester - sector A/D fresh replay

on:
  workflow_dispatch:

# HARD BACKTESTER BOUNDARY: this workflow cannot write repository contents.
permissions:
  contents: read

# Keep the legacy group name for this transition so this push cancels the
# superseded in-progress A/B replay on the same research branch.
concurrency:
  group: backtester-sector-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-sector-ad:
    name: Fresh chronological A/D replay
    if: github.ref_name == 'research/backtester'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out frozen backtester laboratory inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-sector-abc.yml
            /backtester/experiments/2026-08-27-sector-abc/**
            /backtester/run_sector_ad_causal_terminal_terms.py
            /backtester/causal_terminal_terms.py
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /docs/backtester-experiment-contract.md
            /docs/backtester-causal-terminal-terms.md
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_*.csv.gz
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt

      - name: Enforce immutable research-side boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/backtester"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          if git config --get remote.origin.url >/dev/null; then
            echo "Backtester checkout is read-only; persisted credentials are disabled."
          fi
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Check out exact current-main strategy source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Verify exact main source identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=c502d077cae9c494f8b74a41ee8be7f40b25837d
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "${EXPECTED}"
          test -z "$(git -C main-src status --porcelain)"
          test -f main-src/docs/sentinel-handoff/00_README/FROZEN_SENTINEL_1P1_RULE.json
          test -f main-src/docs/sentinel-handoff/00_README/SHA256SUMS.txt
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"
          printf 'Exact strategy source: main@%s\n' "${ACTUAL}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact current-main runtime dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Compile experiment and exact strategy sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/causal_terminal_terms.py \
            backtester/run_sector_ad_causal_terminal_terms.py \
            backtester/experiments/2026-08-27-sector-abc/run.py
          python -m compileall -q -f main-src/sentinel main-src/shared/stock_strategy_shared

      - name: Verify all declared frozen input files are present
        shell: bash
        run: |
          set -euo pipefail
          test -f 'PIT input data/MANIFEST.csv'
          test -f 'PIT input data/ACTIONS_PIT_ONLY.csv.gz'
          test -f 'PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv'
          test -f 'PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz'
          test -f sharadar/SHARADAR_TICKERS.zip
          test -f backtester/data/causal-terminal-terms-v1.json
          test -f backtester/data/causal-terminal-terms-v1.SHA256
          (cd backtester/data && sha256sum -c causal-terminal-terms-v1.SHA256)
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
          count="$(find sharadar -maxdepth 1 -type f -name 'SHARADAR_SEP_*.csv.gz' | wc -l)"
          test "${count}" -ge 29
          echo "Frozen-input preflight PASS (${count} SEP annual source files present)."

      - name: Run fresh chronological A/D experiment
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          BACKTESTER_PROGRESS_INTERVAL_SESSIONS: '63'
        run: |
          set -euo pipefail
          rm -rf backtester-results/sector-ad
          python backtester/run_sector_ad_causal_terminal_terms.py \
            --lab-root . \
            --main-root main-src \
            --output backtester-results/sector-ad \
            2>&1 | tee backtester-sector-ad.log

      - name: Verify result bundle and print headline table
        shell: bash
        run: |
          set -euo pipefail
          cd backtester-results/sector-ad
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          summary = json.loads(Path('summary.json').read_text())
          if summary.get('status') != 'PASS':
              raise SystemExit('summary is not PASS')
          if summary.get('fresh_chronological_replay') is not True:
              raise SystemExit('fresh replay flag is not true')
          if summary.get('prerecorded_decision_inputs') is not False:
              raise SystemExit('prerecorded-decision boundary is not false')
          if summary.get('wealth_core_parity') is not True:
              raise SystemExit('A/D Wealth Core parity is not true')
          variants = summary.get('variant_definition') or {}
          if set(variants) != {'A', 'D'}:
              raise SystemExit(f'wrong variant set: {variants}')
          if summary.get('progress_interval_sessions') != 63:
              raise SystemExit('running CAGR checkpoint interval is not 63 sessions')
          d_semantics = summary.get('d_pit_semantics') or {}
          if d_semantics.get('category') != 'removed':
              raise SystemExit(f'D category semantics are wrong: {d_semantics}')
          if d_semantics.get('sector') != 'strict-prior SEC SIC -> frozen FF12':
              raise SystemExit(f'D sector semantics are wrong: {d_semantics}')
          terms = summary.get('causal_terminal_terms') or {}
          expected_terms_sha = 'f93a3ac12452f2f29a9c57ee93474ce14a44c51d2e81b538a3e150e9089129c9'
          if terms.get('sha256') != expected_terms_sha:
              raise SystemExit(f"wrong causal terminal terms hash: {terms.get('sha256')}")
          expected_events = {
              ('2001-05-30', '120448', 'CASH_MERGER'),
              ('2001-06-01', '122131', 'CONVERSION'),
          }
          actual_events = {
              (str(row.get('session')), str(row.get('security_id')), str(row.get('kind')))
              for row in terms.get('events') or []
          }
          if not expected_events.issubset(actual_events):
              raise SystemExit(f'causal terminal event provenance is incomplete: {actual_events}')
          witness = terms.get('original_failure_boundary') or {}
          if witness.get('session') != '2001-06-04':
              raise SystemExit(f'wrong original-failure witness: {witness}')
          if not isinstance(witness.get('resolved_open_equity'), (int, float)) or witness['resolved_open_equity'] <= 0:
              raise SystemExit(f'original-failure open remains unresolved: {witness}')
          if witness.get('open_unresolved_security_ids') != []:
              raise SystemExit(f'original-failure unresolved security IDs remain: {witness}')
          metrics = pd.read_csv('metrics.csv')
          if 'B' in set(metrics['variant'].astype(str)):
              raise SystemExit('legacy B variant leaked into A/D result bundle')
          if not {'A', 'D'}.issubset(set(metrics['variant'].astype(str))):
              raise SystemExit(f'A/D metrics missing: {set(metrics["variant"].astype(str))}')
          print(Path('metrics.csv').read_text())
          PY

      - name: Upload immutable experiment results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backtester-sector-ad-${{ github.run_id }}
          path: |
            backtester-results/sector-ad/**
            backtester-sector-ad.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
