name: Temporary targeted rollout-rotation patch

on:
  push:
    branches:
      - fix/rollout-certificate-rotation-chain-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact schema patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sentinel/schema.py')
          s = p.read_text()
          old = '''        if from_mode != prior_mode or to_mode not in {
                  "PINNED_1_00", "CONTROLLER"} or to_mode == from_mode:
              raise _operator_refusal(
                  f"rollout event version {event_version} breaks the mode chain")
'''
          new = '''        if from_mode != prior_mode or to_mode not in {
                  "PINNED_1_00", "CONTROLLER"}:
              raise _operator_refusal(
                  f"rollout event version {event_version} breaks the mode chain")
          if to_mode == from_mode and not (
                  to_mode == "CONTROLLER"
                  and prior_certificate is not None
                  and event_certificate is not None
                  and event_certificate != prior_certificate):
              raise _operator_refusal(
                  f"rollout event version {event_version} breaks the mode chain")
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one target block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_temp_patch_rollout_rotation.yml
          git add sentinel/schema.py
          git commit -m 'sentinel: accept meaningful controller certificate rotations'
          git push origin HEAD:${GITHUB_REF_NAME}
