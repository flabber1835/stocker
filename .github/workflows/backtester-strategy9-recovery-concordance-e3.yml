name: Backtester - Strategy 9 recovery concordance E3
run-name: Strategy 9 recovery concordance E3 — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-strategy9-recovery-concordance-e3.yml'
      - 'backtester/experiment_architecture_recovery_concordance_e3.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT_DIR: backtester-results/strategy9-recovery-concordance-e3

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact experiment head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-strategy9-recovery-concordance-e3.yml
            /backtester/experiment_architecture_recovery_concordance_e3.py
            /backtester/calibrate_broad_simplified_breadth.py
            /backtester/experiment2_broad_independent_correlation.py
            /backtester/run_r1000_correlation_peers.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Compile experiment harness
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/experiment_architecture_recovery_concordance_e3.py \
            backtester/calibrate_broad_simplified_breadth.py \
            backtester/experiment2_broad_independent_correlation.py \
            backtester/run_research_ldrc_corrected_warmup_cash.py \
            backtester/run_research_ldrc_nonpit_vs_fullpit.py

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat sharadar/SFP/SHARADAR_SFP.zip.001 sharadar/SFP/SHARADAR_SFP.zip.002 sharadar/SFP/SHARADAR_SFP.zip.003 sharadar/SFP/SHARADAR_SFP.zip.004 > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Run fresh full-history E3 replay
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m backtester.experiment_architecture_recovery_concordance_e3 --output "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum -c E3_SHA256SUMS.txt)

      - name: Validate causal experiment and control parity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          import pandas as pd

          out=Path(os.environ['OUT_DIR'])
          s=json.loads((out/'summary.json').read_text())
          m=json.loads((out/'e3_manifest.json').read_text())
          metrics=pd.read_csv(out/'e3_metrics.csv',dtype={'window_years':str})
          releases=pd.read_csv(out/'e3_release_sessions.csv')
          episodes=pd.read_csv(out/'e3_episode_attribution.csv')

          assert s['status']=='PASS'
          assert s['evidence_label']=='STRATEGY9_E3_CROSS_SURFACE_RECOVERY_CONCORDANCE'
          assert s['experiment_budget_number']==3
          assert s['control_parity']['status']=='PASS', s['control_parity']
          assert m['causal_contract']['fresh_chronological_replay'] is True
          assert m['causal_contract']['same_session_control_and_candidate'] is True
          assert m['causal_contract']['candidate_feedback_into_wealth_core'] is False
          assert m['causal_contract']['candidate_feedback_into_native_sentinel'] is False
          assert m['causal_contract']['pre_recorded_decisions_used_as_input'] is False

          expected_variants={'CONTROL','E3_RECOVERY_CONCORDANCE','CORE','SPY'}
          assert set(metrics.variant.astype(str))==expected_variants
          assert len(metrics)==20
          assert metrics.cagr.map(math.isfinite).all()
          assert metrics.max_drawdown.map(math.isfinite).all()
          assert metrics.sharpe.map(math.isfinite).all()

          expected_release_dates={'2012-01-18','2016-02-25','2019-02-04'}
          actual_release_dates=set(pd.to_datetime(releases.date).dt.strftime('%Y-%m-%d'))
          assert actual_release_dates==expected_release_dates, actual_release_dates
          assert len(episodes)==3, episodes
          assert not episodes.start.astype(str).str.startswith('2000').any()
          assert not episodes.start.astype(str).str.startswith('2001').any()

          control_max=metrics[(metrics.window_years=='max')&(metrics.variant=='CONTROL')].iloc[0]
          assert abs(float(control_max.cagr)-0.1979341893464519)<5e-10
          assert abs(float(control_max.max_drawdown)-(-0.3345904831084261))<5e-10
          print(metrics.to_string(index=False))
          print(releases.to_string(index=False))
          print(episodes.to_string(index=False))
          PY

      - name: Publish E3 summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT_DIR'])
          if not (out/'e3_metrics.csv').exists():
              raise SystemExit(0)
          m=pd.read_csv(out/'e3_metrics.csv',dtype={'window_years':str})
          e=pd.read_csv(out/'e3_episode_attribution.csv')
          order={'5':0,'10':1,'15':2,'20':3,'max':4}; m['_order']=m.window_years.map(order)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Strategy 9 E3 — cross-surface recovery concordance — experiment 3/10\n\n')
              f.write('| Window | Variant | CAGR | Max DD | Sharpe | Multiple |\n')
              f.write('|---|---|---:|---:|---:|---:|\n')
              for r in m.sort_values(['_order','variant']).itertuples(index=False):
                  f.write(f'| {r.window_years} | {r.variant} | {r.cagr:.2%} | {r.max_drawdown:.2%} | {r.sharpe:.3f} | {r.ending_multiple:.2f}x |\n')
              f.write(f'\nCandidate-vs-control allocation-difference episodes: **{len(e)}**.\n')
          PY

      - name: Upload immutable E3 bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy9-recovery-concordance-e3-${{ github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
