name: Wealth Core missing source evidence batch
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/system-campaign-source-batch-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: wealth-core-source-evidence-batch
  cancel-in-progress: false
jobs:
  source:
    # Both requested groups captured; metadata publication must not repeat the fetch.
    if: false && github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/wwe-transfer-requirements.lock
      - name: Authenticate existing frozen inputs and offline runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/system_campaign_stage_transport.py --factual-request research/capital_risk/system-campaign-source-batch-request.json --request research/capital_risk/stage-request.json --output artifacts/capital-risk/source-batch-staging.json'
      - name: Collect source evidence only without a financial parent or transition
        timeout-minutes: 25
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/system_campaign_source_batch.py --mode launch --request research/capital_risk/system-campaign-source-batch-request.json --staging artifacts/capital-risk/source-batch-staging.json --output artifacts/capital-risk/source-batch-receipt.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wealth-core-source-batch-${{ github.sha }}
          path: artifacts/capital-risk/source-batch-*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
