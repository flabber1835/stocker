name: Backtester - WC targeted hedge Stage 5
run-name: WC targeted hedge Stage 5 trigger zero-budget — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-wc-targeted-hedge-diagnostic]
    paths:
      - '.github/workflows/backtester-wc-targeted-hedge-stage5.yml'
      - 'backtester/diagnose_wc_targeted_hedge_stage5.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  E3_RUN_ID: '33912976460'
  E3_HEAD: '3f27834db427e71d9bb8d0b6160c8835b739c906'
  E3_ARTIFACT: 'strategy9-recovery-concordance-e3-3f27834db427e71d9bb8d0b6160c8835b739c906'
  E3_DIGEST: 'sha256:22011d018a336c6da4d92b31e8786811a4f4288daa91d56a80c30c9f144f174f'
  BETA_RUN_ID: '33976008320'
  BETA_HEAD: '92e5d340858dae00909d9d459b539b7e76de8297'
  BETA_ARTIFACT: 'wc-hedge-decomposition-92e5d340858dae00909d9d459b539b7e76de8297'
  BETA_DIGEST: 'sha256:19df7f1c2801629397c70600b10368cb0782c71dbd7dcb049caa6f02436367d3'
  OUT_DIR: '${{ github.workspace }}/backtester-results/wc-targeted-hedge-stage5'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-wc-targeted-hedge-stage5.yml
            /backtester/diagnose_wc_targeted_hedge_stage5.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Authenticate immutable upstream artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${E3_RUN_ID}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${E3_RUN_ID}" --jq '.head_sha')" = "${E3_HEAD}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${E3_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${E3_ARTIFACT}\") | .digest")" = "${E3_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BETA_RUN_ID}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BETA_RUN_ID}" --jq '.head_sha')" = "${BETA_HEAD}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BETA_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${BETA_ARTIFACT}\") | .digest")" = "${BETA_DIGEST}"

      - name: Download accepted E3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.E3_ARTIFACT }}
          path: accepted-e3
          repository: ${{ github.repository }}
          run-id: ${{ env.E3_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prior beta diagnostic
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BETA_ARTIFACT }}
          path: beta-diagnostic
          repository: ${{ github.repository }}
          run-id: ${{ env.BETA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify upstream contents
        run: |
          set -euo pipefail
          (cd accepted-e3 && sha256sum -c E3_SHA256SUMS.txt)
          (cd beta-diagnostic && sha256sum -c WC_BETA_DRAWDOWN_SHA256SUMS.txt)

      - name: Run Stage 5 zero-budget trigger diagnostic
        run: |
          set -euo pipefail
          python -m py_compile backtester/diagnose_wc_targeted_hedge_stage5.py
          rm -rf "$OUT_DIR"
          python backtester/diagnose_wc_targeted_hedge_stage5.py --accepted-root accepted-e3 --beta-root beta-diagnostic --output "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum -c STAGE5_SHA256SUMS.txt)

      - name: Validate pricing gate and E8 remains closed
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['OUT_DIR'])/'stage5_summary.json').read_text())
          assert s['status']=='PASS'
          assert s['zero_budget_diagnostic'] is True
          assert s['strategy_mechanics_changed'] is False
          assert s['experiment_budget_consumed'] is False
          assert s['e8_spent'] is False
          assert s['trigger_contract']['new_fitted_numeric_thresholds']==0
          assert s['target_coverage']['pricing_diagnostic_gate'] is True
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Publish Stage 5 summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['OUT_DIR']); q=p/'stage5_summary.json'
          if not q.exists(): raise SystemExit(0)
          s=json.loads(q.read_text()); e=s['episode_statistics']; t=s['target_coverage']; m=s['top15_mapping']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Targeted hedge Stage 5 — systemic concordance trigger\n\n')
              f.write(f"Episodes: **{e['episodes']}** over **{e['years']:.1f} years** ({e['episodes_per_year']:.2f}/year)  \n")
              f.write(f"Median episode: **{e['median_sessions']:.0f} sessions**  \n")
              f.write(f"All four target systemic episodes caught: **{t['all_four_caught_before_or_at_trough']}**  \n")
              f.write(f"Market-dominant top-15 triggered: **{m['market_dominant_triggered']}/{m['market_dominant_episodes']}**  \n")
              f.write(f"Residual-dominant top-15 triggered: **{m['residual_dominant_triggered']}/{m['residual_dominant_episodes']}**  \n\n")
              f.write('**Pricing diagnostic gate open. Experiment budget remains 7/10; E8 not spent.**\n')
          PY

      - name: Upload immutable Stage 5 evidence
        if: ${{ always() && hashFiles('backtester-results/wc-targeted-hedge-stage5/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wc-targeted-hedge-stage5-${{ github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
