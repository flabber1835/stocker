name: Backtester - inspect split date-domain anomalies

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-inspect-split-date-domain-anomalies.yml'
      - 'backtester/diagnostics/inspect_split_date_domain_anomalies.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-inspect-split-date-domain-anomalies.yml
            /backtester/diagnostics/inspect_split_date_domain_anomalies.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_1998.csv.gz
            /sharadar/SHARADAR_SEP_2009.csv.gz
            /sharadar/SHARADAR_SEP_2014.csv.gz
            /sharadar/SHARADAR_SEP_2017.csv.gz

      - name: Record research identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_LAB_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_SPLIT_DATE_DOMAIN_OUTPUT=${GITHUB_WORKSPACE}/backtester-results/split-date-domain-anomalies.json" >> "${GITHUB_ENV}"

      - name: Check out exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - name: Bind exact main
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "c502d077cae9c494f8b74a41ee8be7f40b25837d"
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Inspect frozen rows
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p backtester-results
          python -m py_compile backtester/diagnostics/inspect_split_date_domain_anomalies.py
          python backtester/diagnostics/inspect_split_date_domain_anomalies.py \
            2>&1 | tee split-date-domain-anomalies.log
          test -s backtester-results/split-date-domain-anomalies.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: split-date-domain-anomalies-${{ github.run_id }}
          path: |
            backtester-results/split-date-domain-anomalies.json
            split-date-domain-anomalies.log
          if-no-files-found: warn
          retention-days: 30
