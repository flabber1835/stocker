name: System campaign training-only locks and compute allocation
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/system-campaign-selection-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: system-optimization-002-training-selection
  cancel-in-progress: false
jobs:
  selection:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/capital_risk
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Authenticate frozen offline runtime and source
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/full-core-staging.json'
      - name: Authenticate reviewed training evidence and freeze choices
        timeout-minutes: 35
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/system_campaign_select_job.py --request research/capital_risk/system-campaign-selection-request.json --staging artifacts/capital-risk/full-core-staging.json --output artifacts/capital-risk/campaign-training-selection.json'
      - name: Preserve encrypted stopped selection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-campaign-training-selection-${{ github.sha }}
          path: |
            artifacts/capital-risk/full-core-staging.json
            artifacts/capital-risk/campaign-training-selection.json
            artifacts/capital-risk/campaign-training-selection.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
