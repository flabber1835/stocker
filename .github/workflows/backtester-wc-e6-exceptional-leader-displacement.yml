name: Backtester - Wealth Core E6 exceptional leader displacement
run-name: WC E6 exceptional leader displacement — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-wc-e6-exceptional-leader-displacement]
    paths:
      - '.github/workflows/backtester-wc-e6-exceptional-leader-displacement.yml'
      - 'backtester/experiment_wc_e6_exceptional_leader_displacement.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  E3_HEAD: '3f27834db427e71d9bb8d0b6160c8835b739c906'
  ACCEPTED_E3_RUN_ID: '33912976460'
  ACCEPTED_E3_ARTIFACT: 'strategy9-recovery-concordance-e3-3f27834db427e71d9bb8d0b6160c8835b739c906'
  ACCEPTED_E3_DIGEST: 'sha256:22011d018a336c6da4d92b31e8786811a4f4288daa91d56a80c30c9f144f174f'
  OUT_DIR: '${{ github.workspace }}/backtester-results/wc-e6-exceptional-leader-displacement'

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out E6 head and exact accepted E3 lineage
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-wc-e6-exceptional-leader-displacement.yml
            /backtester/experiment_wc_e6_exceptional_leader_displacement.py
            /backtester/experiment_architecture_recovery_concordance_e3.py
            /backtester/calibrate_broad_simplified_breadth.py
            /backtester/experiment2_broad_independent_correlation.py
            /backtester/run_r1000_correlation_peers.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - name: Verify accepted E3 source lineage unchanged
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${E3_HEAD}" HEAD
          unexpected=$(git diff --name-only "${E3_HEAD}"..HEAD \
            | grep -v '^backtester/experiment_wc_e6_exceptional_leader_displacement.py$' \
            | grep -v '^.github/workflows/backtester-wc-e6-exceptional-leader-displacement.yml$' \
            || true)
          test -z "${unexpected}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Authenticate accepted E3 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTED_E3_RUN_ID}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTED_E3_RUN_ID}" --jq '.head_sha')" = "${E3_HEAD}"
          observed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTED_E3_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${ACCEPTED_E3_ARTIFACT}\") | .digest")
          test "${observed}" = "${ACCEPTED_E3_DIGEST}"

      - name: Download immutable accepted E3 control
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ACCEPTED_E3_ARTIFACT }}
          path: accepted-e3
          repository: ${{ github.repository }}
          run-id: ${{ env.ACCEPTED_E3_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate accepted E3 contents
        run: |
          set -euo pipefail
          (cd accepted-e3 && sha256sum -c E3_SHA256SUMS.txt)
          test -s accepted-e3/daily.csv.gz

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat sharadar/SFP/SHARADAR_SFP.zip.001 sharadar/SFP/SHARADAR_SFP.zip.002 sharadar/SFP/SHARADAR_SFP.zip.003 sharadar/SFP/SHARADAR_SFP.zip.004 > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Compile E6 experiment
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/experiment_wc_e6_exceptional_leader_displacement.py \
            backtester/experiment_architecture_recovery_concordance_e3.py \
            backtester/calibrate_broad_simplified_breadth.py \
            backtester/experiment2_broad_independent_correlation.py \
            backtester/run_research_ldrc_corrected_warmup_cash.py \
            backtester/run_research_ldrc_nonpit_vs_fullpit.py

      - name: Run fresh E6 chronological A/B candidate
        env:
          PYTHONUNBUFFERED: '1'
          ACCEPTED_E3_ROOT: '${{ github.workspace }}/accepted-e3'
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m backtester.experiment_wc_e6_exceptional_leader_displacement --output "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum -c E6_SHA256SUMS.txt)

      - name: Validate E6 contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT_DIR'])
          m=json.load(open(out/'e6_manifest.json'))
          s=json.load(open(out/'e6_summary.json'))
          x=pd.read_csv(out/'e6_2020_2026_metrics.csv')
          e=pd.read_csv(out/'e6_displacement_events.csv')
          assert m['status']=='PASS' and m['experiment_budget_number']==6
          assert m['pre_activation_parity'] is True
          assert m['native_sentinel_changed'] is False and m['e3_overlay_code_changed'] is False
          assert s['pre_activation_parity']['status']=='PASS'
          assert s['displacement_rule']['new_fitted_return_thresholds']==0
          assert len(e)>0
          assert set(x.variant)=={'ACCEPTED_E3','ACCEPTED_CORE','E6_E3','E6_CORE','SPY'}
          print(x.to_string(index=False))
          print(e.head(50).to_string(index=False))
          PY

      - name: Publish E6 summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT_DIR'])
          p=out/'e6_2020_2026_metrics.csv'
          if not p.exists(): raise SystemExit(0)
          x=pd.read_csv(p).set_index('variant')
          e=pd.read_csv(out/'e6_displacement_events.csv')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Strategy 9 E6 — exceptional leader displacement\n\n')
              f.write(f'Displacements: **{len(e)}**  \n')
              f.write('| Variant | CAGR | Max DD | Sharpe | Ending multiple |\n|---|---:|---:|---:|---:|\n')
              for v in ['ACCEPTED_CORE','E6_CORE','ACCEPTED_E3','E6_E3','SPY']:
                  r=x.loc[v]
                  f.write(f'| {v} | {r.cagr:.2%} | {r.max_drawdown:.2%} | {r.sharpe:.3f} | {r.ending_multiple:.3f} |\n')
          PY

      - name: Upload immutable E6 bundle
        if: ${{ always() && hashFiles('backtester-results/wc-e6-exceptional-leader-displacement/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wc-e6-exceptional-leader-displacement-${{ github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
