name: Wealth Core slot-funding correction v1

on:
  push:
    branches: [research/wealth-core-slot-funding-v1]
    paths:
      - '.github/workflows/wealth-core-slot-funding-v1.yml'
      - 'research/wealth-core-slot-funding-v1/apply_kernel_fix.py'
      - 'research/wealth-core-slot-funding-v1/apply_fixture_updates.py'
      - 'research/wealth-core-slot-funding-v1/remove_obsolete_golden_reservation_checks.py'
      - 'research/wealth-core-slot-funding-v1/apply_full_suite_fixture_updates.py'
      - 'research/wealth-core-slot-funding-v1/apply_semantic_binding.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wealth-core-slot-funding-v1
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: research/wealth-core-slot-funding-v1
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'

      - name: Apply exact pre-registered kernel patch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/wealth-core-slot-funding-v1"
          python research/wealth-core-slot-funding-v1/apply_kernel_fix.py
          python research/wealth-core-slot-funding-v1/apply_fixture_updates.py
          python research/wealth-core-slot-funding-v1/remove_obsolete_golden_reservation_checks.py
          python research/wealth-core-slot-funding-v1/apply_full_suite_fixture_updates.py
          python research/wealth-core-slot-funding-v1/apply_semantic_binding.py
          git diff --check
          python -m compileall -q shared/stock_strategy_shared/wealth_core tests/wealth_core

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.lock

      - name: Run slot-funding and adjacent kernel tests
        env:
          PYTHONPATH: shared:.
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/wealth_core/test_slot_funding.py \
            tests/wealth_core/test_state_machine.py \
            tests/wealth_core/test_adapter.py \
            tests/wealth_core/test_restore_economic_invariants.py \
            tests/wealth_core/test_restore_nested_economic_invariants.py \
            tests/wealth_core/test_pending_corporate_actions.py \
            tests/wealth_core/test_restart_matrix.py \
            tests/wealth_core/test_cooldown_timing.py \
            tests/wealth_core/test_dividends.py \
            tests/wealth_core/test_identity.py \
            tests/wealth_core/test_issuer_rebinding.py \
            tests/wealth_core/test_golden_fixture.py

      - name: Commit the tested kernel correction
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes to commit (already applied)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            shared/stock_strategy_shared/wealth_core/state.py \
            shared/stock_strategy_shared/wealth_core/state_restore_validation.py \
            shared/stock_strategy_shared/wealth_core/engine.py \
            shared/stock_strategy_shared/wealth_core/adapter.py \
            tests/wealth_core/test_state_machine.py \
            tests/wealth_core/test_slot_funding.py \
            tests/wealth_core/test_pending_corporate_actions.py \
            tests/wealth_core/test_restore_nested_economic_invariants.py \
            tests/wealth_core/test_restart_matrix.py \
            tests/wealth_core/test_cooldown_timing.py \
            tests/wealth_core/test_dividends.py \
            tests/wealth_core/test_identity.py \
            tests/wealth_core/test_issuer_rebinding.py \
            tests/wealth_core/test_golden_fixture.py
          git commit -m "wealth_core: bind corrected slot funding semantics"
          git push origin HEAD:research/wealth-core-slot-funding-v1

      - name: Run complete Wealth Core suite on corrected kernel
        env:
          PYTHONPATH: shared:.
        run: |
          set -euo pipefail
          python -m pytest -q tests/wealth_core

      - name: Run current prospective Wealth Core safety boundary
        env:
          PYTHONPATH: shared:.
        run: |
          set -euo pipefail
          python -m pytest -q -ra tests/wealth_core \
            --deselect tests/wealth_core/test_golden_fixture.py::test_the_result_matches_the_pinned_fixture \
            --deselect tests/wealth_core/test_golden_fixture.py::TestTheHashesAreInterpreterIndependent::test_the_run_hash_is_stable_in_a_FRESH_INTERPRETER \
            --deselect tests/wealth_core/test_performance_integration.py::test_measuring_does_not_move_the_pinned_result_hash \
            2>&1 | tee /tmp/wealth-core-prospective.txt
          if grep -Eq '(^|, )[0-9]+ (skipped|xfailed|xpassed)(,| in |$)' \
              /tmp/wealth-core-prospective.txt; then
            echo 'REFUSED: the prospective Wealth Core run had non-passes' >&2
            exit 1
          fi
