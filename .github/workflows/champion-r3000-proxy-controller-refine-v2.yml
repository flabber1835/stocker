name: Research Champion - Russell 3000 proxy controller refine v2
run-name: RESEARCH NOT CERTIFIED - R3000 proxy refinement v2 - ${{ github.sha }}

on:
  push:
    branches: [research/champion-market-risk-controller-robustness]
    paths:
      - '.github/workflows/champion-r3000-proxy-controller-refine-v2.yml'
      - 'backtester/research_champion_r3000_proxy_refine_v2.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  refine:
    name: RESEARCH NOT CERTIFIED - IWV Russell 3000 volatility plateau
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '${{ github.workspace }}/backtester'
      BASELINE_RUN_ID: '34007704385'
      BASELINE_ARTIFACT: 'champion-corrected-classification-34007704385-1'
      BASELINE_DAILY_SHA256: 'fbc8a18d2e6f01bbc5154fe359990633bbe93e28b4dbeba57da0be149f4811a8'
      IWV_RUN_ID: '34011322722'
      IWV_ARTIFACT: 'champion-r3000-proxy-screen-v2-34011322722-1'
      IWV_CUTOFF_SHA256: 'ec57f38bc206466524091c31d0e73edc5b51cb115cfba4e26b62d2c44f712ce9'
      OUT: 'market-risk-controller/r3000-proxy-refined-v2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/research_champion_market_risk_screen_v2.py
            /backtester/research_champion_r3000_proxy_screen_v2.py
            /backtester/research_champion_r3000_proxy_refine_v2.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install pinned analysis dependencies
        run: python -m pip install 'numpy==2.3.2' 'pandas==2.3.2'
      - name: Fetch authenticated witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/baseline /tmp/iwv
          gh run download "${BASELINE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${BASELINE_ARTIFACT}" --dir /tmp/baseline
          gh run download "${IWV_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${IWV_ARTIFACT}" --dir /tmp/iwv
          test "$(sha256sum /tmp/baseline/daily.csv.gz | cut -d' ' -f1)" = "${BASELINE_DAILY_SHA256}"
          test "$(sha256sum /tmp/iwv/iwv-cutoff-through-2026-07-31.csv | cut -d' ' -f1)" = "${IWV_CUTOFF_SHA256}"
      - name: Refine Russell 3000 volatility plateau
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          python backtester/research_champion_r3000_proxy_refine_v2.py \
            --baseline-daily /tmp/baseline/daily.csv.gz \
            --iwv-csv /tmp/iwv/iwv-cutoff-through-2026-07-31.csv \
            --output "${OUT}" | tee "${OUT}/refine-r3000-v2.log"
          cat "${OUT}/full-replay-shortlist-r3000-v2.csv"
      - name: Upload refinement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-r3000-proxy-refine-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-risk-controller/r3000-proxy-refined-v2/
          retention-days: 90
          if-no-files-found: error
