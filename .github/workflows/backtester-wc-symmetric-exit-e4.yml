name: Backtester - Wealth Core symmetric exit E4
run-name: Wealth Core symmetric exit E4 — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-wc-2018-diagnostic]
    paths:
      - '.github/workflows/backtester-wc-symmetric-exit-e4.yml'
      - 'backtester/experiment_wc_symmetric_exit_e4.py'
      - 'backtester/experiments/2026-09-04-architecture-defects/EXPERIMENT4_SYMMETRIC_EXIT.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT_DIR: backtester-results/wc-symmetric-exit-e4

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact experiment head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-wc-symmetric-exit-e4.yml
            /backtester/experiment_wc_symmetric_exit_e4.py
            /backtester/experiment_architecture_recovery_concordance_e3.py
            /backtester/calibrate_broad_simplified_breadth.py
            /backtester/experiment2_broad_independent_correlation.py
            /backtester/run_r1000_correlation_peers.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/experiments/2026-09-04-architecture-defects/EXPERIMENT4_SYMMETRIC_EXIT.md
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Compile experiment harness
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/experiment_wc_symmetric_exit_e4.py \
            backtester/experiment_architecture_recovery_concordance_e3.py \
            backtester/calibrate_broad_simplified_breadth.py \
            backtester/experiment2_broad_independent_correlation.py \
            backtester/run_research_ldrc_corrected_warmup_cash.py \
            backtester/run_research_ldrc_nonpit_vs_fullpit.py

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat sharadar/SFP/SHARADAR_SFP.zip.001 sharadar/SFP/SHARADAR_SFP.zip.002 sharadar/SFP/SHARADAR_SFP.zip.003 sharadar/SFP/SHARADAR_SFP.zip.004 > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Run fresh E3 control and E4 candidate replays
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m backtester.experiment_wc_symmetric_exit_e4 --output "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum -c E4_SHA256SUMS.txt)

      - name: Validate Experiment 4 contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          import pandas as pd

          out=Path(os.environ['OUT_DIR'])
          s=json.loads((out/'e4_summary.json').read_text())
          m=json.loads((out/'e4_manifest.json').read_text())
          metrics=pd.read_csv(out/'e4_comparison_metrics.csv',dtype={'window_years':str})
          periods=pd.read_csv(out/'e4_2018_2019_periods.csv')
          years=pd.read_csv(out/'e4_yearly_attribution.csv')

          assert s['status']=='PASS'
          assert s['evidence_label']=='WEALTH_CORE_E4_SYMMETRIC_DETERIORATION_EXIT_WITH_E3'
          assert s['experiment_budget_number']==4
          assert s['experiment_budget_consumed_after_completion']==4
          assert s['fresh_control_e3_parity']=='PASS'
          assert s['new_fitted_numeric_thresholds']==0
          assert s['candidate_deterioration_signals']>0
          assert s['candidate_deterioration_exits']>0

          c=m['causal_contract']
          assert c['fresh_chronological_control_replay'] is True
          assert c['fresh_chronological_candidate_replay'] is True
          assert c['same_pinned_market_inputs'] is True
          assert c['same_frozen_numerical_runtime'] is True
          assert c['pre_recorded_decisions_used_as_input'] is False
          assert c['decision_at_close_next_open_effect'] is True
          assert c['existing_stop_priority_preserved'] is True
          assert c['existing_cooldown_preserved'] is True
          assert c['existing_age119_review_preserved'] is True
          assert c['E3_sentinel_preserved'] is True

          assert len(metrics)==20
          assert set(metrics.variant)=={'CONTROL_E3','E4_SYMMETRIC_EXIT_E3'}
          assert set(metrics.surface)=={'E3_CONTROLLED','WEALTH_CORE'}
          assert metrics.cagr.map(math.isfinite).all()
          assert metrics.max_drawdown.map(math.isfinite).all()
          assert metrics.sharpe.map(math.isfinite).all()
          assert len(periods)==5
          assert len(years)>=20

          print(metrics.to_string(index=False))
          print(periods.to_string(index=False))
          print(years.to_string(index=False))
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Publish Experiment 4 summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['OUT_DIR'])
          if not (out/'e4_summary.json').exists():
              raise SystemExit(0)
          s=json.loads((out/'e4_summary.json').read_text())
          m=pd.read_csv(out/'e4_comparison_metrics.csv',dtype={'window_years':str})
          p=pd.read_csv(out/'e4_2018_2019_periods.csv')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Wealth Core Experiment 4 — symmetric deterioration exit\n\n')
              f.write('Economic budget after completed candidate replay: **4/10**.\n\n')
              f.write(f"Deterioration signals/executed exits: **{s['candidate_deterioration_signals']} / {s['candidate_deterioration_exits']}**.\n\n")
              f.write(f"Turnover buys/sells — E3 control: **{s['control_buys']}/{s['control_sells']}**; E4: **{s['candidate_buys']}/{s['candidate_sells']}**.\n\n")
              f.write('| Window | Variant | Surface | CAGR | Max DD | Sharpe | Multiple |\n')
              f.write('|---|---|---|---:|---:|---:|---:|\n')
              order={'5':0,'10':1,'15':2,'20':3,'max':4}; m['_o']=m.window_years.map(order)
              for r in m.sort_values(['_o','surface','variant']).itertuples(index=False):
                  f.write(f'| {r.window_years} | {r.variant} | {r.surface} | {r.cagr:.2%} | {r.max_drawdown:.2%} | {r.sharpe:.3f} | {r.ending_multiple:.2f}x |\n')
              f.write('\n### 2018-2019 attribution\n\n')
              f.write('| Period | Control E3 | E4 | E4-Control | Control Core | E4 Core |\n')
              f.write('|---|---:|---:|---:|---:|---:|\n')
              for r in p.itertuples(index=False):
                  f.write(f'| {r.period} | {r.control_e3_return:.2%} | {r.candidate_e4_return:.2%} | {r.candidate_minus_control:.2%} | {r.control_core_return:.2%} | {r.candidate_core_return:.2%} |\n')
          PY

      - name: Upload immutable Experiment 4 bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wc-symmetric-exit-e4-${{ github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
