name: Backtester - classify unreachable split conflicts

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-classify-unreachable-splits.yml'
      - 'backtester/diagnostics/classify_unreachable_split_conflicts.py'
      - 'backtester/causal_split_overrides.py'
      - 'backtester/data/causal-split-overrides-v1.json'
      - 'backtester/data/causal-split-overrides-v1.SHA256'
      - 'backtester/data/causal-split-overrides-v1.d/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-classify-unreachable-splits.yml
            /backtester/diagnostics/classify_unreachable_split_conflicts.py
            /backtester/causal_split_overrides.py
            /backtester/data/causal-split-overrides-v1.json
            /backtester/data/causal-split-overrides-v1.SHA256
            /backtester/data/causal-split-overrides-v1.d/**
            /backtester/experiments/2026-08-27-sector-abc/**
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_*.csv.gz
      - name: Record research identity
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_LAB_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_SPLIT_UNREACHABLE_OUTPUT=${GITHUB_WORKSPACE}/backtester-results/split-unreachable-classification.json" >> "${GITHUB_ENV}"
      - name: Check out exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared
      - name: Record exact main identity
        run: |
          test "$(git -C main-src rev-parse HEAD)" = "c502d077cae9c494f8b74a41ee8be7f40b25837d"
          echo "BACKTESTER_MAIN_SHA=c502d077cae9c494f8b74a41ee8be7f40b25837d" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install frozen runtime
        run: |
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
      - name: Classify economic reachability
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p backtester-results
          python backtester/diagnostics/classify_unreachable_split_conflicts.py 2>&1 | tee backtester-split-unreachable.log
      - name: Upload classification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-split-unreachable-${{ github.run_id }}
          path: |
            backtester-results/split-unreachable-classification.json
            backtester-split-unreachable.log
          if-no-files-found: warn
          retention-days: 30
