name: Backtester - triage price-domain split conflicts

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-triage-price-domain-splits.yml'
      - 'backtester/diagnostics/triage_price_domain_split_conflicts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    name: Triage 14 price-domain split conflicts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-triage-price-domain-splits.yml
            /backtester/diagnostics/triage_price_domain_split_conflicts.py
            /PIT input data/MANIFEST.csv
            /sharadar/SHARADAR_SEP_1998.csv.gz
            /sharadar/SHARADAR_SEP_2003.csv.gz
            /sharadar/SHARADAR_SEP_2007.csv.gz
            /sharadar/SHARADAR_SEP_2008.csv.gz
            /sharadar/SHARADAR_SEP_2009.csv.gz
            /sharadar/SHARADAR_SEP_2014.csv.gz
            /sharadar/SHARADAR_SEP_2016.csv.gz
            /sharadar/SHARADAR_SEP_2017.csv.gz
            /sharadar/SHARADAR_SEP_2019.csv.gz

      - name: Record research identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_LAB_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_SPLIT_TRIAGE_OUTPUT=${GITHUB_WORKSPACE}/backtester-results/price-domain-split-triage.json" >> "${GITHUB_ENV}"

      - name: Check out exact main split semantics
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            shared

      - name: Verify exact main identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "c502d077cae9c494f8b74a41ee8be7f40b25837d"
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Compile and run targeted triage
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/main-src/shared
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -m py_compile backtester/diagnostics/triage_price_domain_split_conflicts.py
          mkdir -p backtester-results
          python backtester/diagnostics/triage_price_domain_split_conflicts.py | tee backtester-price-domain-split-triage.log

      - name: Verify triage evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('backtester-results/price-domain-split-triage.json').read_text())
          if x.get('status')!='PASS' or x.get('target_count')!=14:
              raise SystemExit('invalid price-domain split triage')
          print('PASS target_count=14')
          PY

      - name: Upload triage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-price-domain-split-triage-${{ github.run_id }}
          path: |
            backtester-results/price-domain-split-triage.json
            backtester-price-domain-split-triage.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
