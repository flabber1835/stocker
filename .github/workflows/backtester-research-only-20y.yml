name: Backtester - research-only canonical PIT 20-year replay
run-name: Research-only canonical PIT 20-year replay — ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - research/backtester
    paths:
      - '.github/workflows/backtester-research-only-20y.yml'

permissions:
  contents: read

concurrency:
  group: backtester-research-only-20y-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    name: Canonical build + retained research replay
    if: github.ref_name == 'research/backtester'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CERTIFICATION_WARMUP_START: '2006-01-03'
      CERTIFICATION_MEASUREMENT_START: '2006-07-31'
      CERTIFICATION_END_SESSION: '2026-07-31'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out frozen research laboratory and historical authorities
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-research-only-20y.yml
            /backtester/run_research_strict_pit_20y.py
            /backtester/run_research_strict_pit_certification.py
            /backtester/strict_pit_metadata.py
            /backtester/canonical_pit_dataset.py
            /backtester/causal_split_overrides.py
            /backtester/causal_terminal_terms.py
            /backtester/historical_cash.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/run_ldrc_corrected_warmup_cash.py
            /backtester/run_ldrc_nonpit_vs_pit_certified.py
            /backtester/run_sector_ad_causal_terminal_terms_v2.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/causal-split-overrides-v1.json
            /backtester/data/causal-split-overrides-v1.SHA256
            /backtester/data/causal-split-overrides-v1.d/**
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /backtester/data/GS3M_1996-12_2007-05.csv
            /tests/backtester/test_canonical_pit_dataset.py
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_POSITIVE_EVIDENCE.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_MANUAL_ADMISSION_AUDIT.csv
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SFP/**

      - name: Record immutable branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/backtester"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Reconstruct frozen SFP archive
        shell: bash
        run: |
          set -euo pipefail
          parts=(sharadar/SFP/SHARADAR_SFP.zip.*)
          test "${#parts[@]}" -ge 1
          cat "${parts[@]}" > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null

      - name: Check out pinned runtime closure read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel/requirements.lock
            shared

      - name: Verify pinned runtime identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=887f479b15ad861313da666ad698034d3847121c
          test "$(git -C main-src rev-parse HEAD)" = "${EXPECTED}"
          test -z "$(git -C main-src status --porcelain)"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Compile and test research consumer contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/canonical_pit_dataset.py \
            backtester/run_research_strict_pit_certification.py \
            backtester/run_research_strict_pit_20y.py
          python -m unittest tests.backtester.test_canonical_pit_dataset -v
          env -u PYTHONPATH python backtester/run_research_strict_pit_20y.py --self-test-imports

      - name: Build full-window canonical PIT dataset
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_PATH=backtester-results/canonical-pit-research-20y
          mkdir -p backtester-results
          python backtester/canonical_pit_dataset.py build \
            --output "${CANONICAL_PATH}" \
            --warmup-start "${CERTIFICATION_WARMUP_START}" \
            --measurement-start "${CERTIFICATION_MEASUREMENT_START}" \
            --end "${CERTIFICATION_END_SESSION}" \
            2>&1 | tee canonical-pit-research-20y.log
          python backtester/canonical_pit_dataset.py validate \
            --dataset "${CANONICAL_PATH}"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/${CANONICAL_PATH}" >> "${GITHUB_ENV}"

      - name: Run retained research for the full 20 years
        shell: bash
        run: |
          set -euo pipefail
          python backtester/run_research_strict_pit_20y.py \
            --mode fullpit \
            --output backtester-results/research-only-20y \
            2>&1 | tee research-only-20y.log

      - name: Verify canonical consumption and quarterly reporting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          canonical = json.loads(Path(
              'backtester-results/canonical-pit-research-20y/manifest.json'
          ).read_text())
          research = json.loads(Path(
              'backtester-results/research-only-20y/summary.json'
          ).read_text())
          if canonical.get('status') != 'PASS':
              raise SystemExit('canonical dataset did not certify')
          if int(canonical['counts']['unresolved_corporate_actions']) != 0:
              raise SystemExit('canonical dataset retains unresolved corporate actions')
          if research.get('canonical_pit_dataset_hash') != canonical.get('dataset_hash'):
              raise SystemExit('research did not attest the canonical dataset hash')

          log = Path('research-only-20y.log').read_text()
          rows = re.findall(
              r'\[CERT_CAGR\] role=(research|spy) date=(\d{4}-\d{2}-\d{2}) cagr=([-+.0-9]+)',
              log,
          )
          dates = {}
          for role, date, cagr in rows:
              dates.setdefault(date, {})[role] = float(cagr)
          incomplete = [date for date, values in dates.items()
                        if set(values) != {'research', 'spy'}]
          if not dates or incomplete:
              raise SystemExit(f'incomplete quarterly output: {incomplete}')
          if 'phase=WARMUP cagr=N/A' not in log:
              raise SystemExit('warmup was not explicitly labelled')

          lines = [
              '## Research-only canonical PIT 20-year replay',
              '',
              f"Canonical dataset hash: `{canonical['dataset_hash']}`",
              '',
              '| Date | Research cumulative CAGR | SPY cumulative CAGR |',
              '|---|---:|---:|',
          ]
          for date in sorted(dates):
              values = dates[date]
              lines.append(
                  f"| {date} | {values['research']:.2%} | {values['spy']:.2%} |"
              )
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('\n'.join(lines) + '\n')
          print(f"RESEARCH 20Y PASS dataset_hash={canonical['dataset_hash']} quarters={len(dates)}")
          PY

      - name: Upload immutable research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-research-only-20y-${{ github.run_id }}
          path: |
            backtester-results/canonical-pit-research-20y/**
            backtester-results/research-only-20y/**
            canonical-pit-research-20y.log
            research-only-20y.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
