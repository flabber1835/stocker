name: PR3 apply lifecycle owner migration

on:
  push:
    branches:
      - 'fix/pr3-paper-test-canonical-owners-ci'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/pr3-paper-test-canonical-owners
          fetch-depth: 1
      - name: Migrate lifecycle monkeypatch ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          def rw(path, fn):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              p.write_text(fn(text), encoding='utf-8')

          def after(text, marker, addition):
              assert marker in text, marker
              return text if addition in text else text.replace(marker, marker + addition, 1)

          def replace_once(text, old, new):
              assert text.count(old) == 1, (old, text.count(old))
              return text.replace(old, new, 1)

          def activation(text):
              marker = 'from sentinel import authority, binding, handover, paper, schema  # noqa: E402\n'
              text = after(
                  text, marker,
                  'from sentinel.paper import (  # noqa: E402\n'
                  '    cash as paper_cash,\n'
                  '    execution as paper_execution,\n'
                  '    inspection as paper_inspection,\n'
                  '    preparation as paper_preparation,\n'
                  '    reconciliation_evidence as paper_reconciliation_evidence,\n'
                  '    recovery as paper_recovery,\n'
                  '    targets as paper_targets,\n'
                  '    validation as paper_validation,\n'
                  ')\n')

              fixture = '''    monkeypatch.setattr(paper, "require_certified", lambda _adapter: None)\n    monkeypatch.setattr(paper, "load_controller", lambda: CONFIG)\n    monkeypatch.setattr(\n        paper, "runtime_strategy_identity",\n        lambda _config, **_kwargs: dict(IDENTITY))\n    monkeypatch.setattr(\n        paper, "require_current_authority",\n        lambda *_args, **_kwargs: SimpleNamespace(\n            certificate_sha256=ROLLOUT_CERTIFICATE,\n            authorization_mode="PAPER_OBSERVATION_ONLY"))\n    monkeypatch.setattr(\n        paper.system_identity, "rehearsal_identity",\n        lambda: {"identity_hash": "test-runtime"})\n'''
              replacement = '''    monkeypatch.setattr(\n        paper_inspection, "require_certified", lambda _adapter: None)\n    monkeypatch.setattr(paper_preparation, "load_controller", lambda: CONFIG)\n    monkeypatch.setattr(\n        paper_preparation, "runtime_strategy_identity",\n        lambda _config, **_kwargs: dict(IDENTITY))\n    authority_result = lambda *_args, **_kwargs: SimpleNamespace(\n        certificate_sha256=ROLLOUT_CERTIFICATE,\n        authorization_mode="PAPER_OBSERVATION_ONLY")\n    for owner in (\n            paper_preparation, paper_validation, paper_execution, paper_recovery):\n        monkeypatch.setattr(owner, "require_current_authority", authority_result)\n    monkeypatch.setattr(\n        paper_preparation.system_identity, "rehearsal_identity",\n        lambda: {"identity_hash": "test-runtime"})\n'''
              text = replace_once(text, fixture, replacement)

              for name in ('load_window', 'load_causal_meta_history',
                           'load_published_session', 'advance_and_persist',
                           '_load_marks_and_tickers'):
                  text = text.replace(
                      f'monkeypatch.setattr(paper, "{name}"',
                      f'monkeypatch.setattr(paper_preparation, "{name}"')
                  text = text.replace(
                      f'monkeypatch.setattr(\n        paper, "{name}"',
                      f'monkeypatch.setattr(\n        paper_preparation, "{name}"')

              # This test invokes reconciliation_evidence._settled... directly,
              # so patch the exact binding resolved from that function's globals.
              text = text.replace(
                  'monkeypatch.setattr(paper, "_broker_cash_state_or_refuse", cash_state)',
                  'monkeypatch.setattr(\n        paper_reconciliation_evidence, "_broker_cash_state_or_refuse", cash_state)')

              # The remaining explicit authority override is inside an execution
              # test and must hit execute_paper_plan.__globals__.
              text = text.replace(
                  'monkeypatch.setattr(paper, "require_current_authority", refuse)',
                  'monkeypatch.setattr(\n            paper_execution, "require_current_authority", refuse)')

              module_refs = {
                  'system_identity': 'paper_preparation',
                  'readiness': 'paper_preparation',
                  'feed_store': 'paper_preparation',
                  'calendar': 'paper_preparation',
                  'load_concordance_parent': 'paper_preparation',
              }
              for name, owner in module_refs.items():
                  text = text.replace(f'paper.{name}', f'{owner}.{name}')

              direct = {
                  '_fresh_warmed_state': 'paper_preparation',
                  '_assert_concordance_witness_authority': 'paper_validation',
                  '_state_and_plan_or_refuse': 'paper_validation',
                  '_hash': 'paper_validation',
                  '_action_lookup': 'paper_targets',
                  '_target_action_lookup': 'paper_targets',
                  '_preopen_active_security_ids': 'paper_targets',
                  '_official_preopen_cutoff': 'paper_targets',
                  '_cash_authority_or_refuse': 'paper_cash',
                  '_settled_account_evidence_bracket': 'paper_reconciliation_evidence',
              }
              for name, owner in direct.items():
                  text = text.replace(f'paper.{name}', f'{owner}.{name}')
              return text

          rw('tests/sentinel/test_paper_activation.py', activation)

          def close_nav(text):
              marker = 'from sentinel import paper, trial, trial_close, trial_fills\n'
              text = after(
                  text, marker,
                  'from sentinel.paper import (\n'
                  '    cash as paper_cash,\n'
                  '    finalization as paper_finalization,\n'
                  '    preparation as paper_preparation,\n'
                  ')\n')

              # Finalization tests patch names that _finalize... actually resolves.
              for name in ('_record_due_close_nav_or_refuse',
                           '_record_due_fill_interval_or_refuse'):
                  text = text.replace(
                      f'monkeypatch.setattr(paper, "{name}"',
                      f'monkeypatch.setattr(paper_finalization, "{name}"')
                  text = text.replace(
                      f'monkeypatch.setattr(\n        paper, "{name}"',
                      f'monkeypatch.setattr(\n        paper_finalization, "{name}"')

              dead = '''    monkeypatch.setattr(\n        paper, "_target_action_lookup",\n        lambda *_: pytest.fail(\n            "finalizer recomputed corpus target actions instead of using its "\n            "validated pre-open view"))\n'''
              assert dead in text
              text = text.replace(dead, '', 1)

              prep_names = (
                  'assert_paper_url', '_require_certified_paper_broker',
                  'load_rollout_state', '_readiness_or_refuse',
                  'require_current_authority', '_guard_broker',
                  '_assert_deterministic_plan_id', '_target_action_lookup',
                  '_preopen_views_or_none', '_revalidate_preopen_authority_or_refuse',
                  '_clean_or_refuse', '_account_or_refuse',
                  '_broker_cash_state_or_refuse', '_cash_authority_or_refuse',
                  '_finalize_due_succeeded_cycle_or_refuse',
              )
              for name in prep_names:
                  text = text.replace(
                      f'monkeypatch.setattr(paper, "{name}"',
                      f'monkeypatch.setattr(paper_preparation, "{name}"')
                  text = text.replace(
                      f'monkeypatch.setattr(\n        paper, "{name}"',
                      f'monkeypatch.setattr(\n        paper_preparation, "{name}"')

              for name in ('schema', 'journal', 'publication', 'calendar',
                           'feed_store', 'catchup', 'trial', 'preopen_authority'):
                  text = text.replace(f'paper.{name}', f'paper_preparation.{name}')
              text = text.replace('paper.RolloutMode', 'paper_preparation.RolloutMode')
              text = text.replace('paper.target_reprojection',
                                  'paper_finalization.target_reprojection')
              text = text.replace('paper._record_due_close_nav_or_refuse',
                                  'paper_finalization._record_due_close_nav_or_refuse')
              text = text.replace('paper._record_due_fill_interval_or_refuse',
                                  'paper_finalization._record_due_fill_interval_or_refuse')
              text = text.replace('paper._finalize_due_succeeded_cycle_or_refuse',
                                  'paper_finalization._finalize_due_succeeded_cycle_or_refuse')
              text = text.replace('paper._cash_authority_or_refuse',
                                  'paper_cash._cash_authority_or_refuse')
              return text

          rw('tests/sentinel/test_paper_close_nav_gate.py', close_nav)

          def preopen(text):
              marker = 'from sentinel.core import catchup\n'
              text = after(
                  text, marker,
                  'from sentinel.paper import (\n'
                  '    recovery as paper_recovery,\n'
                  '    targets as paper_targets,\n'
                  ')\n')

              recovery_names = (
                  'assert_paper_url', '_require_certified_paper_broker',
                  'load_rollout_state', '_default_paper_strategy',
                  'require_current_authority', '_validate_automation_grant',
                  '_guard_broker', '_recovery_account_identity_or_refuse',
                  '_broker_cash_state_or_refuse', 'SessionState', '_action_lookup',
                  '_target_action_lookup', '_account_or_refuse',
                  '_cash_authority_or_refuse', '_settled_account_evidence_bracket',
                  '_target_projection_or_refuse',
              )
              for name in recovery_names:
                  text = text.replace(
                      f'monkeypatch.setattr(paper, "{name}"',
                      f'monkeypatch.setattr(paper_recovery, "{name}"')
                  text = text.replace(
                      f'monkeypatch.setattr(\n        paper, "{name}"',
                      f'monkeypatch.setattr(\n        paper_recovery, "{name}"')

              # The three shadow_target seams belong to direct targets tests.
              text = text.replace(
                  'monkeypatch.setattr(\n        paper, "shadow_target",',
                  'monkeypatch.setattr(\n        paper_targets, "shadow_target",')

              direct = (
                  '_preopen_active_security_ids', '_official_preopen_cutoff',
                  '_plan_deltas', '_provably_clean_empty_noop',
                  '_revalidate_preopen_authority_or_refuse',
                  '_target_projection_or_refuse',
              )
              for name in direct:
                  text = text.replace(f'paper.{name}', f'paper_targets.{name}')
              text = text.replace('paper.target_reprojection',
                                  'paper_targets.target_reprojection')
              text = text.replace('paper.feed_store', 'paper_recovery.feed_store')
              return text

          rw('tests/sentinel/test_preopen_paper_gate.py', preopen)

          def simplified(text):
              marker = 'from sentinel import paper\n'
              text = after(text, marker,
                           'from sentinel.paper import preparation as paper_preparation\n')
              return text.replace('paper._default_paper_strategy',
                                  'paper_preparation._default_paper_strategy')
          rw('tests/sentinel/test_issue209_simplified_ldrc_runtime.py', simplified)

          def runtime_regression(text):
              # Helper-owner batch migrated attribute accesses. These remaining
              # string-target monkeypatches exercise validation._validate_broker_grant.
              for name in ('load_rollout_state', 'load_controller',
                           'runtime_strategy_identity', '_readiness_or_refuse'):
                  text = text.replace(
                      f'monkeypatch.setattr(paper, "{name}"',
                      f'monkeypatch.setattr(paper_validation, "{name}"')
                  text = text.replace(
                      f'monkeypatch.setattr(\n        paper, "{name}"',
                      f'monkeypatch.setattr(\n        paper_validation, "{name}"')
              return text
          rw('tests/sentinel/test_runtime_regressions_137_148_149_150.py', runtime_regression)
          PY

          git diff --check
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tests/sentinel/test_paper_private_root_test_ownership.py')
          spec = importlib.util.spec_from_file_location('paper_guard', path)
          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)
          violations = []
          for candidate in sorted(guard.TESTS.rglob('*.py')):
              if candidate.resolve() == path.resolve():
                  continue
              violations.extend(guard._paper_root_violations(candidate))
          for violation in violations:
              print(violation)
          print(f'PR3_PRIVATE_ROOT_VIOLATIONS={len(violations)}')
          raise SystemExit(1 if violations else 0)
          PY

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add tests/sentinel/test_paper_activation.py \
            tests/sentinel/test_paper_close_nav_gate.py \
            tests/sentinel/test_preopen_paper_gate.py \
            tests/sentinel/test_issue209_simplified_ldrc_runtime.py \
            tests/sentinel/test_runtime_regressions_137_148_149_150.py
          git commit -m "test: migrate paper lifecycle monkeypatch owners"
          git push origin HEAD:codex/pr3-paper-test-canonical-owners
