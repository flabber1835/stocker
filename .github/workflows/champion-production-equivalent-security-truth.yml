name: Champion production-equivalent security truth
run-name: Champion security truth ledger - ${{ github.sha }}
on:
  push:
    branches: [research/champion-certification-economic-integrity]
    paths:
      - '.github/workflows/champion-production-equivalent-security-truth.yml'
      - 'backtester/build_production_equivalent_security_truth.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: champion-production-equivalent-security-truth-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Audit builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: audit-src
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            backtester/build_production_equivalent_security_truth.py
            research/champion-economic-integrity/PRODUCTION_EQUIVALENT_CLASSIFICATION_CONTRACT.md
      - name: Exact candidate classification authorities
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester/data/champion-best-effort-security-types-v1.csv
            backtester/data/champion-reviewed-security-types-v1.csv
            backtester/data/champion-historical-security-type-corrections-v1.csv
      - name: Original corrected-candidate path evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: flabber1835/stocker
          run-id: 34007704385
          name: champion-corrected-classification-34007704385-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Build truth hypothesis and contradiction queue
        run: |
          set -euo pipefail
          test "$(git -C audit-src rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C candidate-src rev-parse HEAD)" = ba74e79490beb8950611b1d17f5d124833b3d91e
          test -f candidate-evidence/strategy-path-worklist.csv
          mkdir -p security-truth
          python audit-src/backtester/build_production_equivalent_security_truth.py \
            --base candidate-src/backtester/data/champion-best-effort-security-types-v1.csv \
            --reviewed candidate-src/backtester/data/champion-reviewed-security-types-v1.csv \
            --corrections candidate-src/backtester/data/champion-historical-security-type-corrections-v1.csv \
            --worklist candidate-evidence/strategy-path-worklist.csv \
            --output security-truth
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('security-truth/SUMMARY.json').read_text())
          assert s['security_count']==1751
          assert s['manual_reviewed_security_count']==18
          assert s['historical_correction_rows']==3
          assert s['future_outcome_information_permitted'] is False
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
      - name: Commit immutable truth-worklist checkpoint
        run: |
          set -euo pipefail
          BRANCH=research/champion-certification-economic-integrity
          git -C audit-src fetch origin "refs/heads/${BRANCH}"
          git -C audit-src worktree add --detach "${GITHUB_WORKSPACE}/publish-src" FETCH_HEAD
          DEST=publish-src/research/champion-economic-integrity/security-truth
          mkdir -p "${DEST}"
          cp -a security-truth/. "${DEST}/"
          cd publish-src
          git sparse-checkout disable || true
          git add research/champion-economic-integrity/security-truth
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: retain production-equivalent security truth hypothesis and review queue'
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "# Security truth ledger built" >> "${GITHUB_STEP_SUMMARY}"
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          s=json.load(open('${GITHUB_WORKSPACE}/security-truth/SUMMARY.json'))
          print(f"\nSecurities: {s['security_count']}  \nTruth intervals: {s['truth_interval_count']}  \nReview queue: {s['review_queue_count']}  \nStatus: {s['status']}")
          PY
      - name: Preserve security-truth artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-production-equivalent-security-truth-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-truth/
          retention-days: 90
          if-no-files-found: error
