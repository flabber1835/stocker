name: Wealth Core golden re-pin candidate

on:
  push:
    branches:
      - fix/issue-359-post-merge-hardening

permissions:
  contents: read

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build certified Wealth Core test runtime
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          docker build --build-arg SOURCE_GIT_SHA="$tested_sha" -f Dockerfile.sentinel -t sentinel:ci -t sentinel:latest .
          docker build --build-arg SENTINEL_IMAGE=sentinel:ci --build-arg SOURCE_GIT_SHA="$tested_sha" -f Dockerfile.sentinel-test -t sentinel-test:ci .
      - name: Generate deterministic golden candidate
        run: |
          set -euo pipefail
          docker create --name wealth-core-repin --network none --entrypoint python sentinel-test:ci -m tests.wealth_core.repin_golden >/dev/null
          docker start -a wealth-core-repin
          mkdir -p /tmp/wealth-core-repin
          docker cp wealth-core-repin:/work/tests/wealth_core/fixtures/golden_wealth_core_v1.json /tmp/wealth-core-repin/golden_wealth_core_v1.json
          cat /tmp/wealth-core-repin/golden_wealth_core_v1.json
      - name: Retain golden candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wealth-core-golden-repin-${{ github.sha }}
          path: /tmp/wealth-core-repin/golden_wealth_core_v1.json
          if-no-files-found: error
          retention-days: 1
