name: Map 2007 IWV holdings with Russell abbreviations

on:
  workflow_dispatch:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - 'tools/pit_russell_2007_iwv_abbrev_map.py'
      - '.github/workflows/pit-russell-2007-iwv-abbrev-map.yml'

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/pit_russell_2007_iwv_name_map.py
            tools/pit_russell_2007_iwv_abbrev_map.py
            research/pit_russell_archive/annual_universes/russell3000_2006.csv
            research/pit_russell_archive/annual_universes/russell3000_2010.csv
            .github/workflows/pit-russell-2007-iwv-abbrev-map.yml
          sparse-checkout-cone-mode: false
      - name: Install Poppler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Run conservative abbreviation mapping
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/pit_russell_2007_iwv_abbrev_map.py \
            --russell-2006 research/pit_russell_archive/annual_universes/russell3000_2006.csv \
            --russell-2010 research/pit_russell_archive/annual_universes/russell3000_2010.csv \
            --output /tmp/iwv-2007-abbrev-map.json
