name: Research - Median-5 10bp pure Wealth Core
run-name: Median-5 10bp pure full-PIT - ${{ github.sha }}

on:
  push:
    branches: [research/median5-10bp-buffer-v1]
    paths:
      - '.github/workflows/median5-10bp-buffer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: median5-10bp-buffer-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'
  EXPECTED_BASE_NORMALIZED_SHA256: '435d42ac56f160a665588a997335a923c25110404972e262aa6e47058b3befde'
  EXPECTED_MEDIAN5_RAW_SHA256: '3b1bb12dc4f246dc855c135bce04f97cef79a38c9bd81245c543b733c492290b'

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Isolated experiment checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: audit-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/champion-economic-integrity
            research/median5-10bp-buffer-v1

      - name: Exact formal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27bb992087182c42c3c051e62bf837895f5d2ab7
          path: certified-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/strategy9-e3-broad-stability
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c

      - name: Exact classifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: backtester

      - name: Exact runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Verify pins and install frozen runtime
        run: |
          set -euo pipefail
          test "$(git -C audit-src rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C certified-src rev-parse HEAD)" = 27bb992087182c42c3c051e62bf837895f5d2ab7
          test "$(git -C candidate-src rev-parse HEAD)" = ba74e79490beb8950611b1d17f5d124833b3d91e
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" >> "$GITHUB_ENV"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "$GITHUB_ENV"

      - name: Stage exact corrected certification overlays
        run: |
          set -euo pipefail
          for f in champion_economic_prefix_audit.py champion_full_classification_control.py champion_security_truth_audit_v2.py champion_security_truth_overlay_v2.py champion_final_security_truth.py champion_final_truth_corpus_validator.py production_equivalent_economic_overlay.py champion_production_equivalent_build.py champion_production_equivalent_final_replay.py; do
            cp "audit-src/backtester/$f" certified-src/backtester/
          done
          cp audit-src/backtester/data/champion-security-truth-factual-batch-v2.json certified-src/backtester/data/
          cp candidate-src/backtester/research_champion_corrected_classification.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_best_effort_classification.py certified-src/backtester/
          for f in champion-best-effort-security-types-v1.csv champion-best-effort-security-types-v1-summary.json champion-reviewed-security-types-v1.csv champion-historical-security-type-corrections-v1.csv; do
            cp "candidate-src/backtester/data/$f" certified-src/backtester/data/
          done
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R audit-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/

      - name: Revalidate one-session dividends and classifier
        run: |
          set -euo pipefail
          cd certified-src
          python "${GITHUB_WORKSPACE}/audit-src/backtester/tests/test_production_equivalent_dividend_lag.py" | tee "${GITHUB_WORKSPACE}/dividend-regressions.log"
          python backtester/champion_final_truth_corpus_validator.py --manual research/champion-economic-integrity/security-truth/manual-review --output "${GITHUB_WORKSPACE}/final-corpus-validation.json"
          python backtester/champion_production_equivalent_build.py --candidate-root "${GITHUB_WORKSPACE}/candidate-src" --output "${GITHUB_WORKSPACE}/preflight" | tee "${GITHUB_WORKSPACE}/source-build.log"

      - name: Prove Median-5 control identity and 10bp-only variant
        run: |
          set -euo pipefail
          cd certified-src
          python - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('../audit-src/research/median5-10bp-buffer-v1').resolve()))
          from experiment_overlay import median5_only,apply_arm
          from backtester.production_equivalent_economic_overlay import assert_contract,assert_one_session_dividend_lag
          from backtester.champion_economic_prefix_audit import normalized_ast
          base=Path('../preflight/production-equivalent-generated.py').read_text()
          assert_contract(base); assert assert_one_session_dividend_lag(base)==1
          norm=hashlib.sha256(normalized_ast(base).encode()).hexdigest()
          if norm!='435d42ac56f160a665588a997335a923c25110404972e262aa6e47058b3befde': raise RuntimeError(norm)
          median=median5_only(base)
          median_sha=hashlib.sha256(median.encode()).hexdigest()
          if median_sha!='3b1bb12dc4f246dc855c135bce04f97cef79a38c9bd81245c543b733c492290b': raise RuntimeError('Median-5 control mismatch '+median_sha)
          variant=apply_arm(base,'MEDIAN5_10BP_PURE')
          assert_contract(variant); assert assert_one_session_dividend_lag(variant)==1
          for forbidden in ('native.step(','ctl.step(','ca.step(','cb.step(','apply_overlay(navs'):
              if forbidden in variant: raise RuntimeError('controller runtime remains: '+forbidden)
          Path('../preflight/median5-10bp-generated.py').write_text(variant)
          print('PASS base='+norm+' median5='+median_sha+' variant='+hashlib.sha256(variant.encode()).hexdigest())
          PY

      - name: Pull and verify immutable canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          POINTER=certified-src/backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "$PACKAGE" = ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE"
          cid=$(docker create "$PACKAGE" /bin/true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "$cid:/canonical-pit/." canonical-pit/
          docker rm "$cid"
          trap - EXIT
          PYTHONPATH="${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/certified-src" python certified-src/backtester/canonical_pit_package.py verify --pointer "$POINTER" --dataset canonical-pit > package-integrity.json

      - name: Run fresh 20-year Median-5 plus 10bp pure Wealth Core replay
        run: |
          set -euo pipefail
          cd certified-src
          RESEARCH_REPLAY_MODE=fullpit python "${GITHUB_WORKSPACE}/audit-src/research/median5-10bp-buffer-v1/experiment_runner.py" --arm MEDIAN5_10BP_PURE --candidate-root "${GITHUB_WORKSPACE}/candidate-src" --output "${GITHUB_WORKSPACE}/median5-10bp-output" 2>&1 | tee "${GITHUB_WORKSPACE}/median5-10bp.log"

      - name: Verify experiment result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('median5-10bp-output/RESULT.json').read_text())
          assert r['status']=='PASS_FRESH_CAUSAL_PIT_REPLAY'
          assert r['economic_scope']=='PURE_WEALTH_CORE_MEDIAN5_10BP_NO_EX3_NO_SENTINEL'
          assert r['economics']=={'slots':20,'entry_weight':0.05,'median5_lookback_sessions':5,'median5_hardened_front':3,'cash_buffer_basis_points':10.0,'whole_share_buys':True,'dividend_lag_sessions':1,'ex3':False,'sentinel':False}
          assert r['data']['sessions']==5032 and r['data']['pit'] is True and r['data']['prerecorded_decisions_used'] is False
          assert r['data']['canonical_pit_dataset_hash']=='5bdc6b39e4a8ec4d3e4cebba6091b18a8b4032b41509581366bb60c0d0600993'
          assert r['classification']['classification_expansion_required'] is False
          assert r['engine']['all_buy_share_amounts_integer'] is True
          t=r['engine']['buffer_telemetry']; assert t['reserve_violations']==0; assert t['minimum_cash']>=-1e-8
          out={'status':r['status'],'cagr20':r['windows']['20']['strategy']['cagr'],'maxdd20':r['windows']['20']['strategy']['max_drawdown'],'sharpe20':r['windows']['20']['strategy']['sharpe_daily_252'],'multiple20':r['windows']['20']['strategy']['ending_multiple'],'delta_vs_control':r['delta_vs_median5_control_20y'],'telemetry':t}
          Path('RUN_SUMMARY.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Preserve complete experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: median5-10bp-buffer-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            median5-10bp-output/
            median5-10bp.log
            RUN_SUMMARY.json
            preflight/
            package-integrity.json
            final-corpus-validation.json
            dividend-regressions.log
            source-build.log
            audit-src/research/median5-10bp-buffer-v1/EXPERIMENT.md
            audit-src/research/median5-10bp-buffer-v1/experiment_overlay.py
            audit-src/research/median5-10bp-buffer-v1/experiment_runner.py
          retention-days: 90
          if-no-files-found: warn
