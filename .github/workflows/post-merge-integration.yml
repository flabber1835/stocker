name: Post-merge integration sweep

on:
  push:
    branches:
      - stabilization/post-merge-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-merge-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certified-runtime-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Bind the exact integration head
        shell: bash
        run: |
          set -euo pipefail
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --check HEAD^

      - name: Build the exact certified runtime and test lens
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg SOURCE_GIT_SHA="$TESTED_SHA" \
            -f Dockerfile.sentinel -t sentinel:latest .
          docker build \
            --build-arg SENTINEL_RUNTIME_BASE_IMAGE=sentinel:latest \
            --build-arg SOURCE_GIT_SHA="$TESTED_SHA" \
            -f Dockerfile.sentinel-authorized \
            -t sentinel-authorized:integration .
          docker build \
            --build-arg SENTINEL_IMAGE=sentinel-authorized:integration \
            --build-arg SOURCE_GIT_SHA="$TESTED_SHA" \
            -f Dockerfile.sentinel-test -t sentinel-test:integration .

      - name: Run broker and shared integration boundaries offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none sentinel-test:integration \
            tests/broker tests/shared -q -ra 2>&1 | tee /tmp/broker-shared.txt
          if grep -Eq '(^|, )[0-9]+ (skipped|xfailed|xpassed)(,| in |$)' \
              /tmp/broker-shared.txt; then
            echo 'REFUSED: broker/shared sweep had non-passes' >&2
            exit 1
          fi

      - name: Run the full Wealth Core suite including pin-sensitive integration tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none sentinel-test:integration \
            tests/wealth_core -q -ra 2>&1 | tee /tmp/wealth-core-full.txt
          if grep -Eq '(^|, )[0-9]+ (skipped|xfailed|xpassed)(,| in |$)' \
              /tmp/wealth-core-full.txt; then
            echo 'REFUSED: full Wealth Core sweep had non-passes' >&2
            exit 1
          fi

      - name: Re-run cross-component restart recovery and execution seams offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none sentinel-test:integration \
            tests/sentinel/test_alpaca_restart_day_fence.py \
            tests/sentinel/test_production_outage_recovery.py \
            tests/sentinel/test_reboot_outage_recovery.py \
            tests/sentinel/test_outage_regenesis_integration.py \
            tests/sentinel/test_issue_185_crash_recovery.py \
            tests/sentinel/test_issue_185_full_reseed_recovery.py \
            tests/sentinel/test_issue_185_maintenance_integration.py \
            tests/sentinel/test_issue_185_retry_order.py \
            tests/sentinel/test_final_deploy_overnight_readiness.py \
            tests/sentinel/test_paper_activation.py \
            tests/sentinel/test_preopen_paper_gate.py \
            tests/sentinel/test_projection_and_executor.py \
            tests/sentinel/test_dual_reconciliation.py \
            tests/sentinel/test_system_simulation.py \
            -q -ra 2>&1 | tee /tmp/cross-component.txt
          if grep -Eq '(^|, )[0-9]+ (skipped|xfailed|xpassed)(,| in |$)' \
              /tmp/cross-component.txt; then
            echo 'REFUSED: cross-component sweep had non-passes' >&2
            exit 1
          fi

  repository-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the production Python and locked test closure
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: \
            -r sentinel/requirements.lock
          python -m pip install --require-hashes --only-binary=:all: \
            --no-deps -r tests/requirements.lock
          python -m pip check

      - name: Run repository infrastructure and filesystem regressions
        shell: bash
        env:
          PYTHONPATH: .:shared
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_high_impact_filesystem_remediation.py \
            tests/test_postgres_shm.py \
            -q -ra 2>&1 | tee /tmp/repository-infrastructure.txt
          if grep -Eq '(^|, )[0-9]+ (skipped|xfailed|xpassed)(,| in |$)' \
              /tmp/repository-infrastructure.txt; then
            echo 'REFUSED: repository infrastructure sweep had non-passes' >&2
            exit 1
          fi
