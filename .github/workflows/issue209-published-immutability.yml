name: Apply issue 209 published immutability

on:
  push:
    branches:
      - fix/issue-209-financial-grade-trial
    paths:
      - tools/issue209-published-immutability.py
      - .github/workflows/issue209-published-immutability.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/issue209-published-immutability.py
      - .github/workflows/issue209-published-immutability.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: fix/issue-209-financial-grade-trial
      - name: Apply and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue209-published-immutability.py
          git diff --check
          python -m compileall -q sentinel/feed/schema.py tests/sentinel/test_issue209_published_immutability.py
      - name: Commit production patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sentinel/feed/schema.py tests/sentinel/test_issue209_published_immutability.py
          git rm -- tools/issue209-published-immutability.py .github/workflows/issue209-published-immutability.yml
          git commit -m 'Make published strategy evidence immutable (#122 #209)'
          git pull --rebase origin fix/issue-209-financial-grade-trial
          git push origin HEAD:fix/issue-209-financial-grade-trial
