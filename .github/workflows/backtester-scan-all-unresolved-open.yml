name: Backtester - scan all unresolved opens

on:
  push:
    branches:
      - research/backtester
    paths:
      - '.github/workflows/backtester-scan-all-unresolved-open.yml'
      - 'backtester/diagnostics/scan_all_unresolved_open_boundaries.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtester-scan-all-unresolved-open-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan all unresolved-open boundaries
    if: github.ref_name == 'research/backtester'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out frozen research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-scan-all-unresolved-open.yml
            /backtester/diagnostics/scan_all_unresolved_open_boundaries.py
            /backtester/experiments/2026-08-27-sector-abc/**
            /backtester/run_sector_ad_causal_terminal_terms_v2.py
            /backtester/causal_terminal_terms.py
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_*.csv.gz
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt

      - name: Record research identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/backtester"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Check out exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Verify exact main identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "c502d077cae9c494f8b74a41ee8be7f40b25837d"
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"
          echo "BACKTESTER_LAB_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_SCAN_OUTPUT=${GITHUB_WORKSPACE}/backtester-results/all-unresolved-open-boundaries.json" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact main runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Compile scanner
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backtester/diagnostics/scan_all_unresolved_open_boundaries.py
          python -m py_compile backtester/run_sector_ad_causal_terminal_terms_v2.py
          python -m py_compile backtester/causal_terminal_terms.py
          python -m py_compile backtester/experiments/2026-08-27-sector-abc/run.py

      - name: Scan full chronological A path
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          BACKTESTER_PROGRESS_INTERVAL_SESSIONS: '252'
        run: |
          set -euo pipefail
          rm -rf backtester-results
          python backtester/diagnostics/scan_all_unresolved_open_boundaries.py \
            --lab-root . --main-root main-src \
            --output backtester-results/scanner-discarded-run \
            2>&1 | tee backtester-scan-all-unresolved-open.log

      - name: Verify scanner evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('backtester-results/all-unresolved-open-boundaries.json')
          x = json.loads(p.read_text())
          if x.get('status') != 'PASS':
              raise SystemExit(f"scanner failed: {x.get('status')}")
          if x.get('diagnostic_only') is not True:
              raise SystemExit('scanner diagnostic-only flag missing')
          if x.get('fresh_chronological_replay') is not True:
              raise SystemExit('scanner fresh replay flag missing')
          if x.get('a_production_transitions') != x.get('collapsed_second_arm_transitions'):
              raise SystemExit('A-only collapse count mismatch')
          print(json.dumps({
              'status':'PASS',
              'boundaries':x.get('unresolved_boundary_count'),
              'first_records':(x.get('records') or [])[:10],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-scan-all-unresolved-open-${{ github.run_id }}
          path: |
            backtester-results/all-unresolved-open-boundaries.json
            backtester-scan-all-unresolved-open.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
