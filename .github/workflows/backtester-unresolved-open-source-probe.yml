name: Backtester - unresolved open source probe

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-unresolved-open-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe CIT/Tyco frozen source economics
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pinned research source inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_2001.csv.gz
            /PIT input data/MANIFEST.csv

      - name: Probe exact Tyco identity and frozen raw prices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, hashlib, io, json, zipfile
          from pathlib import Path

          sep_path = Path('sharadar/SHARADAR_SEP_2001.csv.gz')
          tickers_path = Path('sharadar/SHARADAR_TICKERS.zip')
          manifest = {}
          with Path('PIT input data/MANIFEST.csv').open(newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  manifest[row['file']] = row
          pin = manifest['SEP_2001_PIT_ONLY.csv.gz']
          digest = hashlib.sha256(sep_path.read_bytes()).hexdigest()
          if digest != pin['source_sha256']:
              raise SystemExit(f'raw SEP hash mismatch: {digest} != {pin["source_sha256"]}')

          def norm_sid(value):
              try:
                  return str(int(float(str(value).strip())))
              except Exception:
                  return str(value).strip()

          with zipfile.ZipFile(tickers_path) as zf:
              members = [n for n in zf.namelist() if n.lower().endswith('.csv')]
              if len(members) != 1:
                  raise SystemExit(f'unexpected TICKERS members: {members}')
              with zf.open(members[0]) as raw:
                  ticker_rows = list(csv.DictReader(io.TextIOWrapper(raw, encoding='utf-8', newline='')))

          sep_meta = [r for r in ticker_rows if str(r.get('table','')) == 'SEP']
          tyco_meta = []
          by_ticker = {}
          for r in sep_meta:
              ticker = str(r.get('ticker') or '').strip()
              if ticker:
                  by_ticker.setdefault(ticker, []).append(r)
              name = str(r.get('name') or '').upper()
              if ticker == 'TYC' or ('TYCO' in name and ticker):
                  tyco_meta.append({k: r.get(k) for k in (
                      'permaticker','ticker','name','firstpricedate','lastpricedate',
                      'relatedtickers','category','sector','exchange','isdelisted') if k in r})

          def resolve(ticker, date):
              candidates = by_ticker.get(ticker, [])
              active, all_ids = set(), set()
              for r in candidates:
                  sid = norm_sid(r.get('permaticker'))
                  if not sid:
                      continue
                  all_ids.add(sid)
                  first = str(r.get('firstpricedate') or '0001-01-01')[:10]
                  last = str(r.get('lastpricedate') or '9999-12-31')[:10]
                  if first <= date <= last:
                      active.add(sid)
              if len(active) == 1:
                  return next(iter(active))
              if not active and len(all_ids) == 1:
                  return next(iter(all_ids))
              return None

          wanted_dates = {'2001-05-31', '2001-06-01', '2001-06-04'}
          raw_rows = []
          with gzip.open(sep_path, 'rt', encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              for r in reader:
                  ticker = str(r.get('ticker') or '').strip()
                  date = str(r.get('date') or '')[:10]
                  if ticker == 'TYC' and date in wanted_dates:
                      rr = {k: r.get(k) for k in ('ticker','date','open','high','low','close','volume','closeadj','closeunadj') if k in r}
                      rr['resolver_sid'] = resolve(ticker, date)
                      raw_rows.append(rr)

          payload = {
              'schema': 'backtester.cit-tyco-source-probe/1',
              'raw_sep_sha256': digest,
              'raw_sep_pinned_sha256': pin['source_sha256'],
              'tyco_tickers_rows': tyco_meta,
              'tyc_raw_rows': raw_rows,
          }
          Path('cit-tyco-source-probe.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload source probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cit-tyco-source-probe-${{ github.run_id }}
          path: cit-tyco-source-probe.json
          retention-days: 30
