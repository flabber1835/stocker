name: Step 4 decomposition payload repair

on:
  push:
    branches:
      - codex/step-4-paper-lifecycle-decomposition
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract and verify committed generator payload
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = '6507b27416abd6e90e0dc1ae5635581a74275525b2452face41005e7c614dca4'
          workflow = Path('.github/workflows/step4-paper-lifecycle-inventory.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "<<'PAYLOAD'\n"
          payload = text.split(marker, 1)[1].split('\n          PAYLOAD', 1)[0]
          normalized = ''.join(payload.split())
          print('committed_payload_length =', len(normalized))
          print('committed_payload_sha256 =', sha256(normalized.encode()).hexdigest())

          if sha256(normalized.encode()).hexdigest() != expected:
              if len(normalized) != 9581:
                  raise SystemExit('encoded generator has an unexpected shape')
              repaired = None
              for index in range(len(normalized)):
                  candidate = normalized[:index] + normalized[index + 1:]
                  if sha256(candidate.encode()).hexdigest() == expected:
                      repaired = candidate
                      print('removed_extra_character_index =', index)
                      print('removed_extra_character =', repr(normalized[index]))
                      break
              if repaired is None:
                  raise SystemExit('single-character payload repair did not reproduce the pinned hash')
              normalized = repaired

          if len(normalized) != 9580:
              raise SystemExit('repaired generator length mismatch')
          if sha256(normalized.encode()).hexdigest() != expected:
              raise SystemExit('repaired generator hash mismatch')
          Path('/tmp/step4_decompose_paper.py.gz.b64').write_text(
              normalized, encoding='ascii')
          PY
          base64 --decode /tmp/step4_decompose_paper.py.gz.b64 | gzip --decompress > /tmp/step4_decompose_paper.py
          echo "e763f6fb93ee1ec6afc72ce0ed67a022ea1a4153eee6f37d0d4e4debba346578  /tmp/step4_decompose_paper.py" | sha256sum --check
          python -m py_compile /tmp/step4_decompose_paper.py

      - name: Generate cohesive package and equivalence proof
        run: python /tmp/step4_decompose_paper.py

      - name: Verify generated source
        run: |
          test ! -e sentinel/paper.py
          test -f sentinel/paper/__init__.py
          test -f docs/paper-lifecycle-equivalence.json
          test -f tests/sentinel/test_paper_package_architecture.py
          python -m compileall -q sentinel/paper tests/sentinel/test_paper_package_architecture.py
          python -m json.tool docs/paper-lifecycle-equivalence.json >/dev/null
          git diff --check

      - name: Remove one-time generation machinery
        run: |
          rm -f tools/step4_paper_lifecycle_inventory.py
          rm -f artifacts/paper-lifecycle-responsibility-map.json
          rm -f .github/workflows/step4-paper-lifecycle-inventory.yml
          rm -f .github/workflows/step4-decompose-repair.yml

      - name: Commit lifecycle decomposition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(paper): decompose lifecycle modules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
