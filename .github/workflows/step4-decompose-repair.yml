name: Step 4 verified lifecycle decomposition

on:
  push:
    branches:
      - codex/step-4-paper-lifecycle-decomposition
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and assemble generator payload
        shell: bash
        run: |
          set -euo pipefail
          echo "47564b6f746b12659b00999d4e4e6def49ce8afc00b54d7bd70247746d1ee29b  tools/step4_payload/part00" | sha256sum --check
          echo "4b6bad768345c6f6a19f150cf8cfff1aa8916440ab84816829514a1f57d379c1  tools/step4_payload/part01" | sha256sum --check
          echo "b0207b996e969a62d1325d2519d699f30c5de5dbc07515dfc14750d4d6e55eca  tools/step4_payload/part02" | sha256sum --check
          echo "6d8be24da742987f0759879714ce4fa0d8fb933f771ee06a971ff022ec35de89  tools/step4_payload/part03" | sha256sum --check
          echo "61b1e04d20fabcb0c2062f91a70061a7aa6ac2c905f615acfd2e3636ee0f1eff  tools/step4_payload/part04" | sha256sum --check
          echo "ff190ecd9ced584fc7da15bbc8c38c1de1445792cbd072c2e75910acb4aec7ac  tools/step4_payload/part05" | sha256sum --check
          echo "015830171dd1e0592979bffb1d0e37ef5dac5c7ece95495bc8bc87090f389fd4  tools/step4_payload/part06" | sha256sum --check
          cat tools/step4_payload/part00 \
              tools/step4_payload/part01 \
              tools/step4_payload/part02 \
              tools/step4_payload/part03 \
              tools/step4_payload/part04 \
              tools/step4_payload/part05 \
              tools/step4_payload/part06 \
              > /tmp/step4_decompose_paper.py.gz.b64
          test "$(wc -c < /tmp/step4_decompose_paper.py.gz.b64)" = "9580"
          echo "6507b27416abd6e90e0dc1ae5635581a74275525b2452face41005e7c614dca4  /tmp/step4_decompose_paper.py.gz.b64" | sha256sum --check
          base64 --decode /tmp/step4_decompose_paper.py.gz.b64 \
            | gzip --decompress > /tmp/step4_decompose_paper.py
          echo "e763f6fb93ee1ec6afc72ce0ed67a022ea1a4153eee6f37d0d4e4debba346578  /tmp/step4_decompose_paper.py" | sha256sum --check
          python -m py_compile /tmp/step4_decompose_paper.py

      - name: Generate cohesive package and equivalence proof
        run: python /tmp/step4_decompose_paper.py

      - name: Verify generated source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e sentinel/paper.py
          test -f sentinel/paper/__init__.py
          test -f docs/paper-lifecycle-equivalence.json
          test -f tests/sentinel/test_paper_package_architecture.py
          python -m compileall -q sentinel/paper tests/sentinel/test_paper_package_architecture.py
          python -m json.tool docs/paper-lifecycle-equivalence.json >/dev/null
          git diff --check

      - name: Remove one-time generation machinery
        run: |
          rm -rf tools/step4_payload
          rm -f tools/step4_paper_lifecycle_inventory.py
          rm -f artifacts/paper-lifecycle-responsibility-map.json
          rm -f .github/workflows/step4-paper-lifecycle-inventory.yml
          rm -f .github/workflows/step4-decompose-repair.yml

      - name: Commit lifecycle decomposition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(paper): decompose lifecycle modules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
