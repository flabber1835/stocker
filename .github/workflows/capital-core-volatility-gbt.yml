name: Core volatility original GBT cash continuation
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/core-volatility-gbt-request.json']
permissions:
  contents: read
  actions: read
jobs:
  followup:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    concurrency:
      group: core-volatility-gbt-10-VOL075
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            research/capital_risk
            .github/workflows
            docs/core-volatility-penalty-experiment.md
          sparse-checkout-cone-mode: false
      - name: Prepare isolated research capacity
        timeout-minutes: 6
        run: 'python3 -B research/capital_risk/ephemeral_runner_capacity.py --output "$GITHUB_WORKSPACE/artifacts/capital-risk/ephemeral-runner-capacity.json"'
      - name: Install locked transfer dependencies
        timeout-minutes: 4
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/wwe-transfer-requirements.lock
      - name: Verify exact own predecessor and source closure
        timeout-minutes: 2
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/core_volatility_gbt_job.py --probe'
      - name: Authenticate frozen inputs and offline runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/core-volatility-staging.json'
      - name: Qualify original GBT cash fact and continue own book
        timeout-minutes: 266
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/core_volatility_gbt_job.py --arm VOL075 --staging artifacts/capital-risk/core-volatility-staging.json --capacity artifacts/capital-risk/ephemeral-runner-capacity.json --output artifacts/capital-risk/core-volatility-receipt.json'
      - name: Preserve stopped encrypted evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-volatility-gbt-VOL075-${{ github.sha }}
          path: |
            artifacts/capital-risk/ephemeral-runner-capacity.json
            artifacts/capital-risk/core-volatility-staging.json
            artifacts/capital-risk/core-volatility-receipt.json
            artifacts/capital-risk/core-volatility-*.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
