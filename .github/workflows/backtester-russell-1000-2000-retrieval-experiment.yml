name: Backtester - Russell 1000+2000 retrieval experiment
run-name: Russell 1000+2000 2006-2026 retrieval experiment — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-pit-corpus-recovery-v4]
    paths:
      - '.github/workflows/backtester-russell-1000-2000-retrieval-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtester-russell-1000-2000-retrieval-experiment
  cancel-in-progress: true

jobs:
  retrieve:
    name: Probe 2006-2026 IWB/IWM late-June holdings
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact experiment source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Retrieve and validate historical holdings
        env:
          OUT: backtester-results/russell-1000-2000-retrieval-experiment
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/raw"
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import os
          import re
          import time
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          OUT = Path(os.environ['OUT'])
          RAW = OUT / 'raw'
          UA = 'Mozilla/5.0 (compatible; stocker-russell-retrieval-experiment/2.0)'
          FUNDS = {
              'IWB': {'product_id': '239707', 'slug': 'us/products/239707/ishares-russell-1000-etf', 'min_equities': 850},
              'IWM': {'product_id': '239710', 'slug': 'us/products/239710/ishares-russell-2000-etf', 'min_equities': 1500},
          }
          PRODUCT_DATA_URLS = (
              'https://www.ishares.com/varnish-api/blk-one01-product-data/product-data/api/v2/get-product-data',
              'https://www.blackrock.com/varnish-api/blk-one01-product-data/product-data/api/v2/get-product-data',
          )
          LEGACY_AJAX = '1467271812596.ajax'

          def http_get(url, *, timeout=12):
              req = Request(url, headers={
                  'User-Agent': UA,
                  'Accept': 'application/json,text/csv,text/plain,text/html,*/*',
                  'Referer': 'https://www.ishares.com/',
              })
              with urlopen(req, timeout=timeout) as r:
                  return r.read(), r.headers.get_content_type(), getattr(r, 'status', 200)

          def decode_payload(payload):
              for enc in ('utf-8-sig', 'utf-16', 'latin-1'):
                  try:
                      return payload.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return payload.decode('utf-8', errors='replace')

          def candidate_dates(year):
              d = date(year, 6, 30)
              out = []
              for lookback in range(8):
                  candidate = d - timedelta(days=lookback)
                  if candidate.weekday() < 5 and candidate not in out:
                      out.append(candidate)
              return out

          def parse_date(value):
              if value is None:
                  raise ValueError('missing as-of date')
              if isinstance(value, dict):
                  value = value.get('raw') or value.get('value') or value.get('formattedValue')
              if isinstance(value, list):
                  value = value[0] if value else None
              text = str(value or '').strip()
              if re.fullmatch(r'\d{8}', text):
                  return datetime.strptime(text, '%Y%m%d').date()
              for fmt in ('%b %d, %Y', '%B %d, %Y', '%Y-%m-%d', '%m/%d/%Y'):
                  try:
                      return datetime.strptime(text, fmt).date()
                  except ValueError:
                      pass
              raise ValueError(f'unparseable as-of date: {text!r}')

          def data_point_values(data_points, name):
              point = data_points.get(name) if isinstance(data_points, dict) else None
              if not isinstance(point, dict):
                  return []
              values = point.get('value')
              if isinstance(values, list):
                  return values
              values = point.get('formattedValue')
              return values if isinstance(values, list) else []

          def parse_product_data(payload, expected_year, ticker):
              text = decode_payload(payload).lstrip('\ufeff').strip()
              if text.startswith('<'):
                  raise ValueError('product-data endpoint returned HTML')
              obj = json.loads(text)
              try:
                  points = obj['componentsByNameMap']['holdings']['containersByNameMap']['all']['dataPointsByNameMap']
              except (KeyError, TypeError) as exc:
                  raise ValueError('missing product-data holdings map') from exc
              asof_point = points.get('asOfDate') or {}
              asof = parse_date(asof_point.get('value') or asof_point.get('formattedValue'))
              if asof.year != expected_year or not (date(expected_year, 6, 20) <= asof <= date(expected_year, 7, 5)):
                  raise ValueError(f'wrong as-of date returned: {asof.isoformat()}')
              tickers = data_point_values(points, 'ticker')
              names = data_point_values(points, 'issueName')
              asset_classes = data_point_values(points, 'assetClass')
              valid = [str(v or '').strip() for v in tickers if str(v or '').strip() not in ('', '-')]
              if asset_classes and len(asset_classes) >= len(tickers):
                  equities = sum(
                      1 for i, symbol in enumerate(tickers)
                      if str(symbol or '').strip() not in ('', '-') and str(asset_classes[i] or '').strip().lower() == 'equity'
                  )
              else:
                  equities = len(valid)
              if equities < FUNDS[ticker]['min_equities']:
                  raise ValueError(f'too few equity rows: {equities}')
              return {
                  'asof_date': asof.isoformat(),
                  'total_rows': len(tickers),
                  'equity_rows': equities,
                  'named_rows': sum(1 for x in names if str(x or '').strip()),
              }

          def product_data_url(base, ticker, d):
              params = {
                  'appType': 'PRODUCT_PAGE',
                  'appSubType': 'ISHARES',
                  'targetSite': 'us-ishares',
                  'locale': 'en_US',
                  'portfolioId': FUNDS[ticker]['product_id'],
                  'userType': 'individual',
                  'component': 'holdings',
                  'asOfDate': d.strftime('%Y%m%d'),
              }
              return base + '?' + urlencode(params)

          def retrieve_product_data(year, ticker):
              errors = []
              for d in candidate_dates(year):
                  for base in PRODUCT_DATA_URLS:
                      url = product_data_url(base, ticker, d)
                      try:
                          payload, content_type, status = http_get(url)
                          parsed = parse_product_data(payload, year, ticker)
                          sha = hashlib.sha256(payload).hexdigest()
                          target = RAW / f"{ticker}_{parsed['asof_date'].replace('-', '')}_product_data_v2.json"
                          target.write_bytes(payload)
                          return {
                              'status': 'PASS', 'route': 'blackrock_product_data_v2',
                              'requested_date': d.isoformat(), 'source_date': parsed['asof_date'],
                              'source_url': url, 'http_status': status, 'content_type': content_type,
                              'sha256': sha, 'bytes': len(payload), 'total_rows': parsed['total_rows'],
                              'equity_rows': parsed['equity_rows'], 'named_rows': parsed['named_rows'],
                              'artifact_file': str(target.relative_to(OUT)), 'errors_before_success': errors,
                          }
                      except (HTTPError, URLError, TimeoutError, ValueError, OSError, json.JSONDecodeError) as exc:
                          errors.append({'date': d.isoformat(), 'host': base.split('/')[2], 'error': f'{type(exc).__name__}: {exc}'})
                  time.sleep(0.05)
              return {'status': 'FAIL', 'route': 'blackrock_product_data_v2', 'errors': errors}

          def parse_legacy_csv(payload, expected_year, ticker):
              text = decode_payload(payload)
              if text.lstrip().startswith('<'):
                  raise ValueError('legacy endpoint returned HTML')
              rows = list(csv.reader(io.StringIO(text.lstrip('\ufeff'))))
              asof = None
              for row in rows[:25]:
                  if len(row) >= 2 and row[0].strip() == 'Fund Holdings as of':
                      asof = parse_date(row[1])
                      break
              if asof is None:
                  raise ValueError('missing Fund Holdings as of metadata')
              if asof.year != expected_year or not (date(expected_year, 6, 20) <= asof <= date(expected_year, 7, 5)):
                  raise ValueError(f'wrong as-of date returned: {asof.isoformat()}')
              header_i = None
              header = None
              for i, row in enumerate(rows):
                  normalized = [c.strip() for c in row]
                  if normalized and normalized[0] == 'Ticker' and 'Name' in normalized:
                      header_i, header = i, normalized
                      break
              if header_i is None:
                  raise ValueError('holdings CSV header missing')
              frame = [dict(zip(header, r + [''] * max(0, len(header)-len(r)))) for r in rows[header_i+1:] if r]
              equities = sum(1 for r in frame if str(r.get('Asset Class','')).strip().lower() == 'equity')
              if equities < FUNDS[ticker]['min_equities']:
                  raise ValueError(f'too few equity rows: {equities}')
              return {'asof_date': asof.isoformat(), 'total_rows': len(frame), 'equity_rows': equities,
                      'named_rows': sum(1 for r in frame if str(r.get('Name','')).strip())}

          def retrieve_legacy(year, ticker):
              errors = []
              for d in candidate_dates(year):
                  params = urlencode({'fileType': 'csv', 'tab': 'all', 'asOfDate': d.strftime('%Y%m%d')})
                  url = f"https://www.ishares.com/{FUNDS[ticker]['slug']}/{LEGACY_AJAX}?{params}"
                  try:
                      payload, content_type, status = http_get(url)
                      parsed = parse_legacy_csv(payload, year, ticker)
                      sha = hashlib.sha256(payload).hexdigest()
                      target = RAW / f"{ticker}_{parsed['asof_date'].replace('-', '')}_legacy.csv"
                      target.write_bytes(payload)
                      return {
                          'status': 'PASS', 'route': 'ishares_legacy_csv',
                          'requested_date': d.isoformat(), 'source_date': parsed['asof_date'],
                          'source_url': url, 'http_status': status, 'content_type': content_type,
                          'sha256': sha, 'bytes': len(payload), 'total_rows': parsed['total_rows'],
                          'equity_rows': parsed['equity_rows'], 'named_rows': parsed['named_rows'],
                          'artifact_file': str(target.relative_to(OUT)), 'errors_before_success': errors,
                      }
                  except (HTTPError, URLError, TimeoutError, ValueError, OSError) as exc:
                      errors.append({'date': d.isoformat(), 'error': f'{type(exc).__name__}: {exc}'})
                  time.sleep(0.05)
              return {'status': 'FAIL', 'route': 'ishares_legacy_csv', 'errors': errors}

          def retrieve_fund(year, ticker):
              v2 = retrieve_product_data(year, ticker)
              if v2['status'] == 'PASS':
                  return v2
              legacy = retrieve_legacy(year, ticker)
              if legacy['status'] == 'PASS':
                  legacy['product_data_errors'] = v2.get('errors', [])
                  return legacy
              return {'status': 'FAIL', 'route': 'none', 'product_data_errors': v2.get('errors', []), 'legacy_errors': legacy.get('errors', [])}

          def retrieve_sec_combined_source(year):
              result = {'status': 'FAIL', 'route': 'sec_edgar_nq', 'candidates': []}
              index_url = f'https://www.sec.gov/Archives/edgar/full-index/{year}/QTR3/master.idx'
              result['index_url'] = index_url
              try:
                  payload, _, _ = http_get(index_url)
                  candidates = []
                  for line in decode_payload(payload).splitlines():
                      parts = line.split('|')
                      if len(parts) != 5:
                          continue
                      cik, name, form, filed, path = parts
                      if cik == '1100663' and name.upper() == 'ISHARES TRUST' and form in ('N-Q', 'NPORT-P'):
                          candidates.append({'filed': filed, 'form': form, 'path': path})
                  result['candidates'] = candidates
                  for row in candidates:
                      url = 'https://www.sec.gov/Archives/' + row['path']
                      try:
                          filing, ctype, status = http_get(url, timeout=30)
                      except Exception as exc:
                          row['fetch_error'] = f'{type(exc).__name__}: {exc}'
                          continue
                      upper = decode_payload(filing).upper().replace('&NBSP;', ' ')
                      has_iwb = 'RUSSELL 1000 INDEX FUND' in upper or 'RUSSELL 1000 ETF' in upper
                      has_iwm = 'RUSSELL 2000 INDEX FUND' in upper or 'RUSSELL 2000 ETF' in upper
                      period_tokens = (f'JUNE 30, {year}', f'06/30/{year}', f'{year}-06-30')
                      has_period = any(token in upper for token in period_tokens)
                      row.update({'source_url': url, 'http_status': status, 'content_type': ctype,
                                  'bytes': len(filing), 'has_iwb': has_iwb, 'has_iwm': has_iwm, 'has_period': has_period})
                      if has_iwb and has_iwm and has_period:
                          sha = hashlib.sha256(filing).hexdigest()
                          target = RAW / f'SEC_{year}_IWB_IWM_combined_{row["form"]}.txt'
                          target.write_bytes(filing)
                          result.update({'status': 'PASS', 'source_url': url, 'source_date': f'{year}-06-30',
                                         'filing_date': row['filed'], 'form': row['form'], 'sha256': sha,
                                         'bytes': len(filing), 'artifact_file': str(target.relative_to(OUT))})
                          return result
                  return result
              except Exception as exc:
                  result['error'] = f'{type(exc).__name__}: {exc}'
                  return result

          detail = {'schema': 'stocker.russell-1000-2000-retrieval-experiment/2', 'years': {}}
          for year in range(2006, 2027):
              y = detail['years'][str(year)] = {}
              print(f'=== {year} ===', flush=True)
              for ticker in ('IWB','IWM'):
                  r = retrieve_fund(year, ticker)
                  y[ticker] = r
                  print(ticker, r['status'], r.get('route'), r.get('source_date'), r.get('equity_rows'), flush=True)
              if any(y[t]['status'] != 'PASS' for t in ('IWB','IWM')) and year <= 2018:
                  sec = retrieve_sec_combined_source(year)
                  y['SEC_SOURCE'] = sec
                  print('SEC_SOURCE', sec['status'], sec.get('source_url'), flush=True)

          records = []
          for year in range(2006, 2027):
              y = detail['years'][str(year)]
              iwb, iwm = y['IWB'], y['IWM']
              rows_pair = iwb['status'] == 'PASS' and iwm['status'] == 'PASS'
              sec_source = y.get('SEC_SOURCE',{}).get('status') == 'PASS'
              records.append({
                  'year': year,
                  'rows_pair_status': 'PASS' if rows_pair else 'FAIL',
                  'source_availability_status': 'PASS' if rows_pair or sec_source else 'FAIL',
                  'iwb_route': iwb.get('route',''), 'iwb_source_date': iwb.get('source_date',''),
                  'iwb_equity_rows': iwb.get('equity_rows',''), 'iwb_sha256': iwb.get('sha256',''),
                  'iwm_route': iwm.get('route',''), 'iwm_source_date': iwm.get('source_date',''),
                  'iwm_equity_rows': iwm.get('equity_rows',''), 'iwm_sha256': iwm.get('sha256',''),
                  'sec_combined_source': y.get('SEC_SOURCE',{}).get('status',''),
                  'notes': 'ETF holdings are reconstruction evidence, not exact licensed Russell membership authority.',
              })

          with open(OUT/'retrieval_manifest.csv','w',newline='',encoding='utf-8') as fh:
              w=csv.DictWriter(fh,fieldnames=list(records[0])); w.writeheader(); w.writerows(records)
          (OUT/'retrieval_detail.json').write_text(json.dumps(detail,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          rows_pass = sum(r['rows_pair_status']=='PASS' for r in records)
          source_pass = sum(r['source_availability_status']=='PASS' for r in records)
          summary = {
              'schema': 'stocker.russell-1000-2000-retrieval-experiment-summary/2',
              'years_requested': 21,
              'years_direct_constituent_rows_retrieved': rows_pass,
              'years_with_retrievable_source_evidence': source_pass,
              'years_direct_rows_failed': [r['year'] for r in records if r['rows_pair_status']!='PASS'],
              'years_source_failed': [r['year'] for r in records if r['source_availability_status']!='PASS'],
              'all_direct_rows_retrieved': rows_pass == 21,
              'all_source_years_retrieved': source_pass == 21,
              'routes_tested': ['BlackRock/iShares product-data v2','legacy iShares historical CSV','SEC EDGAR combined N-Q source through 2018'],
              'authority_caveat': 'IWB/IWM holdings track Russell 1000/2000 but are fund holdings, not licensed official index constituent lists.',
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('## Russell 1000 + Russell 2000 retrieval experiment\n\n')
              fh.write(f"Direct IWB+IWM constituent rows retrieved for **{rows_pass}/21 years**; usable source evidence located for **{source_pass}/21 years**.\n\n")
              fh.write('| Year | Direct rows | Source | IWB route | IWB equities | IWM route | IWM equities |\n')
              fh.write('|---:|:---:|:---:|---|---:|---|---:|\n')
              for r in records:
                  fh.write(f"| {r['year']} | {r['rows_pair_status']} | {r['source_availability_status']} | {r['iwb_route']} | {r['iwb_equity_rows']} | {r['iwm_route']} | {r['iwm_equity_rows']} |\n")
              fh.write('\nETF holdings are reconstruction evidence; exact Russell membership is a separate authority claim.\n')
          PY

      - name: Verify experiment artifact structure
        env:
          OUT: backtester-results/russell-1000-2000-retrieval-experiment
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          p=Path(os.environ['OUT'])
          s=json.load(open(p/'summary.json'))
          rows=list(csv.DictReader(open(p/'retrieval_manifest.csv',encoding='utf-8')))
          assert len(rows)==21 and s['years_requested']==21
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Upload retrieval evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: russell-1000-2000-retrieval-experiment-${{ github.sha }}
          path: backtester-results/russell-1000-2000-retrieval-experiment
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
