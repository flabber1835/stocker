name: Backup reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/backup-reliability-harness']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  media-and-recovery:
    name: backup-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","synthetic-merge"]' || '["exact-head"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.scope == 'exact-head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip install --no-deps --no-build-isolation ./shared
      - name: Simulate media faults and replay backup lifecycles
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/tested-tree.txt
          python -m pytest tests/backup -q -ra --junitxml=evidence/backup.xml
          python tools/verify_test_owner_execution.py --owner backup.reliability \
            --junit evidence/backup.xml --output evidence/test-owner.json
      - name: Prove real PostgreSQL recovery and corruption refusal
        run: |
          set -euo pipefail
          bash scripts/test-backup-physical.sh 2>&1 | tee evidence/physical.txt
      - name: Prove recovery promotion and timeline history archival
        run: |
          set -euo pipefail
          bash scripts/test-backup-timeline-promotion.sh 2>&1 | tee evidence/timeline-promotion.txt
      - name: Prove runtime readiness against production private base backups
        run: |
          set -euo pipefail
          bash scripts/test-backup-runtime-media.sh 2>&1 | tee evidence/runtime-media.txt
      - name: Retain scenario results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-reliability-${{ matrix.scope }}-${{ github.sha }}
          path: evidence/
