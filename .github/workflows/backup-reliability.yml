name: Backup reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/backup-reliability-harness']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  media-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tests/requirements.lock
      - name: Simulate media faults and replay backup lifecycles
        run: |
          mkdir -p evidence
          python -m pytest tests/backup -q -ra --junitxml=evidence/backup.xml
      - name: Prove real PostgreSQL recovery and corruption refusal
        run: |
          set -euo pipefail
          bash scripts/test-backup-physical.sh 2>&1 | tee evidence/physical.txt
      - name: Retain scenario results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-reliability-${{ github.sha }}
          path: evidence/
