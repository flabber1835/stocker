name: Champion economic integrity - source evidence
run-name: Champion economic integrity evidence - ${{ github.sha }}
on:
  push:
    branches: [research/champion-certification-economic-integrity]
    paths: ['.github/workflows/champion-economic-integrity-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: champion-economic-integrity-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Retain exact source trees, economic history, and run identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p economic-integrity-evidence
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          out=pathlib.Path('economic-integrity-evidence')
          refs={'candidate':'ba74e79490beb8950611b1d17f5d124833b3d91e','certified':'27bb992087182c42c3c051e62bf837895f5d2ab7','champion_evidence':'3af356ab6d329e7bc6cdc015a49a6ca2d4e4b864','runtime':'887f479b15ad861313da666ad698034d3847121c','capacity_diagnostic':'372e2e40a8f65e6992de36dfabe8a98e5c3417ad','original_e3':'3f27834db427e71d9bb8d0b6160c8835b739c906'}
          def git(*args):
              return subprocess.check_output(['git',*args])
          manifest={'schema':'champion.economic-integrity-source-evidence/1','audit_source_sha':os.environ['GITHUB_SHA'],'refs':refs,'files':{},'scope':'SOURCE_AND_EXISTING_EVIDENCE_ONLY_NO_REPLAY_NO_ECONOMIC_CHANGES'}
          roots=('backtester/','tests/backtester/','tests/support/','shared/','sentinel/','services/backtester/','tools/','docs/','research/strategy9-e3','research/champion','research/research-champion','research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/','.github/workflows/')
          data_names=('backtester/data/canonical-pit-20y.json','backtester/data/champion-','backtester/data/GS3M_')
          for label,sha in refs.items():
              subprocess.run(['git','fetch','--filter=blob:none','origin',sha],check=True)
              names=git('ls-tree','-r','--name-only',sha).decode().splitlines()
              (out/f'{label}-tree.txt').write_text('\n'.join(names)+'\n')
              selected=[n for n in names if n.startswith(roots) and (n.endswith(('.py','.md','.yml','.yaml','.toml','.lock','.txt')) or n.startswith(data_names) or (n.endswith('.json') and ('profile' in n or 'champion' in n or 'strategy9-e3' in n)))]
              with (out/f'{label}-source.tar').open('wb') as f:
                  subprocess.run(['git','archive','--format=tar',sha,'--',*selected],stdout=f,check=True)
              (out/f'{label}-commits.txt').write_bytes(git('log','--max-count=150','--format=%H %aI %s',sha))
              (out/f'{label}-source-selection.json').write_text(json.dumps(selected,indent=2)+'\n')
          paths=['research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py','backtester/research_terminal_grace_overlay.py','backtester/run_research_strict_pit_20y.py','backtester/run_research_champion_strict_pit_20y.py','backtester/research_champion_pit_closure.py','backtester/research_champion_corrected_classification.py','backtester/run_research_strict_pit.py']
          for i,path in enumerate(paths):
              (out/f'history-{i}.txt').write_bytes(git('log','--all','--format=commit %H%nDate: %aI%nSubject: %s','-p','--',path))
          for run in [34007704385,34014048220,33993610034]:
              for suffix in ['', '/artifacts','/jobs']:
                  url=f'https://api.github.com/repos/flabber1835/stocker/actions/runs/{run}{suffix}'
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(req,timeout=120) as r:
                      (out/f'run-{run}{suffix.replace("/","-")}.json').write_bytes(r.read())
          for p in sorted(out.iterdir()):
              if p.is_file(): manifest['files'][p.name]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Economic integrity evidence collection\n\nSource identities and prior completed runs retained. Strategy parameters, initial capital, execution rules, and corpus are unchanged. No replay or certification was performed.\n')
          PY
      - name: Retain immutable source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-economic-integrity-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: economic-integrity-evidence/
          retention-days: 90
          if-no-files-found: error
