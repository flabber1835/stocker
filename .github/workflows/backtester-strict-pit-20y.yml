name: Backtester - full 20-year causal certification
run-name: Full PIT causal certification 2006-2026 — ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [research/backtester]
    paths:
      - backtester/data/canonical-pit-20y-certification-request.json

permissions:
  contents: read
  packages: read

concurrency:
  group: backtester-full-20y-causal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Full 20-year research/production causal certification
    if: github.ref_name == 'research/backtester'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out frozen certification laboratory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-strict-pit-20y.yml
            /backtester/apply_production_cooldown_age_zero.py
            /backtester/research_terminal_grace_overlay.py
            /backtester/run_certification_parallel_20y_terminal_grace.py
            /backtester/run_research_strict_pit_20y_terminal_grace.py
            /backtester/run_certification_parallel_20y.py
            /backtester/run_production_strict_pit_20y.py
            /backtester/run_research_strict_pit_20y.py
            /backtester/run_certification_parallel.py
            /backtester/run_production_strict_pit_certification.py
            /backtester/run_research_strict_pit_certification.py
            /backtester/strict_pit_metadata.py
            /backtester/canonical_pit_dataset.py
            /backtester/canonical_pit_package.py
            /backtester/strict_pit_run15_diagnostics.py
            /backtester/causal_split_overrides.py
            /backtester/run_ldrc_corrected_warmup_cash.py
            /backtester/run_ldrc_nonpit_vs_pit_certified.py
            /backtester/run_sector_ad_causal_terminal_terms_v2.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/historical_cash.py
            /backtester/causal_terminal_terms.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/canonical-pit-20y.json
            /backtester/data/canonical-pit-20y-certification-request.json
            /backtester/data/causal-split-overrides-v1.json
            /backtester/data/causal-split-overrides-v1.SHA256
            /backtester/data/causal-split-overrides-v1.d/**
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /backtester/data/GS3M_1996-12_2007-05.csv
            /backtester/CANONICAL_PIT_DATASET_DESIGN.md
            /tests/backtester/test_canonical_pit_dataset.py
            /tests/backtester/test_research_review_basis.py
            /tests/backtester/test_production_cooldown_age_zero.py
            /tests/backtester/test_research_split_dividend_ordering.py
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_POSITIVE_EVIDENCE.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_MANUAL_ADMISSION_AUDIT.csv
            /PIT input data/SEC_SECURITY_TYPE_COVERAGE.md
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SFP/**

      - name: Enforce frozen branch identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/backtester"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Reconstruct frozen SFP archive
        shell: bash
        run: |
          set -euo pipefail
          parts=(sharadar/SFP/SHARADAR_SFP.zip.*)
          test "${#parts[@]}" -ge 1
          cat "${parts[@]}" > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null

      - name: Check out exact production strategy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Apply backtester-only production cooldown correction
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=887f479b15ad861313da666ad698034d3847121c
          test "$(git -C main-src rev-parse HEAD)" = "${EXPECTED}"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "94ba764c79cb7e40d4448195029ecc4c45b8d632"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "a59075507c8031dc0f30f1b989ad7253ad4c1715"
          mkdir -p backtester-results/strict-pit-20y-certification
          python backtester/apply_production_cooldown_age_zero.py \
            --root main-src \
            --evidence backtester-results/strict-pit-20y-certification/production-overlay.json
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "42d6dc0f5dd71cc1331e76d216660b140a609466"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "d171724c2806522e8c94cd184685d09558b04715"
          git -C main-src diff -- \
            shared/stock_strategy_shared/wealth_core/state.py \
            shared/stock_strategy_shared/wealth_core/adapter.py \
            > backtester-results/strict-pit-20y-certification/production-overlay.diff
          echo "BACKTESTER_MAIN_SHA=${EXPECTED}" >> "${GITHUB_ENV}"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact production runtime closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Regression and causal-overlay gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/research_terminal_grace_overlay.py \
            backtester/run_research_strict_pit_20y_terminal_grace.py \
            backtester/run_certification_parallel_20y_terminal_grace.py \
            backtester/run_certification_parallel_20y.py \
            backtester/run_production_strict_pit_20y.py \
            backtester/run_research_strict_pit_20y.py \
            backtester/run_certification_parallel.py \
            backtester/run_production_strict_pit_certification.py \
            backtester/run_research_strict_pit_certification.py \
            backtester/canonical_pit_dataset.py
          python -m compileall -q -f main-src/sentinel main-src/shared/stock_strategy_shared
          python -m unittest tests.backtester.test_canonical_pit_dataset -v
          python -m unittest tests.backtester.test_research_review_basis -v
          python -m unittest tests.backtester.test_production_cooldown_age_zero -v
          python -m unittest tests.backtester.test_research_split_dividend_ordering -v
          python - <<'PY'
          from pathlib import Path
          import backtester.run_research_strict_pit_20y as base
          from backtester.research_terminal_grace_overlay import install
          text=install(base.corrected.transformed_source('fullpit',Path('/tmp/full-20y-overlay-selftest')))
          compile(text,'<full-20y-generated-research>','exec')
          assert "sell_reason='terminal'" not in text
          assert "terminal_pending" in text
          assert "missing_sessions" in text
          assert "book.cash+=_slot.qty*float(_px)" in text
          assert "book.cash+=_slot.qty*float(_px)*(1-COST)" not in text
          entitlement="prior_qty={s.tid:s.qty for s in book.slots if s.held()}"
          assert text.index(entitlement) < text.index("dayact=actions.get(date,{})")
          print('VALIDATED RESEARCH ECONOMIC OVERLAYS PASS')
          PY

      - name: Verify full canonical PIT package pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('backtester/data/canonical-pit-20y.json').read_text())
          assert p['status']=='PASS'
          assert p['dataset_hash']=='f9fb220871ad4152549d31a5da6e0dbcdd327dc7b05843764511b0e800ddb19b'
          assert p['source_run_id']=='33331951602'
          assert p['window']=={
              'warmup_start':'2006-01-03',
              'measurement_start':'2006-07-31',
              'end':'2026-07-31',
          }
          assert int(p['counts']['unresolved_corporate_actions'])==0
          print('FULL CANONICAL PIT POINTER PASS', p['dataset_id'])
          PY

      - name: Verify strict PIT authority inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f 'PIT input data/SEC_SECURITY_TYPE_POSITIVE_EVIDENCE.csv.gz'
          test -f 'PIT input data/SEC_SECURITY_TYPE_MANUAL_ADMISSION_AUDIT.csv'
          test -f 'PIT input data/ACTIONS_PIT_ONLY.csv.gz'
          test -f 'PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz'
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
          test -f backtester/data/GS3M_1996-12_2007-05.csv
          test "$(sha256sum backtester/data/GS3M_1996-12_2007-05.csv | awk '{print $1}')" = "1c1dbdcddd50c2445f8c65d1378d3d2bc87626fe2dc9b9956bc0cd97682a72d3"
          (cd backtester/data && sha256sum -c causal-terminal-terms-v1.SHA256)
          (cd backtester/data && sha256sum -c causal-split-overrides-v1.SHA256)

      - name: Prove child entrypoints without inherited PYTHONPATH
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          env -u PYTHONPATH python backtester/run_production_strict_pit_20y.py --self-test-imports
          env -u PYTHONPATH python backtester/run_research_strict_pit_20y_terminal_grace.py --self-test-imports

      - name: Pull and certify stored full 20-year PIT dataset
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CANONICAL_PATH=backtester-results/canonical-pit-20y
          POINTER=backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          CONTAINER=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true' EXIT
          mkdir -p "${CANONICAL_PATH}"
          docker cp "${CONTAINER}:/canonical-pit/." "${CANONICAL_PATH}"
          docker rm "${CONTAINER}"
          trap - EXIT
          python backtester/canonical_pit_package.py verify \
            --pointer "${POINTER}" --dataset "${CANONICAL_PATH}"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/${CANONICAL_PATH}" >> "${GITHUB_ENV}"

      - name: Run full 20-year corrected-production versus repaired-research certification
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python backtester/run_certification_parallel_20y_terminal_grace.py \
            --canonical-dataset "${CANONICAL_PIT_DATASET}" \
            --output-root backtester-results/strict-pit-20y-certification \
            --spy-factors 'PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz' \
            --lab-root . \
            --main-root main-src \
            2>&1 | tee backtester-strict-pit-20y-certification.log

      - name: Issue final fail-closed causal certificate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('backtester-results/strict-pit-20y-certification')
          pointer=json.loads(Path('backtester/data/canonical-pit-20y.json').read_text())
          manifest=json.loads((Path('backtester-results/canonical-pit-20y')/'manifest.json').read_text())
          consumption=json.loads((root/'canonical_input_consumption_audit.json').read_text())
          progress=json.loads((root/'certification_progress_audit.json').read_text())
          strong=json.loads((root/'strong_equivalence_audit.json').read_text())
          production=json.loads((root/'production'/'metadata_authority_audit.json').read_text())
          research=json.loads((root/'research'/'metadata_authority_audit.json').read_text())

          expected=pointer['dataset_hash']
          if manifest.get('status')!='PASS' or manifest.get('dataset_hash')!=expected:
              raise SystemExit('NO_GO: full canonical PIT package identity/status mismatch')
          if int(manifest['counts']['unresolved_corporate_actions'])!=0:
              raise SystemExit('NO_GO: unresolved canonical corporate actions')
          if consumption.get('dataset_hash')!=expected or not consumption.get('per_session_hashes_identical'):
              raise SystemExit('NO_GO: research/production did not consume byte-identical canonical sessions')
          if progress.get('first_divergence') is not None:
              raise SystemExit('NO_GO: NAV divergence remains')
          if strong.get('first_divergence') is not None:
              raise SystemExit('NO_GO: economically active strategy-state divergence remains')
          if int(strong.get('sessions_compared',0)) <= 0:
              raise SystemExit('NO_GO: no strategy sessions compared')
          if not progress.get('quarterly_blocks_emitted'):
              raise SystemExit('NO_GO: no quarterly progress evidence emitted')
          for role,audit in (('production',production),('research',research)):
              if audit.get('current_SHARADAR_TICKERS_economically_active_fields') != []:
                  raise SystemExit(f'NO_GO: {role} retained current TICKERS economic authority')
              if audit.get('fallbacks',{}).get('security_type_unknown')!='ineligible':
                  raise SystemExit(f'NO_GO: {role} security-type unknown fallback not fail-closed')

          certificate={
              'schema':'backtester.full-20y-causal-certificate/1',
              'status':'PASS',
              'backtester_sha':os.environ['GITHUB_SHA'],
              'production_source_sha':os.environ['BACKTESTER_MAIN_SHA'],
              'production_cooldown_issue':294,
              'production_cooldown_overlay_diff_sha256':'87648d1600f4a434f645d4a10c94074ac576d7e4e03af415f48fd7a0fbfacdc9',
              'bounded_equivalence_prerequisite_run':33347898761,
              'canonical_dataset_hash':expected,
              'canonical_dataset_id':pointer['dataset_id'],
              'canonical_source_run_id':pointer['source_run_id'],
              'window':pointer['window'],
              'canonical_input_sessions_identical':True,
              'strong_equivalence_sessions':int(strong['sessions_compared']),
              'strong_equivalence_tolerance':strong['tolerance'],
              'first_divergence':None,
              'quarterly_blocks_emitted':progress['quarterly_blocks_emitted'],
              'unknown_security_type_policy':'ineligible (fail closed)',
              'main_modified':False,
          }
          path=root/'full_20y_causal_certificate.json'
          path.write_text(json.dumps(certificate,indent=2,sort_keys=True)+'\n')
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          (root/'full_20y_causal_certificate.SHA256').write_text(f'{digest}  {path.name}\n')
          print('FULL 20-YEAR CAUSAL CERTIFICATION PASS')
          print(json.dumps(certificate,sort_keys=True))
          PY

      - name: Upload full certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-full-20y-causal-${{ github.run_id }}
          path: |
            backtester-results/strict-pit-20y-certification/**
            backtester-strict-pit-20y-certification.log
            backtester/data/canonical-pit-20y.json
            backtester/data/canonical-pit-20y-certification-request.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
