name: Backtester - resolve S&P 500 PIT aliases v2
run-name: S&P 500 PIT alias resolution v2 — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-resolve-sp500-pit-aliases-v2.yml'
      - 'backtester/sp500_pit_alias_resolution_v2.py'
      - 'backtester/sp500_pit_coverage_audit.py'
      - 'backtester/sp500_pit_trading_gap_filter.py'
      - 'backtester/sp500_pit_cik_alias_resolution.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DIR: backtester-results/sp500-pit-source
  MEMBERSHIP_DIR: backtester-results/sp500-pit-membership
  IDENTITY_DIR: backtester-results/sp500-pit-identity
  OUTPUT_DIR: backtester-results/sp500-pit-alias
  COVERAGE_DIR: backtester-results/sp500-pit-coverage
  TRADING_GAP_DIR: backtester-results/sp500-pit-trading-gaps
  CIK_ALIAS_DIR: backtester-results/sp500-pit-cik-alias
  SOURCE_URL: https://raw.githubusercontent.com/fja05680/sp500/c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff/sp500_ticker_start_end.csv

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/sp500_pit_corpus.py
            /backtester/sp500_pit_identity.py
            /backtester/sp500_pit_alias_resolution.py
            /backtester/sp500_pit_alias_resolution_v2.py
            /backtester/sp500_pit_coverage_audit.py
            /backtester/sp500_pit_trading_gap_filter.py
            /backtester/sp500_pit_cik_alias_resolution.py
            /backtester/strict_pit_metadata.py
            /backtester/data/sp500_official_overlay_2026.csv
            /backtester/data/causal-terminal-terms-v1.json
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - run: python -m pip install --disable-pip-version-check pandas
      - name: Rebuild Stage-1 and Stage-2 inputs
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          curl --fail --location --retry 4 --retry-all-errors "$SOURCE_URL" --output "$SOURCE_DIR/sp500_ticker_start_end.csv"
          rm -rf "$MEMBERSHIP_DIR" "$IDENTITY_DIR"
          python -m backtester.sp500_pit_corpus --source "$SOURCE_DIR/sp500_ticker_start_end.csv" --overlay backtester/data/sp500_official_overlay_2026.csv --output "$MEMBERSHIP_DIR" --start 1996-01-02 --end 2026-09-03
          python -m backtester.sp500_pit_identity --membership-root "$MEMBERSHIP_DIR" --sharadar-root sharadar --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz --output "$IDENTITY_DIR" --start-year 1997 --end-year 2026
      - name: Resolve aliases v2
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          python -m backtester.sp500_pit_alias_resolution_v2 --identity-root "$IDENTITY_DIR" --tickers-zip sharadar/SHARADAR_TICKERS.zip --sharadar-root sharadar --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz --output "$OUTPUT_DIR" --start-year 1997 --end-year 2026
          (cd "$OUTPUT_DIR" && sha256sum -c SHA256SUMS.txt)
      - name: Audit actual interval coverage
        run: |
          set -euo pipefail
          rm -rf "$COVERAGE_DIR"
          python -m backtester.sp500_pit_coverage_audit --membership-root "$MEMBERSHIP_DIR" --identity-root "$IDENTITY_DIR" --alias-root "$OUTPUT_DIR" --output "$COVERAGE_DIR"
          (cd "$COVERAGE_DIR" && sha256sum -c SHA256SUMS.txt)
      - name: Filter residual gaps to actual trading sessions
        run: |
          set -euo pipefail
          rm -rf "$TRADING_GAP_DIR"
          python -m backtester.sp500_pit_trading_gap_filter --coverage-root "$COVERAGE_DIR" --sharadar-root sharadar --output "$TRADING_GAP_DIR" --start-year 1997 --end-year 2026
          (cd "$TRADING_GAP_DIR" && sha256sum -c SHA256SUMS.txt)
      - name: Discover residual aliases through historical SEC CIK
        run: |
          set -euo pipefail
          rm -rf "$CIK_ALIAS_DIR"
          python -m backtester.sp500_pit_cik_alias_resolution --coverage-root "$TRADING_GAP_DIR" --sharadar-root sharadar --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz --output "$CIK_ALIAS_DIR" --start-year 1997 --end-year 2026
          (cd "$CIK_ALIAS_DIR" && sha256sum -c SHA256SUMS.txt)
      - name: Validate diagnostic
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads((Path(os.environ['OUTPUT_DIR'])/'alias-summary.json').read_text())
          c=json.loads((Path(os.environ['COVERAGE_DIR'])/'coverage-summary.json').read_text())
          t=json.loads((Path(os.environ['TRADING_GAP_DIR'])/'trading-gap-summary.json').read_text())
          k=json.loads((Path(os.environ['CIK_ALIAS_DIR'])/'cik-alias-summary.json').read_text())
          assert a['status']=='ALIAS_DIAGNOSTIC_COMPLETE'
          assert c['status']=='COVERAGE_AUDIT_COMPLETE'
          assert t['schema']=='backtester.sp500-pit-trading-gap-filter/1'
          assert t['status']=='TRADING_GAP_FILTER_COMPLETE'
          assert t['output_gap_intervals'] <= c['post_tape_intervals_with_gap']
          assert k['status']=='CIK_ALIAS_DIAGNOSTIC_COMPLETE'
          assert k['blocking_identity_conflicts']==0
          print(json.dumps({'alias':a,'coverage':c,'trading_gap_filter':t,'cik_alias':k},indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### S&P 500 PIT identity coverage\n')
              fh.write(f"- Calendar-gap intervals: {c['post_tape_intervals_with_gap']:,}\n")
              fh.write(f"- True trading-session gap intervals: {t['output_gap_intervals']:,}\n")
              fh.write(f"- Non-trading gap ranges removed: {t['removed_nontrading_gap_ranges']:,}\n")
              fh.write(f"- Unique SEC-CIK residual alias candidates: {k['unique_gap_aliases']:,}\n")
              fh.write(f"- Ambiguous SEC-CIK residuals: {k['ambiguous_gap_aliases']:,}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sp500-pit-alias-v2-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}
            ${{ env.COVERAGE_DIR }}
            ${{ env.TRADING_GAP_DIR }}
            ${{ env.CIK_ALIAS_DIR }}
          if-no-files-found: error
          retention-days: 90
