name: Backtester - broad alpha attribution
run-name: Broad alpha attribution — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-broad-alpha-attribution]
    paths:
      - '.github/workflows/backtester-broad-alpha-attribution.yml'
      - 'backtester/forensics_broad_alpha_attribution.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  BROAD_DIR: backtester-results/broad-alpha-reference
  INPUT_DIR: backtester-results/broad-alpha-input
  OUT_DIR: backtester-results/broad-alpha-attribution

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-broad-alpha-attribution.yml
            /backtester/forensics_broad_alpha_attribution.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_ACTIONS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Compile modules
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/forensics_broad_alpha_attribution.py \
            backtester/run_research_ldrc_corrected_warmup_cash.py \
            backtester/run_research_ldrc_nonpit_vs_fullpit.py

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat sharadar/SFP/SHARADAR_SFP.zip.001 sharadar/SFP/SHARADAR_SFP.zip.002 sharadar/SFP/SHARADAR_SFP.zip.003 sharadar/SFP/SHARADAR_SFP.zip.004 > sharadar/SHARADAR_SFP.zip
          unzip -t sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Run frozen broad-universe full-PIT reference
        run: |
          set -euo pipefail
          rm -rf "$BROAD_DIR"
          mkdir -p "$BROAD_DIR"
          python -m backtester.run_research_ldrc_corrected_warmup_cash --mode fullpit --output "$BROAD_DIR"
          (cd "$BROAD_DIR" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BROAD_DIR'])
          s=json.loads((root/'summary.json').read_text())
          assert s['status']=='PASS'
          assert s['mode']=='fullpit'
          print('broad result files:')
          for p in sorted(root.iterdir()):
              print(p.name)
          PY

      - name: Download authenticated S&P membership artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$INPUT_DIR"
          mkdir -p "$INPUT_DIR"
          gh run download 33828489539 \
            --repo flabber1835/stocker \
            --name sp500-continuous-1997-2026-f10f7ea9406ed2296210b93446b272deba2f96c3 \
            --dir "$INPUT_DIR"
          test -f "$INPUT_DIR/sp500-best-effort-universe-continuous/SHA256SUMS.txt"
          (cd "$INPUT_DIR/sp500-best-effort-universe-continuous" && sha256sum -c SHA256SUMS.txt)

      - name: Attribute realized broad alpha
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m backtester.forensics_broad_alpha_attribution \
            --broad-root "$BROAD_DIR" \
            --sp500-eligibility "$INPUT_DIR/sp500-best-effort-universe-continuous/sp500-best-effort-eligibility.csv.gz" \
            --output "$OUT_DIR"
          cat "$OUT_DIR/ATTRIBUTION.md"
          cat "$OUT_DIR/ATTRIBUTION.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: broad-alpha-attribution-${{ github.sha }}
          path: |
            ${{ env.OUT_DIR }}
            ${{ env.BROAD_DIR }}/summary.json
            ${{ env.BROAD_DIR }}/metrics.csv
            ${{ env.BROAD_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
