name: Capital risk encrypted staging

on:
  push:
    branches: [codex/capital-risk-research]
    paths:
      - 'research/capital_risk/stage-request.json'

permissions:
  contents: read

concurrency:
  group: capital-risk-encrypted-staging
  cancel-in-progress: false

jobs:
  verify-transfer:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
          fetch-depth: 1
      - name: Install the hash-locked transfer dependency closure
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Verify refusal and transfer guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -v'
      - name: Authenticate and verify frozen research assets
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/staging.json'
      - name: Retain only nonfinancial verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-risk-staging-${{ github.sha }}
          path: artifacts/capital-risk/staging.json
          if-no-files-found: error
          retention-days: 1
