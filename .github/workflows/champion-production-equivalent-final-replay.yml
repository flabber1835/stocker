name: Champion production-equivalent final 20y replay
run-name: Champion final production-equivalent 20y replay - ${{ github.sha }}
on:
  push:
    branches: [research/champion-production-equivalent-economic-alignment]
    paths:
      - '.github/workflows/champion-production-equivalent-final-replay.yml'
      - 'backtester/champion_production_equivalent_final_replay.py'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: 2006-01-03
  CERTIFICATION_MEASUREMENT_START: 2006-07-31
  CERTIFICATION_END_SESSION: 2026-07-31
jobs:
  final-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Audit checkout - sparse
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: audit-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/champion-economic-integrity
      - name: Exact formal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27bb992087182c42c3c051e62bf837895f5d2ab7
          path: certified-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/strategy9-e3-broad-stability
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c
      - name: Exact candidate classifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: backtester
      - name: Pinned runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install frozen runtime
        run: |
          set -euo pipefail
          test "$(git -C audit-src rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C certified-src rev-parse HEAD)" = 27bb992087182c42c3c051e62bf837895f5d2ab7
          test "$(git -C candidate-src rev-parse HEAD)" = ba74e79490beb8950611b1d17f5d124833b3d91e
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" >> "${GITHUB_ENV}"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "${GITHUB_ENV}"
      - name: Stage exact final classifier and economic overlays
        run: |
          set -euo pipefail
          cp audit-src/backtester/champion_economic_prefix_audit.py certified-src/backtester/
          cp audit-src/backtester/champion_full_classification_control.py certified-src/backtester/
          cp audit-src/backtester/champion_security_truth_audit_v2.py certified-src/backtester/
          cp audit-src/backtester/champion_security_truth_overlay_v2.py certified-src/backtester/
          cp audit-src/backtester/champion_final_security_truth.py certified-src/backtester/
          cp audit-src/backtester/champion_final_truth_corpus_validator.py certified-src/backtester/
          cp audit-src/backtester/production_equivalent_economic_overlay.py certified-src/backtester/
          cp audit-src/backtester/champion_production_equivalent_build.py certified-src/backtester/
          cp audit-src/backtester/champion_production_equivalent_final_replay.py certified-src/backtester/
          cp audit-src/backtester/data/champion-security-truth-factual-batch-v2.json certified-src/backtester/data/
          cp candidate-src/backtester/research_champion_corrected_classification.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_best_effort_classification.py certified-src/backtester/
          cp candidate-src/backtester/data/champion-historical-security-type-corrections-v1.csv certified-src/backtester/data/
          cp candidate-src/backtester/data/champion-best-effort-security-types-v1.csv certified-src/backtester/data/
          cp candidate-src/backtester/data/champion-best-effort-security-types-v1-summary.json certified-src/backtester/data/
          cp candidate-src/backtester/data/champion-reviewed-security-types-v1.csv certified-src/backtester/data/
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R audit-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/
      - name: Exact executable preflight before PIT download
        run: |
          set -euo pipefail
          cd certified-src
          python backtester/champion_final_truth_corpus_validator.py \
            --manual research/champion-economic-integrity/security-truth/manual-review \
            --output "${GITHUB_WORKSPACE}/final-corpus-validation.json"
          PYTHONPATH="${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" python - <<'PY'
          from backtester import champion_final_security_truth as truth
          from backtester import research_champion_best_effort_classification as base
          assert len(truth.FINAL_INTERVALS) == 696, len(truth.FINAL_INTERVALS)
          estimate = truth.SecurityTypeEstimate(base.DEFAULT_LEDGER, 'reviewed_18')
          checked = 0
          for sid, intervals in sorted(truth.FINAL_INTERVALS.items(), key=lambda item: int(item[0])):
              for row in intervals:
                  assert estimate.peek(sid, row.first) == row.classification, (sid, row, 'first')
                  assert estimate.peek(sid, row.last) == row.classification, (sid, row, 'last')
                  checked += 2
          assert checked == 1404, checked
          print(f'PASS executable final truth: 696 securities; {checked} boundary classifications')
          PY
          rm -rf "${GITHUB_WORKSPACE}/final-preflight-output"
          PYTHONPATH="${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" \
            python backtester/champion_production_equivalent_build.py \
              --candidate-root "${GITHUB_WORKSPACE}/candidate-src" \
              --output "${GITHUB_WORKSPACE}/final-preflight-output"
          python - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('../final-preflight-output/SOURCE_PROBES.json').read_text())
          assert d['status']=='PASS_SOURCE_BUILD_NO_REPLAY', d
          assert d['corpus_hash']=='5bdc6b39e4a8ec4d3e4cebba6091b18a8b4032b41509581366bb60c0d0600993', d
          assert d['capacity_participation_cap'] is None, d
          assert d['dividend_accrual_precedes_open_equity'] is True, d
          assert d['dividend_lag_sessions']==1, d
          assert d['cumulative_terminal_retirement_present'] is False, d
          assert d['hard_abort_missing_mark_present'] is False, d
          assert d['final_truth_classifier_present'] is True, d
          print('PASS generated source contract')
          PY
          EXPECTED_FINAL_NORMALIZED_SHA256=$(PYTHONPATH="${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" python - <<'PY'
          import hashlib
          from pathlib import Path
          from backtester.champion_economic_prefix_audit import normalized_ast
          text=Path('../final-preflight-output/production-equivalent-generated.py').read_text()
          print(hashlib.sha256(normalized_ast(text).encode()).hexdigest())
          PY
          )
          test -n "${EXPECTED_FINAL_NORMALIZED_SHA256}"
          echo "EXPECTED_FINAL_NORMALIZED_SHA256=${EXPECTED_FINAL_NORMALIZED_SHA256}" >> "${GITHUB_ENV}"
          echo "PASS path-stable normalized source identity ${EXPECTED_FINAL_NORMALIZED_SHA256}"
      - name: Pull and verify exact canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          POINTER=certified-src/backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "${PACKAGE}" = ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          cid=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "${cid}:/canonical-pit/." canonical-pit/
          docker rm "${cid}"
          trap - EXIT
          PYTHONPATH="${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/certified-src" python certified-src/backtester/canonical_pit_package.py verify --pointer "${POINTER}" --dataset canonical-pit > package-integrity.json
      - name: Run single final 20-year replay
        run: |
          set -euo pipefail
          rm -rf final-output
          cd certified-src
          PYTHONPATH="${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" python backtester/champion_production_equivalent_final_replay.py --candidate-root "${GITHUB_WORKSPACE}/candidate-src" --output "${GITHUB_WORKSPACE}/final-output" 2>&1 | tee "${GITHUB_WORKSPACE}/final-replay.log"
      - name: Preserve certificate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-production-equivalent-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            final-output/
            final-replay.log
            final-corpus-validation.json
            final-preflight-output/
            package-integrity.json
          retention-days: 90
          if-no-files-found: warn
