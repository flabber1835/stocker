name: Launch V5 reconvergence experiment

on:
  push:
    branches: [research/wealth-core-v5-canonical-reconvergence-v1]
    paths:
      - '.github/workflows/v5-reconvergence-launch.yml'

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch optimized experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wealth-core-v5-canonical-reconvergence-fast-v1.yml --repo flabber1835/stocker --ref research/wealth-core-v5-canonical-reconvergence-v1

