name: Issue 160 PR176 focused fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.event.pull_request.head.ref == 'fix/issue-160-deployed-fenced'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/issue-160-deployed-fenced
          fetch-depth: 2

      - name: Apply durability ordering fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('scripts/sentinel_autonomous_deploy.py')
          text = core.read_text(encoding='utf-8')
          start = text.index('    def persist_deployed(self, status: Mapping) -> None:')
          end = text.index('\n    def persist_success(self, health: Mapping) -> None:', start)
          section = text[start:end]
          backup = '        post_backup = self._post_deploy_backup()\n'
          persist = '        self._persist_deploy_facts({\n'
          if section.count(backup) != 1 or section.count(persist) != 1:
              raise SystemExit('REFUSED: persist_deployed structure is not the expected unique shape')
          if section.index(persist) > section.index(backup):
              raise SystemExit('REFUSED: persist_deployed is already backup-before-persist')
          section = section.replace(backup, '', 1)
          section = section.replace(persist, backup + persist, 1)
          text = text[:start] + section + text[end:]
          core.write_text(text, encoding='utf-8')

          test = Path('tests/sentinel/test_autonomous_deploy_bootstrap.py')
          text = test.read_text(encoding='utf-8')
          old = '''def test_bootstrap_does_not_persist_discovered_facts_before_final_pass():
              source = (SCRIPTS / "sentinel_autonomous_deploy_bootstrap.py").read_text(
                  encoding="utf-8")
              assert "os.environ.update(env)" in source
              assert source.index("post_backup = self._create_backup") < source.index(
                  "_safe_update_dotenv(core.ENV_PATH")
          '''
          new = '''def test_bootstrap_does_not_persist_discovered_facts_before_final_pass(tmp_path):
              calls = []
              cfg = SimpleNamespace(
                  deployment_id="sentinel-nas-paper-01",
                  account_id="PA3UVTMJYYGM",
                  runtime_repository="ghcr.io/example/sentinel",
                  test_repository="ghcr.io/example/sentinel-test",
              )
              obj = bootstrap.BootstrapDeploy(cfg, SimpleNamespace(env={}), tmp_path)
              obj.commit = "a" * 40
              obj.runtime_digest = "sha256:" + "1" * 64
              obj.test_digest = "sha256:" + "2" * 64
              obj.runtime_repo_digest = cfg.runtime_repository + "@" + obj.runtime_digest
              obj.test_repo_digest = cfg.test_repository + "@" + obj.test_digest
              obj._post_deploy_backup = lambda: calls.append("backup") or "/backups/final"
              obj._persist_deploy_facts = lambda _updates: calls.append("persist")

              obj.persist_deployed({
                  "enabled": False,
                  "kill_switch_engaged": True,
                  "operational_ready": False,
                  "policy_state": "INERT",
              })

              assert calls == ["backup", "persist"]
          '''
          if text.count(old) != 1:
              raise SystemExit('REFUSED: bootstrap regression test block did not match exactly once')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit exact candidate and remove temporary worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentinel-ci-fix"
          git config user.email "sentinel-ci-fix@users.noreply.github.com"
          git rm .github/workflows/issue160-pr176-ci-fix.yml
          git add scripts/sentinel_autonomous_deploy.py tests/sentinel/test_autonomous_deploy_bootstrap.py
          git commit -m "fix: preserve backup-before-persist deployment invariant"

      - name: Build exact Sentinel test image
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          docker build --build-arg SOURCE_GIT_SHA="$SHA" -f Dockerfile.sentinel -t sentinel:latest .
          docker build --build-arg SENTINEL_RUNTIME_BASE_IMAGE=sentinel:latest --build-arg SOURCE_GIT_SHA="$SHA" -f Dockerfile.sentinel-authorized -t sentinel-authorized:ci .
          docker build --build-arg SENTINEL_IMAGE=sentinel-authorized:ci --build-arg SOURCE_GIT_SHA="$SHA" -f Dockerfile.sentinel-test -t sentinel-test:ci .

      - name: Run only targeted PR176 tests without network
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none sentinel-test:ci \
            tests/sentinel/test_autonomous_deploy.py \
            tests/sentinel/test_autonomous_deploy_bootstrap.py \
            tests/sentinel/test_issue_160_deployed_fenced.py \
            -q

      - name: Push verified fix
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/issue-160-deployed-fenced
