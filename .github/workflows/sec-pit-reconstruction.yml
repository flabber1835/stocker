name: SEC PIT reconstruction

on:
  pull_request:
    paths:
      - 'sec-filings/**'
      - 'tools/sec_pit_reconstruct.py'
      - 'tests/scripts/test_sec_pit_reconstruct.py'
      - '.github/workflows/sec-pit-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-sector-sic-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install DuckDB client
        run: python -m pip install --disable-pip-version-check --quiet duckdb pandas

      - name: Export SEC submissions SIC evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import duckdb
          import pandas as pd

          out=Path('/tmp/sec-sic-tape'); out.mkdir(parents=True,exist_ok=True)
          con=duckdb.connect()
          con.execute('INSTALL httpfs; LOAD httpfs;')
          url='https://huggingface.co/datasets/erlenbusch/sec-edgar/resolve/main/sec_edgar.duckdb'
          con.execute(f"ATTACH '{url}' AS sec (READ_ONLY)")
          df=con.execute("""
              SELECT adsh, cik, sic, filed, accepted
              FROM sec.submissions
              WHERE filed >= DATE '2009-04-01'
                AND filed <= DATE '2026-03-31'
                AND sic IS NOT NULL
              ORDER BY filed, cik, accepted, adsh
          """).df()
          df['filed']=pd.to_datetime(df['filed']).dt.date.astype(str)
          df['accepted']=pd.to_datetime(df['accepted']).astype(str)
          df['cik']=df['cik'].astype(str).str.replace(r'\.0$','',regex=True).str.zfill(10)
          df['sic']=pd.to_numeric(df['sic'],errors='coerce')
          df=df[df.sic.notna() & (df.sic>0)].copy(); df['sic']=df.sic.astype(int)
          df=df.drop_duplicates(['adsh','cik','sic','filed','accepted']).reset_index(drop=True)

          q2=df[(df.filed>='2011-04-01')&(df.filed<='2011-06-30')]
          q2_unique=q2[['filed','cik','sic']].drop_duplicates()
          print('2011Q2 unique dated CIK/SIC observations:',len(q2_unique),flush=True)

          p=out/'sec_sic_submissions.csv'; df.to_csv(p,index=False)
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          prov=(
              'upstream=U.S. SEC Financial Statement Data Sets submissions table\n'
              'transport_mirror=https://huggingface.co/datasets/erlenbusch/sec-edgar\n'
              'transport_file_sha256=fdfd9c5807dac4725a1fb0b84b42a547be75f9a70d3568280a45930d1776a044\n'
              f'rows={len(df)}\n'
              f'2011Q2_unique_dated_cik_sic={len(q2_unique)}\n'
              f'sha256={digest}\n'
              'causal_rule=use only evidence with filed < decision session; latest accepted/adsh on latest eligible filed date\n'
          )
          (out/'PROVENANCE.txt').write_text(prov); print(prov)
          PY

      - name: Upload corrected sector research input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corrected-pit-sec-sic-tape
          path: /tmp/sec-sic-tape/
          if-no-files-found: error
          retention-days: 7
