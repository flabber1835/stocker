name: Owned55 single entry gate B E75 screen

on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/entry-gate-request.json']

permissions:
  contents: read

concurrency:
  group: owned55-entry-gate-001
  cancel-in-progress: false

jobs:
  entry-gate:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Verify entry gate and existing fence guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -q'
      - name: Authenticate existing encrypted inputs and runtime
        timeout-minutes: 7
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/entry-staging.json'
      - name: Qualify baseline and coverage then compare one sensitivity
        timeout-minutes: 10
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/entry_gate_job.py --request research/capital_risk/entry-gate-request.json --staging-receipt artifacts/capital-risk/entry-staging.json --output artifacts/capital-risk/entry-gate.json'
      - name: Preserve encrypted evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned55-entry-gate-${{ github.sha }}
          path: |
            artifacts/capital-risk/entry-staging.json
            artifacts/capital-risk/entry-gate.json
            artifacts/capital-risk/entry-gate.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
