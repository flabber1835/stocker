name: Backtester - historical metadata V4 issuer-safe authority probe
run-name: Historical metadata V4 issuer-safe authority probe — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-pit-corpus-recovery-v4]
    paths:
      - '.github/workflows/backtester-historical-metadata-v4-issuer-safe-authority-probe.yml'
      - 'backtester/expand_historical_authority_v4_issuer_safe.py'
      - 'backtester/mine_historical_metadata_candidates_v4_issuer_safe.py'
      - 'tests/backtester/test_expand_historical_authority_v4_issuer_safe.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: backtester-historical-metadata-v4-issuer-safe-authority-probe
  cancel-in-progress: true

env:
  AUDIT_RUN_ID: '33711744625'
  AUDIT_ARTIFACT: historical-metadata-v3-corrected-canonical-observation-audit-9536ee216f0d8ef2299530a02e0fa1f41154fce1
  AUDIT_ROOT: backtester-results/v3-corrected-audit
  PLAN_ROOT: backtester-results/v4-issuer-safe-authority-plan
  OUTPUT_ROOT: backtester-results/v4-issuer-safe-authority-probe
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    name: Freeze issuer-safe bounded strict-prior SEC authority evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact issuer-safe V4 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/__init__.py
            /backtester/expand_historical_authority_v4.py
            /backtester/expand_historical_authority_v4_issuer_safe.py
            /backtester/historical_metadata_reconstruction_v2.py
            /backtester/mine_historical_metadata_candidates_v3.py
            /backtester/mine_historical_metadata_candidates_v4_issuer_safe.py
            /tests/backtester/test_expand_historical_authority_v4.py
            /tests/backtester/test_expand_historical_authority_v4_issuer_safe.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run base and issuer-CIK fail-closed contracts
        run: |
          set -euo pipefail
          python -m compileall -q \
            backtester/expand_historical_authority_v4.py \
            backtester/expand_historical_authority_v4_issuer_safe.py \
            backtester/mine_historical_metadata_candidates_v4_issuer_safe.py \
            tests/backtester/test_expand_historical_authority_v4.py \
            tests/backtester/test_expand_historical_authority_v4_issuer_safe.py
          python - <<'PY'
          import runpy, tempfile
          from pathlib import Path
          ns=runpy.run_path('tests/backtester/test_expand_historical_authority_v4.py')
          with tempfile.TemporaryDirectory() as td:
              ns['test_v4_plan_uses_earliest_unresolved_observation_and_strict_prior_end'](Path(td))
          ns['test_efts_parser_and_display_ticker_match_are_discovery_only']()
          ns['test_exact_archived_filing_can_emit_candidate_but_never_admission']()
          ns['test_same_day_or_future_filing_is_rejected']()
          safe=runpy.run_path('tests/backtester/test_expand_historical_authority_v4_issuer_safe.py')
          for name in sorted(safe):
              if name.startswith('test_'):
                  safe[name]()
          print({'status':'PASS','contract':'strict-prior archived evidence; Forms 3/4/5 candidate issuer CIK comes from filing issuerCik'})
          PY

      - name: Download definitive corrected observation audit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.AUDIT_ARTIFACT }}
          path: ${{ env.AUDIT_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable audit input
        run: |
          set -euo pipefail
          (cd "${AUDIT_ROOT}" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.load(open(Path(os.environ['AUDIT_ROOT'])/'summary.json'))
          assert s['status']=='PASS' and s['admission_status']=='REVIEW_REQUIRED'
          assert s['canonical_observation_rows']==31820893
          assert s['unresolved_after_corrected_overlay']['episodes']==10795
          assert s['unknown_never_means_ineligible'] is True
          print({'status':'PASS','definitive_unresolved':10795})
          PY

      - name: Build same bounded 25-episode probe plan
        run: |
          set -euo pipefail
          rm -rf "${PLAN_ROOT}"
          python -m backtester.expand_historical_authority_v4_issuer_safe plan \
            --inventory "${AUDIT_ROOT}/definitive_unresolved_episodes.csv.gz" \
            --output "${PLAN_ROOT}" \
            --limit 25 \
            --include-ticker LYG \
            --include-ticker GIB
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.load(open(Path(os.environ['PLAN_ROOT'])/'plan_summary.json'))
          assert s['status']=='PASS' and s['planned_rows']==25
          assert {'LYG','GIB'}.issubset(set(s['included_tickers_present']))
          assert s['strict_prior_rule']=='filing_date < earliest unresolved canonical observation'
          print(s)
          PY

      - name: Harvest and freeze issuer-safe SEC authority candidates
        run: |
          set -euo pipefail
          rm -rf "${OUTPUT_ROOT}"
          python -m backtester.expand_historical_authority_v4_issuer_safe harvest \
            --plan "${PLAN_ROOT}/plan.csv.gz" \
            --output "${OUTPUT_ROOT}" \
            --min-interval 1.0 \
            --max-pages 1 \
            --max-filings-per-episode 6

      - name: Enforce candidate-only issuer-safe result
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, json, os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_ROOT'])
          s=json.load(open(root/'summary.json'))
          assert s['status']=='PASS'
          assert s['admission_status']=='REVIEW_REQUIRED'
          assert s['candidate_only'] is True
          assert s['canonical_price_dataset_rewritten'] is False
          assert s['unknown_never_means_ineligible'] is True
          assert s['discovery_is_authority'] is False
          assert s['episodes']==25
          rows=list(csv.DictReader(gzip.open(root/'candidate_evidence.csv.gz','rt')))
          ownership=[r for r in rows if r.get('form') in {'3','3/A','4','4/A','5','5/A'}]
          assert all(r.get('issuer_cik_source')=='OWNERSHIP_XML_ISSUER_CIK' for r in ownership)
          print(json.dumps(s,indent=2,sort_keys=True))
          print({'ownership_candidate_rows':len(ownership),'ownership_source_cik_mismatches':sum(r.get('issuer_cik_matches_source')=='false' for r in ownership)})
          PY

      - name: Upload frozen issuer-safe V4 authority probe
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-v4-issuer-safe-authority-probe-${{ github.sha }}
          path: |
            ${{ env.PLAN_ROOT }}
            ${{ env.OUTPUT_ROOT }}
            !${{ env.OUTPUT_ROOT }}/.http-cache/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
