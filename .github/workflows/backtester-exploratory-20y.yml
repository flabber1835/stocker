name: Backtester - exploratory approximate-PIT 20-year replay
run-name: Exploratory approximate-PIT 20-year replay — ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - research/backtester-exploratory-20y
    paths:
      - '.github/workflows/backtester-exploratory-20y.yml'

permissions:
  contents: read

concurrency:
  group: backtester-exploratory-20y
  cancel-in-progress: false

jobs:
  exploratory:
    name: Build best-effort PIT inputs + run full research replay
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CERTIFICATION_WARMUP_START: '2006-01-03'
      CERTIFICATION_MEASUREMENT_START: '2006-07-31'
      CERTIFICATION_END_SESSION: '2026-07-31'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out exploratory replay and historical inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-exploratory-20y.yml
            /backtester/canonical_pit_dataset.py
            /backtester/strict_pit_metadata.py
            /backtester/causal_split_overrides.py
            /backtester/causal_terminal_terms.py
            /backtester/historical_cash.py
            /backtester/run_research_exploratory_20y.py
            /backtester/run_research_strict_pit_20y.py
            /backtester/run_research_strict_pit_certification.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/causal-split-overrides-v1.json
            /backtester/data/causal-split-overrides-v1.SHA256
            /backtester/data/causal-split-overrides-v1.d/**
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /backtester/data/GS3M_1996-12_2007-05.csv
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/**
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_POSITIVE_EVIDENCE.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_MANUAL_ADMISSION_AUDIT.csv
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SFP/**

      - name: Record exploratory identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/backtester-exploratory-20y"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Reconstruct frozen SFP archive
        shell: bash
        run: |
          set -euo pipefail
          parts=(sharadar/SFP/SHARADAR_SFP.zip.*)
          test "${#parts[@]}" -ge 1
          cat "${parts[@]}" > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null

      - name: Check out pinned runtime closure read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C main-src rev-parse HEAD)" = "887f479b15ad861313da666ad698034d3847121c"
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Compile exploratory entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/canonical_pit_dataset.py \
            backtester/run_research_strict_pit_certification.py \
            backtester/run_research_strict_pit_20y.py \
            backtester/run_research_exploratory_20y.py
          python backtester/run_research_exploratory_20y.py --self-test-imports

      - name: Build best-effort causal dataset
        shell: bash
        run: |
          set -euo pipefail
          DATASET=backtester-results/exploratory-pit-20y
          mkdir -p backtester-results
          set +e
          python backtester/canonical_pit_dataset.py build \
            --output "${DATASET}" \
            --warmup-start "${CERTIFICATION_WARMUP_START}" \
            --measurement-start "${CERTIFICATION_MEASUREMENT_START}" \
            --end "${CERTIFICATION_END_SESSION}" \
            2>&1 | tee exploratory-dataset.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          if [[ "${BUILD_RC}" -ne 0 && "${BUILD_RC}" -ne 2 ]]; then
            exit "${BUILD_RC}"
          fi
          test -f "${DATASET}/manifest.json"
          python backtester/canonical_pit_dataset.py validate \
            --dataset "${DATASET}" --allow-failed
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/${DATASET}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('backtester-results/exploratory-pit-20y/manifest.json').read_text())
          c=m.get('counts') or {}
          print('[EXPLORATORY DATASET] status=%s observations=%s securities=%s unresolved_actions=%s unknown_security_type_observations=%s' % (
              m.get('status'), c.get('observation_rows'), c.get('security_count'),
              c.get('unresolved_corporate_actions'), c.get('unknown_security_type_observations')))
          PY

      - name: Run full 20-year exploratory research replay
        shell: bash
        run: |
          set -euo pipefail
          python backtester/run_research_exploratory_20y.py \
            --mode fullpit \
            --output backtester-results/exploratory-research-20y \
            2>&1 | tee exploratory-research-20y.log

      - name: Summarize go-no-go evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          dataset_path=Path('backtester-results/exploratory-pit-20y/manifest.json')
          result_path=Path('backtester-results/exploratory-research-20y/summary.json')
          log_path=Path('exploratory-research-20y.log')
          lines=['## Exploratory approximate-PIT 20-year replay','',
                 '**Purpose:** strategy go/no-go evidence. This run is not PIT-certified.','']
          if dataset_path.exists():
              m=json.loads(dataset_path.read_text())
              c=m.get('counts') or {}
              lines += [
                  f"Dataset status: `{m.get('status')}`",
                  '',
                  f"Observation rows: `{c.get('observation_rows')}`",
                  '',
                  f"Securities: `{c.get('security_count')}`",
                  '',
                  f"Unresolved corporate actions: `{c.get('unresolved_corporate_actions')}`",
                  '',
                  f"Unknown security-type observations: `{c.get('unknown_security_type_observations')}`",
                  '',
              ]
          if result_path.exists():
              s=json.loads(result_path.read_text())
              lines += [f"Run classification: `{s.get('run_classification')}`",'']
          if log_path.exists():
              rows=re.findall(r'\[CERT_CAGR\] role=(research|spy) date=(\d{4}-\d{2}-\d{2}) cagr=([-+.0-9]+)',log_path.read_text())
              dates={}
              for role,date,cagr in rows:
                  dates.setdefault(date,{})[role]=float(cagr)
              complete=[(d,v) for d,v in sorted(dates.items()) if {'research','spy'} <= set(v)]
              if complete:
                  lines += ['| Date | Research cumulative CAGR | SPY cumulative CAGR |','|---|---:|---:|']
                  for date,values in complete:
                      lines.append(f"| {date} | {values['research']:.2%} | {values['spy']:.2%} |")
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as handle:
              handle.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Upload exploratory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-exploratory-20y-${{ github.run_id }}
          path: |
            backtester-results/exploratory-pit-20y/manifest.json
            backtester-results/exploratory-pit-20y/SHA256SUMS.txt
            backtester-results/exploratory-research-20y/**
            exploratory-dataset.log
            exploratory-research-20y.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
