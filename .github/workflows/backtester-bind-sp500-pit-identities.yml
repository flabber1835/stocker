name: Backtester - bind S&P 500 PIT identities
run-name: S&P 500 PIT identity binding — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-bind-sp500-pit-identities.yml'
      - 'backtester/sp500_pit_identity.py'
      - 'tests/backtester/test_sp500_pit_identity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtester-sp500-pit-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: backtester-results/sp500-pit-source
  MEMBERSHIP_DIR: backtester-results/sp500-pit-membership
  OUTPUT_DIR: backtester-results/sp500-pit-identity
  SOURCE_URL: https://raw.githubusercontent.com/fja05680/sp500/c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff/sp500_ticker_start_end.csv

jobs:
  bind:
    name: Bind membership episodes to causal security IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact identity inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/sp500_pit_corpus.py
            /backtester/sp500_pit_identity.py
            /backtester/strict_pit_metadata.py
            /backtester/data/sp500_official_overlay_2026.csv
            /backtester/data/causal-terminal-terms-v1.json
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /tests/backtester/test_sp500_pit_identity.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install identity dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Run identity binding regressions
        run: python -m pytest -q tests/backtester/test_sp500_pit_identity.py

      - name: Rebuild exact Stage-1 membership corpus
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          curl --fail --location --retry 4 --retry-all-errors "$SOURCE_URL" \
            --output "$SOURCE_DIR/sp500_ticker_start_end.csv"
          rm -rf "$MEMBERSHIP_DIR"
          python -m backtester.sp500_pit_corpus \
            --source "$SOURCE_DIR/sp500_ticker_start_end.csv" \
            --overlay backtester/data/sp500_official_overlay_2026.csv \
            --output "$MEMBERSHIP_DIR" \
            --start 1996-01-02 --end 2026-09-03

      - name: Bind S&P membership to canonical causal identity
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          python -m backtester.sp500_pit_identity \
            --membership-root "$MEMBERSHIP_DIR" \
            --sharadar-root sharadar \
            --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz \
            --output "$OUTPUT_DIR" \
            --start-year 1997 --end-year 2026
          (cd "$OUTPUT_DIR" && sha256sum -c SHA256SUMS.txt)

      - name: Validate identity diagnostic contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_DIR'])
          s=json.loads((root/'identity-summary.json').read_text())
          assert s['schema']=='backtester.sp500-pit-identity/1'
          assert s['status']=='IDENTITY_DIAGNOSTIC_COMPLETE'
          assert s['membership_dataset_hash']=='1981828b71073be4d0fcf4addb37a56c844a29219090eb0c8fbc535d393bdb2d'
          assert s['membership_intervals']==1261
          assert s['binding_rows'] > 0
          assert s['identity_domain_security_ids'] > 0
          assert s['identity_domain_tickers'] > 0
          assert s['local_identity_start'] is not None
          print(json.dumps(s,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### S&P 500 causal identity binding\n')
              fh.write(f"- Membership intervals: {s['membership_intervals']:,}\n")
              fh.write(f"- Binding segments: {s['binding_rows']:,}\n")
              fh.write(f"- Fully bound intervals: {s['fully_bound_intervals']:,}\n")
              fh.write(f"- Prefix-before-local-tape intervals: {s['prefix_unbound_intervals']:,}\n")
              fh.write(f"- Unresolved intervals: {s['unresolved_intervals']:,}\n")
              fh.write(f"- Multi-episode intervals: {s['multi_episode_intervals']:,}\n")
              fh.write(f"- Identity authority conflicts: {s['blocking_identity_conflicts']:,}\n")
              fh.write(f"- Local identity tape begins: {s['local_identity_start']}\n")
          PY

      - name: Upload identity binding diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sp500-pit-identity-${{ github.sha }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
