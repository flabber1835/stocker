name: Backtester - financial and causality gate

on:
  workflow_dispatch:
  push:
    branches:
      - research/backtester
    paths:
      - 'backtester/**'
      - 'tests/backtester/**'
      - '.github/workflows/backtester-*.yml'
      - 'research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: backtester-financial-causality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification-suite:
    name: Exact-head mandatory PIT / financial / causality suite
    uses: ./.github/workflows/backtester-pit-certification-suite.yml
    with:
      mode: production
      source_sha: ${{ github.sha }}
      strategy_sha: ea0e100b43da989bfb39ab69cdfb2b9745f3b850
      runtime_main_sha: ea0e100b43da989bfb39ab69cdfb2b9745f3b850
      parameters_json: '{"entrypoint":"financial-causality-gate","production_source":"pristine-current-main","runtime_main_sha":"ea0e100b43da989bfb39ab69cdfb2b9745f3b850","certification_contract":"backtester.pit-certification/1"}'
    secrets: inherit
