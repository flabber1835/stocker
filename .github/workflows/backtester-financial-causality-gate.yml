name: Backtester - financial and causality gate

on:
  workflow_dispatch:
  push:
    branches:
      - research/backtester
    paths:
      - 'backtester/**'
      - 'tests/backtester/**'
      - '.github/workflows/backtester-*.yml'
      - 'research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/**'

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: backtester-financial-causality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-tests:
    name: Exact-head complete financial/test closure
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact backtester source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/**
            /backtester/**
            /services/backtester/**
            /services/bt-engine/Dockerfile
            /tools/**
            /tests/conftest.py
            /tests/backtester/**
            /tests/support/**
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_POSITIVE_EVIDENCE.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_MANUAL_ADMISSION_AUDIT.csv
            /pytest.ini

      - name: Check out reviewed Production runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f1c4be214da458b425998f8616631a4fa6072aa0
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run pinned complete test closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C main-src rev-parse HEAD)" = "f1c4be214da458b425998f8616631a4fa6072aa0"
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          python -m pip install -r services/backtester/requirements.txt
          python -m pip install pytest==8.4.2
          export PYTHONPATH="${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}"
          python -m compileall -q backtester tests/backtester tests/support
          python -m pytest -q tests/backtester

  certification-suite:
    name: Explicit full PIT / financial / causality certification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/backtester-pit-certification-suite.yml
    with:
      mode: production
      source_sha: ${{ github.sha }}
      strategy_sha: f1c4be214da458b425998f8616631a4fa6072aa0
      runtime_main_sha: f1c4be214da458b425998f8616631a4fa6072aa0
      parameters_json: '{"entrypoint":"financial-causality-gate","production_source":"reviewed-current-main","runtime_main_sha":"f1c4be214da458b425998f8616631a4fa6072aa0","certification_contract":"backtester.pit-certification/1"}'
    secrets: inherit
