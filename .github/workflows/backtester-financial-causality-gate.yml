name: Backtester financial and causality gate

on:
  workflow_dispatch:
  push:
    branches:
      - research/backtester
    paths:
      - 'backtester/**'
      - 'services/backtester/**'
      - 'tests/backtester/**'
      - 'tests/support/**'
      - 'tests/conftest.py'
      - '.github/workflows/backtester-production-strict-pit-20y.yml'
      - '.github/workflows/backtester-production-strict-pit-year-worker.yml'
      - '.github/workflows/backtester-research-only-20y.yml'
      - '.github/workflows/backtester-strict-pit-20y.yml'
      - '.github/workflows/backtester-financial-causality-gate.yml'

permissions:
  contents: read

jobs:
  financial-causality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CURRENT_MAIN_SHA: c851386fa4dddcf2e2533af3a1d313c38220b7f2
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out backtester branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/**
            /backtester/**
            /services/backtester/**
            /tests/__init__.py
            /tests/conftest.py
            /tests/backtester/**
            /tests/support/**
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_POSITIVE_EVIDENCE.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_MANUAL_ADMISSION_AUDIT.csv
            /pytest.ini

      - name: Check out exact current main production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CURRENT_MAIN_SHA }}
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared

      - name: Verify pristine current-main production closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C main-src rev-parse HEAD)" = "${CURRENT_MAIN_SHA}"
          test -z "$(git -C main-src status --porcelain)"
          test "$(git -C main-src hash-object sentinel/core/kernel.py)" = "12617af8eb954d4ae18fef2ae16977048e2e40cd"
          test "$(git -C main-src hash-object sentinel/core/production.py)" = "99e8f87aa456fc672c84b0b0ceb3d674ca7ccf4c"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "466a8f8202692e65e08596a7a47d45bd15bb3fd3"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "8dd316ed28ff9b82c216f852118f8ef83d8510ad"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install production runtime and audit runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          python -m pip install -r services/backtester/requirements.txt
          python -m pip install pytest

      - name: Compile audited financial paths
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m compileall -q -f backtester services/backtester tests/backtester tests/support
          python -m py_compile \
            main-src/sentinel/core/kernel.py \
            main-src/sentinel/core/production.py \
            main-src/shared/stock_strategy_shared/wealth_core/adapter.py \
            main-src/shared/stock_strategy_shared/wealth_core/state.py

      - name: Verify unmodified current-main production binding
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared:${{ github.workspace }}
        run: |
          set -euo pipefail
          python backtester/run_production_current_main_strict_pit_20y.py \
            --main-root main-src --self-test-source-identity

      - name: Verify financial-grade source contracts
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared:${{ github.workspace }}
        run: |
          set -euo pipefail
          python backtester/run_research_strict_pit_20y.py --self-test-imports
          python - <<'PY'
          from pathlib import Path
          production = Path('backtester/run_production_strict_pit_20y.py').read_text()
          research = Path('backtester/run_research_strict_pit_20y.py').read_text()
          workflow = Path('.github/workflows/backtester-research-only-20y.yml').read_text()
          for marker in (
              'DIVIDEND_SETTLEMENT_LAG_SESSIONS = 15',
              'MAX_TRAILING_VOLUME_PARTICIPATION = 0.10',
              'def _capacity_guard(',
              'def _resolved_nav_guard(',
              'recent-leadership next-close return is unresolved',
              '_install_financial_guards()',
          ):
              assert marker in production, marker
          for marker in (
              'FINANCIAL_GRADE_DIVIDEND_LAG_SESSIONS = 15',
              'install_terminal_grace(text)',
              'financial-grade NAV unresolved',
              'unresolved recent-leadership return',
          ):
              assert marker in research, marker
          assert '/backtester/research_terminal_grace_overlay.py' in workflow
          print('FINANCIAL-GRADE SOURCE CONTRACT PASS')
          PY

      - name: Prove pytest imports the runtime backtester package
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared:${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import backtester
          from pathlib import Path
          path = Path(backtester.__file__).resolve()
          expected = (Path.cwd() / 'backtester' / '__init__.py').resolve()
          assert path == expected, (path, expected)
          print('BACKTESTER PACKAGE IDENTITY PASS', path)
          PY

      - name: Run complete backtester regression suite
        id: regressions
        shell: bash
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared:${{ github.workspace }}
        run: |
          set -o pipefail
          python -m pytest -q tests/backtester 2>&1 | tee backtester-test.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-financial-gate-tests-${{ github.run_id }}
          path: backtester-test.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Enforce regression result
        if: steps.regressions.outcome != 'success'
        shell: bash
        run: exit 1
