name: Backtester - production-only 20-year strict PIT
run-name: Production strict PIT annual chain 2006-2026 — ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [research/backtester]
    paths:
      - backtester/data/production-strict-pit-20y-request.json

permissions:
  contents: read
  packages: read

env:
  PIT_OFFICIAL_BACKTEST: '1'

concurrency:
  group: backtester-production-strict-pit-annual-${{ github.sha }}
  cancel-in-progress: false

jobs:
  causality:
    name: Mandatory PIT / financial / causality evidence
    uses: ./.github/workflows/backtester-pit-certification-suite.yml
    with:
      mode: production
      source_sha: ${{ github.sha }}
      strategy_sha: ea0e100b43da989bfb39ab69cdfb2b9745f3b850
      runtime_main_sha: ea0e100b43da989bfb39ab69cdfb2b9745f3b850
      parameters_json: '{"entrypoint":"production-annual-chain-2006-2026","mode":"production","production_main_sha":"ea0e100b43da989bfb39ab69cdfb2b9745f3b850","runtime_main_sha":"ea0e100b43da989bfb39ab69cdfb2b9745f3b850","production_overlay":"pristine","certification_contract":"backtester.pit-certification/1"}'
    secrets: inherit

  year_2006:
    uses: ./.github/workflows/backtester-production-strict-pit-year-worker.yml
    with:
      year: '2006'
      source_sha: ${{ github.sha }}
      workflow_sha: ${{ github.sha }}
      chain_ref: ${{ github.ref }}
    secrets: inherit

  year_2007:
    needs: year_2006
    uses: ./.github/workflows/backtester-production-strict-pit-year-worker.yml
    with:
      year: '2007'
      source_sha: ${{ github.sha }}
      workflow_sha: ${{ github.sha }}
      chain_ref: ${{ github.ref }}
      previous_run_id: ${{ needs.year_2006.outputs.run_id }}
      previous_run_attempt: ${{ needs.year_2006.outputs.run_attempt }}
      previous_artifact_name: ${{ needs.year_2006.outputs.artifact_name }}
      previous_certificate_hash: ${{ needs.year_2006.outputs.certificate_hash }}
      previous_chain_hash: ${{ needs.year_2006.outputs.chain_hash }}
    secrets: inherit

  year_2008:
    needs: year_2007
    uses: ./.github/workflows/backtester-production-strict-pit-year-worker.yml
    with:
      year: '2008'
      source_sha: ${{ github.sha }}
      workflow_sha: ${{ github.sha }}
      chain_ref: ${{ github.ref }}
      previous_run_id: ${{ needs.year_2007.outputs.run_id }}
      previous_run_attempt: ${{ needs.year_2007.outputs.run_attempt }}
      previous_artifact_name: ${{ needs.year_2007.outputs.artifact_name }}
      previous_certificate_hash: ${{ needs.year_2007.outputs.certificate_hash }}
      previous_chain_hash: ${{ needs.year_2007.outputs.chain_hash }}
    secrets: inherit

  year_2009:
    needs: year_2008
