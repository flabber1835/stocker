      previous_run_attempt: ${{ needs.year_2020.outputs.run_attempt }}
      previous_artifact_name: ${{ needs.year_2020.outputs.artifact_name }}
      previous_certificate_hash: ${{ needs.year_2020.outputs.certificate_hash }}
      previous_chain_hash: ${{ needs.year_2020.outputs.chain_hash }}
