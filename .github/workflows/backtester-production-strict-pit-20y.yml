  year_2023:
    needs: year_2022
    uses: ./.github/workflows/backtester-production-strict-pit-year-worker.yml
    with:
      year: '2023'
      source_sha: ${{ github.sha }}
      workflow_sha: ${{ github.sha }}
      chain_ref: ${{ github.ref }}
      previous_run_id: ${{ needs.year_2022.outputs.run_id }}
      previous_run_attempt: ${{ needs.year_2022.outputs.run_attempt }}
      previous_artifact_name: ${{ needs.year_2022.outputs.artifact_name }}
      previous_certificate_hash: ${{ needs.year_2022.outputs.certificate_hash }}
      previous_chain_hash: ${{ needs.year_2022.outputs.chain_hash }}
