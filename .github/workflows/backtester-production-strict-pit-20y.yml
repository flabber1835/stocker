      chain_ref: ${{ github.ref }}
      previous_run_id: ${{ needs.year_2008.outputs.run_id }}
      previous_run_attempt: ${{ needs.year_2008.outputs.run_attempt }}
      previous_artifact_name: ${{ needs.year_2008.outputs.artifact_name }}
      previous_certificate_hash: ${{ needs.year_2008.outputs.certificate_hash }}
      previous_chain_hash: ${{ needs.year_2008.outputs.chain_hash }}
    secrets: inherit

  year_2010:
