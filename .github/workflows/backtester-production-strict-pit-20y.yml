      chain_ref: ${{ github.ref }}
      previous_run_id: ${{ needs.year_2019.outputs.run_id }}
      previous_run_attempt: ${{ needs.year_2019.outputs.run_attempt }}
      previous_artifact_name: ${{ needs.year_2019.outputs.artifact_name }}
      previous_certificate_hash: ${{ needs.year_2019.outputs.certificate_hash }}
      previous_chain_hash: ${{ needs.year_2019.outputs.chain_hash }}
