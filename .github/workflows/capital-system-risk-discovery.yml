name: C V discovery qualification recovery
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/system-campaign-risk-discovery-request-002.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: system-optimization-002-risk-discovery-recovery
  cancel-in-progress: false
jobs:
  discovery:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [P09, P10, P11]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/capital_risk
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/wwe-transfer-requirements.lock
      - name: Verify metadata and all original discovery source bytes
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/system_campaign_risk_discovery_probe.py --request research/capital_risk/system-campaign-risk-discovery-request-002.json'
      - name: Authenticate frozen inputs and offline runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/full-core-staging.json'
      - name: Qualify own canonical parent then discover remaining sessions
        timeout-minutes: 335
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
          DISCOVERY_ARM: ${{ matrix.arm }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/system_campaign_risk_discovery_job.py --arm "$DISCOVERY_ARM" --request research/capital_risk/system-campaign-risk-discovery-request-002.json --staging artifacts/capital-risk/full-core-staging.json --output artifacts/capital-risk/discovery.json'
      - name: Preserve encrypted proven stopped diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-risk-discovery-${{ matrix.arm }}-${{ github.sha }}
          path: |
            artifacts/capital-risk/full-core-staging.json
            artifacts/capital-risk/export-qualification.json
            artifacts/capital-risk/discovery.json
            artifacts/capital-risk/discovery.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
