name: PR298 exact-head financial validation

on:
  push:
    branches:
      - codex/pr298-final-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 6dc3b06ff5136ce421806e809b1dac1a3cf42680
      PINNED_PRODUCTION_SHA: c851386fa4dddcf2e2533af3a1d313c38220b7f2
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-financial-causality-gate.yml
            /.github/workflows/backtester-production-strict-pit-20y.yml
            /.github/workflows/backtester-production-strict-pit-year-worker.yml
            /.github/workflows/backtester-research-only-20y.yml
            /.github/workflows/backtester-strict-pit-20y.yml
            /backtester/**
            /tests/__init__.py
            /tests/conftest.py
            /tests/backtester/**
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /pytest.ini
      - name: Verify exact target identity
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain)"
      - name: Check out pinned production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.PINNED_PRODUCTION_SHA }}
          path: target/main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
      - name: Verify pinned production closure
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git -C main-src rev-parse HEAD)" = "${PINNED_PRODUCTION_SHA}"
          test -z "$(git -C main-src status --porcelain)"
          test "$(git -C main-src hash-object sentinel/core/kernel.py)" = "12617af8eb954d4ae18fef2ae16977048e2e40cd"
          test "$(git -C main-src hash-object sentinel/core/production.py)" = "99e8f87aa456fc672c84b0b0ceb3d674ca7ccf4c"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "466a8f8202692e65e08596a7a47d45bd15bb3fd3"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "8dd316ed28ff9b82c216f852118f8ef83d8510ad"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install runtime and pytest
        working-directory: target
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          python -m pip install pytest
      - name: Compile audited paths
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/target/main-src:${{ github.workspace }}/target/main-src/shared:${{ github.workspace }}/target
        run: |
          set -euo pipefail
          python -m compileall -q -f backtester
          python -m py_compile main-src/sentinel/core/kernel.py main-src/sentinel/core/production.py
      - name: Verify production binding
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/target/main-src:${{ github.workspace }}/target/main-src/shared:${{ github.workspace }}/target
        run: |
          python backtester/run_production_current_main_strict_pit_20y.py --main-root main-src --self-test-source-identity
      - name: Run financial and causality regressions
        working-directory: target
        env:
          PYTHONPATH: ${{ github.workspace }}/target/main-src:${{ github.workspace }}/target/main-src/shared:${{ github.workspace }}/target
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/backtester/test_current_main_production_binding.py \
            tests/backtester/test_forward_bias_regression.py \
            tests/backtester/test_certification_parallel.py \
            tests/backtester/test_research_review_basis.py \
            tests/backtester/test_research_split_dividend_ordering.py \
            tests/backtester/test_production_annual_chain.py
