name: Backtester - resolve S&P 500 PIT aliases
run-name: S&P 500 PIT alias resolution — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-resolve-sp500-pit-aliases.yml'
      - 'backtester/sp500_pit_alias_resolution.py'
      - 'tests/backtester/test_sp500_pit_alias_resolution.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtester-sp500-pit-alias-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: backtester-results/sp500-pit-source
  MEMBERSHIP_DIR: backtester-results/sp500-pit-membership
  IDENTITY_DIR: backtester-results/sp500-pit-identity
  OUTPUT_DIR: backtester-results/sp500-pit-alias
  SOURCE_URL: https://raw.githubusercontent.com/fja05680/sp500/c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff/sp500_ticker_start_end.csv

jobs:
  resolve:
    name: Resolve historical ticker aliases by causal SEP overlap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact alias inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/sp500_pit_corpus.py
            /backtester/sp500_pit_identity.py
            /backtester/sp500_pit_alias_resolution.py
            /backtester/strict_pit_metadata.py
            /backtester/data/sp500_official_overlay_2026.csv
            /backtester/data/causal-terminal-terms-v1.json
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /tests/backtester/test_sp500_pit_alias_resolution.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Run alias regressions
        run: python -m pytest -q tests/backtester/test_sp500_pit_alias_resolution.py

      - name: Rebuild Stage-1 membership and Stage-2 identity inputs
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          curl --fail --location --retry 4 --retry-all-errors "$SOURCE_URL" --output "$SOURCE_DIR/sp500_ticker_start_end.csv"
          rm -rf "$MEMBERSHIP_DIR" "$IDENTITY_DIR"
          python -m backtester.sp500_pit_corpus \
            --source "$SOURCE_DIR/sp500_ticker_start_end.csv" \
            --overlay backtester/data/sp500_official_overlay_2026.csv \
            --output "$MEMBERSHIP_DIR" --start 1996-01-02 --end 2026-09-03
          python -m backtester.sp500_pit_identity \
            --membership-root "$MEMBERSHIP_DIR" \
            --sharadar-root sharadar \
            --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz \
            --output "$IDENTITY_DIR" --start-year 1997 --end-year 2026

      - name: Resolve aliases
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          python -m backtester.sp500_pit_alias_resolution \
            --identity-root "$IDENTITY_DIR" \
            --tickers-zip sharadar/SHARADAR_TICKERS.zip \
            --sharadar-root sharadar \
            --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz \
            --output "$OUTPUT_DIR" --start-year 1997 --end-year 2026
          (cd "$OUTPUT_DIR" && sha256sum -c SHA256SUMS.txt)

      - name: Validate alias diagnostic contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUTPUT_DIR'])
          s=json.loads((root/'alias-summary.json').read_text())
          assert s['schema']=='backtester.sp500-pit-alias-resolution/1'
          assert s['status']=='ALIAS_DIAGNOSTIC_COMPLETE'
          assert s['membership_dataset_hash']=='1981828b71073be4d0fcf4addb37a56c844a29219090eb0c8fbc535d393bdb2d'
          assert s['input_unresolved_intervals'] > 0
          assert s['resolved_intervals'] + s['ambiguous_intervals'] + s['still_unresolved_intervals'] == s['input_unresolved_intervals']
          assert s['blocking_identity_conflicts'] == 0
          print(json.dumps(s,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('### S&P 500 historical alias resolution\n')
              fh.write(f"- Input unresolved intervals: {s['input_unresolved_intervals']:,}\n")
              fh.write(f"- Auto-resolved: {s['resolved_intervals']:,}\n")
              fh.write(f"- Ambiguous: {s['ambiguous_intervals']:,}\n")
              fh.write(f"- Still unresolved: {s['still_unresolved_intervals']:,}\n")
              fh.write(f"- TICKERS metadata rows scanned: {s['tickers_metadata_rows']:,}\n")
          PY

      - name: Upload alias diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sp500-pit-alias-${{ github.sha }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
