name: P01 stopped evidence read-only review
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/p01_iac_stopped_review_request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: system-optimization-002-p01-iac-stopped-review-only
  cancel-in-progress: false
jobs:
  iac-stopped-review:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 3
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows
          fetch-depth: 1
      - name: Prepare dedicated ephemeral research capacity
        timeout-minutes: 3
        run: 'python3 -B research/capital_risk/ephemeral_runner_capacity.py --output "$GITHUB_WORKSPACE/artifacts/capital-risk/ephemeral-runner-capacity.json"'
      - name: Install locked transfer dependencies
        timeout-minutes: 4
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/wwe-transfer-requirements.lock
      - name: Verify exact own628 epoch and twelfth-input and capacity contracts
        timeout-minutes: 2
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/p01_iac_stopped_review_probe.py --request research/capital_risk/p01_iac_stopped_review_request.json --capacity artifacts/capital-risk/ephemeral-runner-capacity.json'
      - name: Authenticate frozen inputs and offline runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/full-core-staging.json'
      - name: Authenticate stopped evidence and run one read-only reviewer
        timeout-minutes: 90
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/p01_iac_stopped_review_job.py --request research/capital_risk/p01_iac_stopped_review_request.json --staging artifacts/capital-risk/full-core-staging.json --capacity artifacts/capital-risk/ephemeral-runner-capacity.json --output artifacts/capital-risk/p01-iac-stopped-review.json'
      - name: Preserve only fresh stopped review report and diagnostics
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-p01-iac-stopped-review-${{ github.sha }}
          path: |
            artifacts/capital-risk/ephemeral-runner-capacity.json
            artifacts/capital-risk/full-core-staging.json
            artifacts/capital-risk/p01-iac-stopped-review-phase.json
            artifacts/capital-risk/p01-iac-stopped-review-export-qualification.json
            artifacts/capital-risk/p01-iac-stopped-review.json
            artifacts/capital-risk/p01-iac-stopped-review-report.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
