name: Matched persistent H0 and selective P2 research
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/selective-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: selective-h0-p2-001
  cancel-in-progress: false
jobs:
  comparison:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Verify pure and static research guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -q'
      - name: Authenticate original encrypted inputs and runtime
        timeout-minutes: 7
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/selective-staging.json'
      - name: Fetch exact existing encrypted price qualification
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40706014951 --repo flabber1835/stocker --name holding-action-price-64f241d49c8d3fc5128a54deda0d435498d50089 --dir "$RUNNER_TEMP/selective-qualification-download"
      - name: Matched baseline gate and one P2 comparison
        timeout-minutes: 9
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/selective_job.py --request research/capital_risk/selective-request.json --staging-receipt artifacts/capital-risk/selective-staging.json --qualification-download "$RUNNER_TEMP/selective-qualification-download" --output artifacts/capital-risk/selective-comparison.json'
      - name: Preserve encrypted comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selective-h0-p2-${{ github.sha }}
          path: |
            artifacts/capital-risk/selective-staging.json
            artifacts/capital-risk/selective-comparison.json
            artifacts/capital-risk/selective-comparison.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
