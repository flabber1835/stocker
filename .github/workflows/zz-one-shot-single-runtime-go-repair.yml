name: one-shot single-runtime GO repair
on:
  push:
    branches:
      - codex/sentinel-docker-layering
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/sentinel-docker-layering
          fetch-depth: 0
      - name: Repair retired Dockerfile invocation and add regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/sentinel_go_validate.py')
          s = p.read_text()
          old = '''    runtime_ref = "sentinel-go-runtime:%s" % commit
              authorized_ref = "sentinel-go-authorized:%s" % commit
              test_ref = "sentinel-go-test:%s" % commit
              commands = (
                  ["docker", "build", "--network", "host", "--build-arg",
                   "SOURCE_GIT_SHA=" + commit, "-t", runtime_ref,
                   "-f", "Dockerfile.sentinel", "."],
                  ["docker", "build", "--network", "host", "--build-arg",
                   "SENTINEL_RUNTIME_BASE_IMAGE=" + runtime_ref, "--build-arg",
                   "SOURCE_GIT_SHA=" + commit, "-t", authorized_ref,
                   "-f", "Dockerfile.sentinel-authorized", "."],
                  ["docker", "build", "--network", "host", "--build-arg",
                   "SENTINEL_IMAGE=" + authorized_ref, "--build-arg",
                   "SOURCE_GIT_SHA=" + commit, "-t", test_ref,
                   "-f", "Dockerfile.sentinel-test", "."],
              )'''.replace('              ', '')
          new = '''    runtime_ref = "sentinel-go-runtime:%s" % commit
              test_ref = "sentinel-go-test:%s" % commit
              commands = (
                  ["docker", "build", "--network", "host", "--build-arg",
                   "SOURCE_GIT_SHA=" + commit, "-t", runtime_ref,
                   "-f", "Dockerfile.sentinel", "."],
                  ["docker", "build", "--network", "host", "--build-arg",
                   "SENTINEL_IMAGE=" + runtime_ref, "--build-arg",
                   "SOURCE_GIT_SHA=" + commit, "-t", test_ref,
                   "-f", "Dockerfile.sentinel-test", "."],
              )'''.replace('              ', '')
          if old not in s:
              raise SystemExit('reviewed probe_certified_suite topology not found')
          s = s.replace(old, new, 1)
          old2 = '    runtime_digest = _inspect_image_id(runner, authorized_ref)'
          new2 = '    runtime_digest = _inspect_image_id(runner, runtime_ref)'
          if s.count(old2) != 1:
              raise SystemExit('reviewed runtime identity line not found exactly once')
          s = s.replace(old2, new2, 1)
          s = s.replace(
              '# Readiness is executed by the exact deployable authorized runtime digest\n',
              '# Readiness is executed by the exact deployable runtime digest\n', 1)
          p.write_text(s)
          PY
          cat > tests/scripts/test_sentinel_single_runtime_go_build.py <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          ROOT = Path(os.environ.get("SENTINEL_REPO_ROOT") or Path(__file__).resolve().parents[2])
          SCRIPT = ROOT / "scripts" / "sentinel_go_validate.py"
          spec = importlib.util.spec_from_file_location("single_runtime_go_validate", SCRIPT)
          go = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = go
          spec.loader.exec_module(go)

          COMMIT = "a" * 40
          RUNTIME_ID = "sha256:" + "b" * 64
          TEST_ID = "sha256:" + "c" * 64
          IDENTITY = "d" * 64


          class RecordingRunner:
              def __init__(self):
                  self.commands = []

              def run(self, argv, *, env=None, cwd=ROOT):
                  command = [str(x) for x in argv]
                  self.commands.append(command)
                  if command[:3] == ["docker", "image", "inspect"]:
                      ref = command[-1]
                      value = TEST_ID if ref.startswith("sentinel-go-test:") else RUNTIME_ID
                      return subprocess.CompletedProcess(command, 0, stdout=value + "\n", stderr="")
                  if command[:4] == ["docker", "run", "--rm", "--network"] and "identity" in command:
                      return subprocess.CompletedProcess(
                          command, 0, stdout=json.dumps({"identity_hash": IDENTITY}), stderr="")
                  if command[:2] == ["docker", "run"]:
                      return subprocess.CompletedProcess(command, 0, stdout="1 passed in 0.01s\n", stderr="")
                  return subprocess.CompletedProcess(command, 0, stdout="", stderr="")


          def test_production_go_certification_builds_runtime_then_test_lens_only():
              runner = RecordingRunner()
              summary, gate = go.probe_certified_suite(
                  runner, commit=COMMIT, now_text="2026-09-06T17:00:00Z")

              build_commands = [cmd for cmd in runner.commands if cmd[:2] == ["docker", "build"]]
              assert len(build_commands) == 2
              joined = "\n".join(" ".join(cmd) for cmd in build_commands)
              assert "Dockerfile.sentinel-authorized" not in joined
              assert "sentinel-go-authorized:" not in joined
              assert "SENTINEL_RUNTIME_BASE_IMAGE=" not in joined
              assert "-f Dockerfile.sentinel ." in joined
              assert "-f Dockerfile.sentinel-test ." in joined
              assert "SENTINEL_IMAGE=sentinel-go-runtime:" + COMMIT in joined
              assert summary.runtime_image_digest == RUNTIME_ID
              assert summary.candidate_image_digest == TEST_ID
              assert summary.auxiliary_image_digests == ()
              assert summary.complete
              assert gate.status == go.PASS
          PY
          python -m pytest tests/scripts/test_sentinel_single_runtime_go_build.py -q
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/sentinel_go_validate.py tests/scripts/test_sentinel_single_runtime_go_build.py
          git commit -m 'fix: make standalone GO use single runtime topology'
          git push origin HEAD:codex/sentinel-docker-layering
