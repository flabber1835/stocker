name: Step 4 paper lifecycle decomposition

on:
  push:
    branches:
      - codex/step-4-paper-lifecycle-decomposition
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize verified decomposition generator
        shell: bash
        run: |
          cat > /tmp/step4_decompose_paper.py.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 --decode /tmp/step4_decompose_paper.py.gz.b64 | gzip --decompress > /tmp/step4_decompose_paper.py
          echo "e763f6fb93ee1ec6afc72ce0ed67a022ea1a4153eee6f37d0d4e4debba346578  /tmp/step4_decompose_paper.py" | sha256sum --check
          python -m py_compile /tmp/step4_decompose_paper.py

      - name: Generate cohesive package and equivalence proof
        run: python /tmp/step4_decompose_paper.py

      - name: Verify generated source
        run: |
          test ! -e sentinel/paper.py
          test -f sentinel/paper/__init__.py
          test -f docs/paper-lifecycle-equivalence.json
          test -f tests/sentinel/test_paper_package_architecture.py
          python -m compileall -q sentinel/paper tests/sentinel/test_paper_package_architecture.py
          python -m json.tool docs/paper-lifecycle-equivalence.json >/dev/null
          git diff --check

      - name: Remove one-time generation machinery
        run: |
          rm -f tools/step4_paper_lifecycle_inventory.py
          rm -f artifacts/paper-lifecycle-responsibility-map.json
          rm -f .github/workflows/step4-paper-lifecycle-inventory.yml

      - name: Commit lifecycle decomposition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(paper): decompose lifecycle modules"
          git push origin "HEAD:${GITHUB_REF_NAME}"
