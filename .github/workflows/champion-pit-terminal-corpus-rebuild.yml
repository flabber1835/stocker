name: Champion PIT terminal corpus rebuild
run-name: Champion PIT terminal corpus rebuild - ${{ github.sha }}

on:
  push:
    branches: [research/champion-pit-metadata-closure]
    paths:
      - '.github/workflows/champion-pit-terminal-corpus-rebuild.yml'
      - 'backtester/data/causal-terminal-terms-v1.json'
      - 'backtester/data/causal-terminal-terms-v1.SHA256'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: champion-pit-terminal-corpus-rebuild
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild and publish terminal-closure PIT corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out exact data branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/champion-pit-terminal-corpus-rebuild.yml
            /.github/workflows/backtester-build-canonical-pit-attempt.yml
            /.github/workflows/backtester-build-canonical-pit-20y.yml
            /.github/workflows/backtester-publish-canonical-pit-diagnostic.yml
            /.github/workflows/backtester-research-only-20y.yml
            /.github/workflows/backtester-production-trial-2006-2007.yml
            /.github/workflows/backtester-strict-pit-20y.yml
            /backtester/canonical_pit_dataset.py
            /backtester/canonical_pit_package.py
            /backtester/canonical-pit.Dockerfile
            /backtester/strict_pit_metadata.py
            /backtester/causal_split_overrides.py
            /backtester/causal_terminal_terms.py
            /backtester/historical_cash.py
            /backtester/run_research_strict_pit_certification.py
            /backtester/run_production_strict_pit_certification.py
            /backtester/data/canonical-pit-20y.json
            /backtester/data/production-chain-generation*.json
            /backtester/data/causal-split-overrides-v1.json
            /backtester/data/causal-split-overrides-v1.SHA256
            /backtester/data/causal-split-overrides-v1.d/**
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /backtester/data/GS3M_1996-12_2007-05.csv
            /tests/backtester/test_canonical_pit_dataset.py
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/**
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_POSITIVE_EVIDENCE.csv.gz
            /PIT input data/SEC_SECURITY_TYPE_MANUAL_ADMISSION_AUDIT.csv
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SFP/**

      - name: Verify exact source and terminal ledger
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          (cd backtester/data && sha256sum -c causal-terminal-terms-v1.SHA256)

      - name: Reconstruct frozen SFP archive
        run: |
          set -euo pipefail
          parts=(sharadar/SFP/SHARADAR_SFP.zip.*)
          test "${#parts[@]}" -ge 1
          cat "${parts[@]}" > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null

      - name: Check out pinned runtime read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install pinned reconstruction runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Test canonical reconstruction contract
        run: |
          set -euo pipefail
          python -m py_compile backtester/canonical_pit_dataset.py backtester/causal_terminal_terms.py
          python -m unittest tests.backtester.test_canonical_pit_dataset -v

      - name: Build terminal-closure canonical corpus
        run: |
          set -euo pipefail
          mkdir -p results
          python backtester/canonical_pit_dataset.py build \
            --output results/canonical-pit \
            --warmup-start 2006-01-03 \
            --measurement-start 2006-07-31 \
            --end 2026-07-31 \
            2>&1 | tee results/canonical-build.log
          python backtester/canonical_pit_dataset.py validate --dataset results/canonical-pit
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('results/canonical-pit/manifest.json').read_text())
          assert m['status']=='PASS'
          assert m['counts']['incomplete_terminal_terms']==10643, m['counts']
          assert m['terminal_terms_hash']=='bf2c8dda5d1a450797e3f800a2d201a0bbb6786dd3bc13fa50704c71095abfb7'
          print(json.dumps(m['counts'],indent=2,sort_keys=True))
          PY

      - name: Publish immutable canonical package
        id: package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          hash=$(python -c "import json; print(json.load(open('results/canonical-pit/manifest.json'))['dataset_hash'])")
          image="ghcr.io/flabber1835/stocker-canonical-pit:champion-terminal-${hash}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build --file backtester/canonical-pit.Dockerfile \
            --build-arg SOURCE_REPOSITORY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg DATASET_HASH="${hash}" --tag "${image}" results/canonical-pit
          docker push "${image}"
          docker pull "${image}"
          package=$(docker inspect --format='{{index .RepoDigests 0}}' "${image}")
          case "${package}" in ghcr.io/flabber1835/stocker-canonical-pit@sha256:*) ;; *) exit 1 ;; esac
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "dataset_hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Write candidate pointer
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          python backtester/canonical_pit_package.py write \
            --dataset results/canonical-pit \
            --output results/canonical-pit-terminal-pointer.json \
            --package "${PACKAGE}" \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python backtester/canonical_pit_package.py verify \
            --pointer results/canonical-pit-terminal-pointer.json \
            --dataset results/canonical-pit

      - name: Upload rebuild evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-pit-terminal-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/canonical-pit/manifest.json
            results/canonical-pit/SHA256SUMS.txt
            results/canonical-pit/session-hashes.csv
            results/canonical-pit-terminal-pointer.json
            results/canonical-build.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
