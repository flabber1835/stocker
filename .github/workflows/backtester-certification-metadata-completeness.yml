name: Backtester - certification metadata completeness
run-name: Certification metadata completeness — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-pit-corpus-recovery-v4]
    paths:
      - '.github/workflows/backtester-certification-metadata-completeness.yml'
      - 'backtester/certification_metadata_completeness.py'
      - 'backtester/run_certification_parallel_20y.py'
      - 'tests/backtester/test_certification_metadata_completeness.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Prove official certification fails closed on incomplete metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/certification_metadata_completeness.py
            /backtester/run_certification_parallel_20y.py
            /tests/backtester/test_certification_metadata_completeness.py
            /.github/workflows/backtester-certification-metadata-completeness.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run completeness regressions
        run: |
          set -euo pipefail
          python -m compileall -q \
            backtester/certification_metadata_completeness.py \
            backtester/run_certification_parallel_20y.py \
            tests/backtester/test_certification_metadata_completeness.py
          python - <<'PY'
          import runpy
          ns=runpy.run_path('tests/backtester/test_certification_metadata_completeness.py')
          for name in sorted(ns):
              if name.startswith('test_'):
                  ns[name]()
          print({'status':'PASS','tests':6})
          PY

      - name: Prove gate is on official runner path before replay
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('backtester/run_certification_parallel_20y.py')
          tree=ast.parse(path.read_text(encoding='utf-8'))
          main=next(node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name=='main')
          canonical_index=None
          gate_index=None
          replay_index=None
          for index,node in enumerate(main.body):
              text=ast.unparse(node)
              if canonical_index is None and 'CanonicalPITDataset(' in text:
                  canonical_index=index
              if gate_index is None and 'require_certification_metadata_complete(canonical.manifest)' in text:
                  gate_index=index
              if replay_index is None and 'base.main()' in text:
                  replay_index=index
          assert canonical_index is not None and gate_index is not None and replay_index is not None
          assert canonical_index < gate_index < replay_index, (canonical_index,gate_index,replay_index)
          print({'status':'PASS','order':{'canonical_authentication':canonical_index,'metadata_completeness_gate':gate_index,'replay_launch':replay_index}})
          PY

      - name: Demonstrate current unresolved counts are rejected
        run: |
          set -euo pipefail
          python - <<'PY'
          from backtester.certification_metadata_completeness import CertificationMetadataIncomplete, require_certification_metadata_complete
          manifest={'counts':{
              'unknown_security_type_observations':8985891,
              'unknown_sector_observations':12001922,
              'missing_active_metadata_observations':8985891,
          }}
          try:
              require_certification_metadata_complete(manifest)
          except CertificationMetadataIncomplete as exc:
              text=str(exc)
              assert 'unknown_security_type_observations=8985891' in text
              assert 'unknown_sector_observations=12001922' in text
              print({'status':'PASS','expected_fail_closed_reason':text})
          else:
              raise AssertionError('current unresolved metadata was accepted for certification')
          PY
