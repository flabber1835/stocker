name: Issue 160 repair worker

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.head_ref == 'fix/issue-160-deployed-fenced' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/issue-160-deployed-fenced
          fetch-depth: 0

      - name: Apply deployed-fenced boundary and runtime data progression
        run: |
          set -euo pipefail
          python tools/issue160_worker.py
          git diff --check

      - name: Build exact Sentinel test lens
        run: |
          set -euo pipefail
          docker build --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel -t sentinel:latest .
          docker build \
            --build-arg SENTINEL_RUNTIME_BASE_IMAGE=sentinel:latest \
            --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel-authorized -t sentinel-authorized:issue160 .
          docker build \
            --build-arg SENTINEL_IMAGE=sentinel-authorized:issue160 \
            --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel-test -t sentinel-test:issue160 .

      - name: Run only issue-160 targeted tests
        run: |
          set -euo pipefail
          docker run --rm --network none sentinel-test:issue160 \
            tests/sentinel/test_autonomous_deploy.py \
            tests/sentinel/test_autonomous_deploy_driver.py \
            tests/sentinel/test_automation_runtime.py \
            tests/sentinel/test_issue_160_deployed_fenced.py \
            -q -ra

      - name: Commit verified repair and remove worker
        run: |
          set -euo pipefail
          rm .github/workflows/issue160-worker.yml tools/issue160_worker.py
          git add -A
          git config user.name "sentinel-repair-bot"
          git config user.email "sentinel-repair-bot@users.noreply.github.com"
          git commit -m "sentinel: separate deployment from operational readiness [issue160-worker]"
          git push origin HEAD:fix/issue-160-deployed-fenced
