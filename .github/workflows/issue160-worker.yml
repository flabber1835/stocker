name: Issue 160 repair worker

on:
  push:
    branches: [fix/issue-160-deployed-fenced]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[issue160-worker]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/issue-160-deployed-fenced
          fetch-depth: 0

      - name: Apply deployed-fenced boundary and runtime data progression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          core = 'scripts/sentinel_autonomous_deploy.py'
          marker = '    def persist_success(self, health: Mapping) -> None:\n'
          methods = '''    def start_fenced_runtime(self) -> Mapping:\n        \"\"\"Start the exact promoted runtime while durable trading fences stay on.\"\"\"\n        self.phase(\"install: start exact promoted runtime in DEPLOYED/FENCED state\")\n        before = self._automation_status()\n        if (before.get(\"enabled\") is not False\n                or before.get(\"kill_switch_engaged\") is not True):\n            raise DeployRefused(\n                \"fenced runtime install requires disabled+killed automation\")\n        self.runner.run(self._authorized_compose() + [\n            \"--profile\", \"automation\", \"up\", \"-d\", \"sentinel-automation\"])\n        after = self._automation_status()\n        if (after.get(\"enabled\") is not False\n                or after.get(\"kill_switch_engaged\") is not True):\n            raise DeployRefused(\n                \"new runtime did not remain disabled+killed after install\")\n        return after\n\n    def _persist_deploy_facts(self, updates: Mapping[str, str]) -> None:\n        update_dotenv(ENV_PATH, updates)\n\n    def _post_deploy_backup(self) -> Optional[str]:\n        self.runner.run([\"bash\", \"scripts/sentinel-base-backup.sh\"])\n        self.runner.run([\"bash\", \"scripts/sentinel-backup-status.sh\"])\n        return None\n\n    def persist_deployed(self, status: Mapping) -> None:\n        \"\"\"Persist installation success independently of operational readiness.\"\"\"\n        self.phase(\"finalize: persist immutable DEPLOYED facts while fenced\")\n        if (status.get(\"enabled\") is not False\n                or status.get(\"kill_switch_engaged\") is not True):\n            raise DeployRefused(\n                \"deployment receipt requires disabled+killed automation\")\n        self._persist_deploy_facts({\n            \"SENTINEL_GIT_COMMIT\": self.commit,\n            \"SENTINEL_RUNTIME_IMAGE_REPOSITORY\": self.cfg.runtime_repository,\n            \"SENTINEL_RUNTIME_IMAGE_DIGEST\": self.runtime_digest,\n            \"SENTINEL_TEST_IMAGE_REPOSITORY\": self.cfg.test_repository,\n            \"SENTINEL_TEST_IMAGE_DIGEST\": self.test_digest,\n        })\n        post_backup = self._post_deploy_backup()\n        receipt = {\n            \"schema\": DEPLOY_SCHEMA,\n            \"completed_at\": _utc_text(_utcnow()),\n            \"git_commit\": self.commit,\n            \"runtime_image\": self.runtime_repo_digest,\n            \"test_image\": self.test_repo_digest,\n            \"deployment_id\": self.cfg.deployment_id,\n            \"paper_account_id\": self.cfg.account_id,\n            \"deployment_state\": \"DEPLOYED\",\n            \"operational_state\": \"FENCED\",\n            \"automation_enabled\": False,\n            \"kill_switch_engaged\": True,\n            \"operational_ready\": bool(status.get(\"operational_ready\") is True),\n            \"policy_state\": status.get(\"policy_state\"),\n            \"active_certificate_sha256_at_install\": status.get(\"certificate_sha256\"),\n            \"post_deploy_backup\": post_backup,\n        }\n        path = self.attempt_dir / \"deployment-receipt.json\"\n        path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + \"\\n\",\n                        encoding=\"utf-8\")\n        print(\"\\nDEPLOYMENT PASS: exact Sentinel runtime is installed and durably fenced\")\n        print(\"operational state: FENCED (runtime readiness owns later progression)\")\n        print(\"receipt: %s\" % path)\n\n'''
          replace_once(core, marker, methods + marker)

          old_run = '''    def run(self) -> None:\n        self.git_preflight()\n        self.read_paper_account()\n        self.build_promote()\n        with self.transition():\n            self.quiesce_backup_and_migrate()\n            self.refresh_data()\n            self.ensure_ownership()\n            certificate, session = self.rotate_observation_authority()\n            self.prepare_activate_start(certificate, session)\n            health = self.verify_operational(certificate)\n            self.persist_success(health)\n'''
          new_run = '''    def run(self) -> None:\n        # Deployment establishes software/schema identity and a safe writer fence.\n        # Operational readiness (data, broker, ownership, authority, plan, leader)\n        # is deliberately not part of this success boundary.\n        self.git_preflight()\n        self.build_promote()\n        with self.transition():\n            self.quiesce_backup_and_migrate()\n            status = self.start_fenced_runtime()\n            self.persist_deployed(status)\n'''
          replace_once(core, old_run, new_run)
          replace_once(
              core,
              '        print("git ff-only -> account read -> build/test/push -> kill/stop -> "\n              "backup/restore -> schema -> daily/readiness -> ownership -> "\n              "signed certificate rotate -> prepare -> activate killed -> start -> "\n              "release -> heartbeat proof -> post-deploy backup")\n',
              '        print("git ff-only -> build/test/push -> kill/stop -> backup/restore -> "\n              "schema -> start exact runtime disabled+killed -> persist DEPLOYED/FENCED; "\n              "runtime later owns data/readiness and activation prerequisites")\n')

          bootstrap = 'scripts/sentinel_autonomous_deploy_bootstrap.py'
          persist_marker = '    def persist_success(self, health: Mapping) -> None:\n'
          bootstrap_hooks = '''    def _persist_deploy_facts(self, updates: Mapping[str, str]) -> None:\n        _safe_update_dotenv(core.ENV_PATH, updates)\n\n    def _post_deploy_backup(self) -> str:\n        return self._create_backup(restore_drill=False)\n\n'''
          replace_once(bootstrap, persist_marker, bootstrap_hooks + persist_marker)
          replace_once(
              bootstrap,
              '            "discover existing durable identity -> git/build/test/push -> "\n            "kill/backup/schema/data -> certificate/key rotation -> plan -> "\n            "activate killed -> start -> release -> heartbeat proof")\n',
              '            "discover existing durable identity -> git/build/test/push -> "\n            "kill/backup/schema -> start exact runtime disabled+killed -> "\n            "persist DEPLOYED/FENCED; runtime owns later readiness progression")\n')

          runtime = 'sentinel/automation_runtime.py'
          replace_once(runtime, 'import asyncio\nimport os\n', 'import asyncio\nimport hashlib\nimport os\n')
          replace_once(runtime, 'from datetime import date, datetime, timezone\n',
                       'from datetime import date, datetime, timedelta, timezone\n')
          replace_once(
              runtime,
              '        self.alert_adapter = alert_adapter or outbox.LogAlertAdapter()\n        self.service = AutomationService(\n',
              '        self.alert_adapter = alert_adapter or outbox.LogAlertAdapter()\n        # Fenced installs may advance only the canonical corpus path. The timer\n        # is deliberately process-local: restart may cause one extra safe probe,\n        # never broker authority or a duplicate trading command.\n        self._fenced_data_next_wake: datetime | None = None\n        self._fenced_data_poll_seconds = 300\n        self.service = AutomationService(\n')

          control_marker = '    async def control_wake(self, conn):\n'
          fenced_method = '''    async def _fenced_data_wake(self, conn):\n        \"\"\"Advance canonical Sharadar readiness while broker mutation is fenced.\n\n        This path intentionally has no CycleContext, leader permit, broker, plan,\n        or execution grant. It can only call the same ingest.daily/publication/\n        readiness path used by active automation. Vendor lag and corpus refusal\n        are retained as alerts and retried; they never release the kill switch.\n        \"\"\"\n        now = datetime.now(timezone.utc)\n        if (self._fenced_data_next_wake is not None\n                and now < self._fenced_data_next_wake):\n            return self._fenced_data_next_wake\n        next_wake = now + timedelta(seconds=self._fenced_data_poll_seconds)\n        self._fenced_data_next_wake = next_wake\n        target = schedule.for_clock(now, self.automation_config).decision_session.isoformat()\n        try:\n            feed_store.require_feed_schema(conn)\n            schema.require_runtime_schema(conn)\n            visible = feed_store.latest_visible_session(conn)\n            if visible != target:\n                ingest.daily(conn, today=target)\n                visible = feed_store.latest_visible_session(conn)\n            report = readiness.check_readiness(\n                conn, today=now.astimezone(\n                    ZoneInfo(calendar.EXCHANGE_TZ)).isoformat())\n            if visible != target or not report.ready:\n                raise RuntimeError(\n                    \"fenced data progression has not reached exact ready frontier \"\n                    f\"{target}; visible={visible!r}\")\n        except Exception as exc:                              # noqa: BLE001\n            conn.rollback()\n            detail = f\"{type(exc).__name__}: {exc}\"[:4000]\n            digest = hashlib.sha256(detail.encode(\"utf-8\")).hexdigest()[:16]\n            outbox.enqueue(\n                conn,\n                idempotency_key=f\"fenced-data:{target}:not-ready:{digest}\",\n                event_type=\"AUTOMATION_FENCED_DATA_NOT_READY\",\n                severity=\"WARN\",\n                payload={\n                    \"decision_session\": target,\n                    \"state\": \"DEPLOYED_FENCED\",\n                    \"readiness\": \"DATA_NOT_READY\",\n                    \"detail\": detail,\n                },\n                max_attempts=self.automation_config.alert_max_attempts)\n            return next_wake\n        outbox.enqueue(\n            conn,\n            idempotency_key=f\"fenced-data:{target}:ready\",\n            event_type=\"AUTOMATION_FENCED_DATA_READY\",\n            severity=\"WARN\",\n            payload={\n                \"decision_session\": target,\n                \"state\": \"DEPLOYED_FENCED\",\n                \"readiness\": \"DATA_READY\",\n                \"frontier\": target,\n            },\n            max_attempts=self.automation_config.alert_max_attempts)\n        return next_wake\n\n'''
          replace_once(runtime, control_marker, fenced_method + control_marker)
          replace_once(
              runtime,
              '        control = store.load_control(conn)\n        if not control.enabled or control.kill_switch_engaged:\n            return None\n',
              '        control = store.load_control(conn)\n        if not control.enabled or control.kill_switch_engaged:\n            return await self._fenced_data_wake(conn)\n')

          tests = 'tests/sentinel/test_autonomous_deploy.py'
          replace_once(
              tests,
              '    obj.read_paper_account = lambda: events.append("account")\n\n    def fail_build():\n',
              '    obj.read_paper_account = lambda: pytest.fail(\n        "broker readiness must not be consulted for deployment success")\n\n    def fail_build():\n')
          replace_once(tests,
                       '    assert events == ["git", "account", "build"]\n',
                       '    assert events == ["git", "build"]\n')
          old_test = '''def test_run_post_transition_failure_always_fail_closes(tmp_path):\n    obj = deploy.AutonomousDeploy(\n        SimpleNamespace(), SimpleNamespace(env={}), tmp_path)\n    events = []\n    obj.git_preflight = lambda: events.append(\"git\")\n    obj.read_paper_account = lambda: events.append(\"account\")\n    obj.build_promote = lambda: events.append(\"build\")\n    obj.quiesce_backup_and_migrate = lambda: events.append(\"quiesce\")\n\n    def fail_refresh():\n        events.append(\"refresh\")\n        raise deploy.DeployRefused(\"feed failed\")\n\n    obj.refresh_data = fail_refresh\n    obj.fail_close = lambda: events.append(\"fenced\")\n    with pytest.raises(deploy.DeployRefused):\n        obj.run()\n    assert events == [\"git\", \"account\", \"build\", \"quiesce\", \"refresh\", \"fenced\"]\n'''
          new_test = '''def test_run_post_transition_install_failure_always_fail_closes(tmp_path):\n    obj = deploy.AutonomousDeploy(\n        SimpleNamespace(), SimpleNamespace(env={}), tmp_path)\n    events = []\n    obj.git_preflight = lambda: events.append(\"git\")\n    obj.read_paper_account = lambda: pytest.fail(\n        \"broker readiness is not a deployment gate\")\n    obj.build_promote = lambda: events.append(\"build\")\n    obj.quiesce_backup_and_migrate = lambda: events.append(\"quiesce\")\n\n    def fail_install():\n        events.append(\"install\")\n        raise deploy.DeployRefused(\"runtime install failed\")\n\n    obj.start_fenced_runtime = fail_install\n    obj.fail_close = lambda: events.append(\"fenced\")\n    with pytest.raises(deploy.DeployRefused):\n        obj.run()\n    assert events == [\"git\", \"build\", \"quiesce\", \"install\", \"fenced\"]\n'''
          replace_once(tests, old_test, new_test)

          issue_test = Path('tests/sentinel/test_issue_160_deployed_fenced.py')
          issue_test.write_text(r'''from __future__ import annotations

import asyncio
import importlib.util
import json
import os
from datetime import date
from pathlib import Path
from types import SimpleNamespace

import pytest

from sentinel import automation_runtime


ROOT = Path(os.environ.get("SENTINEL_REPO_ROOT")
            or Path(__file__).resolve().parents[2])
SCRIPT = ROOT / "scripts" / "sentinel_autonomous_deploy.py"
spec = importlib.util.spec_from_file_location("issue160_deploy", SCRIPT)
deploy = importlib.util.module_from_spec(spec)
assert spec.loader is not None
spec.loader.exec_module(deploy)


def test_deploy_success_boundary_stops_before_operational_gates(tmp_path):
    obj = deploy.AutonomousDeploy(SimpleNamespace(), SimpleNamespace(env={}), tmp_path)
    events = []
    obj.git_preflight = lambda: events.append("git")
    obj.build_promote = lambda: events.append("build")
    obj.quiesce_backup_and_migrate = lambda: events.append("migrate")
    obj.start_fenced_runtime = lambda: (
        events.append("install") or {
            "enabled": False, "kill_switch_engaged": True,
            "operational_ready": False})
    obj.persist_deployed = lambda status: events.append(
        ("receipt", status["kill_switch_engaged"]))
    obj.read_paper_account = lambda: pytest.fail("broker gate reached")
    obj.refresh_data = lambda: pytest.fail("data gate reached")
    obj.ensure_ownership = lambda: pytest.fail("ownership gate reached")
    obj.rotate_observation_authority = lambda: pytest.fail("authority gate reached")
    obj.prepare_activate_start = lambda *_: pytest.fail("plan/activation gate reached")
    obj.verify_operational = lambda *_: pytest.fail("health gate reached")

    obj.run()

    assert events == ["git", "build", "migrate", "install", ("receipt", True)]


def test_persisted_deployment_receipt_is_explicitly_fenced(tmp_path):
    cfg = SimpleNamespace(
        deployment_id="sentinel-a", account_id="PAPER-1",
        runtime_repository="registry/sentinel",
        test_repository="registry/sentinel-test")
    obj = deploy.AutonomousDeploy(cfg, SimpleNamespace(env={}), tmp_path)
    obj.commit = "a" * 40
    obj.runtime_digest = "sha256:" + "1" * 64
    obj.test_digest = "sha256:" + "2" * 64
    obj.runtime_repo_digest = "registry/sentinel@" + obj.runtime_digest
    obj.test_repo_digest = "registry/sentinel-test@" + obj.test_digest
    obj.phase = lambda _text: None
    obj._persist_deploy_facts = lambda _updates: None
    obj._post_deploy_backup = lambda: "/backup/exact"

    obj.persist_deployed({
        "enabled": False, "kill_switch_engaged": True,
        "operational_ready": False, "policy_state": "KILLED",
        "certificate_sha256": "c" * 64})

    receipt = json.loads((tmp_path / "deployment-receipt.json").read_text())
    assert receipt["deployment_state"] == "DEPLOYED"
    assert receipt["operational_state"] == "FENCED"
    assert receipt["automation_enabled"] is False
    assert receipt["kill_switch_engaged"] is True
    assert receipt["operational_ready"] is False
    assert receipt["post_deploy_backup"] == "/backup/exact"


def test_start_fenced_runtime_never_releases_kill(tmp_path):
    cfg = SimpleNamespace()
    calls = []
    runner = SimpleNamespace(
        env={}, run=lambda argv, **_kwargs: calls.append(list(argv)))
    obj = deploy.AutonomousDeploy(cfg, runner, tmp_path)
    obj.phase = lambda _text: None
    obj._authorized_compose = lambda: ["docker", "compose", "-f", "authorized.yml"]
    statuses = iter([
        {"enabled": False, "kill_switch_engaged": True},
        {"enabled": False, "kill_switch_engaged": True},
    ])
    obj._automation_status = lambda: next(statuses)

    result = obj.start_fenced_runtime()

    assert result["kill_switch_engaged"] is True
    assert calls == [["docker", "compose", "-f", "authorized.yml",
                      "--profile", "automation", "up", "-d",
                      "sentinel-automation"]]


def test_fenced_runtime_uses_canonical_ingest_without_broker(monkeypatch):
    obj = object.__new__(automation_runtime.ProductionAutomation)
    obj.automation_config = SimpleNamespace(alert_max_attempts=8)
    obj._fenced_data_next_wake = None
    obj._fenced_data_poll_seconds = 300
    conn = SimpleNamespace(rollback=lambda: None)
    visible = iter(["2026-08-17", "2026-08-18"])
    ingested = []
    alerts = []

    monkeypatch.setattr(
        automation_runtime.schedule, "for_clock",
        lambda *_args, **_kwargs: SimpleNamespace(
            decision_session=date(2026, 8, 18)))
    monkeypatch.setattr(
        automation_runtime.feed_store, "require_feed_schema", lambda _c: None)
    monkeypatch.setattr(
        automation_runtime.schema, "require_runtime_schema", lambda _c: None)
    monkeypatch.setattr(
        automation_runtime.feed_store, "latest_visible_session",
        lambda _c: next(visible))
    monkeypatch.setattr(
        automation_runtime.ingest, "daily",
        lambda _c, *, today: ingested.append(today))
    monkeypatch.setattr(
        automation_runtime.readiness, "check_readiness",
        lambda *_args, **_kwargs: SimpleNamespace(ready=True))
    monkeypatch.setattr(
        automation_runtime.outbox, "enqueue",
        lambda _c, **kwargs: alerts.append(kwargs))
    obj._broker = lambda *_args, **_kwargs: pytest.fail(
        "fenced data progression constructed a broker")

    asyncio.run(obj._fenced_data_wake(conn))

    assert ingested == ["2026-08-18"]
    assert alerts[-1]["event_type"] == "AUTOMATION_FENCED_DATA_READY"


def test_fenced_vendor_lag_is_retained_not_raised(monkeypatch):
    obj = object.__new__(automation_runtime.ProductionAutomation)
    obj.automation_config = SimpleNamespace(alert_max_attempts=8)
    obj._fenced_data_next_wake = None
    obj._fenced_data_poll_seconds = 300
    rolled_back = []
    conn = SimpleNamespace(rollback=lambda: rolled_back.append(True))
    alerts = []

    monkeypatch.setattr(
        automation_runtime.schedule, "for_clock",
        lambda *_args, **_kwargs: SimpleNamespace(
            decision_session=date(2026, 8, 18)))
    monkeypatch.setattr(
        automation_runtime.feed_store, "require_feed_schema", lambda _c: None)
    monkeypatch.setattr(
        automation_runtime.schema, "require_runtime_schema", lambda _c: None)
    monkeypatch.setattr(
        automation_runtime.feed_store, "latest_visible_session",
        lambda _c: "2026-08-17")
    monkeypatch.setattr(
        automation_runtime.ingest, "daily",
        lambda *_args, **_kwargs: (_ for _ in ()).throw(
            RuntimeError("vendor publication incomplete")))
    monkeypatch.setattr(
        automation_runtime.outbox, "enqueue",
        lambda _c, **kwargs: alerts.append(kwargs))

    wake = asyncio.run(obj._fenced_data_wake(conn))

    assert wake is not None
    assert rolled_back == [True]
    assert alerts[-1]["event_type"] == "AUTOMATION_FENCED_DATA_NOT_READY"
    assert alerts[-1]["payload"]["state"] == "DEPLOYED_FENCED"


def test_disabled_or_killed_control_wake_owns_fenced_data_progress(monkeypatch):
    obj = object.__new__(automation_runtime.ProductionAutomation)
    called = []

    async def fenced(_conn):
        called.append(True)
        return "wake"

    obj._fenced_data_wake = fenced
    monkeypatch.setattr(
        automation_runtime.store, "load_control",
        lambda _conn: SimpleNamespace(enabled=False, kill_switch_engaged=True))

    assert asyncio.run(obj.control_wake(object())) == "wake"
    assert called == [True]
''', encoding='utf-8')
          PY

          git diff --check

      - name: Build exact Sentinel test lens
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel -t sentinel:latest .
          docker build \
            --build-arg SENTINEL_RUNTIME_BASE_IMAGE=sentinel:latest \
            --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel-authorized -t sentinel-authorized:issue160 .
          docker build \
            --build-arg SENTINEL_IMAGE=sentinel-authorized:issue160 \
            --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel-test -t sentinel-test:issue160 .

      - name: Run only issue-160 targeted tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none sentinel-test:issue160 \
            tests/sentinel/test_autonomous_deploy.py \
            tests/sentinel/test_autonomous_deploy_driver.py \
            tests/sentinel/test_automation_runtime.py \
            tests/sentinel/test_issue_160_deployed_fenced.py \
            -q -ra

      - name: Commit verified repair and remove worker
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue160-worker.yml
          git add -A
          git config user.name "sentinel-repair-bot"
          git config user.email "sentinel-repair-bot@users.noreply.github.com"
          git commit -m "sentinel: separate deployment from operational readiness [issue160-worker]"
          git push origin HEAD:fix/issue-160-deployed-fenced
