name: Issue 180 executor universe one-shot helper

on:
  push:
    branches:
      - fix/issue-180-execution-projection
    paths:
      - .github/workflows/issue-180-executor-universe-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-180-execution-projection
          fetch-depth: 0
      - name: Apply exact executor universe fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sentinel/execution/executor.py')
          text = path.read_text()
          anchor = '''def order_of_operations(deltas: Sequence[C.Delta]) -> tuple:\n'''
          helper = '''def _execution_universe(desired: Mapping[str, Decimal], observation) -> set[str]:\n    """Every security whose broker economics can affect exact-delta sizing.\n\n    A working order is economic state even when no position exists yet and the\n    immutable plan never named the security.  Omitting that order-only identity\n    makes the lower execution membrane incomplete: `desired - held - committed`\n    is exact only if every committed security is actually sized.\n    """\n    return (\n        set(desired)\n        | set(observation.positions_by_security())\n        | {order.instrument.security_id\n           for order in observation.orders if order.is_working}\n    )\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('executor helper insertion anchor mismatch')
          text = text.replace(anchor, helper + anchor)
          old = '''    for security_id in sorted(set(desired) | set(observation.positions_by_security())):\n'''
          new = '''    for security_id in sorted(_execution_universe(desired, observation)):\n'''
          if text.count(old) != 1:
              raise SystemExit('executor sizing-universe replacement mismatch')
          path.write_text(text.replace(old, new))

          test = Path('tests/sentinel/test_issue_180_executor_universe.py')
          if test.exists():
              raise SystemExit(f'{test} already exists')
          test.write_text('''"""Executor-level regression for issue #180 working-order identity coverage."""\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\n\nfrom sentinel.execution.executor import _execution_universe\nfrom sentinel.execution.contract import (\n    BrokerInstrument, BrokerObservation, BrokerOrder, Completeness, Side)\nfrom sentinel.execution.states import CommandState\n\n\ndef test_executor_universe_includes_working_order_only_security():\n    instrument = BrokerInstrument(\n        security_id="ORDER-ONLY", symbol="OLD", broker_id="asset-old")\n    order = BrokerOrder(\n        broker_order_id="broker-1", client_key=None, instrument=instrument,\n        side=Side.BUY, state=CommandState.ACKNOWLEDGED,\n        quantity=Decimal("7"), filled_quantity=Decimal(0))\n    observation = BrokerObservation(\n        observed_at=datetime(2026, 8, 12, tzinfo=timezone.utc),\n        orders=(order,), positions=(), completeness=Completeness.COMPLETE)\n\n    assert _execution_universe({}, observation) == {"ORDER-ONLY"}\n''')
          PY
          rm .github/workflows/issue-180-executor-universe-helper.yml
          git diff --check
          python -m compileall -q sentinel/execution/executor.py tests/sentinel/test_issue_180_executor_universe.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- sentinel/execution/executor.py tests/sentinel/test_issue_180_executor_universe.py .github/workflows/issue-180-executor-universe-helper.yml
          git commit -m 'executor: include working-order-only securities'
          git push origin HEAD:fix/issue-180-execution-projection
