name: Research - Wealth Core V3 + EX3 S&P 500 full PIT once
run-name: Wealth Core V3 + EX3 S&P 500 full PIT - ${{ github.sha }}

on:
  push:
    branches: [research/wealth-core-v3-ex3-sp500-pit-v1]
    paths:
      - '.github/workflows/wealth-core-v3-ex3-sp500-pit-once.yml'

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: wealth-core-v3-ex3-sp500-pit-once-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'
  SP500_SOURCE_URL: https://raw.githubusercontent.com/fja05680/sp500/c31ac3cc56f28cf9a02b4e694eff7ceab596a0ff/sp500_ticker_start_end.csv

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Experiment and S&P PIT harness checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: experiment-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/wealth-core-v3-ex3-sp500-pit-once.yml
            /research/wealth-core-v3-ex3-sp500-pit-v1
            /research/median5-open-sizing-10bp-ex3-v1
            /backtester/sp500_best_effort_universe.py
            /backtester/sp500_pit_corpus.py
            /backtester/sp500_pit_identity.py
            /backtester/sp500_pit_alias_resolution.py
            /backtester/sp500_pit_alias_resolution_v2.py
            /backtester/sp500_pit_coverage_audit.py
            /backtester/sp500_pit_trading_gap_filter.py
            /backtester/sp500_pit_web_alias_resolution.py
            /backtester/sp500_pit_cik_alias_resolution.py
            /backtester/strict_pit_metadata.py
            /backtester/data/sp500_official_overlay_2026.csv
            /backtester/data/sp500_web_alias_evidence.csv
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - name: Exact economic-source authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3dc74a8e54fdfe6e8368a8db3be0ecd127ee4689
          path: open-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/champion-economic-integrity
            research/wealth-core-v1-buffer-sweep-evidence/arms/10bp

      - name: Exact Median-5 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1c66096c1e3bd650233c630d4e9f71104ac8fc32
          path: median-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: research/median5-fullpit-recertification-v13

      - name: Exact formal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27bb992087182c42c3c051e62bf837895f5d2ab7
          path: certified-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/strategy9-e3-broad-stability
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c

      - name: Exact classifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: backtester

      - name: Exact runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Verify pins and install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C open-src rev-parse HEAD)" = 3dc74a8e54fdfe6e8368a8db3be0ecd127ee4689
          test "$(git -C median-src rev-parse HEAD)" = 1c66096c1e3bd650233c630d4e9f71104ac8fc32
          test "$(git -C certified-src rev-parse HEAD)" = 27bb992087182c42c3c051e62bf837895f5d2ab7
          test "$(git -C candidate-src rev-parse HEAD)" = ba74e79490beb8950611b1d17f5d124833b3d91e
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" >> "$GITHUB_ENV"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "$GITHUB_ENV"
          echo "BEST_EFFORT_SECURITY_TYPES=${GITHUB_WORKSPACE}/candidate-src/backtester/data/champion-best-effort-security-types-v1.csv" >> "$GITHUB_ENV"
          echo "BEST_EFFORT_CLASSIFICATION_SCENARIO=reviewed_18" >> "$GITHUB_ENV"

      - name: Stage exact corrected economic overlays
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            champion_economic_prefix_audit.py \
            champion_full_classification_control.py \
            champion_security_truth_audit_v2.py \
            champion_security_truth_overlay_v2.py \
            champion_final_security_truth.py \
            champion_final_truth_corpus_validator.py \
            production_equivalent_economic_overlay.py \
            champion_production_equivalent_build.py \
            champion_production_equivalent_final_replay.py
          do
            cp "open-src/backtester/$f" certified-src/backtester/
          done
          cp open-src/backtester/data/champion-security-truth-factual-batch-v2.json certified-src/backtester/data/
          cp candidate-src/backtester/research_champion_corrected_classification.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_best_effort_classification.py certified-src/backtester/
          for f in \
            champion-best-effort-security-types-v1.csv \
            champion-best-effort-security-types-v1-summary.json \
            champion-reviewed-security-types-v1.csv \
            champion-historical-security-type-corrections-v1.csv
          do
            cp "candidate-src/backtester/data/$f" certified-src/backtester/data/
          done
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R open-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/
          cd certified-src
          python backtester/champion_final_truth_corpus_validator.py \
            --manual research/champion-economic-integrity/security-truth/manual-review \
            --output "${GITHUB_WORKSPACE}/final-corpus-validation.json"

      - name: Pull and verify immutable canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          POINTER=certified-src/backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "$PACKAGE" = ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE"
          cid=$(docker create "$PACKAGE" /bin/true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "$cid:/canonical-pit/." canonical-pit/
          docker rm "$cid"
          trap - EXIT
          PYTHONPATH="${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/certified-src" \
            python certified-src/backtester/canonical_pit_package.py verify \
              --pointer "$POINTER" \
              --dataset canonical-pit \
              > package-integrity.json

      - name: Rebuild pinned S&P membership and causal identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd experiment-src
          cat \
            sharadar/SFP/SHARADAR_SFP.zip.001 \
            sharadar/SFP/SHARADAR_SFP.zip.002 \
            sharadar/SFP/SHARADAR_SFP.zip.003 \
            sharadar/SFP/SHARADAR_SFP.zip.004 \
            > sharadar/SHARADAR_SFP.zip
          unzip -t sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

          mkdir -p backtester-results/sp500-pit-source
          curl --fail --location --retry 4 --retry-all-errors \
            "$SP500_SOURCE_URL" --output backtester-results/sp500-pit-source/sp500_ticker_start_end.csv
          rm -rf backtester-results/sp500-pit-membership backtester-results/sp500-pit-identity
          PYTHONPATH=. python -m backtester.sp500_pit_corpus \
            --source backtester-results/sp500-pit-source/sp500_ticker_start_end.csv \
            --overlay backtester/data/sp500_official_overlay_2026.csv \
            --output backtester-results/sp500-pit-membership \
            --start 1996-01-02 --end 2026-09-03
          PYTHONPATH=. python -m backtester.sp500_pit_identity \
            --membership-root backtester-results/sp500-pit-membership \
            --sharadar-root sharadar \
            --cik-path research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz \
            --output backtester-results/sp500-pit-identity \
            --start-year 1997 --end-year 2026

          rm -rf \
            backtester-results/sp500-pit-alias \
            backtester-results/sp500-pit-coverage \
            backtester-results/sp500-pit-trading-gaps \
            backtester-results/sp500-pit-web-alias \
            backtester-results/sp500-pit-cik-alias
          gh run download 33823947011 \
            --repo flabber1835/stocker \
            --name sp500-pit-alias-v2-30dce7f2adedc8196bc14f73d8943786631922bb \
            --dir backtester-results
          for d in \
            backtester-results/sp500-pit-alias \
            backtester-results/sp500-pit-coverage \
            backtester-results/sp500-pit-trading-gaps \
            backtester-results/sp500-pit-web-alias \
            backtester-results/sp500-pit-cik-alias
          do
            test -f "$d/SHA256SUMS.txt"
            (cd "$d" && sha256sum -c SHA256SUMS.txt)
          done

          rm -rf "${GITHUB_WORKSPACE}/sp500-universe"
          PYTHONPATH=. python -m backtester.sp500_best_effort_universe \
            --membership-root backtester-results/sp500-pit-membership \
            --identity-root backtester-results/sp500-pit-identity \
            --alias-root backtester-results/sp500-pit-alias \
            --trading-gap-root backtester-results/sp500-pit-trading-gaps \
            --web-alias-root backtester-results/sp500-pit-web-alias \
            --cik-alias-root backtester-results/sp500-pit-cik-alias \
            --sharadar-root sharadar \
            --output "${GITHUB_WORKSPACE}/sp500-universe" \
            --window-start 2006-07-31 \
            --window-end 2026-07-31
          (cd "${GITHUB_WORKSPACE}/sp500-universe" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['GITHUB_WORKSPACE'])/'sp500-universe'/'best-effort-summary.json'
          s=json.loads(p.read_text())
          assert s['status']=='BEST_EFFORT_RUNNABLE'
          assert s['window_start']=='2006-07-31' and s['window_end']=='2026-07-31'
          assert s['membership_dataset_hash']=='1981828b71073be4d0fcf4addb37a56c844a29219090eb0c8fbc535d393bdb2d'
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          echo "SP500_BEST_EFFORT_ELIGIBILITY=${GITHUB_WORKSPACE}/sp500-universe/sp500-best-effort-eligibility.csv.gz" >> "$GITHUB_ENV"
          echo "SP500_UNIVERSE_SUMMARY=${GITHUB_WORKSPACE}/sp500-universe/best-effort-summary.json" >> "$GITHUB_ENV"

      - name: Run Wealth Core V3 plus EX3 on dated S&P 500 PIT universe
        shell: bash
        run: |
          set -euo pipefail
          cd certified-src
          python "${GITHUB_WORKSPACE}/experiment-src/research/wealth-core-v3-ex3-sp500-pit-v1/run_experiment.py" \
            --control-source "${GITHUB_WORKSPACE}/open-src/research/wealth-core-v1-buffer-sweep-evidence/arms/10bp/buffer-10bp-generated.py" \
            --median-overlay "${GITHUB_WORKSPACE}/median-src/research/median5-fullpit-recertification-v13/experiment_overlay.py" \
            --output "${GITHUB_WORKSPACE}/experiment-results" \
            2>&1 | tee "${GITHUB_WORKSPACE}/experiment.log"
          cp "${GITHUB_WORKSPACE}/package-integrity.json" "${GITHUB_WORKSPACE}/experiment-results/package-integrity.json"
          cp "${GITHUB_WORKSPACE}/final-corpus-validation.json" "${GITHUB_WORKSPACE}/experiment-results/final-corpus-validation.json"
          cp "${GITHUB_WORKSPACE}/sp500-universe/best-effort-summary.json" "${GITHUB_WORKSPACE}/experiment-results/sp500-universe-summary.json"
          cp "${GITHUB_WORKSPACE}/experiment.log" "${GITHUB_WORKSPACE}/experiment-results/experiment.log"
          cat "${GITHUB_WORKSPACE}/experiment-results/RESULT.json"

      - name: Preserve complete S&P 500 V3 evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wealth-core-v3-ex3-sp500-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiment-results/
            experiment.log
            package-integrity.json
            final-corpus-validation.json
            sp500-universe/
            experiment-src/research/wealth-core-v3-ex3-sp500-pit-v1/run_experiment.py
            experiment-src/research/median5-open-sizing-10bp-ex3-v1/canonical_execution_harness.py
            experiment-src/research/median5-open-sizing-10bp-ex3-v1/run_experiment.py
          retention-days: 90
          if-no-files-found: warn

      - name: Persist successful S&P 500 V3 result to research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd experiment-src
          DEST=research/wealth-core-v3-ex3-sp500-pit-v1/evidence
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "${GITHUB_WORKSPACE}/experiment-results/RESULT.json" "$DEST/RESULT.json"
          cp "${GITHUB_WORKSPACE}/experiment-results/SHA256.json" "$DEST/SHA256.json"
          cp "${GITHUB_WORKSPACE}/experiment-results/open-sizing-telemetry.json" "$DEST/open-sizing-telemetry.json"
          cp "${GITHUB_WORKSPACE}/experiment-results/close-decisions.csv" "$DEST/close-decisions.csv"
          cp "${GITHUB_WORKSPACE}/experiment-results/sp500-universe-summary.json" "$DEST/sp500-universe-summary.json"
          cp "${GITHUB_WORKSPACE}/package-integrity.json" "$DEST/package-integrity.json"
          cp "${GITHUB_WORKSPACE}/final-corpus-validation.json" "$DEST/final-corpus-validation.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'research: persist Wealth Core V3 plus EX3 S&P 500 PIT result'
          git push origin HEAD:research/wealth-core-v3-ex3-sp500-pit-v1
