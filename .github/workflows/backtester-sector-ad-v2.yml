name: Backtester - sector A/D fresh replay v2

on:
  push:
    branches:
      - research/backtester
    paths:
      - '.github/workflows/backtester-sector-ad-v2.yml'
      - 'backtester/experiments/2026-08-27-sector-abc/**'
      - 'backtester/run_sector_ad_causal_terminal_terms_v2.py'
      - 'backtester/causal_terminal_terms.py'
      - 'backtester/data/causal-terminal-terms-v1.json'
      - 'backtester/data/causal-terminal-terms-v1.SHA256'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtester-sector-ad-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-sector-ad-v2:
    name: Fresh chronological A/D replay v2
    if: github.ref_name == 'research/backtester'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out frozen backtester laboratory inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-sector-ad-v2.yml
            /backtester/experiments/2026-08-27-sector-abc/**
            /backtester/run_sector_ad_causal_terminal_terms_v2.py
            /backtester/causal_terminal_terms.py
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_*.csv.gz
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt

      - name: Enforce immutable research-side boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/backtester"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Check out exact current-main strategy source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Verify exact main source identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=c502d077cae9c494f8b74a41ee8be7f40b25837d
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "${EXPECTED}"
          test -z "$(git -C main-src status --porcelain)"
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact current-main runtime dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Compile experiment and exact strategy sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/causal_terminal_terms.py \
            backtester/run_sector_ad_causal_terminal_terms_v2.py \
            backtester/experiments/2026-08-27-sector-abc/run.py
          python -m compileall -q -f main-src/sentinel main-src/shared/stock_strategy_shared

      - name: Verify all declared frozen input files are present
        shell: bash
        run: |
          set -euo pipefail
          test -f 'PIT input data/MANIFEST.csv'
          test -f 'PIT input data/ACTIONS_PIT_ONLY.csv.gz'
          test -f 'PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv'
          test -f 'PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz'
          test -f sharadar/SHARADAR_TICKERS.zip
          test -f backtester/data/causal-terminal-terms-v1.json
          test -f backtester/data/causal-terminal-terms-v1.SHA256
          (cd backtester/data && sha256sum -c causal-terminal-terms-v1.SHA256)
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
          count="$(find sharadar -maxdepth 1 -type f -name 'SHARADAR_SEP_*.csv.gz' | wc -l)"
          test "${count}" -ge 29

      - name: Run fresh chronological A/D experiment v2
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
          BACKTESTER_PROGRESS_INTERVAL_SESSIONS: '63'
        run: |
          set -euo pipefail
          rm -rf backtester-results/sector-ad-v2
          python backtester/run_sector_ad_causal_terminal_terms_v2.py \
            --lab-root . \
            --main-root main-src \
            --output backtester-results/sector-ad-v2 \
            2>&1 | tee backtester-sector-ad-v2.log

      - name: Verify result bundle and print headline table
        shell: bash
        run: |
          set -euo pipefail
          cd backtester-results/sector-ad-v2
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          summary = json.loads(Path('summary.json').read_text())
          if summary.get('status') != 'PASS':
              raise SystemExit('summary is not PASS')
          if summary.get('fresh_chronological_replay') is not True:
              raise SystemExit('fresh replay flag is not true')
          if summary.get('prerecorded_decision_inputs') is not False:
              raise SystemExit('prerecorded-decision boundary is not false')
          if summary.get('wealth_core_parity') is not True:
              raise SystemExit('A/D Wealth Core parity is not true')
          variants = summary.get('variant_definition') or {}
          if set(variants) != {'A', 'D'}:
              raise SystemExit(f'wrong variant set: {variants}')
          if summary.get('progress_interval_sessions') != 63:
              raise SystemExit('running CAGR checkpoint interval is not 63 sessions')
          d = summary.get('d_pit_semantics') or {}
          if d.get('sector') != 'strict-prior SEC SIC -> frozen FF12':
              raise SystemExit(f'D sector semantics are wrong: {d}')
          if d.get('wealth_core_path') != 'exact A/D parity required every session':
              raise SystemExit(f'D Wealth Core parity contract is wrong: {d}')
          terms = summary.get('causal_terminal_terms') or {}
          expected_terms_sha = 'b9a143e84548e2569391aa8080d75b97034d61187c81f40319f640480fb16a4a'
          if terms.get('sha256') != expected_terms_sha:
              raise SystemExit(f"wrong causal terminal terms hash: {terms.get('sha256')}")
          witness = terms.get('original_failure_boundary') or {}
          if witness.get('session') != '2001-06-04' or witness.get('open_unresolved_security_ids') != []:
              raise SystemExit(f'original failure boundary unresolved: {witness}')
          metrics = pd.read_csv('metrics.csv')
          variants = set(metrics['variant'].astype(str))
          if 'B' in variants or not {'A','D'}.issubset(variants):
              raise SystemExit(f'wrong metrics variants: {variants}')
          print(Path('metrics.csv').read_text())
          PY

      - name: Upload immutable experiment results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-sector-ad-v2-${{ github.run_id }}
          path: |
            backtester-results/sector-ad-v2/**
            backtester-sector-ad-v2.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
