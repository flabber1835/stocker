name: Backtester - Wealth Core 2018 mechanical-state diagnostic
run-name: Wealth Core 2018 mechanical-state diagnostic — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-wc-2018-diagnostic]
    paths:
      - '.github/workflows/backtester-wc-2018-mechanical-state-diagnostic.yml'
      - 'backtester/diagnose_wc_2018_mechanical_state.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT_DIR: backtester-results/wc-2018-mechanical-state-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-wc-2018-mechanical-state-diagnostic.yml
            /backtester/diagnose_wc_2018_mechanical_state.py
            /backtester/calibrate_broad_simplified_breadth.py
            /backtester/experiment2_broad_independent_correlation.py
            /backtester/run_r1000_correlation_peers.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /shared/stock_strategy_shared/wealth_core/
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Compile diagnostic harness
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/diagnose_wc_2018_mechanical_state.py \
            backtester/calibrate_broad_simplified_breadth.py \
            backtester/experiment2_broad_independent_correlation.py \
            backtester/run_research_ldrc_corrected_warmup_cash.py \
            backtester/run_research_ldrc_nonpit_vs_fullpit.py \
            shared/stock_strategy_shared/wealth_core/state.py

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat sharadar/SFP/SHARADAR_SFP.zip.001 sharadar/SFP/SHARADAR_SFP.zip.002 sharadar/SFP/SHARADAR_SFP.zip.003 sharadar/SFP/SHARADAR_SFP.zip.004 > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Run fresh zero-budget mechanical diagnostic
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m backtester.diagnose_wc_2018_mechanical_state --output "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum -c MECHANICAL_SHA256SUMS.txt)

      - name: Validate diagnostic contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd

          out=Path(os.environ['OUT_DIR'])
          s=json.loads((out/'wc_mechanical_summary.json').read_text())
          assert s['status']=='PASS'
          assert s['evidence_label']=='WEALTH_CORE_2018_MECHANICAL_STATE_DIAGNOSTIC'
          assert s['economic_experiments_consumed']==0
          assert s['experiment_budget_completed']==4
          assert s['strategy_decisions_changed'] is False
          assert abs(float(s['strategy9_2018_year_end_nav'])-21.214765615495)<5e-9
          assert s['cooldown_convention']['canonical_first_replacement_fill_open_offset']==21
          assert s['cooldown_convention']['research_first_replacement_fill_open_offset']==22
          assert s['cooldown_convention']['research_extra_replacement_session_vs_canonical']==1
          m=pd.read_csv(out/'wc_mechanical_daily.csv')
          assert len(m)>200
          assert {'held_slots','cooling_slots','ready_slots','admissible_candidates','admission_cap_binding'}.issubset(m.columns)
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Publish diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['OUT_DIR'])
          p=out/'wc_mechanical_summary.json'
          if not p.exists():
              raise SystemExit(0)
          s=json.loads(p.read_text())
          c=s['cooldown_convention']; d=s['deterioration_review_state_2018']; a=s['admission_pressure_2018']; x=s['exit_execution_2018']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Wealth Core 2018 mechanical-state diagnostic — zero budget\n\n')
              f.write('Economic experiment budget remains **4/10**; this diagnostic consumes **0**.\n\n')
              f.write(f"Cooldown earliest replacement fill — canonical: **+{c['canonical_first_replacement_fill_open_offset']} sessions**; research replay: **+{c['research_first_replacement_fill_open_offset']} sessions**.\n\n")
              f.write(f"2018 deterioration episodes: **{d['episodes']}**; already reviewed before deterioration: **{d['reviewed_before']}**.\n\n")
              f.write(f"One-admission cap binding sessions in 2018: **{a['cap_binding_sessions']} / {a['sessions']}**.\n\n")
              f.write(f"2018 exits delayed beyond the next open: **{x['exits_waiting_more_than_next_open']}**.\n")
          PY

      - name: Upload immutable diagnostic bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wc-2018-mechanical-state-diagnostic-${{ github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
