name: Apply Alpaca remediation on PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/alpaca-boundary-remediation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/alpaca-boundary-remediation
          fetch-depth: 2
      - name: Apply embedded reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('.github/workflows/alpaca-remediation-probe.yml').read_text()
          start = src.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = src.index("\n          PY\n", start)
          code = textwrap.dedent(src[start:end])
          Path('/tmp/apply_alpaca.py').write_text(code)
          PY
          python /tmp/apply_alpaca.py
          rm -f .github/workflows/alpaca-remediation-pr-apply.yml
          git diff --check
          python -m compileall -q -f sentinel tests/sentinel/test_alpaca_boundary_remediation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- sentinel tests/sentinel/test_alpaca_boundary_remediation.py .github/workflows/alpaca-remediation-probe.yml .github/workflows/alpaca-remediation-pr-apply.yml alpaca-remediation-probe.txt
          git commit -m 'Harden Alpaca recovery and execution authority'
          git push origin HEAD:fix/alpaca-boundary-remediation
