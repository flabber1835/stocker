name: Apply Alpaca remediation
on:
  push:
    branches: [fix/alpaca-boundary-remediation]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/alpaca-boundary-remediation
          fetch-depth: 2
      - name: Apply reviewed remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), got {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          # Typed evidence: native fill identity and account-bound observations.
          replace('sentinel/execution/contract.py', '''class BrokerFill:\n    client_key: Optional[str]\n    broker_order_id: str\n    quantity: Decimal\n    price: Decimal\n    filled_at: Optional[datetime] = None\n\n    def __post_init__(self) -> None:\n        _require_decimal("BrokerFill.quantity", self.quantity)\n        _require_decimal("BrokerFill.price", self.price)\n''', '''class BrokerFill:\n    client_key: Optional[str]\n    broker_order_id: str\n    quantity: Decimal\n    price: Decimal\n    filled_at: Optional[datetime] = None\n    activity_id: Optional[str] = None\n\n    def __post_init__(self) -> None:\n        _require_decimal("BrokerFill.quantity", self.quantity)\n        _require_decimal("BrokerFill.price", self.price)\n        if self.activity_id is not None and not str(self.activity_id).strip():\n            raise ValueError("BrokerFill.activity_id must be non-empty when present")\n''')
          replace('sentinel/execution/contract.py', '''    terminal_recovery_through: Optional[datetime] = None\n\n    def __post_init__(self) -> None:\n''', '''    terminal_recovery_through: Optional[datetime] = None\n    #: Broker/account identity bracketing this exact multi-request observation.\n    #: Adapters that can prove it populate this; reconciliation validates it\n    #: before any authority-bearing journal mutation.\n    account_identity: Optional[BrokerAccountIdentity] = None\n\n    def __post_init__(self) -> None:\n        if (self.account_identity is not None\n                and (not self.account_identity.broker\n                     or not self.account_identity.account_id)):\n            raise ValueError("BrokerObservation.account_identity is incomplete")\n''')

          # Alpaca account activities: request the whole non-trade category so a\n          # newly introduced cash-affecting type cannot be hidden by our filter.
          replace('sentinel/execution/alpaca.py', '''            params = {\n                "activity_types": ",".join(sorted(RECOGNIZED_ACTIVITY_TYPES)),\n                "after": floor.isoformat(),\n''', '''            params = {\n                "category": "non_trade_activity",\n                "after": floor.isoformat(),\n''')
          replace('sentinel/execution/alpaca.py', '''                activity_type = str(\n                    item.get("activity_type") or "").upper()\n                if activity_type not in RECOGNIZED_ACTIVITY_TYPES:\n                    raise MalformedBrokerPayload(\n                        f"account activity {activity_id} returned unexpected "\n                        f"type {activity_type!r}")\n                try:\n                    activity_date = date.fromisoformat(\n                        str(item.get("date") or "")[:10])\n                except ValueError:\n                    raise MalformedBrokerPayload(\n                        f"account activity {activity_id} has invalid date "\n                        f"{item.get('date')!r}") from None\n                amount = _required_dec(\n                    item.get("net_amount"),\n                    where=f"account activity {activity_id} net_amount",\n                    allow_negative=True)\n''', '''                activity_type = str(\n                    item.get("activity_type") or "").upper()\n                amount = _required_dec(\n                    item.get("net_amount"),\n                    where=f"account activity {activity_id} net_amount",\n                    allow_negative=True)\n                if activity_type not in RECOGNIZED_ACTIVITY_TYPES:\n                    if amount == 0:\n                        # Non-cash corporate activity is outside this ledger.\n                        # A new non-zero cash type is never silently filtered.\n                        continue\n                    raise MalformedBrokerPayload(\n                        f"unrecognized non-trade cash activity {activity_id} "\n                        f"type={activity_type!r} net_amount={amount}")\n                try:\n                    activity_date = date.fromisoformat(\n                        str(item.get("date") or "")[:10])\n                except ValueError:\n                    raise MalformedBrokerPayload(\n                        f"account activity {activity_id} has invalid date "\n                        f"{item.get('date')!r}") from None\n''')

          # Bracket every multi-request broker observation with account identity.
          replace('sentinel/execution/alpaca.py', '''    async def _observe_snapshot(\n            self, *, terminal_floor: Optional[datetime] = None,\n            recovery_through: Optional[datetime] = None) -> BrokerObservation:\n        opened, complete_open_a = await self._list_open_orders()\n''', '''    async def _observe_snapshot(\n            self, *, terminal_floor: Optional[datetime] = None,\n            recovery_through: Optional[datetime] = None) -> BrokerObservation:\n        account_before = await self.identify_account()\n        opened, complete_open_a = await self._list_open_orders()\n''')
          replace('sentinel/execution/alpaca.py', '''        recheck, merged_b = _merge_order_sets(reopened, terminal_b)\n        completeness = Completeness.COMPLETE\n''', '''        recheck, merged_b = _merge_order_sets(reopened, terminal_b)\n        account_after = await self.identify_account()\n        completeness = Completeness.COMPLETE\n        if (account_after.broker != account_before.broker\n                or account_after.account_id != account_before.account_id):\n            completeness = Completeness.INCONSISTENT\n''')
          replace('sentinel/execution/alpaca.py', '''            positions=tuple(positions), completeness=completeness,\n            terminal_recovery_through=recovery_through)\n''', '''            positions=tuple(positions), completeness=completeness,\n            terminal_recovery_through=recovery_through,\n            account_identity=account_before)\n''')

          # A plain Alpaca order may echo order_class as the empty string; Alpaca\n          # defines both empty and "simple" as simple orders.
          replace('sentinel/execution/alpaca.py', '''            if key not in payload\n            or payload[key] is None\n            or (key != "extended_hours" and payload[key] == "")]\n''', '''            if key not in payload\n            or payload[key] is None\n            or (key not in {"extended_hours", "order_class"}\n                and payload[key] == "")]\n''')
          replace('sentinel/execution/alpaca.py', '''        if str(payload.get("order_class") or "").lower() != "simple":\n            raise MalformedBrokerPayload(\n                "successful submit did not confirm simple order class")\n''', '''        order_class = str(payload.get("order_class") or "").lower()\n        if order_class not in {"", "simple"}:\n            raise MalformedBrokerPayload(\n                f"successful submit returned non-simple order class "\n                f"{payload.get('order_class')!r}")\n''')

          # Order-set stability must include the broker-native asset identity.
          replace('sentinel/execution/alpaca.py', '''        order.broker_order_id, order.client_key or "",\n        order.instrument.security_id, order.side.value, str(order.quantity),\n''', '''        order.broker_order_id, order.client_key or "",\n        order.instrument.security_id, order.instrument.broker_id or "",\n        order.side.value, str(order.quantity),\n''')

          # Replace the non-paginated fill helper with complete, native-ID paging.
          p = Path('sentinel/execution/alpaca.py'); text = p.read_text()
          pattern = re.compile(r'''    async def recent_fills\(self, since: datetime\) -> Sequence\[BrokerFill\]:\n.*?\n\n\ndef _fingerprint''', re.S)
          replacement = '''    async def recent_fills(self, since: datetime) -> Sequence[BrokerFill]:\n        floor = _required_aware_ts(since, where="fill activity lower boundary")\n        out: list[BrokerFill] = []\n        seen_ids: set[str] = set()\n        page_token: Optional[str] = None\n        for _page in range(MAX_ACTIVITY_PAGES):\n            params = {\n                "after": floor.isoformat(),\n                "direction": "asc",\n                "page_size": ACTIVITY_PAGE_SIZE,\n            }\n            if page_token:\n                params["page_token"] = page_token\n            payload = await self._get("/v2/account/activities/FILL", params)\n            if not isinstance(payload, list):\n                raise MalformedBrokerPayload("fill activities response must be an array")\n            if len(payload) > ACTIVITY_PAGE_SIZE:\n                raise MalformedBrokerPayload("fill activities page exceeds requested limit")\n            if not payload:\n                return tuple(out)\n            page_ids: list[str] = []\n            for activity in payload:\n                if not isinstance(activity, dict):\n                    raise MalformedBrokerPayload("fill activities contains a non-object row")\n                activity_id = str(activity.get("id") or "").strip()\n                if not activity_id:\n                    raise MalformedBrokerPayload("fill activity has no native id")\n                if activity_id in seen_ids:\n                    raise MalformedBrokerPayload(\n                        f"fill activity pagination repeated native id {activity_id}")\n                seen_ids.add(activity_id)\n                page_ids.append(activity_id)\n                out.append(BrokerFill(\n                    client_key=None, activity_id=activity_id,\n                    broker_order_id=str(activity.get("order_id") or ""),\n                    quantity=_required_dec(\n                        activity.get("qty"), where=f"activity {activity_id} qty"),\n                    price=_required_dec(\n                        activity.get("price"), where=f"activity {activity_id} price"),\n                    filled_at=_parse_ts(activity.get("transaction_time"))))\n            if len(payload) < ACTIVITY_PAGE_SIZE:\n                return tuple(out)\n            next_token = page_ids[-1]\n            if not next_token or next_token == page_token:\n                raise MalformedBrokerPayload(\n                    "fill activity pagination cannot prove a complete traversal")\n            page_token = next_token\n        raise MalformedBrokerPayload(\n            f"fill activity recovery exceeded {MAX_ACTIVITY_PAGES} pages; "\n            "refusing to imply completeness")\n\n\ndef _fingerprint'''
          text2, n = pattern.subn(replacement, text)
          if n != 1: raise SystemExit(f'alpaca recent_fills replacement count={n}')
          p.write_text(text2)

          # Stable asset identity is re-resolved immediately before the final\n          # authority callback. Alpaca POST is symbol-addressed, so this is the\n          # last available proof against delist/relist or symbol reuse races.
          replace('sentinel/execution/guarded.py', '''        # XNYS remains the outer execution authority.  For increases, the\n''', '''        if self.capabilities.instrument_identity:\n            if not instrument.broker_id:\n                raise PreTransportAuthorityRefused(\n                    "durable command has no broker-native instrument identity")\n            try:\n                current = await self.resolve_instrument(\n                    security_id=instrument.security_id, symbol=instrument.symbol)\n            except BrokerAuthorityRefused as exc:\n                raise PreTransportAuthorityRefused(\n                    f"instrument identity unavailable before submit: {exc}") from exc\n            except Exception as exc:                          # noqa: BLE001\n                raise PreTransportAuthorityRefused(\n                    "instrument identity unavailable before submit: "\n                    f"{type(exc).__name__}: {exc}") from exc\n            if (current.security_id != instrument.security_id\n                    or current.symbol != instrument.symbol\n                    or current.broker_id != instrument.broker_id):\n                raise PreTransportAuthorityRefused(\n                    "broker-native instrument identity changed before submit; "\n                    f"durable={instrument}, current={current}")\n\n        # XNYS remains the outer execution authority.  For increases, the\n''')

          # Reconciliation refuses an account-bound observation before recording\n          # or adopting anything from it; ordinary broker-id drift is conflict.
          replace('sentinel/execution/reconcile.py', '''    observation_seq = journal.record_observation(\n        conn, observation, RuntimeState.RECONCILING.value)\n''', '''    if observation.account_identity is not None:\n        observed_identity = observation.account_identity\n        if (observed_identity.broker != identity.broker\n                or observed_identity.account_id != identity.account_id):\n            return ReconciliationResult(\n                runtime_state=RuntimeState.RECONCILING, observation=observation,\n                detail=("broker account identity changed during observation; "\n                        "no journal mutation was accepted"))\n\n    observation_seq = journal.record_observation(\n        conn, observation, RuntimeState.RECONCILING.value)\n''')
          replace('sentinel/execution/reconcile.py', '''    if order.quantity != command.quantity:\n        conflicts.append(\n            f"quantity {order.quantity} != {command.quantity}")\n''', '''    if order.quantity != command.quantity:\n        conflicts.append(\n            f"quantity {order.quantity} != {command.quantity}")\n    if (command.instrument.broker_id is not None\n            and order.instrument.broker_id != command.instrument.broker_id):\n        conflicts.append(\n            f"broker instrument {order.instrument.broker_id!r} != "\n            f"{command.instrument.broker_id!r}")\n''')

          # Native fill IDs are the idempotency authority. Old rows retain their\n          # content hash fallback only for compatibility with already-retained data.
          replace('sentinel/execution/journal.py', '''def fill_fingerprint(fill: BrokerFill) -> str:\n    payload = {\n        "broker_order_id": fill.broker_order_id,\n        "quantity": str(fill.quantity),\n        "price": str(fill.price),\n        "filled_at": fill.filled_at.isoformat() if fill.filled_at else None,\n    }\n''', '''def fill_fingerprint(fill: BrokerFill) -> str:\n    if fill.activity_id is not None:\n        payload = {"broker_activity_id": fill.activity_id}\n    else:\n        payload = {\n            "broker_order_id": fill.broker_order_id,\n            "quantity": str(fill.quantity),\n            "price": str(fill.price),\n            "filled_at": fill.filled_at.isoformat() if fill.filled_at else None,\n        }\n''')

          # Retained observations include broker-native asset IDs and account\n          # provenance without changing the physical behavioral schema.
          replace('sentinel/execution/journal.py', '''             json.dumps({k: str(v) for k, v in\n                          sorted(observation.positions_by_security().items())}),\n             json.dumps([{"id": o.broker_order_id, "key": o.client_key,\n                          "security_id": o.instrument.security_id,\n                          "side": o.side.value, "state": o.state.value,\n                          "qty": str(o.quantity),\n                          "filled": str(o.filled_quantity)}\n                         for o in observation.orders]),\n''', '''             json.dumps({\n                 "account": ({"broker": observation.account_identity.broker,\n                              "account_id": observation.account_identity.account_id}\n                             if observation.account_identity else None),\n                 "positions": [\n                     {"security_id": p.instrument.security_id,\n                      "broker_id": p.instrument.broker_id,\n                      "qty": str(p.quantity)}\n                     for p in observation.positions]}),\n             json.dumps([{"id": o.broker_order_id, "key": o.client_key,\n                          "security_id": o.instrument.security_id,\n                          "broker_id": o.instrument.broker_id,\n                          "side": o.side.value, "state": o.state.value,\n                          "qty": str(o.quantity),\n                          "filled": str(o.filled_quantity)}\n                         for o in observation.orders]),\n''')

          # Terminal watermark witness: bind each advancement to the exact\n          # finalized COMPLETE observation that earned it. Legacy watermarks are\n          # accepted only when that exact durable observation already exists.
          insert_point = '''def terminal_recovery_checkpoint(conn) -> datetime:\n'''
          witness_helpers = '''TERMINAL_RECOVERY_WITNESS_PREFIX = "terminal-recovery-witness:v1:"\n\n\ndef _terminal_recovery_witness_name(broker: str, account_id: str) -> str:\n    return f"{TERMINAL_RECOVERY_WITNESS_PREFIX}{broker}:{account_id}"\n\n\ndef _terminal_observation_witness(conn, through: datetime):\n    with conn.cursor() as cur:\n        cur.execute(\n            "SELECT seq,observed_at,terminal_recovery_through,completeness,"\n            "positions,orders,runtime_state FROM sentinel_observations"\n            " WHERE terminal_recovery_through=%s AND completeness='COMPLETE'"\n            " AND runtime_state <> 'RECONCILING' ORDER BY seq DESC LIMIT 1",\n            (through,))\n        row = cur.fetchone()\n    if row is None:\n        return None\n    payload = {\n        "seq": int(row[0]), "observed_at": _aware_utc(row[1], "observation").isoformat(),\n        "through": _aware_utc(row[2], "observation boundary").isoformat(),\n        "completeness": str(row[3]), "positions": row[4], "orders": row[5],\n        "runtime_state": str(row[6]),\n    }\n    digest = hashlib.sha256(\n        json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str)\n        .encode("utf-8")).hexdigest()\n    return int(row[0]), digest\n\n\n'''
          replace('sentinel/execution/journal.py', insert_point, witness_helpers + insert_point)
          replace('sentinel/execution/journal.py', '''    if row[2] is None:\n        raise RuntimeError(\n            "terminal recovery watermark has no processed boundary")\n    return _aware_utc(row[2], "terminal recovery checkpoint")\n''', '''    if row[2] is None:\n        raise RuntimeError(\n            "terminal recovery watermark has no processed boundary")\n    processed = _aware_utc(row[2], "terminal recovery checkpoint")\n    observed = _terminal_observation_witness(conn, processed)\n    if observed is None:\n        raise RuntimeError(\n            "terminal recovery watermark has no finalized COMPLETE observation "\n            "witness; refusing to narrow broker history")\n    observation_seq, digest = observed\n    name = _terminal_recovery_witness_name(broker, account_id)\n    with conn.cursor() as cur:\n        cur.execute(\n            "SELECT state FROM sentinel_processed_sessions WHERE cursor_name=%s",\n            (name,))\n        witness_row = cur.fetchone()\n    if witness_row is not None:\n        state = witness_row[0] if isinstance(witness_row[0], dict) else json.loads(str(witness_row[0]))\n        expected = {\n            "kind": "terminal-recovery-witness/v1",\n            "broker": broker, "account_id": account_id,\n            "processed_through": processed.isoformat(),\n            "observation_seq": observation_seq,\n            "observation_sha256": digest,\n        }\n        if state != expected:\n            raise RuntimeError(\n                "terminal recovery watermark integrity witness disagrees with "\n                "its finalized observation")\n    return processed\n''')
          replace('sentinel/execution/journal.py', '''    processed = max(current, candidate)\n    with conn.cursor() as cur:\n        cur.execute(\n            "INSERT INTO sentinel_terminal_recovery_watermark"\n''', '''    processed = max(current, candidate)\n    observed = _terminal_observation_witness(conn, processed)\n    if observed is None:\n        raise RuntimeError(\n            "terminal recovery cannot advance without a finalized COMPLETE "\n            "observation at the exact processed boundary")\n    observation_seq, digest = observed\n    witness_name = _terminal_recovery_witness_name(broker, account_id)\n    witness = {\n        "kind": "terminal-recovery-witness/v1",\n        "broker": broker, "account_id": account_id,\n        "processed_through": processed.isoformat(),\n        "observation_seq": observation_seq,\n        "observation_sha256": digest,\n    }\n    with conn.cursor() as cur:\n        cur.execute(\n            "INSERT INTO sentinel_terminal_recovery_watermark"\n''')
          replace('sentinel/execution/journal.py', '''            (broker, account_id, processed))\n    conn.commit()\n    return processed\n''', '''            (broker, account_id, processed))\n        cur.execute(\n            "INSERT INTO sentinel_processed_sessions (cursor_name,session,state)"\n            " VALUES (%s,%s,%s::jsonb) ON CONFLICT (cursor_name) DO UPDATE SET"\n            " session=EXCLUDED.session,state=EXCLUDED.state,updated_at=NOW()",\n            (witness_name, processed.date().isoformat(),\n             json.dumps(witness, sort_keys=True)))\n    conn.commit()\n    return processed\n''')

          # Finalize the exact observation before it becomes the recovery witness.\n          replace('sentinel/execution/reconcile.py', '''    if not adoption_conflicts:\n        journal.advance_terminal_recovery_watermark(\n            conn, recovery_through)\n\n    # The evidence row was committed before recovery on purpose. Now that the\n    # complete reconciliation has a verdict, bind that verdict to the exact row\n    # so read-only operational surfaces do not report the temporary\n    # RECONCILING placeholder forever.\n    journal.finalize_observation_runtime(conn, observation_seq, state.value)\n''', '''    # The evidence row was committed before recovery on purpose. Finalize it\n    # first; a crash before the watermark commit merely replays this interval.\n    journal.finalize_observation_runtime(conn, observation_seq, state.value)\n    if not adoption_conflicts:\n        journal.advance_terminal_recovery_watermark(\n            conn, recovery_through)\n''')

          # Use native fill activity as a late-fill tripwire even after an old\n          # order's submitted_at has aged out of closed-order pagination.
          replace('sentinel/execution/reconcile.py', '''    stored = journal.load_commands(conn, deployment)\n    known_keys = {c.client_key for c in stored}\n''', '''    stored = journal.load_commands(conn, deployment)\n    try:\n        recent_fills = await broker.recent_fills(recovery_floor)\n        fill_identity = await broker.identify_account()\n    except BrokerAuthorityRefused:\n        raise\n    except Exception as exc:                              # noqa: BLE001\n        return ReconciliationResult(\n            runtime_state=RuntimeState.BROKER_DEGRADED, observation=observation,\n            observation_id=observation_seq,\n            detail=f"fill activity recovery unavailable: {exc}")\n    if (fill_identity.broker != identity.broker\n            or fill_identity.account_id != identity.account_id):\n        return ReconciliationResult(\n            runtime_state=RuntimeState.RECONCILING, observation=observation,\n            observation_id=observation_seq,\n            detail="broker identity changed while recovering fill activities")\n    journal.record_fills(conn, recent_fills)\n    by_broker_order = {c.broker_order_id: c for c in stored if c.broker_order_id}\n    for fill in recent_fills:\n        command = by_broker_order.get(fill.broker_order_id)\n        if command is None or command.state not in {\n                CommandState.CANCELLED, CommandState.FILLED, CommandState.REJECTED}:\n            continue\n        try:\n            latest = await broker.find_by_client_key(command.client_key)\n        except BrokerAuthorityRefused:\n            raise\n        except Exception as exc:                          # noqa: BLE001\n            return ReconciliationResult(\n                runtime_state=RuntimeState.BROKER_DEGRADED, observation=observation,\n                observation_id=observation_seq,\n                detail=f"late-fill exact lookup unavailable: {exc}")\n        if latest is None:\n            return ReconciliationResult(\n                runtime_state=RuntimeState.RECONCILING, observation=observation,\n                observation_id=observation_seq,\n                detail=("late fill activity references terminal Sentinel order "\n                        f"{fill.broker_order_id} but exact order evidence vanished"))\n        conflict = _order_command_conflict(latest, command)\n        if conflict:\n            return ReconciliationResult(\n                runtime_state=RuntimeState.RECONCILING, observation=observation,\n                observation_id=observation_seq, detail=conflict)\n\n    known_keys = {c.client_key for c in stored}\n''')

          # Emergency kill and execution-authority revocation serialize with the\n          # same session advisory writer lock as broker-mutating execution.
          replace('sentinel/automation/store.py', '''def engage_kill(conn, *, actor: str, reason: str) -> AutomationControl:\n''', '''def engage_kill(conn, *, actor: str, reason: str) -> AutomationControl:\n    with writer_lock(conn):\n        return _engage_kill_locked(conn, actor=actor, reason=reason)\n\n\ndef _engage_kill_locked(conn, *, actor: str, reason: str) -> AutomationControl:\n''')
          replace('sentinel/authority.py', '''from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey\n''', '''from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey\n\nfrom sentinel.execution import journal as execution_journal\n''')
          marker = '''@_rollback_authority_failure\ndef revoke_signed_certificate(\n'''
          decorator = '''def _execution_writer_serialized(function):\n    @wraps(function)\n    def serialized(conn, *args, **kwargs):\n        with execution_journal.writer_lock(conn):\n            return function(conn, *args, **kwargs)\n    return serialized\n\n\n@_rollback_authority_failure\n@_execution_writer_serialized\ndef revoke_signed_certificate(\n'''
          replace('sentinel/authority.py', marker, decorator)
          replace('sentinel/authority.py', '''@_rollback_authority_failure\ndef revoke_signed_key(\n''', '''@_rollback_authority_failure\n@_execution_writer_serialized\ndef revoke_signed_key(\n''')

          # Real Alpaca wire-shape and boundary regressions.
          test = Path('tests/sentinel/test_alpaca_boundary_remediation.py')
          test.write_text(r'''from __future__ import annotations\n\nimport asyncio\nfrom datetime import datetime, timezone\nfrom decimal import Decimal\n\nimport pytest\n\nfrom sentinel.execution import journal\nfrom sentinel.execution.alpaca import AlpacaExecutionBroker, MalformedBrokerPayload\nfrom sentinel.execution.contract import BrokerFill, BrokerInstrument, Side\n\nUTC = timezone.utc\nPAPER = "https://paper-api.alpaca.markets"\nINSTRUMENT = BrokerInstrument("SEC-AAPL", "AAPL", "asset-aapl")\n\n\ndef run(coro):\n    return asyncio.run(coro)\n\n\nclass Response:\n    def __init__(self, payload, status_code=200):\n        self.payload = payload; self.status_code = status_code; self.text = ""; self.headers = {}\n    def json(self): return self.payload\n    def raise_for_status(self):\n        if self.status_code >= 400: raise RuntimeError(self.status_code)\n\n\nclass HTTP:\n    def __init__(self, post=None, get=None): self.post = post; self.getter = get; self.calls = []\n    @property\n    def AsyncClient(self):\n        outer = self\n        class Client:\n            def __init__(self, **kwargs): pass\n            async def __aenter__(self): return self\n            async def __aexit__(self, *args): return False\n            async def post(self, url, headers=None, json=None): return outer.post\n            async def get(self, url, headers=None, params=None):\n                outer.calls.append((url, dict(params or {})))\n                value = outer.getter(dict(params or {})) if callable(outer.getter) else outer.getter\n                return value if isinstance(value, Response) else Response(value)\n        return Client\n\n\ndef broker(http):\n    return AlpacaExecutionBroker(api_key="k", secret_key="s", base_url=PAPER,\n        resolve_security_id=lambda symbol, _as_of=None: f"SEC-{symbol}",\n        http_provider=lambda: http)\n\n\ndef order(**changes):\n    value = {"id":"o1","client_order_id":"k1","symbol":"AAPL",\n        "asset_id":"asset-aapl","side":"buy","status":"new","qty":"2",\n        "filled_qty":"0","filled_avg_price":None,"submitted_at":"2026-08-19T17:00:00Z",\n        "type":"market","time_in_force":"day","order_class":"",\n        "extended_hours":False}\n    value.update(changes); return value\n\n\ndef test_plain_order_empty_order_class_is_valid_alpaca_simple_wire_shape():\n    outcome = run(broker(HTTP(post=Response(order()))).submit(\n        client_key="k1", instrument=INSTRUMENT, side=Side.BUY, quantity=Decimal(2)))\n    assert outcome.state.value == "ACKNOWLEDGED"\n\n\ndef test_nontrade_activity_query_does_not_filter_unknown_cash_type():\n    seen = []\n    def page(params):\n        seen.append(params)\n        return [{"id":"x1","activity_type":"FUTURE_CASH","date":"2026-08-19","net_amount":"1"}]\n    b = broker(HTTP(get=page))\n    with pytest.raises(MalformedBrokerPayload, match="unrecognized non-trade cash"):\n        run(b.account_cash_activities(after=datetime(2026,8,19,tzinfo=UTC),\n                                      through=datetime(2026,8,20,tzinfo=UTC)))\n    assert seen[0]["category"] == "non_trade_activity"\n    assert "activity_types" not in seen[0]\n\n\ndef test_native_fill_id_distinguishes_identical_economics():\n    base = dict(client_key=None, broker_order_id="o", quantity=Decimal(1),\n                price=Decimal(10), filled_at=datetime(2026,8,19,tzinfo=UTC))\n    assert journal.fill_fingerprint(BrokerFill(activity_id="a", **base)) != \
