name: Codex apply backtester financial remediation

on:
  push:
    branches: [codex/fix-backtester-financial-audit-20260831]
    paths: [.github/workflows/codex-apply-backtester-financial-remediation.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact backtester target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: true

      - name: Prove only permitted write target
        shell: bash
        run: |
          set -euo pipefail
          TARGET=research/backtester
          test "${TARGET}" = "research/backtester"
          test "$(git rev-parse HEAD)" = "c6a1e253fb3b6b12fa8572d039b8c4894a1b917d"
          test -z "$(git status --porcelain)"

      - name: Apply audited remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          OLD = '887f479b15ad861313da666ad698034d3847121c'
          MAIN = 'c851386fa4dddcf2e2533af3a1d313c38220b7f2'
          EMPTY = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'

          def replace_all_required(path: str, old: str, new: str, minimum: int = 1) -> None:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n < minimum:
                  raise RuntimeError(f'{path}: expected at least {minimum} replacements, found {n}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          def replace_overlay_step(path: str, next_step_name: str = 'Set up Python 3.12') -> None:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              start_mark = '      - name: Apply and identify the backtester-only production correction\n'
              if start_mark not in s:
                  start_mark = '      - name: Apply and verify backtester-only production correction\n'
              start = s.index(start_mark)
              end_mark = f'      - name: {next_step_name}\n'
              end = s.index(end_mark, start)
              new = '''      - name: Verify exact unmodified production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C main-src rev-parse HEAD)" = "${PRODUCTION_MAIN_SHA:-''' + MAIN + '''}"
          test -z "$(git -C main-src status --porcelain)"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "8dd316ed28ff9b82c216f852118f8ef83d8510ad"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "466a8f8202692e65e08596a7a47d45bd15bb3fd3"
          test "$(git -C main-src hash-object sentinel/core/kernel.py)" = "12617af8eb954d4ae18fef2ae16977048e2e40cd"
          test "$(git -C main-src hash-object sentinel/core/production.py)" = "99e8f87aa456fc672c84b0b0ceb3d674ca7ccf4c"
          YEAR_ROOT="backtester-results/${CHAIN_YEAR:+production-year-${CHAIN_YEAR}}"
          if test -z "${CHAIN_YEAR:-}"; then YEAR_ROOT="backtester-results/strict-pit-20y-diagnostic"; fi
          mkdir -p "${YEAR_ROOT}"
          : > "${YEAR_ROOT}/production-overlay.diff"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ.get('YEAR_OUTPUT_ROOT') or (
              f"backtester-results/production-year-{os.environ['CHAIN_YEAR']}"
              if os.environ.get('CHAIN_YEAR') else
              'backtester-results/strict-pit-20y-diagnostic'))
          root.mkdir(parents=True, exist_ok=True)
          diff = root / 'production-overlay.diff'
          if not diff.exists(): diff.write_bytes(b'')
          digest = hashlib.sha256(diff.read_bytes()).hexdigest()
          evidence = {
              'schema': 'backtester.production-source-witness/1',
              'source_mode': 'exact_unmodified_main_kernel',
              'production_main_sha': os.environ.get('PRODUCTION_MAIN_SHA', ''' + repr(MAIN) + '''),
              'diff_sha256': digest,
              'mutation_applied': False,
              'canonical_kernel': 'sentinel.core.kernel.advance_session',
          }
          (root / 'production-overlay.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\\n', encoding='utf-8')
          PY
          PRODUCTION_OVERLAY_SHA256="''' + EMPTY + '''"
          test -z "$(git -C main-src status --porcelain)"
          echo "PRODUCTION_OVERLAY_SHA256=${PRODUCTION_OVERLAY_SHA256}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_SHA=${PRODUCTION_MAIN_SHA:-''' + MAIN + '''}" >> "${GITHUB_ENV}"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

'''
              p.write_text(s[:start] + new + s[end:], encoding='utf-8')

          p = Path('backtester/run_production_strict_pit_20y.py')
          s = p.read_text(encoding='utf-8')
          if OLD not in s:
              raise RuntimeError('production entrypoint stale pin seam missing')
          s = s.replace(OLD, MAIN)
          needle = f'EXPECTED_MAIN_SHA = "{MAIN}"\n\n'
          insert = needle + (
              '# The retained production harness module is historical; bind its runtime identity\n'
              '# to the exact current-main checkout before any replay or manifest is created.\n'
              'strict.corrected.prod.EXPECTED_MAIN_SHA = EXPECTED_MAIN_SHA\n'
              'strict.corrected.prod.base.runner.EXPECTED_MAIN_SHA = EXPECTED_MAIN_SHA\n\n'
          )
          if 'strict.corrected.prod.EXPECTED_MAIN_SHA' not in s:
              if s.count(needle) != 1:
                  raise RuntimeError('production identity insertion seam missing')
              s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')

          worker = '.github/workflows/backtester-production-strict-pit-year-worker.yml'
          replace_all_required(worker, OLD, MAIN, 2)
          p = Path(worker)
          s = p.read_text(encoding='utf-8').replace('            /backtester/apply_production_cooldown_age_zero.py\n', '')
          p.write_text(s, encoding='utf-8')
          replace_overlay_step(worker)

          combined = '.github/workflows/backtester-strict-pit-20y.yml'
          replace_all_required(combined, OLD, MAIN, 2)
          p = Path(combined)
          s = p.read_text(encoding='utf-8').replace('            /backtester/apply_production_cooldown_age_zero.py\n', '')
          p.write_text(s, encoding='utf-8')
          replace_overlay_step(combined)

          replace_all_required('.github/workflows/backtester-research-only-20y.yml', OLD, MAIN, 2)

          p = Path('backtester/data/production-chain-generation.json')
          d = json.loads(p.read_text())
          d['production_main_sha'] = MAIN
          d['production_source_mode'] = 'exact_unmodified_main_kernel'
          d['execution']['production_source_mutation'] = False
          p.write_text(json.dumps(d, indent=2) + '\n', encoding='utf-8')

          Path('backtester/__init__.py').write_text(
              '"""Research backtester package.\n\n'
              'The package marker keeps pytest collection from shadowing these modules with\n'
              '``tests/backtester``.\n"""\n', encoding='utf-8')

          p = Path('backtester/PRODUCTION_20Y_ANNUAL_CHAIN_DESIGN.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              f'Scope: `research/backtester` only. Production `main` remains read-only and pinned\nto `{OLD}`.\n',
              f'Scope: `research/backtester` only. Production `main` remains read-only and is\npinned to `{MAIN}` for the current certification chain.\n\n'
              '## Exact current-main production-source rule\n\n'
              'The current chain executes the exact, unmodified production source from the pinned\n'
              'main commit. `sentinel.core.production.advance_state` delegates directly to the\n'
              'canonical `sentinel.core.kernel.advance_session`. The backtester must keep\n'
              '`main-src` clean; the kernel, production adapter, Wealth Core adapter, and\n'
              'persistent state blobs are hash-checked before economic replay. Earlier\n'
              'certificates using `887f479b...` plus the issue-294 overlay remain historical\n'
              'evidence and cannot authenticate this current-main chain.\n'
          )
          s = s.replace(
              'pinned production source, applied\n   production overlay, checkpoint implementation, canonical manifest, and',
              'pinned production source, exact no-mutation source witness,\n   checkpoint implementation, canonical manifest, and')
          p.write_text(s, encoding='utf-8')

          p = Path('tests/backtester/test_production_annual_chain.py')
          s = p.read_text(encoding='utf-8')
          needle = '    def test_source_identity_failure_context_and_genesis_equivalence_are_enforced(self):\n'
          if 'test_current_main_is_unmodified_production_authority' not in s:
              test = f'''    def test_current_main_is_unmodified_production_authority(self):
        self.assertIn("PRODUCTION_MAIN_SHA: {MAIN}", self.worker)
        self.assertIn("ref: {MAIN}", self.worker)
        self.assertIn("Verify exact unmodified production source", self.worker)
        self.assertIn("sentinel/core/kernel.py", self.worker)
        self.assertIn("mutation_applied", self.worker)
        self.assertNotIn("python backtester/apply_production_cooldown_age_zero.py", self.worker)

'''
              if s.count(needle) != 1:
                  raise RuntimeError('annual chain test insertion seam missing')
              s = s.replace(needle, test + needle, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/backtester/test_canonical_pit_dataset.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('self.assertIn("canonical-pit-2006-2007.json", diagnostic_replay)',
                        'self.assertIn("canonical-pit-20y.json", diagnostic_replay)')
          s = s.replace('self.assertIn("canonical-pit-2006-2007-equivalence-request.json", diagnostic_replay)',
                        'self.assertIn("canonical-pit-20y-certification-request.json", diagnostic_replay)')
          s = s.replace('self.assertIn("backtester-canonical-pit-2006-2007-equivalence", diagnostic_replay)',
                        'self.assertIn("name: causal-checkpoint", diagnostic_replay)')
          p.write_text(s, encoding='utf-8')

          print('backtester financial-source remediation applied')
          PY

      - name: Validate remediation before publication
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backtester/run_production_strict_pit_20y.py backtester/__init__.py
          python -m unittest tests.backtester.test_production_annual_chain -v
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('backtester/data/production-chain-generation.json').read_text())
          assert d['production_main_sha'] == 'c851386fa4dddcf2e2533af3a1d313c38220b7f2'
          assert d['production_source_mode'] == 'exact_unmodified_main_kernel'
          assert d['execution']['production_source_mutation'] is False
          import backtester
          assert str(Path(backtester.__file__).resolve()).endswith('backtester/__init__.py')
          PY

      - name: Commit only backtester remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/backtester"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/backtester-production-strict-pit-year-worker.yml .github/workflows/backtester-strict-pit-20y.yml .github/workflows/backtester-research-only-20y.yml backtester/__init__.py backtester/run_production_strict_pit_20y.py backtester/data/production-chain-generation.json backtester/PRODUCTION_20Y_ANNUAL_CHAIN_DESIGN.md tests/backtester/test_production_annual_chain.py tests/backtester/test_canonical_pit_dataset.py
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E "(^|/)(sec|sec-filings)(/|$)|sec[_-]?backfill"; then exit 1; fi
          git commit -m "Fix backtester production source equivalence"
          test "$(git branch --show-current)" = "research/backtester"
          git push origin HEAD:refs/heads/research/backtester
