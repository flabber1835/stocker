name: Codex apply backtester financial remediation

on:
  push:
    branches: [codex/fix-backtester-financial-audit-20260831]
    paths: [.github/workflows/codex-apply-backtester-financial-remediation.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact backtester target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: true

      - name: Prove only permitted write target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/backtester"
          test "$(git rev-parse HEAD)" = "c6a1e253fb3b6b12fa8572d039b8c4894a1b917d"
          test -z "$(git status --porcelain)"

      - name: Apply audited remediation
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/backtester-remediation.b64
          printf '%s' '' >> /tmp/backtester-remediation.b64
          printf '%s' '' >> /tmp/backtester-remediation.b64
          printf '%s' '' >> /tmp/backtester-remediation.b64
          printf '%s' '' >> /tmp/backtester-remediation.b64
          printf '%s' '' >> /tmp/backtester-remediation.b64
          base64 -d /tmp/backtester-remediation.b64 > /tmp/backtester-remediation.py
          python -m py_compile /tmp/backtester-remediation.py
          python /tmp/backtester-remediation.py

      - name: Validate remediation before publication
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backtester/run_production_strict_pit_20y.py backtester/__init__.py
          python -m unittest tests.backtester.test_production_annual_chain tests.backtester.test_canonical_pit_dataset -v
          python - <<'PY'
          import json
          from pathlib import Path
          import backtester
          d = json.loads(Path('backtester/data/production-chain-generation.json').read_text())
          assert d['production_main_sha'] == 'c851386fa4dddcf2e2533af3a1d313c38220b7f2'
          assert d['production_source_mode'] == 'exact_unmodified_main_kernel'
          assert d['execution']['production_source_mutation'] is False
          assert str(Path(backtester.__file__).resolve()).endswith('backtester/__init__.py')
          PY

      - name: Commit only backtester remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/backtester"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/backtester-production-strict-pit-year-worker.yml .github/workflows/backtester-strict-pit-20y.yml .github/workflows/backtester-research-only-20y.yml backtester/__init__.py backtester/run_production_strict_pit_20y.py backtester/data/production-chain-generation.json backtester/PRODUCTION_20Y_ANNUAL_CHAIN_DESIGN.md tests/backtester/test_production_annual_chain.py tests/backtester/test_canonical_pit_dataset.py
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '(^|/)(sec|sec-filings)(/|$)|sec[_-]?backfill'; then exit 1; fi
          git commit -m "Fix backtester production source equivalence"
          test "$(git branch --show-current)" = "research/backtester"
          git push origin HEAD:refs/heads/research/backtester
