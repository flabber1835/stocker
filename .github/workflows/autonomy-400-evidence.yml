name: Autonomy 400 evidence
on:
  push:
    branches: ['audit/autonomy-400-evidence']
    paths: ['audit/**', 'audit-support/**', '.github/workflows/autonomy-400-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autonomy-400-evidence
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read audit witnesses
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit-runner
          sparse-checkout: |
            audit
            audit-support
      - name: Read exact production baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aff4461d9af6d4a7367018768fda18d948958b49
          path: subject
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            subject/sentinel/requirements.lock
            subject/tests/requirements.lock
      - name: Install locked dependencies and disposable PostgreSQL
        working-directory: subject
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r sentinel/requirements.lock -r tests/requirements.lock
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Record exact audit identity
        working-directory: subject
        run: |
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = aff4461d9af6d4a7367018768fda18d948958b49
          git rev-parse HEAD > ../evidence/tested-commit.txt
          git rev-parse 'HEAD^{tree}' > ../evidence/tested-tree.txt
          git status --porcelain > ../evidence/source-status-before.txt
          python -V > ../evidence/python-version.txt
          python -m pip freeze > ../evidence/packages.txt
          sha256sum sentinel/requirements.lock tests/requirements.lock ../audit-runner/audit/autonomy_400_witnesses.py ../audit-runner/audit-support/autonomy_400_extended.py > ../evidence/input-sha256.txt
          cp ../audit-runner/audit/autonomy_400_witnesses.py "$RUNNER_TEMP/test_autonomy_400.py"
          cp ../audit-runner/audit-support/autonomy_400_extended.py "$RUNNER_TEMP/autonomy_400_extended.py"
      - name: Initial and extended defect witnesses
        id: witnesses
        continue-on-error: true
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject:${{ github.workspace }}/subject/shared:${{ runner.temp }}
        run: |
          set -o pipefail
          python -m pytest -q -ra "$RUNNER_TEMP/test_autonomy_400.py" "$RUNNER_TEMP/autonomy_400_extended.py" --junitxml=../evidence/witnesses.xml 2>&1 | tee ../evidence/witnesses.log
      - name: Diagnose existing worker restart failure
        id: recovery
        continue-on-error: true
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject:${{ github.workspace }}/subject/shared:${{ runner.temp }}
        run: |
          set -o pipefail
          python -m pytest -q -ra -p autonomy_400_extended 'tests/sentinel/test_automation_worker_source_recovery.py::test_worker_wait_restart_source_healing_and_transport[recover]' --junitxml=../evidence/recovery.xml 2>&1 | tee ../evidence/recovery.log
      - name: Existing execution deployment and strategy components
        id: components
        continue-on-error: true
        working-directory: subject
        env:
          PYTHONPATH: ${{ github.workspace }}/subject:${{ github.workspace }}/subject/shared
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          patterns = ['test_panel*.py','test_paper*.py','test_preopen_paper_gate.py','test_execution*.py','test_guarded_execution_broker.py','test_automation_runtime.py','test_automation_p0_continuity.py','test_automation_p1_continuity.py','test_automation_deployment.py','test_env_automation_config.py','test_rolling_paper_inputs.py','test_rolling_daily.py','test_rolling_go_inputs.py','test_deployment_receipt_key_bootstrap.py','test_v5_opening_execution_freshness.py','test_production_controller_semantics.py']
          selected = sorted({str(p) for pat in patterns for p in Path('tests/sentinel').glob(pat)})
          selected += ['tests/wealth_core','tests/champion','tests/v5','tests/production_composition/test_clock_calendar_faults.py','tests/scripts/test_go_process_cleanup.py','tests/scripts/test_sentinel_automation_compose_argument_boundary.py']
          Path('../evidence/component-selection.txt').write_text('\n'.join(selected)+'\n')
          PY
          mapfile -t cases < ../evidence/component-selection.txt
          python -m pytest -q -ra "${cases[@]}" --junitxml=../evidence/components.xml 2>&1 | tee ../evidence/components.log
      - name: Confirm production source unchanged
        if: always()
        working-directory: subject
        run: |
          git status --porcelain > ../evidence/source-status-after.txt
          git diff --exit-code
          git rev-parse HEAD > ../evidence/tested-commit-after.txt
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autonomy-400-extended-aff4461d
          path: evidence/
          retention-days: 30
      - name: Require all evidence lanes to finish
        if: always()
        env:
          COMPONENTS: ${{ steps.components.outcome }}
          RECOVERY: ${{ steps.recovery.outcome }}
          WITNESSES: ${{ steps.witnesses.outcome }}
        run: test "$COMPONENTS" = success && test "$RECOVERY" = success && test "$WITNESSES" = success
