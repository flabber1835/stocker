name: Backtester - extract two blocking split witnesses
on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-extract-two-blocking-split-witnesses.yml'
      - 'backtester/diagnostics/extract_two_blocking_split_witnesses.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/diagnostics/extract_two_blocking_split_witnesses.py
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_1998.csv.gz
            /sharadar/SHARADAR_SEP_2003.csv.gz
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python backtester/diagnostics/extract_two_blocking_split_witnesses.py | tee witnesses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-blocking-split-witnesses-${{ github.run_id }}
          path: witnesses.json
          retention-days: 30
