name: Codex migrate production chain v2

on:
  push:
    branches:
      - codex/fix-backtester-financial-audit-20260831
    paths:
      - '.github/workflows/codex-migrate-production-chain-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/fix-backtester-financial-audit-20260831
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply generation-2 migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}')
              p.write_text(text.replace(old, new))

          replace(
              'backtester/write_production_year_certificate.py',
              'CHAIN_GENERATION = 1',
              'CHAIN_GENERATION = 2',
          )

          replace(
              'backtester/run_production_strict_pit_20y_checkpointed.py',
              'import backtester.run_production_strict_pit_20y as base  # noqa: E402\nfrom backtester.production_year_checkpoint_overlay import install  # noqa: E402\n',
              '''from backtester.run_production_current_main_strict_pit_20y import (  # noqa: E402\n    CURRENT_MAIN_SHA,\n    bind_current_main_identity,\n    verify_unmodified_current_main,\n)\n\nverify_unmodified_current_main(PINNED_MAIN_ROOT)\nos.environ["BACKTESTER_MAIN_SHA"] = CURRENT_MAIN_SHA\n\nimport backtester.run_production_strict_pit_20y as base  # noqa: E402\nbind_current_main_identity(base)\nfrom backtester.production_year_checkpoint_overlay import install  # noqa: E402\n''',
          )

          worker = Path('.github/workflows/backtester-production-strict-pit-year-worker.yml')
          text = worker.read_text()
          text = text.replace('      PRODUCTION_MAIN_SHA: 887f479b15ad861313da666ad698034d3847121c', '      PRODUCTION_MAIN_SHA: c851386fa4dddcf2e2533af3a1d313c38220b7f2')
          text = text.replace('            /backtester/apply_production_cooldown_age_zero.py\n', '')
          text = text.replace('            /backtester/production_year_checkpoint_overlay.py\n', '            /backtester/production_year_checkpoint_overlay.py\n            /backtester/run_production_current_main_strict_pit_20y.py\n')
          text = text.replace('            /backtester/data/production-chain-generation.json\n', '            /backtester/data/production-chain-generation.json\n            /backtester/data/production-chain-generation-1.json\n')
          text = text.replace("          assert generation['generation'] == 1", "          assert generation['generation'] == 2\n          assert generation['supersedes_generation'] == 1\n          assert generation['historical_descriptor'] == 'backtester/data/production-chain-generation-1.json'\n          historical = json.loads(Path(generation['historical_descriptor']).read_text())\n          assert historical['generation'] == 1\n          assert historical['production_main_sha'] == '887f479b15ad861313da666ad698034d3847121c'")
          text = text.replace('          ref: 887f479b15ad861313da666ad698034d3847121c', '          ref: c851386fa4dddcf2e2533af3a1d313c38220b7f2')
          old_step = '''      - name: Apply and identify the backtester-only production correction\n        shell: bash\n        run: |\n          set -euo pipefail\n          test "$(git -C main-src rev-parse HEAD)" = "${PRODUCTION_MAIN_SHA}"\n          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "94ba764c79cb7e40d4448195029ecc4c45b8d632"\n          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "a59075507c8031dc0f30f1b989ad7253ad4c1715"\n          YEAR_ROOT="backtester-results/production-year-${CHAIN_YEAR}"\n          mkdir -p "${YEAR_ROOT}"\n          python backtester/apply_production_cooldown_age_zero.py \\\n            --root main-src \\\n            --evidence "${YEAR_ROOT}/production-overlay.json"\n          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "42d6dc0f5dd71cc1331e76d216660b140a609466"\n          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "d171724c2806522e8c94cd184685d09558b04715"\n          git -C main-src diff -- \\\n            shared/stock_strategy_shared/wealth_core/state.py \\\n            shared/stock_strategy_shared/wealth_core/adapter.py \\\n            > "${YEAR_ROOT}/production-overlay.diff"\n          PRODUCTION_OVERLAY_SHA256=$(python - <<'PY'\n          import json, os\n          from pathlib import Path\n          root = Path('backtester-results') / f"production-year-{os.environ['CHAIN_YEAR']}"\n          value = json.loads((root / 'production-overlay.json').read_text())['diff_sha256']\n          if len(value) != 64:\n              raise SystemExit('invalid Production overlay identity')\n          print(value)\n          PY\n          )\n          echo "PRODUCTION_OVERLAY_SHA256=${PRODUCTION_OVERLAY_SHA256}" >> "${GITHUB_ENV}"\n          echo "BACKTESTER_MAIN_SHA=${PRODUCTION_MAIN_SHA}" >> "${GITHUB_ENV}"\n          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"\n'''
          new_step = '''      - name: Verify pristine current-main production source\n        shell: bash\n        run: |\n          set -euo pipefail\n          test "$(git -C main-src rev-parse HEAD)" = "${PRODUCTION_MAIN_SHA}"\n          test -z "$(git -C main-src status --porcelain)"\n          test "$(git -C main-src hash-object sentinel/core/kernel.py)" = "12617af8eb954d4ae18fef2ae16977048e2e40cd"\n          test "$(git -C main-src hash-object sentinel/core/production.py)" = "99e8f87aa456fc672c84b0b0ceb3d674ca7ccf4c"\n          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "466a8f8202692e65e08596a7a47d45bd15bb3fd3"\n          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "8dd316ed28ff9b82c216f852118f8ef83d8510ad"\n          YEAR_ROOT="backtester-results/production-year-${CHAIN_YEAR}"\n          mkdir -p "${YEAR_ROOT}"\n          : > "${YEAR_ROOT}/production-overlay.diff"\n          python - <<'PY'\n          import json, os\n          from pathlib import Path\n          root = Path('backtester-results') / f"production-year-{os.environ['CHAIN_YEAR']}"\n          evidence = {\n              'schema': 'backtester.production-source-overlay/1',\n              'mode': 'pristine-current-main',\n              'production_main_sha': os.environ['PRODUCTION_MAIN_SHA'],\n              'diff_sha256': 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',\n              'patched': False,\n          }\n          (root / 'production-overlay.json').write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\\n')\n          PY\n          echo "PRODUCTION_OVERLAY_SHA256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" >> "${GITHUB_ENV}"\n          echo "BACKTESTER_MAIN_SHA=${PRODUCTION_MAIN_SHA}" >> "${GITHUB_ENV}"\n          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"\n'''
          if text.count(old_step) != 1:
              raise SystemExit(f'worker: old correction step count={text.count(old_step)}')
          text = text.replace(old_step, new_step)
          text = text.replace('          python -m unittest tests.backtester.test_production_cooldown_age_zero -v\n', '')
          text = text.replace('            backtester/run_production_strict_pit_20y_checkpointed.py \\\n', '            backtester/run_production_strict_pit_20y_checkpointed.py \\\n            backtester/run_production_current_main_strict_pit_20y.py \\\n')
          worker.write_text(text)

          tests = Path('tests/backtester/test_production_annual_chain.py')
          text = tests.read_text()
          text = text.replace('        self.assertEqual(generation["generation"], 1)', '        self.assertEqual(generation["generation"], 2)\n        self.assertEqual(generation["supersedes_generation"], 1)\n        historical = json.loads((ROOT / generation["historical_descriptor"]).read_text())\n        self.assertEqual(historical["generation"], 1)\n        self.assertEqual(historical["production_main_sha"], "887f479b15ad861313da666ad698034d3847121c")\n        self.assertEqual(generation["production_main_sha"], "c851386fa4dddcf2e2533af3a1d313c38220b7f2")')
          marker = '        self.assertNotIn("actions: write", self.worker)\n'
          if marker not in text:
              raise SystemExit('annual-chain test marker missing')
          text = text.replace(marker, marker + '        self.assertNotIn("apply_production_cooldown_age_zero.py", self.worker)\n        self.assertIn("Verify pristine current-main production source", self.worker)\n        self.assertIn("c851386fa4dddcf2e2533af3a1d313c38220b7f2", self.worker)\n')
          tests.write_text(text)
          PY

          git rm .github/workflows/codex-migrate-production-chain-v2.yml
          git diff --check
          python -m py_compile \
            backtester/run_production_current_main_strict_pit_20y.py \
            backtester/run_production_strict_pit_20y_checkpointed.py \
            backtester/write_production_year_certificate.py \
            tests/backtester/test_production_annual_chain.py
          python -m unittest tests.backtester.test_production_annual_chain -v
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chain: bind annual production replay to pristine current main'
          git push origin HEAD:codex/fix-backtester-financial-audit-20260831
