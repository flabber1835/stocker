name: Backtester - checkpoint resume stateful equivalence

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-checkpoint-resume-stateful-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      BACKTESTER_CHECKPOINT_EQUIV_END: '1999-06-30'
      BACKTESTER_EQUIV_IGNORE_FINAL_SPLIT_AUDIT: '1'
    steps:
      - name: Check out frozen research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-checkpoint-resume-stateful-equivalence.yml
            /backtester/checkpoint_output_schema.py
            /backtester/checkpoint_runner.py
            /backtester/run_checkpoint_equivalence_base.py
            /backtester/run_checkpoint_equivalence_base_v2.py
            /backtester/experiments/2026-08-27-sector-abc/**
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_1998.csv.gz
            /sharadar/SHARADAR_SEP_1999.csv.gz
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt

      - name: Record research identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_LAB_ROOT=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Check out exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Verify exact main identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "c502d077cae9c494f8b74a41ee8be7f40b25837d"
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Compile sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backtester/checkpoint_output_schema.py
          python -m py_compile backtester/checkpoint_runner.py
          python -m py_compile backtester/run_checkpoint_equivalence_base.py
          python -m py_compile backtester/run_checkpoint_equivalence_base_v2.py

      - name: Run uninterrupted stateful control
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backtester-results/stateful-continuous
          python backtester/run_checkpoint_equivalence_base_v2.py \
            --lab-root . --main-root main-src \
            --output backtester-results/stateful-continuous \
            2>&1 | tee checkpoint-stateful-continuous.log

      - name: Run stateful first segment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backtester-results/stateful-segmented
          mkdir -p backtester-results/stateful-checkpoints
          python backtester/run_checkpoint_equivalence_base_v2.py \
            --lab-root . --main-root main-src \
            --output backtester-results/stateful-segmented \
            --stop-after-session 1998-12-31 \
            --checkpoint-out backtester-results/stateful-checkpoints/1998-12-31.json \
            2>&1 | tee checkpoint-stateful-segment-1.log

      - name: Resume stateful second segment
        shell: bash
        run: |
          set -euo pipefail
          python backtester/run_checkpoint_equivalence_base_v2.py \
            --lab-root . --main-root main-src \
            --output backtester-results/stateful-segmented \
            --resume-checkpoint backtester-results/stateful-checkpoints/1998-12-31.json \
            2>&1 | tee checkpoint-stateful-segment-2.log

      - name: Require byte-identical stateful economics
        shell: bash
        run: |
          set -euo pipefail
          cmp backtester-results/stateful-continuous/daily.csv.gz backtester-results/stateful-segmented/daily.csv.gz
          cmp backtester-results/stateful-continuous/metrics.csv backtester-results/stateful-segmented/metrics.csv
          cmp backtester-results/stateful-continuous/summary.json backtester-results/stateful-segmented/summary.json
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          p=Path('backtester-results/stateful-continuous/daily.csv.gz')
          rows=gzip.open(p,'rt',encoding='utf-8').read().splitlines()
          if len(rows) <= 253:
              raise SystemExit(f'stateful window too short: {len(rows)-1}')
          ck=json.loads(Path('backtester-results/stateful-checkpoints/1998-12-31.json').read_text())['payload']
          wc=ck['state_a']['wealth_core']
          occupied=sum(1 for slot in (wc.get('slots') or {}).values() if slot.get('occupied_by'))
          if occupied <= 0 and not wc.get('episodes'):
              raise SystemExit('checkpoint did not capture a live/nontrivial portfolio state')
          print(json.dumps({
              'status':'PASS',
              'sessions':len(rows)-1,
              'daily_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'checkpoint_session':ck['checkpoint_session'],
              'occupied_slots':occupied,
              'episode_count':len(wc.get('episodes') or {}),
              'A_nav':ck['accounts']['A']['nav'],
              'B_nav':ck['accounts']['B']['nav'],
          }, sort_keys=True))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-checkpoint-stateful-equivalence-${{ github.run_id }}
          path: |
            backtester-results/stateful-continuous/daily.csv.gz
            backtester-results/stateful-continuous/metrics.csv
            backtester-results/stateful-continuous/summary.json
            backtester-results/stateful-segmented/daily.csv.gz
            backtester-results/stateful-segmented/metrics.csv
            backtester-results/stateful-segmented/summary.json
            backtester-results/stateful-checkpoints/1998-12-31.json
            backtester-results/stateful-checkpoints/1998-12-31.json.SHA256
            checkpoint-stateful-continuous.log
            checkpoint-stateful-segment-1.log
            checkpoint-stateful-segment-2.log
          if-no-files-found: warn
          retention-days: 30
