name: System campaign unfinished accurate financial continuations
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/system-campaign-factual-request.json']
permissions:
  contents: read
  actions: read
jobs:
  suffix:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    concurrency:
      group: system-optimization-002-financial-${{ matrix.arm }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [P03]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 3
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows
          fetch-depth: 1
      - name: Prepare dedicated ephemeral research capacity
        timeout-minutes: 3
        run: 'python3 -B research/capital_risk/ephemeral_runner_capacity.py --output "$GITHUB_WORKSPACE/artifacts/capital-risk/ephemeral-runner-capacity.json"'
      - name: Install locked transfer dependencies
        timeout-minutes: 4
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/wwe-transfer-requirements.lock
      - name: Probe launcher imports and exact request before staging
        timeout-minutes: 2
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/system_campaign_financial_resume.py --probe --request research/capital_risk/system-campaign-factual-request.json'
      - name: Authenticate existing frozen inputs and offline runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/full-core-staging.json'
      - name: Review P03 new83 financial closes and four saved reports without replay
        timeout-minutes: 270
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/system_campaign_financial_resume.py --request research/capital_risk/system-campaign-factual-request.json --staging artifacts/capital-risk/full-core-staging.json --capacity artifacts/capital-risk/ephemeral-runner-capacity.json --arm ${{ matrix.arm }} --output artifacts/capital-risk/campaign-factual-${{ matrix.arm }}.json'
      - name: Preserve encrypted proven stopped evidence
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-campaign-factual-${{ matrix.arm }}-${{ github.sha }}
          path: |
            artifacts/capital-risk/ephemeral-runner-capacity.json
            artifacts/capital-risk/full-core-staging.json
            artifacts/capital-risk/resume-export-qualification-${{ matrix.arm }}.json
            artifacts/capital-risk/campaign-factual-${{ matrix.arm }}.json
            artifacts/capital-risk/campaign-factual-*.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
