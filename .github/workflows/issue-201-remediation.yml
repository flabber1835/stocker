def cfg(**changes) -> AutomationConfig:
    base = AutomationConfig(
        publication_delay_seconds=0,
        execution_delay_seconds=60,
        max_execution_lateness_seconds=30,
        lease_seconds=30,
        heartbeat_seconds=5,
        retry_base_seconds=5,
        retry_max_seconds=30,
    )
    return base.model_copy(update=changes)


def binding(config: AutomationConfig) -> ControlBinding:
    return ControlBinding(
        deployment_id="sentinel-a",
        broker="alpaca-paper",
        broker_account_id="paper-account-1",
        takeover_epoch=1,
        certificate_sha256="d" * 64,
        rollout_mode="PINNED_1_00",
        rollout_version=1,
        config_sha256=config.fingerprint,
    )


def enable(conn, config: AutomationConfig) -> None:
    expected = binding(config)
    store.activate(conn, binding=expected, actor="operator", reason="test")
    store.release_kill(
        conn, expected_binding=expected, actor="operator", reason="test")


def prepare_result(context):
    return {
        "plan_id": f"plan-{context.cycle.decision_session}",
        "data_version": "publication",
        "publication_fingerprint": "p" * 64,
        "state_fingerprint": "s" * 64,
        "plan_fingerprint": "f" * 64,
    }


def execute_success(context):
    return {
        "disposition": "SUCCEEDED",
        "last_clean_reconciliation_id": "clean",
    }


def recover_success(context):
    return execute_success(context)


def refresh_result(context):
    return {
        "already_published": False,
        "data_version": "publication",
        "publication_fingerprint": "p" * 64,
    }


def service(config, *, execute=execute_success, recover=recover_success):
    return AutomationService(
        config=config,
        holder_id="worker-a",
        refresh=refresh_result,
        prepare=prepare_result,
        recover=recover,
        execute=execute,
    )


async def prepared_waiting(conn, config, *, execute=execute_success, recover=recover_success):
    enable(conn, config)
    svc = service(config, execute=execute, recover=recover)
    assert (await svc.tick(conn, now=AFTER_WEDNESDAY_CLOSE)).action is TickAction.RECOVERED
    assert (await svc.tick(conn, now=AFTER_WEDNESDAY_CLOSE)).action is TickAction.REFRESHED
    assert (await svc.tick(conn, now=AFTER_WEDNESDAY_CLOSE)).action is TickAction.PREPARED
    waiting = await svc.tick(conn, now=THURSDAY_BEFORE_EXECUTE)
    assert waiting.cycle.state is CycleState.WAITING_OPEN
    return svc, waiting


@pytest.mark.asyncio
@pytest.mark.parametrize(
    "offset,expected_action,expected_calls",
    [(0, TickAction.EXECUTED, 1), (20, TickAction.EXECUTED, 1),
     (31, TickAction.SUPERSEDED, 0)],
)
async def test_certified_fresh_execution_window(conn, offset, expected_action, expected_calls):
    calls = []
    config = cfg()
    svc, _ = await prepared_waiting(
        conn, config, execute=lambda context: (calls.append(context.cycle.plan_id), execute_success(context))[1])
    result = await svc.tick(conn, now=THURSDAY_EXECUTE + timedelta(seconds=offset))
    assert result.action is expected_action
    assert len(calls) == expected_calls
    if offset > config.max_execution_lateness_seconds:
        assert result.cycle.failure_code == "MAX_EXECUTION_LATENESS_EXCEEDED"


@pytest.mark.asyncio
async def test_execute_retry_cannot_bypass_execute_at(conn):
    calls = []
    config = cfg()
    svc, waiting = await prepared_waiting(
        conn, config, execute=lambda context: (calls.append("execute"), execute_success(context))[1])
    executing = store.transition_cycle(
        conn, permit=waiting.permit, cycle_id=waiting.cycle.cycle_id,
        to_state=CycleState.EXECUTING, increment_attempt=True, next_wake_at=None)
    retry = store.transition_cycle(
        conn, permit=waiting.permit, cycle_id=executing.cycle_id,
        to_state=CycleState.RETRY_WAIT,
        next_wake_at=THURSDAY_BEFORE_EXECUTE,
        diagnostic={"retry_phase": "EXECUTE"})
    result = await svc.tick(conn, now=THURSDAY_BEFORE_EXECUTE)
    assert result.action is TickAction.WAITING
    assert result.cycle.cycle_id == retry.cycle_id
    assert calls == []


@pytest.mark.asyncio
