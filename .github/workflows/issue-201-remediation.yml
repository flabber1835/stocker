name: Issue 201 remediation

on:
  pull_request:
    branches:
      - fix/issue-201-automation-financial-grade

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'trigger/issue-201-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-201-automation-financial-grade
          fetch-depth: 0
      - name: Apply financial-grade automation remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          # ---- model: immutable policy knobs + typed fail-closed exceptions ----
          replace_once(
              "sentinel/automation/model.py",
              '''class StaleLeaderRefused(AutomationRefused):\n    """The caller no longer owns the current live fencing token."""\n\n\nclass NonRetryableCallbackRefused(AutomationRefused):''',
              '''class StaleLeaderRefused(AutomationRefused):\n    """The caller no longer owns the current live fencing token."""\n\n\nclass CallbackDeadlineExceeded(StaleLeaderRefused):\n    """A callback outlived its bounded leadership-renewal window."""\n\n\nclass CycleIntegrityRefused(AutomationRefused):\n    """Durable cycle materialization disagrees with its event lineage."""\n\n\nclass NonRetryableCallbackRefused(AutomationRefused):''')
          replace_once(
              "sentinel/automation/model.py",
              '''    publication_delay_seconds: int = Field(default=900, ge=0)\n    execution_delay_seconds: int = Field(default=60, ge=0)\n    lease_seconds: int = Field(default=45, ge=3)''',
              '''    publication_delay_seconds: int = Field(default=900, ge=0)\n    execution_delay_seconds: int = Field(default=60, ge=0)\n    # Fresh transport is certified only close to the intended next-open fill.\n    # This value is part of config_sha256, so changing it requires a new\n    # activation/certificate binding rather than silently widening live parity.\n    max_execution_lateness_seconds: int = Field(default=60, ge=0)\n    # Host wall time chooses the exchange obligation; PostgreSQL time owns\n    # fencing.  Bound that cross-clock trust boundary in the signed config.\n    max_clock_skew_seconds: int = Field(default=5, ge=0)\n    # Heartbeats stop at this deadline so a wedged callback can be fenced and\n    # recovered by a replacement worker.\n    callback_max_seconds: int = Field(default=300, ge=1)\n    lease_seconds: int = Field(default=45, ge=3)''')

          # ---- store: trusted DB clock + immutable cycle/event lineage proof ----
          replace_once(
              "sentinel/automation/store.py",
              '''    CycleRecord,\n    CycleSpec,\n    CycleState,''',
              '''    CycleIntegrityRefused,\n    CycleRecord,\n    CycleSpec,\n    CycleState,''')
          replace_once(
              "sentinel/automation/store.py",
              '''def release_lease(conn, *, permit: LeaderPermit) -> None:\n''',
              '''def database_now(conn) -> datetime:\n    """Return PostgreSQL wall time without leaving a read transaction open."""\n    try:\n        with conn.cursor() as cur:\n            cur.execute("SELECT clock_timestamp()")\n            row = cur.fetchone()\n        if row is None or row[0] is None:\n            raise MissingAutomationState("PostgreSQL clock_timestamp() returned no value")\n        value = row[0]\n        conn.rollback()\n        return value\n    except BaseException:\n        conn.rollback()\n        raise\n\n\ndef release_lease(conn, *, permit: LeaderPermit) -> None:\n''')
          replace_once(
              "sentinel/automation/store.py",
              '''_UNSET = object()\n\n\ndef transition_cycle(''',
              '''def validate_cycle_lineage(conn, cycle: CycleRecord) -> CycleRecord:\n    """Fail closed unless the mutable row is explained by immutable events.\n\n    This deliberately validates; it never reconstructs or repairs a row from\n    event history.  A disagreement is corruption evidence and must remain so.\n    """\n    expected_id = CycleSpec(\n        decision_session=cycle.decision_session,\n        effective_session=cycle.effective_session,\n        deployment_id=cycle.deployment_id,\n        broker=cycle.broker,\n        broker_account_id=cycle.broker_account_id,\n        takeover_epoch=cycle.takeover_epoch,\n        control_generation=cycle.control_generation,\n        certificate_sha256=cycle.certificate_sha256,\n        rollout_mode=cycle.rollout_mode,\n        rollout_version=cycle.rollout_version,\n        config_sha256=cycle.config_sha256,\n        decision_close_at=cycle.decision_close_at,\n        prepare_at=cycle.prepare_at,\n        execution_open_at=cycle.execution_open_at,\n        execute_at=cycle.execute_at,\n        execution_close_at=cycle.execution_close_at,\n        historical_state_only=cycle.historical_state_only,\n    ).cycle_id\n    if expected_id != cycle.cycle_id:\n        raise CycleIntegrityRefused(\n            "automation cycle id does not match its immutable identity")\n\n    try:\n        with conn.cursor() as cur:\n            cur.execute(\n                "SELECT seq,from_state,to_state,control_generation,fence_token,"\n                " detail FROM sentinel_automation_cycle_events"\n                " WHERE cycle_id=%s ORDER BY seq", (cycle.cycle_id,))\n            rows = cur.fetchall()\n        conn.rollback()\n    except BaseException:\n        conn.rollback()\n        raise\n    if not rows:\n        raise CycleIntegrityRefused("automation cycle has no genesis event")\n\n    previous = None\n    attempts = 0\n    final_fence = None\n    reconstructed = {\n        "plan_id": None,\n        "data_version": None,\n        "publication_fingerprint": None,\n        "state_fingerprint": None,\n        "plan_fingerprint": None,\n        "last_clean_reconciliation_id": None,\n        "next_wake_at": cycle.prepare_at,\n        "failure_code": None,\n        "failure_detail": None,\n        "diagnostic": {},\n    }\n    carried_fields = tuple(reconstructed)\n    for index, (_seq, raw_from, raw_to, _generation, fence_token, detail) in enumerate(rows):\n        if isinstance(detail, str):\n            detail = json.loads(detail)\n        detail = dict(detail or {})\n        to_state = CycleState(raw_to)\n        from_state = CycleState(raw_from) if raw_from is not None else None\n        if index == 0:\n            if from_state is not None or to_state is not CycleState.DISCOVERED:\n                raise CycleIntegrityRefused(\n                    "automation cycle genesis must be NULL -> DISCOVERED")\n        else:\n            if from_state is not previous:\n                raise CycleIntegrityRefused(\n                    "automation cycle event chain has a discontinuous predecessor")\n            if detail.get("adoption"):\n                allowed_adoption = {\n                    from_state, CycleState.SUCCEEDED, CycleState.RETRY_WAIT,\n                    CycleState.SUPERSEDED, CycleState.BLOCKED,\n                }\n                if to_state not in allowed_adoption:\n                    raise CycleIntegrityRefused(\n                        "automation cycle event contains an illegal adoption edge")\n            elif to_state not in _ALLOWED_TRANSITIONS.get(from_state, set()):\n                raise CycleIntegrityRefused(\n                    f"automation cycle event contains illegal edge "\n                    f"{from_state.value} -> {to_state.value}")\n        if detail.get("increment_attempt") is True:\n            attempts += 1\n        for field in carried_fields:\n            if field in detail:\n                reconstructed[field] = detail[field]\n        previous = to_state\n        final_fence = fence_token\n\n    if previous is not cycle.state:\n        raise CycleIntegrityRefused(\n            "automation cycle materialized state disagrees with its last event")\n    if final_fence != cycle.last_fence_token:\n        raise CycleIntegrityRefused(\n            "automation cycle materialized fence disagrees with its last event")\n    if attempts != cycle.attempt_count:\n        raise CycleIntegrityRefused(\n            "automation cycle attempt count disagrees with its event lineage")\n    if cycle.state.terminal != (cycle.completed_at is not None):\n        raise CycleIntegrityRefused(\n            "automation cycle completion timestamp disagrees with terminal state")\n\n    for field, expected in reconstructed.items():\n        actual = getattr(cycle, field)\n        if field == "next_wake_at" and isinstance(expected, str):\n            expected = datetime.fromisoformat(expected)\n        if field == "diagnostic":\n            expected = dict(expected or {})\n            actual = dict(actual or {})\n        if actual != expected:\n            raise CycleIntegrityRefused(\n                f"automation cycle field {field} disagrees with event lineage")\n    return cycle\n\n\n_UNSET = object()\n\n\ndef transition_cycle(''')

          # ---- service: bounded time authority, deadline heartbeat, execution gate ----
          replace_once(
              "sentinel/automation/service.py",
              '''import inspect\nimport threading\nfrom datetime''',
              '''import inspect\nimport threading\nimport time\nfrom datetime''')
          replace_once(
              "sentinel/automation/service.py",
              '''    AutomationConfig,\n    AutomationRefused,\n    CycleContext,''',
              '''    AutomationConfig,\n    AutomationRefused,\n    CallbackDeadlineExceeded,\n    CycleContext,\n    CycleIntegrityRefused,''')
          replace_once(
              "sentinel/automation/service.py",
              '''    def _retry_at(self, now: datetime, attempts: int) -> datetime:\n        delay = min(\n            self.config.retry_max_seconds,\n            self.config.retry_base_seconds * (2 ** max(0, attempts - 1)))\n        return now + timedelta(seconds=delay)\n\n    @staticmethod\n    def _nonretryable''',
              '''    def _retry_at(self, now: datetime, attempts: int) -> datetime:\n        delay = min(\n            self.config.retry_max_seconds,\n            self.config.retry_base_seconds * (2 ** max(0, attempts - 1)))\n        return now + timedelta(seconds=delay)\n\n    def _latest_new_execution_at(self, cycle: CycleRecord) -> datetime:\n        return min(\n            cycle.execution_close_at,\n            cycle.execute_at + timedelta(\n                seconds=self.config.max_execution_lateness_seconds))\n\n    def _execution_is_fresh(self, *, now: datetime, cycle: CycleRecord) -> bool:\n        return (cycle.execute_at <= now\n                <= self._latest_new_execution_at(cycle)\n                and now < cycle.execution_close_at)\n\n    def _execution_expired(self, *, now: datetime, cycle: CycleRecord) -> bool:\n        return (now > self._latest_new_execution_at(cycle)\n                or now >= cycle.execution_close_at)\n\n    def _assert_clock_skew(self, conn, *, now: datetime, conn_factory) -> None:\n        clock_conn = conn_factory()\n        try:\n            database_now = _utc(store.database_now(clock_conn))\n        finally:\n            clock_conn.close()\n        skew = abs((now - database_now).total_seconds())\n        if skew > self.config.max_clock_skew_seconds:\n            raise AutomationRefused(\n                "host/database clock skew exceeds the signed automation "\n                f"limit: {skew:.3f}s > "\n                f"{self.config.max_clock_skew_seconds}s")\n\n    @staticmethod\n    def _nonretryable''')

          old_invoke = '''    async def _invoke(\n            self, callback, context: CycleContext, *, permit,\n            heartbeat_conn_factory=None):\n        """Invoke with a separate connection/thread renewing the leader lease.\n\n        A thread is intentional: a synchronous canonical callback must not\n        starve the heartbeat merely because it occupies the event-loop thread.\n        A heartbeat failure is re-raised at the callback boundary; the guarded\n        broker independently rechecks the same fence before every mutation.\n        """\n        if heartbeat_conn_factory is None:\n            return await _resolve(callback(context))\n\n        stopped = threading.Event()\n        heartbeat_errors: list[BaseException] = []\n\n        def heartbeat() -> None:\n            while not stopped.wait(self.config.heartbeat_seconds):\n                heartbeat_conn = heartbeat_conn_factory()\n                try:\n                    store.heartbeat_lease(\n                        heartbeat_conn, permit=permit,\n                        lease_seconds=self.config.lease_seconds)\n                except BaseException as exc:                    # noqa: BLE001\n                    heartbeat_errors.append(exc)\n                    return\n                finally:\n                    heartbeat_conn.close()\n\n        worker = threading.Thread(\n            target=heartbeat,\n            name=f"sentinel-heartbeat-{self.holder_id}", daemon=True)\n        worker.start()\n        try:\n            result = await _resolve(callback(context))\n        finally:\n            stopped.set()\n            worker.join(timeout=self.config.heartbeat_seconds + 1)\n        if heartbeat_errors:\n            raise heartbeat_errors[0]\n        return result\n'''
          new_invoke = '''    async def _invoke(\n            self, callback, context: CycleContext, *, permit, phase: str,\n            heartbeat_conn_factory=None):\n        """Invoke with bounded lease renewal around one callback boundary.\n\n        A synchronous callback may occupy the event loop, so heartbeat remains\n        in a thread.  The thread deliberately stops renewing at the signed\n        callback deadline.  A replacement can then acquire a new fence after\n        lease expiry; any eventually-waking old worker fails its fresh fence\n        check before committing state or mutating through the guarded broker.\n        """\n        deadline = time.monotonic() + self.config.callback_max_seconds\n        if heartbeat_conn_factory is None:\n            result = await _resolve(callback(context))\n            if time.monotonic() > deadline:\n                raise CallbackDeadlineExceeded(\n                    f"{phase} callback exceeded "\n                    f"{self.config.callback_max_seconds}s deadline")\n            return result\n\n        stopped = threading.Event()\n        deadline_hit = threading.Event()\n        heartbeat_errors: list[BaseException] = []\n\n        def heartbeat() -> None:\n            while True:\n                remaining = deadline - time.monotonic()\n                if remaining <= 0:\n                    deadline_hit.set()\n                    return\n                if stopped.wait(min(self.config.heartbeat_seconds, remaining)):\n                    return\n                if time.monotonic() >= deadline:\n                    deadline_hit.set()\n                    return\n                heartbeat_conn = heartbeat_conn_factory()\n                try:\n                    store.heartbeat_lease(\n                        heartbeat_conn, permit=permit,\n                        lease_seconds=self.config.lease_seconds)\n                except BaseException as exc:                    # noqa: BLE001\n                    heartbeat_errors.append(exc)\n                    return\n                finally:\n                    heartbeat_conn.close()\n\n        worker = threading.Thread(\n            target=heartbeat,\n            name=f"sentinel-heartbeat-{self.holder_id}", daemon=True)\n        worker.start()\n        try:\n            result = await _resolve(callback(context))\n        finally:\n            stopped.set()\n            worker.join(timeout=self.config.heartbeat_seconds + 1)\n        if deadline_hit.is_set() or time.monotonic() > deadline:\n            raise CallbackDeadlineExceeded(\n                f"{phase} callback exceeded "\n                f"{self.config.callback_max_seconds}s deadline")\n        if heartbeat_errors:\n            raise heartbeat_errors[0]\n        return result\n'''
          replace_once("sentinel/automation/service.py", old_invoke, new_invoke)

          replace_once(
              "sentinel/automation/service.py",
              '''        permit = store.acquire_lease(\n            conn, holder_id=self.holder_id,\n            lease_seconds=self.config.lease_seconds)''',
              '''        if heartbeat_conn_factory is not None:\n            self._assert_clock_skew(\n                conn, now=now, conn_factory=heartbeat_conn_factory)\n\n        permit = store.acquire_lease(\n            conn, holder_id=self.holder_id,\n            lease_seconds=self.config.lease_seconds)''')
          replace_once(
              "sentinel/automation/service.py",
              '''        cycle = store.create_cycle(\n            conn, permit=permit, spec=self._spec(control, obligation))\n        if cycle.state.terminal:''',
              '''        cycle = store.create_cycle(\n            conn, permit=permit, spec=self._spec(control, obligation))\n        store.validate_cycle_lineage(conn, cycle)\n        if cycle.state.terminal:''')

          replace_once(
              "sentinel/automation/service.py",
              '''            elif retry_phase == "EXECUTE":\n                if now >= cycle.execution_close_at:\n                    return await self._run_recover(\n                        conn, now=now, cycle=cycle, permit=permit,\n                        heartbeat_conn_factory=heartbeat_conn_factory)\n                cycle = store.transition_cycle(''',
              '''            elif retry_phase == "EXECUTE":\n                if now < cycle.execute_at:\n                    return TickResult(\n                        action=TickAction.WAITING, cycle=cycle, permit=permit,\n                        reason="effective-session execution wake has not arrived")\n                if self._execution_expired(now=now, cycle=cycle):\n                    return await self._run_recover(\n                        conn, now=now, cycle=cycle, permit=permit,\n                        heartbeat_conn_factory=heartbeat_conn_factory)\n                cycle = store.transition_cycle(''')

          replace_once(
              "sentinel/automation/service.py",
              '''        if cycle.state is CycleState.WAITING_OPEN:\n            if now >= cycle.execution_close_at:\n                cycle = store.transition_cycle(\n                    conn, permit=permit, cycle_id=cycle.cycle_id,\n                    to_state=CycleState.SUPERSEDED,\n                    failure_code="MISSED_EXECUTION_WINDOW",\n                    failure_detail="the plan was not executed before session close")\n                return TickResult(\n                    action=TickAction.SUPERSEDED, cycle=cycle, permit=permit,\n                    reason="execution window closed without transport")\n            if now < cycle.execute_at:\n                return TickResult(\n                    action=TickAction.WAITING, cycle=cycle, permit=permit,\n                    reason="effective-session execution wake has not arrived")\n            cycle = store.transition_cycle(''',
              '''        if cycle.state is CycleState.WAITING_OPEN:\n            if now < cycle.execute_at:\n                return TickResult(\n                    action=TickAction.WAITING, cycle=cycle, permit=permit,\n                    reason="effective-session execution wake has not arrived")\n            if self._execution_expired(now=now, cycle=cycle):\n                failure_code = (\n                    "MISSED_EXECUTION_WINDOW"\n                    if now >= cycle.execution_close_at\n                    else "MAX_EXECUTION_LATENESS_EXCEEDED")\n                cycle = store.transition_cycle(\n                    conn, permit=permit, cycle_id=cycle.cycle_id,\n                    to_state=CycleState.SUPERSEDED,\n                    failure_code=failure_code,\n                    failure_detail=(\n                        "the certified fresh-execution window expired before "\n                        "new transport was initiated"))\n                return TickResult(\n                    action=TickAction.SUPERSEDED, cycle=cycle, permit=permit,\n                    reason="fresh execution window expired without transport")\n            cycle = store.transition_cycle(''')

          replace_once(
              "sentinel/automation/service.py",
              '''        if cycle.state is CycleState.EXECUTING:\n            if cycle.last_fence_token != permit.fence_token:\n                # A takeover never resumes an old worker's execution path.\n                # Stamp the new fence and enter read-only reconciliation.\n                cycle = store.adopt_cycle(\n                    conn, permit=permit, cycle_id=cycle.cycle_id)\n                return await self._run_recover(\n                    conn, now=now, cycle=cycle, permit=permit,\n                    heartbeat_conn_factory=heartbeat_conn_factory)\n            if now >= cycle.execution_close_at:\n                return await self._run_recover(''',
              '''        if cycle.state is CycleState.EXECUTING:\n            if cycle.last_fence_token != permit.fence_token:\n                # A takeover never resumes an old worker's execution path.\n                # Stamp the new fence and enter read-only reconciliation.\n                cycle = store.adopt_cycle(\n                    conn, permit=permit, cycle_id=cycle.cycle_id)\n                return await self._run_recover(\n                    conn, now=now, cycle=cycle, permit=permit,\n                    heartbeat_conn_factory=heartbeat_conn_factory)\n            if now < cycle.execute_at:\n                raise CycleIntegrityRefused(\n                    "EXECUTING cycle reached executor before execute_at")\n            if self._execution_expired(now=now, cycle=cycle):\n                return await self._run_recover(''')

          # Validate lineage at every callback-bearing boundary.  The first four
          # signatures are unique even though their bodies share a try block.
          for marker in (
              '''    async def _run_refresh(\n            self, conn, *, now: datetime, cycle: CycleRecord,\n            permit, heartbeat_conn_factory=None) -> TickResult:\n        try:''',
              '''    async def _run_preflight_recover(\n            self, conn, *, now: datetime, cycle: CycleRecord,\n            permit, heartbeat_conn_factory=None) -> TickResult:\n        """Prove the shared journal clean before any new publication."""\n        try:''',
              '''    async def _run_recover(\n            self, conn, *, now: datetime, cycle: CycleRecord,\n            permit, heartbeat_conn_factory=None) -> TickResult:\n        """Read-only broker recovery; this callback is never the executor."""\n        if cycle.last_fence_token != permit.fence_token:''',
              '''    async def _run_prepare(\n            self, conn, *, now: datetime, cycle: CycleRecord,\n            permit, heartbeat_conn_factory=None) -> TickResult:\n        try:''',
          ):
              if "_run_preflight" in marker:
                  replacement = marker.replace("        try:", "        store.validate_cycle_lineage(conn, cycle)\n        try:")
              elif "_run_recover" in marker:
                  replacement = marker.replace(
                      "        if cycle.last_fence_token != permit.fence_token:",
                      "        store.validate_cycle_lineage(conn, cycle)\n        if cycle.last_fence_token != permit.fence_token:")
              else:
                  replacement = marker.replace("        try:", "        store.validate_cycle_lineage(conn, cycle)\n        try:")
              replace_once("sentinel/automation/service.py", marker, replacement)

          replace_once(
              "sentinel/automation/service.py",
              '''    async def _run_execute(\n            self, conn, *, now: datetime, cycle: CycleRecord,\n            permit, heartbeat_conn_factory=None) -> TickResult:\n        try:''',
              '''    async def _run_execute(\n            self, conn, *, now: datetime, cycle: CycleRecord,\n            permit, heartbeat_conn_factory=None) -> TickResult:\n        store.validate_cycle_lineage(conn, cycle)\n        if now < cycle.execute_at:\n            raise CycleIntegrityRefused(\n                "EXECUTE callback refused before immutable execute_at")\n        if self._execution_expired(now=now, cycle=cycle):\n            return await self._run_recover(\n                conn, now=now, cycle=cycle, permit=permit,\n                heartbeat_conn_factory=heartbeat_conn_factory)\n        try:''')

          # Add explicit phase names to all callback watchdog invocations.
          service = Path("sentinel/automation/service.py")
          text = service.read_text()
          replacements = {
              '''self.refresh, CycleContext(cycle=cycle, permit=permit),\n                permit=permit,\n                heartbeat_conn_factory=heartbeat_conn_factory)''':
              '''self.refresh, CycleContext(cycle=cycle, permit=permit),\n                permit=permit, phase="REFRESH",\n                heartbeat_conn_factory=heartbeat_conn_factory)''',
              '''self.prepare, CycleContext(cycle=cycle, permit=permit),\n                permit=permit,\n                heartbeat_conn_factory=heartbeat_conn_factory)''':
              '''self.prepare, CycleContext(cycle=cycle, permit=permit),\n                permit=permit, phase="PREPARE",\n                heartbeat_conn_factory=heartbeat_conn_factory)''',
              '''self.recover, CycleContext(cycle=cycle, permit=permit),\n                permit=permit,\n                heartbeat_conn_factory=heartbeat_conn_factory)''':
              '''self.recover, CycleContext(cycle=cycle, permit=permit),\n                permit=permit, phase="RECOVER",\n                heartbeat_conn_factory=heartbeat_conn_factory)''',
              '''self.execute, CycleContext(cycle=cycle, permit=permit),\n                permit=permit,\n                heartbeat_conn_factory=heartbeat_conn_factory)''':
              '''self.execute, CycleContext(cycle=cycle, permit=permit),\n                permit=permit, phase="EXECUTE",\n                heartbeat_conn_factory=heartbeat_conn_factory)''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"service.py: missing callback invoke target: {old.split(',')[0]}")
              text = text.replace(old, new)
          service.write_text(text)

          # READY_TO_EXECUTE after read-only reconciliation may only re-enter
          # transport while the same immutable fresh-execution window survives.
          replace_once(
              "sentinel/automation/service.py",
              '''        if result.disposition is ExecuteDisposition.READY_TO_EXECUTE:\n            if cycle.control_generation != permit.control_generation:''',
              '''        if result.disposition is ExecuteDisposition.READY_TO_EXECUTE:\n            if cycle.control_generation != permit.control_generation:''')
          replace_once(
              "sentinel/automation/service.py",
              '''            cycle = store.transition_cycle(\n                conn, permit=permit, cycle_id=cycle.cycle_id,\n                to_state=CycleState.RETRY_WAIT, next_wake_at=now,\n                last_clean_reconciliation_id=\n                    result.last_clean_reconciliation_id,\n                failure_code=result.failure_code,\n                failure_detail=result.failure_detail,\n                diagnostic={**dict(result.diagnostic),\n                            "retry_phase": "EXECUTE"})\n            return TickResult(\n                action=TickAction.RECOVERED, cycle=cycle, permit=permit,\n                reason="clean recovery permits a fresh executor boundary")''',
              '''            if not self._execution_is_fresh(now=now, cycle=cycle):\n                cycle = store.transition_cycle(\n                    conn, permit=permit, cycle_id=cycle.cycle_id,\n                    to_state=CycleState.SUPERSEDED, next_wake_at=None,\n                    last_clean_reconciliation_id=\n                        result.last_clean_reconciliation_id,\n                    failure_code="MAX_EXECUTION_LATENESS_EXCEEDED",\n                    failure_detail=(\n                        "clean recovery completed after the certified fresh-"\n                        "execution window; stale economics cannot be executed"),\n                    diagnostic=result.diagnostic)\n                return TickResult(\n                    action=TickAction.SUPERSEDED, cycle=cycle, permit=permit,\n                    reason=cycle.failure_detail)\n            cycle = store.transition_cycle(\n                conn, permit=permit, cycle_id=cycle.cycle_id,\n                to_state=CycleState.RETRY_WAIT, next_wake_at=now,\n                last_clean_reconciliation_id=\n                    result.last_clean_reconciliation_id,\n                failure_code=result.failure_code,\n                failure_detail=result.failure_detail,\n                diagnostic={**dict(result.diagnostic),\n                            "retry_phase": "EXECUTE"})\n            return TickResult(\n                action=TickAction.RECOVERED, cycle=cycle, permit=permit,\n                reason="clean recovery permits a fresh executor boundary")''')

          # ---- health: readiness means the scheduler can actually progress ----
          replace_once(
              "sentinel/automation/health.py",
              '''from datetime import datetime''',
              '''from datetime import datetime, timezone''')
          replace_once(
              "sentinel/automation/health.py",
              '''    last_instance_id: str | None = None\n    last_instance_heartbeat_at: datetime | None = None\n    reason: str | None = None''',
              '''    last_instance_id: str | None = None\n    last_instance_heartbeat_at: datetime | None = None\n    service_heartbeat_fresh: bool = False\n    scheduler_overdue: bool = False\n    database_now: datetime | None = None\n    host_database_clock_skew_seconds: float | None = None\n    reason: str | None = None''')
          replace_once(
