UTC = timezone.utc
AFTER_WEDNESDAY_CLOSE = datetime(2026, 8, 12, 20, 1, tzinfo=UTC)
THURSDAY_BEFORE_EXECUTE = datetime(2026, 8, 13, 13, 30, 30, tzinfo=UTC)
THURSDAY_EXECUTE = datetime(2026, 8, 13, 13, 31, tzinfo=UTC)


@pytest.fixture(scope="module")
