@pytest.mark.asyncio
async def test_recovery_after_fresh_window_never_reenters_execution(conn):
    config = cfg()
    recover_calls = []

    def ready(context):
        recover_calls.append(context.cycle.cycle_id)
        return {
            "disposition": "READY_TO_EXECUTE",
            "last_clean_reconciliation_id": "clean",
        }

    svc, waiting = await prepared_waiting(conn, config, recover=ready)
    executing = store.transition_cycle(
        conn, permit=waiting.permit, cycle_id=waiting.cycle.cycle_id,
        to_state=CycleState.EXECUTING, increment_attempt=True, next_wake_at=None)
    retry = store.transition_cycle(
        conn, permit=waiting.permit, cycle_id=executing.cycle_id,
        to_state=CycleState.RETRY_WAIT,
        next_wake_at=THURSDAY_EXECUTE + timedelta(seconds=31),
        diagnostic={"retry_phase": "EXECUTE"})
    result = await svc.tick(
        conn, now=THURSDAY_EXECUTE + timedelta(seconds=31))
    assert result.action is TickAction.SUPERSEDED
    assert result.cycle.failure_code == "MAX_EXECUTION_LATENESS_EXCEEDED"
    assert recover_calls


@pytest.mark.asyncio
async def test_production_tick_refuses_material_host_database_clock_skew(conn, pg):
    config = cfg(max_clock_skew_seconds=1)
    enable(conn, config)
    with conn.cursor() as cur:
        cur.execute("SELECT clock_timestamp()")
        database_now = cur.fetchone()[0]
    conn.rollback()
    svc = service(config)
    with pytest.raises(Exception, match="clock skew exceeds"):
        await svc.tick(
            conn, now=database_now + timedelta(minutes=5),
            heartbeat_conn_factory=lambda: feed_store.connect(pg.sync_dsn))


@pytest.mark.asyncio
async def test_callback_deadline_stops_accepting_result_after_timeout():
    config = cfg(callback_max_seconds=1)
    svc = service(config)
    context = object()

    async def slow(_context):
        await asyncio.sleep(1.05)
        return "late"

    with pytest.raises(CallbackDeadlineExceeded):
        await svc._invoke(  # noqa: SLF001 - explicit watchdog regression
            slow, context, permit=object(), phase="PREPARE",
            heartbeat_conn_factory=None)


