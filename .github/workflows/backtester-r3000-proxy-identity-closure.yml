name: Backtester - R3000 proxy identity closure
run-name: R3000 proxy identity closure — ${{ github.sha }}

on:
  push:
    branches: [research/r3000-proxy-pit-corpus]
    paths:
      - '.github/workflows/backtester-r3000-proxy-identity-closure.yml'
      - 'backtester/r3000_proxy_identity_closure.py'
      - 'tests/backtester/test_r3000_proxy_identity_closure.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: r3000-proxy-identity-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE_A_RUN_ID: '33933612697'
  STAGE_A_HEAD: '55e0e165bf379b905c220aa54adc01c51ec67285'
  STAGE_A_ARTIFACT: r3000-proxy-source-recovery-55e0e165bf379b905c220aa54adc01c51ec67285
  STAGE_A_ARTIFACT_DIGEST: sha256:36da7d20a2a4e3088985dda1f1bd97c2d51ffbf48e20015122fa1a7213e63c88
  STAGE_A_ROOT: backtester-results/r3000-proxy-source-recovery
  CANONICAL_ROOT: backtester-results/canonical-pit
  OUTPUT: backtester-results/r3000-proxy-identity-closure
  PYTHONUNBUFFERED: '1'

jobs:
  identity:
    name: Resolve historical security identities for 42 IWB/IWM snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact corpus source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run identity closure regressions
        run: |
          set -euo pipefail
          python -m compileall -q backtester/r3000_proxy_identity_closure.py tests/backtester/test_r3000_proxy_identity_closure.py
          python - <<'PY'
          import inspect
          import runpy
          import tempfile
          from pathlib import Path

          ns = runpy.run_path('tests/backtester/test_r3000_proxy_identity_closure.py')
          executed = 0
          for name in sorted(ns):
              if not name.startswith('test_'):
                  continue
              fn = ns[name]
              params = inspect.signature(fn).parameters
              if set(params) == {'tmp_path'}:
                  with tempfile.TemporaryDirectory() as td:
                      fn(Path(td))
              elif params:
                  raise RuntimeError(f'unsupported test signature: {name}{inspect.signature(fn)}')
              else:
                  fn()
              executed += 1
          assert executed == 3, executed
          print({'status':'PASS','tests':executed,'contract':'historical-session identity only; exact identifier/name continuity; no future ticker leakage'})
          PY

      - name: Authenticate immutable Stage A artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGE_A_RUN_ID}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGE_A_RUN_ID}" --jq '.head_sha')" = "${STAGE_A_HEAD}"
          observed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGE_A_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${STAGE_A_ARTIFACT}\") | .digest")
          test "${observed}" = "${STAGE_A_ARTIFACT_DIGEST}"
          echo "Stage A artifact authenticated: ${observed}"

      - name: Download immutable Stage A source package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: ${{ env.STAGE_A_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Stage A member hashes
        run: |
          set -euo pipefail
          (cd "${STAGE_A_ROOT}" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.load(open(Path(os.environ['STAGE_A_ROOT'])/'summary.json'))
          assert s['status']=='PASS'
          assert s['years_source_covered']==21
          assert s['fund_snapshots']==42
          assert s['parsed_equity_rows']==63113
          PY

      - name: Pull immutable canonical PIT package by digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          POINTER=backtester/data/canonical-pit-20y.json
          PACKAGE=$(python - <<'PY'
          import json
          p=json.load(open('backtester/data/canonical-pit-20y.json'))
          assert p['status']=='PASS'
          package=p['package']
          assert package.startswith('ghcr.io/flabber1835/stocker-canonical-pit@sha256:')
          print(package)
          PY
          )
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          cid=$(docker create "${PACKAGE}")
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          rm -rf "${CANONICAL_ROOT}"
          mkdir -p "${CANONICAL_ROOT}"
          docker cp "${cid}:/canonical-pit/." "${CANONICAL_ROOT}/"
          docker rm "${cid}"
          trap - EXIT
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          pointer=json.load(open('backtester/data/canonical-pit-20y.json'))
          root=Path(os.environ['CANONICAL_ROOT'])
          manifest_path=root/'manifest.json'
          assert manifest_path.is_file()
          digest=hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert digest==pointer['manifest_sha256'], (digest,pointer['manifest_sha256'])
          manifest=json.load(open(manifest_path))
          assert manifest['dataset_hash']==pointer['dataset_hash']
          assert (root/'session-hashes.csv').is_file()
          for year in range(2006,2027):
              assert (root/f'observations-{year}.csv.gz').is_file(), year
          print({'status':'PASS','dataset_hash':manifest['dataset_hash'],'manifest_sha256':digest})
          PY

      - name: Build deterministic Stage B identity ledger
        run: |
          set -euo pipefail
          rm -rf "${OUTPUT}"
          python -m backtester.r3000_proxy_identity_closure \
            --stage-a "${STAGE_A_ROOT}" \
            --canonical "${CANONICAL_ROOT}" \
            --output "${OUTPUT}"
          (cd "${OUTPUT}" && sha256sum -c SHA256SUMS.txt)

      - name: Enforce Stage B accounting and causality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.load(open(Path(os.environ['OUTPUT'])/'identity_summary.json'))
          counts=s['resolution_counts']
          assert s['status']=='PASS'
          assert s['source_rows']==63113
          assert s['fund_snapshots']==42
          assert sum(counts.values())==63113
          assert s['future_session_violations']==0
          assert (Path(os.environ['OUTPUT'])/'identity_ledger.csv.gz').is_file()
          assert (Path(os.environ['OUTPUT'])/'identity_unresolved_worklist.csv.gz').is_file()
          print(json.dumps(s,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('## IWB/IWM R3000 proxy — Stage B identity closure\n\n')
              fh.write(f"- Total source rows: {s['source_rows']:,}\n")
              fh.write(f"- Resolved: {counts['RESOLVED']:,}\n")
              fh.write(f"- Ambiguous: {counts['AMBIGUOUS']:,}\n")
              fh.write(f"- Unmatched: {counts['UNMATCHED']:,}\n")
              fh.write(f"- Conflicts: {counts['CONFLICT']:,}\n")
              fh.write(f"- Closure state: **{s['acceptance_state']}**\n")
              fh.write('- Future-session violations: 0\n')
              fh.write('- No current-ticker substitution and no fuzzy identity promotion.\n')
          PY

      - name: Upload Stage B identity ledger and exact worklist
        if: ${{ always() && hashFiles('backtester-results/r3000-proxy-identity-closure/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r3000-proxy-identity-closure-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
