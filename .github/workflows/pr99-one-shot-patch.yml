name: PR99 one-shot lineage hardening

on:
  push:
    branches:
      - fix/rollout-certificate-rotation-chain

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rollout-certificate-rotation-chain
          fetch-depth: 1
      - name: Apply exact schema hardening and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('sentinel/schema.py')
          text = path.read_text(encoding='utf-8')

          old_prelude = '''    snapshots: dict[int, tuple[str, str | None]] = {1: ("PINNED_1_00", None)}
              prior_mode, prior_certificate = snapshots[1]
              referenced_certificates: set[str] = set()
              for raw_event_version, raw_from, raw_to, raw_cert, raw_reason in events:
          '''
          new_prelude = '''    snapshots: dict[int, tuple[str, str | None]] = {1: ("PINNED_1_00", None)}
              prior_mode, prior_certificate = snapshots[1]
              referenced_certificates: set[str] = set()
              signed_lineage: dict[str, tuple[str | None, int]] = {}
              cur.execute(
                  "SELECT to_regclass('public.sentinel_signed_execution_certificates')")
              if cur.fetchone()[0] is not None:
                  cur.execute(
                      "SELECT certificate_sha256,supersedes_certificate_sha256,"
                      " issuer_generation"
                      " FROM public.sentinel_signed_execution_certificates")
                  signed_lineage = {
                      str(raw_sha): (
                          str(raw_supersedes) if raw_supersedes else None,
                          int(raw_generation))
                      for raw_sha, raw_supersedes, raw_generation in cur.fetchall()
                  }
              for raw_event_version, raw_from, raw_to, raw_cert, raw_reason in events:
          '''

          old_rotation = '''        # A renewal/rotation may keep CONTROLLER while changing the signed
                  # certificate that authorizes it. That is a real authority transition,
                  # not a no-op mode event. Every other same-mode event remains invalid.
                  same_mode_rotation = (
                      from_mode == to_mode == "CONTROLLER"
                      and prior_certificate is not None
                      and event_certificate is not None
                      and event_certificate != prior_certificate)
          '''
          new_rotation = '''        # A renewal/rotation may keep CONTROLLER only when the durable
                  # signed-certificate lineage proves it is the exact successor. Merely
                  # changing a SHA would let unrelated or legacy certificates manufacture
                  # rollout history that activate_signed_certificate() could never create.
                  prior_signed = signed_lineage.get(prior_certificate or "")
                  event_signed = signed_lineage.get(event_certificate or "")
                  same_mode_rotation = (
                      from_mode == to_mode == "CONTROLLER"
                      and prior_certificate is not None
                      and event_certificate is not None
                      and event_certificate != prior_certificate
                      and prior_signed is not None
                      and event_signed is not None
                      and event_signed[0] == prior_certificate
                      and event_signed[1] > prior_signed[1])
          '''

          if text.count(old_prelude) != 1:
              raise SystemExit('REFUSED: rollout prelude did not match exactly once')
          if text.count(old_rotation) != 1:
              raise SystemExit('REFUSED: rollout rotation block did not match exactly once')
          text = text.replace(old_prelude, new_prelude, 1)
          text = text.replace(old_rotation, new_rotation, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/pr99-one-shot-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel/schema.py .github/workflows/pr99-one-shot-patch.yml
          git commit -m 'sentinel: require signed lineage for same-mode rotations'
          git push origin HEAD:fix/rollout-certificate-rotation-chain
