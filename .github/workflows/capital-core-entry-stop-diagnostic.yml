name: Core exploratory 10 20 30 exit diagnostic
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/core-entry-stop-diagnostic-request.json']
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: core-entry-stop-diagnostic-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            research/capital_risk
            .github/workflows
            docs/core-entry-stop-diagnostic.md
          sparse-checkout-cone-mode: false
      - name: Install locked transfer dependencies
        timeout-minutes: 4
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/wwe-transfer-requirements.lock
      - name: Verify fixed diagnostic contract
        timeout-minutes: 2
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/core_entry_stop_job.py --probe'
      - name: Replay recorded exits without a new portfolio
        timeout-minutes: 10
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/core_entry_stop_job.py --output artifacts/capital-risk/core-volatility-receipt.json'
      - name: Preserve encrypted diagnostic evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-entry-stop-diagnostic-${{ github.sha }}
          path: |
            artifacts/capital-risk/core-volatility-receipt.json
            artifacts/capital-risk/core-entry-stop-diagnostic.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
