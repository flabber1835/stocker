name: Champion production-equivalent source probes
run-name: Champion production-equivalent probes - ${{ github.sha }}

on:
  push:
    branches: [research/champion-production-equivalent-economic-alignment]
    paths:
      - '.github/workflows/champion-production-equivalent-probe.yml'
      - 'backtester/champion_production_equivalent_build.py'
      - 'backtester/production_equivalent_economic_overlay.py'
      - 'backtester/champion_final_security_truth.py'
      - 'backtester/test_production_equivalent_economic_overlay.py'
      - 'research/champion-economic-integrity/PRODUCTION_EQUIVALENT_ECONOMIC_CONTRACT.md'
      - 'research/champion-economic-integrity/security-truth/manual-review/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Audit checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: audit-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Exact formal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27bb992087182c42c3c051e62bf837895f5d2ab7
          path: certified-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/strategy9-e3-broad-stability
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c

      - name: Exact candidate classifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester

      - name: Pinned runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit-src rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C certified-src rev-parse HEAD)" = 27bb992087182c42c3c051e62bf837895f5d2ab7
          test "$(git -C candidate-src rev-parse HEAD)" = ba74e79490beb8950611b1d17f5d124833b3d91e
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/audit-src" >> "${GITHUB_ENV}"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "${GITHUB_ENV}"

      - name: Pull and verify exact canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          POINTER=certified-src/backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "${PACKAGE}" = ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          cid=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "${cid}:/canonical-pit/." canonical-pit/
          docker rm "${cid}"
          trap - EXIT
          PYTHONPATH="${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/certified-src" \
            python certified-src/backtester/canonical_pit_package.py verify --pointer "${POINTER}" --dataset canonical-pit > package-integrity.json

      - name: Stage audit-only overlays into exact formal source tree
        shell: bash
        run: |
          set -euo pipefail
          cp audit-src/backtester/champion_economic_prefix_audit.py certified-src/backtester/
          cp audit-src/backtester/champion_full_classification_control.py certified-src/backtester/
          cp audit-src/backtester/champion_security_truth_audit_v2.py certified-src/backtester/
          cp audit-src/backtester/champion_security_truth_overlay_v2.py certified-src/backtester/
          cp audit-src/backtester/champion_final_security_truth.py certified-src/backtester/
          cp audit-src/backtester/production_equivalent_economic_overlay.py certified-src/backtester/
          cp audit-src/backtester/champion_production_equivalent_build.py certified-src/backtester/
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R audit-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/

      - name: Run synthetic/source seam tests
        shell: bash
        run: |
          set -euo pipefail
          cd audit-src
          PYTHONPATH="${GITHUB_WORKSPACE}/audit-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" \
            python -m pytest -q backtester/test_production_equivalent_economic_overlay.py

      - name: Build exact final generated source and probes - no replay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe-output
          cd certified-src
          PYTHONPATH="${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" \
            python backtester/champion_production_equivalent_build.py \
              --candidate-root "${GITHUB_WORKSPACE}/candidate-src" \
              --output "${GITHUB_WORKSPACE}/probe-output" | tee "${GITHUB_WORKSPACE}/probe.log"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('../probe-output/SOURCE_PROBES.json')
          d=json.loads(p.read_text())
          assert d['status']=='PASS_SOURCE_BUILD_NO_REPLAY', d
          assert d['performance_replay_executed'] is False, d
          assert d['capacity_participation_cap'] is None, d
          assert d['dividend_accrual_precedes_open_equity'] is True, d
          assert d['dividend_lag_sessions']==1, d
          assert d['cumulative_terminal_retirement_present'] is False, d
          assert d['hard_abort_missing_mark_present'] is False, d
          assert d['final_truth_classifier_present'] is True, d
          print(json.dumps(d, sort_keys=True))
          PY

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-production-equivalent-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe-output/
            probe.log
            package-integrity.json
          retention-days: 90
          if-no-files-found: warn
