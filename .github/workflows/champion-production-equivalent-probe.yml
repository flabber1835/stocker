name: Champion production-equivalent source probes
run-name: Champion production-equivalent probes - ${{ github.sha }}

on:
  push:
    branches: [research/champion-production-equivalent-economic-alignment]
    paths:
      - '.github/workflows/champion-production-equivalent-probe.yml'
      - 'backtester/champion_production_equivalent_build.py'
      - 'backtester/production_equivalent_economic_overlay.py'
      - 'backtester/champion_final_security_truth.py'
      - 'backtester/champion_final_truth_corpus_validator.py'
      - 'backtester/test_production_equivalent_economic_overlay.py'
      - 'research/champion-economic-integrity/PRODUCTION_EQUIVALENT_ECONOMIC_CONTRACT.md'
      - 'research/champion-economic-integrity/security-truth/manual-review/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Audit checkout - sparse
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: audit-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/champion-economic-integrity

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Fast full-corpus validation - no runtime or PIT package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit-src rev-parse HEAD)" = "${GITHUB_SHA}"
          python audit-src/backtester/champion_final_truth_corpus_validator.py \
            --manual audit-src/research/champion-economic-integrity/security-truth/manual-review \
            --output corpus-validation.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('corpus-validation.json').read_text())
          assert report['status'] == 'PASS_FINAL_TRUTH_CORPUS_EXECUTABLE', report
          assert report['issue_count'] == 0, report
          assert report['final_unresolved_count'] == 0, report
          assert report['parent_family_counts'] == {'durable': 442, 'leadership': 182, 'ranking': 61}, report
          assert report['parent_unique_security_count'] == 685, report
          assert report['final_effective_security_count'] == 696, report
          assert report['performance_replay_executed'] is False, report
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Exact formal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27bb992087182c42c3c051e62bf837895f5d2ab7
          path: certified-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/strategy9-e3-broad-stability
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c

      - name: Exact candidate classifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: backtester

      - name: Pinned runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C certified-src rev-parse HEAD)" = 27bb992087182c42c3c051e62bf837895f5d2ab7
          test "$(git -C candidate-src rev-parse HEAD)" = ba74e79490beb8950611b1d17f5d124833b3d91e
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/audit-src" >> "${GITHUB_ENV}"

      - name: Stage audit-only overlays into exact formal source tree
        shell: bash
        run: |
          set -euo pipefail
          cp audit-src/backtester/champion_economic_prefix_audit.py certified-src/backtester/
          cp audit-src/backtester/champion_full_classification_control.py certified-src/backtester/
          cp audit-src/backtester/champion_security_truth_audit_v2.py certified-src/backtester/
          cp audit-src/backtester/champion_security_truth_overlay_v2.py certified-src/backtester/
          cp audit-src/backtester/champion_final_security_truth.py certified-src/backtester/
          cp audit-src/backtester/champion_final_truth_corpus_validator.py certified-src/backtester/
          cp audit-src/backtester/production_equivalent_economic_overlay.py certified-src/backtester/
          cp audit-src/backtester/champion_production_equivalent_build.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_corrected_classification.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_best_effort_classification.py certified-src/backtester/
          cp candidate-src/backtester/data/champion-historical-security-type-corrections-v1.csv certified-src/backtester/data/
          cp candidate-src/backtester/data/champion-best-effort-security-types-v1.csv certified-src/backtester/data/
          cp candidate-src/backtester/data/champion-best-effort-security-types-v1-summary.json certified-src/backtester/data/
          cp candidate-src/backtester/data/champion-reviewed-security-types-v1.csv certified-src/backtester/data/
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R audit-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/

      - name: Execute final classifier and every interval boundary
        shell: bash
        run: |
          set -euo pipefail
          cd certified-src
          PYTHONPATH="${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" python - <<'PY'
          from pathlib import Path
          from backtester import champion_final_security_truth as truth
          from backtester import research_champion_best_effort_classification as base
          assert len(truth.FINAL_INTERVALS) == 696, len(truth.FINAL_INTERVALS)
          estimate = truth.SecurityTypeEstimate(base.DEFAULT_LEDGER, 'reviewed_18')
          checked = 0
          for sid, intervals in sorted(truth.FINAL_INTERVALS.items(), key=lambda item: int(item[0])):
              for row in intervals:
                  assert estimate.peek(sid, row.first) == row.classification, (sid, row, 'first')
                  assert estimate.peek(sid, row.last) == row.classification, (sid, row, 'last')
                  checked += 2
          am = truth.FINAL_INTERVALS['838821611242754318']
          assert [(x.first, x.last, x.classification) for x in am] == [
              ('2017-12-26', '2019-03-12', 'non_common'),
              ('2019-03-13', '2019-03-14', 'common'),
          ], am
          pds = truth.FINAL_INTERVALS['594891209465982980']
          assert [(x.first, x.last, x.classification) for x in pds] == [
              ('2006-07-05', '2010-06-01', 'non_common'),
              ('2010-06-02', '2015-06-04', 'common'),
          ], pds
          print(f'PASS executable final truth: {len(truth.FINAL_INTERVALS)} securities; {checked} boundary classifications')
          PY

      - name: Run synthetic/source seam tests
        shell: bash
        run: |
          set -euo pipefail
          cd audit-src
          PYTHONPATH="${GITHUB_WORKSPACE}/audit-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('backtester/test_production_equivalent_economic_overlay.py')
          spec = importlib.util.spec_from_file_location('production_equivalent_probe_tests', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          tests = [(name, value) for name, value in vars(module).items() if name.startswith('test_') and callable(value)]
          if not tests:
              raise RuntimeError('no production-equivalent probe tests discovered')
          for name, test in sorted(tests):
              test()
              print(f'PASS {name}')
          print(f'PASS {len(tests)} synthetic/source seam tests')
          PY

      - name: Build exact final generated source and probes - no replay, no PIT download
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe-output
          cd certified-src
          PYTHONPATH="${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" \
            python backtester/champion_production_equivalent_build.py \
              --candidate-root "${GITHUB_WORKSPACE}/candidate-src" \
              --output "${GITHUB_WORKSPACE}/probe-output" | tee "${GITHUB_WORKSPACE}/probe.log"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('../probe-output/SOURCE_PROBES.json')
          d=json.loads(p.read_text())
          assert d['status']=='PASS_SOURCE_BUILD_NO_REPLAY', d
          assert d['performance_replay_executed'] is False, d
          assert d['capacity_participation_cap'] is None, d
          assert d['dividend_accrual_precedes_open_equity'] is True, d
          assert d['dividend_lag_sessions']==1, d
          assert d['cumulative_terminal_retirement_present'] is False, d
          assert d['hard_abort_missing_mark_present'] is False, d
          assert d['final_truth_classifier_present'] is True, d
          assert d['corpus_identity_source']=='IMMUTABLE_FORMAL_PACKAGE_POINTER_NO_DATA_ROWS_CONSUMED', d
          print(json.dumps(d, sort_keys=True))
          PY

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-production-equivalent-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe-output/
            probe.log
            corpus-validation.json
          retention-days: 90
          if-no-files-found: warn
