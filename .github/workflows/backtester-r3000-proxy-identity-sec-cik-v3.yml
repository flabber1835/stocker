name: Backtester - R3000 proxy identity SEC CIK V3
run-name: R3000 proxy identity SEC CIK V3 — ${{ github.sha }}

on:
  push:
    branches: [research/r3000-proxy-pit-corpus]
    paths:
      - '.github/workflows/backtester-r3000-proxy-identity-sec-cik-v3.yml'
      - 'backtester/r3000_proxy_identity_closure_v3.py'
      - 'tests/backtester/test_r3000_proxy_identity_closure_v3.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: r3000-proxy-identity-sec-cik-v3-${{ github.ref }}
  cancel-in-progress: false

env:
  B2_RUN_ID: '33937496364'
  B2_HEAD: '5a1fdfd8ff27f4e9be6b108edda46477680f4e5c'
  B2_ARTIFACT: r3000-proxy-identity-price-path-v2-5a1fdfd8ff27f4e9be6b108edda46477680f4e5c
  B2_ARTIFACT_DIGEST: sha256:d8faffda3739dbf4c64136cfbddabfb15a21bdcf5937164abb9d00316868e5a7
  B2_ROOT: backtester-results/r3000-proxy-identity-price-path-v2
  CANONICAL_ROOT: backtester-results/canonical-pit
  SEC_SUBMISSIONS_ZIP: backtester-results/sec/submissions.zip
  OUTPUT: backtester-results/r3000-proxy-identity-sec-cik-v3
  PYTHONUNBUFFERED: '1'

jobs:
  identity-v3:
    name: Close residual identities with SEC CIK current/former-name authority
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact corpus branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run SEC CIK authority regressions
        run: |
          set -euo pipefail
          python -m compileall -q backtester/r3000_proxy_identity_closure_v3.py tests/backtester/test_r3000_proxy_identity_closure_v3.py
          python - <<'PY'
          import inspect, runpy, tempfile
          from pathlib import Path
          ns=runpy.run_path('tests/backtester/test_r3000_proxy_identity_closure_v3.py')
          executed=0
          for name in sorted(ns):
              if not name.startswith('test_'):
                  continue
              fn=ns[name]
              params=inspect.signature(fn).parameters
              if set(params)=={'tmp_path'}:
                  with tempfile.TemporaryDirectory() as td:
                      fn(Path(td))
              elif params:
                  raise RuntimeError(f'unsupported test signature: {name}{inspect.signature(fn)}')
              else:
                  fn()
              executed += 1
          assert executed == 2, executed
          print({'status':'PASS','tests':executed,'contract':'exact SEC current/former-name authority plus exact historical price; no fuzzy promotion'})
          PY

      - name: Authenticate immutable B2 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${B2_RUN_ID}" --jq '.status+":"+(.conclusion // "")')" = "completed:success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${B2_RUN_ID}" --jq '.head_sha')" = "${B2_HEAD}"
          observed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${B2_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${B2_ARTIFACT}\") | .digest")
          test "${observed}" = "${B2_ARTIFACT_DIGEST}"
          echo "B2 artifact authenticated: ${observed}"

      - name: Download immutable B2 identity package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.B2_ARTIFACT }}
          path: ${{ env.B2_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.B2_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify B2 hashes and geometry
        run: |
          set -euo pipefail
          (cd "${B2_ROOT}" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.load(open(Path(os.environ['B2_ROOT'])/'identity_summary_v2.json'))
          assert s['status']=='PASS'
          assert s['source_rows']==63113
          assert s['fund_snapshots']==42
          assert s['resolution_counts']=={'RESOLVED':58840,'AMBIGUOUS':3,'UNMATCHED':4270,'CONFLICT':0}
          assert s['future_session_violations']==0
          PY

      - name: Pull pinned canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE=$(python - <<'PY'
          import json
          p=json.load(open('backtester/data/canonical-pit-20y.json'))
          assert p['status']=='PASS'
          print(p['package'])
          PY
          )
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          cid=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          rm -rf "${CANONICAL_ROOT}" && mkdir -p "${CANONICAL_ROOT}"
          docker cp "${cid}:/canonical-pit/." "${CANONICAL_ROOT}/"
          docker rm "${cid}"
          trap - EXIT
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          pointer=json.load(open('backtester/data/canonical-pit-20y.json'))
          root=Path(os.environ['CANONICAL_ROOT'])
          manifest_path=root/'manifest.json'
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest()==pointer['manifest_sha256']
          assert json.load(open(manifest_path))['dataset_hash']==pointer['dataset_hash']
          for year in range(2006,2027):
              assert (root/f'observations-{year}.csv.gz').is_file()
          PY

      - name: Download SEC bulk submissions authority
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SEC_SUBMISSIONS_ZIP}")"
          curl --fail --location \
            --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            --user-agent 'stocker-r3000-proxy-research/1.0 (https://github.com/flabber1835/stocker)' \
            --output "${SEC_SUBMISSIONS_ZIP}" \
            'https://www.sec.gov/Archives/edgar/daily-index/bulkdata/submissions.zip'
          unzip -tq "${SEC_SUBMISSIONS_ZIP}"
          sha256sum "${SEC_SUBMISSIONS_ZIP}"

      - name: Run Stage B3 SEC CIK authority closure
        run: |
          set -euo pipefail
          rm -rf "${OUTPUT}"
          python -m backtester.r3000_proxy_identity_closure_v3 \
            --b2 "${B2_ROOT}" \
            --canonical "${CANONICAL_ROOT}" \
            --sec-submissions-zip "${SEC_SUBMISSIONS_ZIP}" \
            --output "${OUTPUT}"
          (cd "${OUTPUT}" && sha256sum -c SHA256SUMS.txt)

      - name: Enforce B3 accounting, authority and duplicate gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.load(open(Path(os.environ['OUTPUT'])/'identity_summary_v3.json'))
          c=s['resolution_counts']
          assert s['status']=='PASS'
          assert s['source_rows']==63113
          assert s['fund_snapshots']==42
          assert sum(c.values())==63113
          assert s['future_session_violations']==0
          assert s['duplicate_security_assignments_after']==0
          assert s['sec_ciks_loaded'] + s['authority_gaps']['sec_cik_members_missing_from_bulk_archive'] == s['sec_ciks_requested']
          print(json.dumps(s,indent=2,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('## R3000 proxy Stage B3 — SEC CIK identity authority\n\n')
              fh.write(f"- Resolved: {c['RESOLVED']:,}\n")
              fh.write(f"- Ambiguous: {c['AMBIGUOUS']:,}\n")
              fh.write(f"- Unmatched: {c['UNMATCHED']:,}\n")
              fh.write(f"- Conflicts: {c['CONFLICT']:,}\n")
              fh.write(f"- SEC footnote/name closures: {s['methods_added']['sec_footnote_normalization_plus_price_certified_blackrock_name']:,}\n")
              fh.write(f"- SEC CIK current/former-name closures: {s['methods_added']['sec_cik_current_former_name_plus_historical_price']:,}\n")
              fh.write(f"- Duplicate security assignments remaining: {s['duplicate_security_assignments_after']:,}\n")
              fh.write(f"- Closure state: **{s['acceptance_state']}**\n")
              fh.write('- Every B3 promotion requires exact historical price plus exact issuer-name authority.\n')
          PY

      - name: Upload B3 identity ledger, SEC authority slice and worklist
        if: ${{ always() && hashFiles('backtester-results/r3000-proxy-identity-sec-cik-v3/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r3000-proxy-identity-sec-cik-v3-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
