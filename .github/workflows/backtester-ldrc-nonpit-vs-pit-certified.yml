name: RETIRED - legacy 1998 LD-RC Production replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Use canonical 20-year Production chain
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse unsupported legacy replay
        shell: bash
        run: |
          echo 'HISTORICAL_REPLAY_UNSUPPORTED: the legacy 1998 replay requires a 1997 SPY total-return warm-up that is not present in the certified retained SFP authority.' >&2
          echo 'Use .github/workflows/backtester-production-strict-pit-20y.yml, which runs Production on the certified canonical 2006-01-03 through 2026-07-31 PIT dataset.' >&2
          exit 1
