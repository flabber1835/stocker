name: Backtester - corrected production LD-RC non-PIT vs full-stack PIT

on:
  push:
    branches:
      - research/backtester
    paths:
      - '.github/workflows/backtester-ldrc-nonpit-vs-pit-certified.yml'
      - 'backtester/run_ldrc_corrected_warmup_cash.py'
      - 'backtester/run_ldrc_nonpit_vs_pit_certified.py'
      - 'backtester/historical_cash.py'
      - 'backtester/data/GS3M_1996-12_2007-05.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtester-ldrc-nonpit-vs-pit-certified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certified-ldrc-comparison:
    name: Corrected production LD-RC non-PIT vs full-stack PIT replay
    if: github.ref_name == 'research/backtester'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out frozen backtester laboratory inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-ldrc-nonpit-vs-pit-certified.yml
            /backtester/experiments/2026-08-27-sector-abc/**
            /backtester/run_sector_ad_causal_terminal_terms_v2.py
            /backtester/run_ldrc_nonpit_vs_pit_certified.py
            /backtester/run_ldrc_corrected_warmup_cash.py
            /backtester/historical_cash.py
            /backtester/causal_terminal_terms.py
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/MANIFEST.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SFP/**
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt

      - name: Enforce immutable research-side boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/backtester"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "BACKTESTER_BRANCH_SHA=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Reconstruct frozen SFP archive for 1997 warm-up
        shell: bash
        run: |
          set -euo pipefail
          parts=(sharadar/SFP/SHARADAR_SFP.zip.*)
          test "${#parts[@]}" -ge 1
          cat "${parts[@]}" > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null

      - name: Check out exact fixed current-main strategy source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Verify exact current-main source identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=887f479b15ad861313da666ad698034d3847121c
          ACTUAL="$(git -C main-src rev-parse HEAD)"
          test "${ACTUAL}" = "${EXPECTED}"
          test -z "$(git -C main-src status --porcelain)"
          echo "BACKTESTER_MAIN_SHA=${ACTUAL}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_ROOT=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact current-main runtime dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Compile corrected replay and exact strategy sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/historical_cash.py \
            backtester/causal_terminal_terms.py \
            backtester/run_sector_ad_causal_terminal_terms_v2.py \
            backtester/run_ldrc_nonpit_vs_pit_certified.py \
            backtester/run_ldrc_corrected_warmup_cash.py \
            backtester/experiments/2026-08-27-sector-abc/run.py
          python -m compileall -q -f main-src/sentinel main-src/shared/stock_strategy_shared

      - name: Verify frozen replay inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f 'PIT input data/MANIFEST.csv'
          test -f 'PIT input data/ACTIONS_PIT_ONLY.csv.gz'
          test -f 'PIT input data/PRICE_RECONSTRUCTION_MANIFEST.csv'
          test -f 'PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz'
          test -f sharadar/SHARADAR_TICKERS.zip
          test -f sharadar/SHARADAR_SEP_1997.csv.gz
          test -f sharadar/SHARADAR_SFP.zip
          test -f backtester/data/GS3M_1996-12_2007-05.csv
          test "$(sha256sum backtester/data/GS3M_1996-12_2007-05.csv | awk '{print $1}')" = "1c1dbdcddd50c2445f8c65d1378d3d2bc87626fe2dc9b9956bc0cd97682a72d3"
          test -f backtester/data/causal-terminal-terms-v1.json
          test -f backtester/data/causal-terminal-terms-v1.SHA256
          (cd backtester/data && sha256sum -c causal-terminal-terms-v1.SHA256)
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
          test -f research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
          count="$(find sharadar -maxdepth 1 -type f -name 'SHARADAR_SEP_*.csv.gz' | wc -l)"
          test "${count}" -ge 30

      - name: Run corrected full chronological production comparison
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          rm -rf backtester-results/ldrc-corrected-production
          python backtester/run_ldrc_corrected_warmup_cash.py \
            --lab-root . \
            --main-root main-src \
            --output backtester-results/ldrc-corrected-production \
            2>&1 | tee backtester-ldrc-corrected-production.log

      - name: Verify corrected certified bundle and print comparison table
        shell: bash
        run: |
          set -euo pipefail
          cd backtester-results/ldrc-corrected-production
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          expected_main = '887f479b15ad861313da666ad698034d3847121c'
          summary = json.loads(Path('summary.json').read_text())
          if summary.get('status') != 'PASS': raise SystemExit('summary is not PASS')
          if summary.get('full_stack_pit') is not True: raise SystemExit('full-stack PIT flag is not true')
          if summary.get('wealth_core_pit_enabled') is not True: raise SystemExit('Wealth Core PIT flag is not true')
          if summary.get('wealth_core_parity') is not False: raise SystemExit('A/D Wealth Core parity must be disabled')
          warm = summary.get('warmup') or {}
          if warm.get('start') != '1997-01-02' or warm.get('measurement_start') != '1998-01-02' or warm.get('full_machine_state_carried') is not True:
              raise SystemExit(f'wrong warm-up contract: {warm}')
          cash = summary.get('defensive_cash_authority') or {}
          if cash.get('treasury_fallback_sessions', 0) <= 0 or cash.get('bil_sessions', 0) <= 0:
              raise SystemExit(f'cash authority was not exercised across both regimes: {cash}')
          contract = summary.get('comparison_contract') or {}
          if expected_main not in str(contract.get('wealth_core')): raise SystemExit(f'wrong Wealth Core pin: {contract}')
          years = [str(x)[:4] for x in summary.get('calendar_year_cagr_checkpoints') or []]
          if years != [str(y) for y in range(1998, 2026)]: raise SystemExit(f'calendar-year checkpoints incomplete: {years}')
          daily = pd.read_csv('daily.csv.gz', compression='gzip')
          if str(daily.iloc[0]['date']) != '1998-01-02': raise SystemExit('daily measurement begins at wrong date')
          if abs(float(daily.iloc[0]['A_nav'])-1.0) > 1e-12 or abs(float(daily.iloc[0]['D_nav'])-1.0) > 1e-12:
              raise SystemExit('measured NAV was not rebased at 1998-01-02')
          required_daily = {'date','A_nav','D_nav','A_wealth_core_equity','D_wealth_core_equity','A_allocation','D_allocation'}
          if not required_daily.issubset(daily.columns): raise SystemExit(f'daily evidence missing: {sorted(required_daily-set(daily.columns))}')
          metrics = pd.read_csv('metrics.csv', dtype={'window_years': str})
          if set(metrics.window_years.astype(str)) != {'5','10','15','20','max'}: raise SystemExit('wrong metric windows')
          if set(metrics.variant.astype(str)) != {'A','D','SPY'} or len(metrics) != 15: raise SystemExit('wrong metric variants/rows')
          max_rows=metrics[metrics.window_years.astype(str).eq('max')]
          if set(max_rows.start.astype(str)) != {'1998-01-02'}: raise SystemExit(f'max window starts wrong: {max_rows.start.tolist()}')
          print(metrics.to_string(index=False))
          PY

      - name: Upload immutable corrected production replay bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtester-ldrc-corrected-production-${{ github.run_id }}
          path: |
            backtester-results/ldrc-corrected-production/**
            backtester-ldrc-corrected-production.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
