name: Backtester - Strategy 9 E3 stability basin stage 2
run-name: Strategy 9 E3 stability basin stage 2 — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-e3-broad-stability-basin]
    paths:
      - '.github/workflows/backtester-strategy9-e3-stability-basin-stage2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT_OUT: backtester-results/strategy9-e3-stability-basin-stage2

jobs:
  stability-point:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: center
            rec: 8
            v: 0.11
            dd: -0.10
            r20: -0.085
            spy: 0.0
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: spy_m005
            rec: 8
            v: 0.11
            dd: -0.10
            r20: -0.085
            spy: -0.005
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: spy_p005
            rec: 8
            v: 0.11
            dd: -0.10
            r20: -0.085
            spy: 0.005
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: spy_p010
            rec: 8
            v: 0.11
            dd: -0.10
            r20: -0.085
            spy: 0.010
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: r40_m005
            rec: 8
            v: 0.11
            dd: -0.10
            r20: -0.085
            spy: 0.0
            full_r40: -0.005
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: r40_p005
            rec: 8
            v: 0.11
            dd: -0.10
            r20: -0.085
            spy: 0.0
            full_r40: 0.005
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: r40_p010
            rec: 8
            v: 0.11
            dd: -0.10
            r20: -0.085
            spy: 0.0
            full_r40: 0.010
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: dd_m09
            rec: 8
            v: 0.11
            dd: -0.09
            r20: -0.085
            spy: 0.0
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: dd_m11
            rec: 8
            v: 0.11
            dd: -0.11
            r20: -0.085
            spy: 0.0
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: v105
            rec: 8
            v: 0.105
            dd: -0.10
            r20: -0.085
            spy: 0.0
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630
          - name: v120
            rec: 8
            v: 0.120
            dd: -0.10
            r20: -0.085
            spy: 0.0
            full_r40: 0.0
            fast_dam: 0.880
            healthy_dam: 0.630

    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-strategy9-e3-stability-basin-stage2.yml
            /backtester/run_strategy9_e3_stability_point.py
            /backtester/experiment_architecture_recovery_concordance_e3.py
            /backtester/calibrate_broad_simplified_breadth.py
            /backtester/experiment2_broad_independent_correlation.py
            /backtester/run_r1000_correlation_peers.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Compile stability harness
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/run_strategy9_e3_stability_point.py \
            backtester/experiment_architecture_recovery_concordance_e3.py \
            backtester/calibrate_broad_simplified_breadth.py \
            backtester/experiment2_broad_independent_correlation.py \
            backtester/run_research_ldrc_corrected_warmup_cash.py \
            backtester/run_research_ldrc_nonpit_vs_fullpit.py

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat sharadar/SFP/SHARADAR_SFP.zip.001 sharadar/SFP/SHARADAR_SFP.zip.002 sharadar/SFP/SHARADAR_SFP.zip.003 sharadar/SFP/SHARADAR_SFP.zip.004 > sharadar/SHARADAR_SFP.zip
          unzip -tq sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Run exact broad full-history stability point
        env:
          PYTHONUNBUFFERED: '1'
          POINT: ${{ matrix.name }}
        run: |
          set -euo pipefail
          OUT="$ROOT_OUT/$POINT"
          rm -rf "$OUT"
          python -m backtester.run_strategy9_e3_stability_point \
            --name "$POINT" \
            --output "$OUT" \
            --ldrc-rec '${{ matrix.rec }}' \
            --ldrc-v '${{ matrix.v }}' \
            --ldrc-dd '${{ matrix.dd }}' \
            --ldrc-r20 '${{ matrix.r20 }}' \
            --div-spy-floor '${{ matrix.spy }}' \
            --full-r40-floor '${{ matrix.full_r40 }}' \
            --fast-damaged '${{ matrix.fast_dam }}' \
            --healthy-damaged '${{ matrix.healthy_dam }}'
          (cd "$OUT" && sha256sum -c STABILITY_SHA256SUMS.txt)

      - name: Publish point summary
        if: always()
        env:
          POINT: ${{ matrix.name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          out=Path(os.environ['ROOT_OUT'])/os.environ['POINT']
          p=out/'stability_metrics.csv'
          if not p.exists():
              raise SystemExit(0)
          m=pd.read_csv(p,dtype={'window_years':str})
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"## {os.environ['POINT']}\n\n")
              f.write('| Window | CAGR | Max DD | Sharpe | Multiple |\n')
              f.write('|---|---:|---:|---:|---:|\n')
              for r in m.itertuples(index=False):
                  f.write(f'| {r.window_years} | {r.cagr:.2%} | {r.max_drawdown:.2%} | {r.sharpe:.3f} | {r.ending_multiple:.2f}x |\n')
          PY

      - name: Upload immutable stability point
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy9-e3-stability-stage2-${{ matrix.name }}-${{ github.sha }}
          path: ${{ env.ROOT_OUT }}/${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
