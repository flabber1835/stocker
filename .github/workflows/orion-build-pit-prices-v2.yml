name: Orion build Phase-2 PIT prices v2

on:
  workflow_dispatch:
  push:
    branches:
      - research/sentinel-fastgate-2026-08-24
    paths:
      - '.github/workflows/orion-build-pit-prices-v2.yml'
      - 'PIT input data/build_phase2_prices_v2.py'
      - 'PIT input data/MANIFEST.csv'
      - 'sharadar/SHARADAR_SEP_*.csv.gz'
      - 'sharadar/SHARADAR_ACTIONS.zip'
      - 'sharadar/SHARADAR_SFP.zip'
      - 'sharadar/SFP/SHARADAR_SFP.zip.*'

permissions:
  contents: write

concurrency:
  group: orion-build-pit-prices-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct-prices:
    name: Reconstruct and commit PIT-safe price inputs v2
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Enforce research branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "research/sentinel-fastgate-2026-08-24"

      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble exact SFP source in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/orion-phase2-source"
          rm -rf "${raw}" && mkdir -p "${raw}"
          if [[ -f sharadar/SHARADAR_SFP.zip ]]; then
            cp sharadar/SHARADAR_SFP.zip "${raw}/SHARADAR_SFP.zip"
          else
            mapfile -t parts < <(find sharadar/SFP -maxdepth 1 -type f -name 'SHARADAR_SFP.zip.*' -print | sort)
            (( ${#parts[@]} > 0 )) || { echo "missing SFP source" >&2; exit 1; }
            cat "${parts[@]}" > "${raw}/SHARADAR_SFP.zip"
          fi
          sha256sum "${raw}/SHARADAR_SFP.zip"
          echo "ORION_PHASE2_SFP=${raw}/SHARADAR_SFP.zip" >> "${GITHUB_ENV}"

      - name: Reconstruct into closed-world temporary directory
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/orion-phase2-prices"
          rm -rf "${tmp}" && mkdir -p "${tmp}"
          python "PIT input data/build_phase2_prices_v2.py" \
            --source-dir sharadar \
            --sfp "${ORION_PHASE2_SFP}" \
            --phase1-manifest "PIT input data/MANIFEST.csv" \
            --output-dir "${tmp}"
          echo "ORION_PHASE2_OUTPUT=${tmp}" >> "${GITHUB_ENV}"

      - name: Enforce closed-world Phase-2 output contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, os, pathlib
          root = pathlib.Path(os.environ['ORION_PHASE2_OUTPUT'])
          manifest = root / 'PRICE_RECONSTRUCTION_MANIFEST.csv'
          audit = root / 'PRICE_RECONSTRUCTION_AUDIT.json'
          if not manifest.is_file() or not audit.is_file(): raise SystemExit('manifest/audit missing')
          with manifest.open(newline='', encoding='utf-8') as f: rows=list(csv.DictReader(f))
          if len(rows) != 30: raise SystemExit(f'expected 30 files, got {len(rows)}')
          expected={r['file'] for r in rows}; actual={p.name for p in root.glob('*.csv.gz')}
          if expected != actual: raise SystemExit(f'closed-world mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          sep=['ticker','date','raw_open','signal_open','signal_close','split_factor_step','effective_split_ratio','dividend_basis']
          sfp=['ticker','date','raw_open','raw_close','close_to_close_factor','prior_close_to_open_factor','open_to_close_factor']
          forbidden={'open','close','closeadj','high','low','lastupdated'}
          for name in sorted(expected):
              p=root/name
              with gzip.open(p,'rt',encoding='utf-8',newline='') as f: header=next(csv.reader(f))
              want=sfp if name.startswith('SFP_') else sep
              if header != want: raise SystemExit(f'header mismatch {name}: {header}')
              if forbidden.intersection(header): raise SystemExit(f'forbidden fields in {name}')
              if p.stat().st_size >= 99*1024*1024: raise SystemExit(f'file too large: {name}')
          total=sum((root/n).stat().st_size for n in expected)
          if total >= 1800*1024*1024: raise SystemExit(f'payload too large: {total}')
          print(f'Phase-2 closed-world PASS: {len(expected)} files, {total:,} bytes')
          PY

      - name: Copy only validated derived price files into PIT input data
        shell: bash
        run: |
          set -euo pipefail
          target="PIT input data"
          rm -f "${target}"/SEP_PRICE_*_PIT_ONLY.csv.gz \
                "${target}"/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz \
                "${target}"/PRICE_RECONSTRUCTION_MANIFEST.csv \
                "${target}"/PRICE_RECONSTRUCTION_AUDIT.json
          cp "${ORION_PHASE2_OUTPUT}"/SEP_PRICE_*_PIT_ONLY.csv.gz "${target}/"
          cp "${ORION_PHASE2_OUTPUT}"/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz "${target}/"
          cp "${ORION_PHASE2_OUTPUT}"/PRICE_RECONSTRUCTION_MANIFEST.csv "${target}/"
          cp "${ORION_PHASE2_OUTPUT}"/PRICE_RECONSTRUCTION_AUDIT.json "${target}/"

      - name: Commit validated Phase-2 price inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "PIT input data"/SEP_PRICE_*_PIT_ONLY.csv.gz \
                     "PIT input data"/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz \
                     "PIT input data"/PRICE_RECONSTRUCTION_MANIFEST.csv \
                     "PIT input data"/PRICE_RECONSTRUCTION_AUDIT.json
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "Add validated Phase-2 PIT price inputs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
