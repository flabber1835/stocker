name: ABC peer sparse discovery
on:
  push:
    branches: [research/abc-peer-comparison-2026-08-27]
    paths: ['.github/workflows/abc-peer-sparse-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/abc-peer-comparison-2026-08-27
          fetch-depth: 1
          sparse-checkout: |
            .github
            docs
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/recovered
            research/sentinel-fastgate/control_parity.json
            sentinel
          sparse-checkout-cone-mode: false
      - name: Inventory
        run: |
          set -euo pipefail
          echo '=== ARCHIVES ==='
          for z in docs/Sentinel_1_1_Frozen_Harness_Handoff.zip docs/Sentinel_1_1_Faithful_Reproduction_Kit_NO_SHARADAR.zip docs/Sentinel_1_1_Terminal_and_Issuer_Corrected.zip; do
            [ -f "$z" ] || continue
            echo "--- $z"
            unzip -l "$z" | grep -Ei '(\.py|\.csv|\.pkl|\.json|\.md)$' | head -n 500 || true
          done
          echo '=== RECOVERED ==='
          find research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/recovered -type f -printf '%p %s\n' | grep -Ei 'py$|csv$|pkl$|json$|md$' | head -n 1000 || true
