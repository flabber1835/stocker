name: Backtester - broad non-PIT forensic reference
run-name: Broad non-PIT forensic reference — ${{ github.sha }}

on:
  push:
    branches: [research/backtester-sp500-pit]
    paths:
      - '.github/workflows/backtester-forensics-broad-nonpit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT_DIR: backtester-results/broad-nonpit-forensic

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-forensics-broad-nonpit.yml
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/GS3M_1996-12_2007-05.csv
            /PIT input data/ACTIONS_PIT_ONLY.csv.gz
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /sharadar/SHARADAR_SEP_*.csv.gz
            /sharadar/SHARADAR_TICKERS.zip
            /sharadar/SHARADAR_ACTIONS.zip
            /sharadar/SFP/SHARADAR_SFP.zip.*

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install frozen numerical runtime
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.4.6

      - name: Assemble pinned SFP archive
        run: |
          set -euo pipefail
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.001)" = "1b076808b3f46607c43dec4f1dd656736c4604eb"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.002)" = "8ddbc007c3b57f4f344cd1740e5a0defd4ace4a4"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.003)" = "73af2c3883f516421e4e42a0cd007110ff19b02e"
          test "$(git hash-object sharadar/SFP/SHARADAR_SFP.zip.004)" = "28a63f62b7705abd375b8747b8a9c13bc648f27e"
          cat sharadar/SFP/SHARADAR_SFP.zip.001 sharadar/SFP/SHARADAR_SFP.zip.002 sharadar/SFP/SHARADAR_SFP.zip.003 sharadar/SFP/SHARADAR_SFP.zip.004 > sharadar/SHARADAR_SFP.zip
          unzip -t sharadar/SHARADAR_SFP.zip >/dev/null
          test "$(sha256sum sharadar/SHARADAR_SFP.zip | awk '{print $1}')" = "8d2ebf7485977d9c40ec379eb33bd9d36d39d69db13602e5c51862d03172400c"

      - name: Verify frozen broad inputs
        run: |
          set -euo pipefail
          test -f sharadar/SHARADAR_ACTIONS.zip
          test -f sharadar/SHARADAR_TICKERS.zip
          test -f sharadar/SHARADAR_SEP_1997.csv.gz
          test -f backtester/data/GS3M_1996-12_2007-05.csv

      - name: Run frozen broad non-PIT reference
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python -m backtester.run_research_ldrc_corrected_warmup_cash --mode nonpit --output "$OUT_DIR"
          (cd "$OUT_DIR" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          root=Path(os.environ['OUT_DIR'])
          s=json.loads((root/'summary.json').read_text())
          m=pd.read_csv(root/'metrics.csv',dtype={'window_years':str})
          assert s['status']=='PASS' and s['mode']=='nonpit'
          assert s['research_embedded_commit']=='c14f77b3c6c6fcc14cf00e8916d7968c853a5d6c'
          print(m.to_string(index=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Frozen broad non-PIT reference\n\n')
              f.write(m.to_markdown(index=False))
              f.write('\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: broad-nonpit-forensic-${{ github.sha }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 90
