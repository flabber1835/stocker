name: Capital risk bounded baseline timing pilot

on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/timing-pilot-request.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: capital-risk-baseline-timing-pilot-001
  cancel-in-progress: false

jobs:
  timing-pilot:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
          fetch-depth: 1
      - name: Install hash-locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Verify observer and budget guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -v'
      - name: Retrieve exact approved pre-formation origin
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'gh run download 40568817130 --repo flabber1835/stocker --name capital-risk-core-recovery-qualification-stress2021-a5a2fe4c38cf0e95e79974e7b5ea78b171ea48b3 --dir "$RUNNER_TEMP/timing-origin"'
      - name: Authenticate frozen research inputs and retained runtime
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/timing-staging.json'
      - name: Run at most five formation transitions with a five-minute wait
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/timing_pilot_job.py --request research/capital_risk/timing-pilot-request.json --staging-receipt artifacts/capital-risk/timing-staging.json --qualification-download "$RUNNER_TEMP/timing-origin" --output artifacts/capital-risk/timing-pilot.json'
      - name: Preserve encrypted stopped evidence and nonfinancial receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-risk-baseline-timing-pilot-${{ github.sha }}
          path: |
            artifacts/capital-risk/timing-staging.json
            artifacts/capital-risk/timing-pilot.json
            artifacts/capital-risk/baseline-timing-pilot.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
