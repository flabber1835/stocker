name: V5 reconvergence restart barrier

on:
  push:
    branches: [research/wealth-core-v5-canonical-reconvergence-v1]
    paths:
      - '.github/workflows/v5-reconvergence-restart-barrier.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: wealth-core-v5-canonical-reconvergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch optimized experiment after cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wealth-core-v5-canonical-reconvergence-fast-v1.yml --ref research/wealth-core-v5-canonical-reconvergence-v1
