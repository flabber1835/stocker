name: Backtester - causal terminal integration verification

on:
  push:
    branches: [research/backtester]
    paths:
      - '.github/workflows/backtester-causal-terminal-integration-verify.yml'
      - 'backtester/causal_terminal_terms.py'
      - 'backtester/data/causal-terminal-terms-v1.json'
      - 'backtester/data/causal-terminal-terms-v1.SHA256'

permissions:
  contents: read

jobs:
  verify:
    name: Exercise production terminal settlement and open valuation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen research inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backtester/causal_terminal_terms.py
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /sharadar/SHARADAR_SEP_2001.csv.gz
            /PIT input data/MANIFEST.csv

      - name: Check out exact production source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c502d077cae9c494f8b74a41ee8be7f40b25837d
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact production dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Exercise exact production settlements
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/main-src:${{ github.workspace }}/main-src/shared
        run: |
          set -euo pipefail
          (cd backtester/data && sha256sum -c causal-terminal-terms-v1.SHA256)
          python - <<'PY'
          import csv, gzip, hashlib, json, math
          from pathlib import Path

          from backtester.causal_terminal_terms import load_frozen_terminal_terms
          from sentinel.feed.domains import NormalisationReport, normalise_sep_rows
          from stock_strategy_shared.wealth_core.adapter import _resolved_open_equity
          from stock_strategy_shared.wealth_core.engine import WealthCoreConfig
          from stock_strategy_shared.wealth_core.feed import SecurityMeta
          from stock_strategy_shared.wealth_core.ledger import EventType, Ledger
          from stock_strategy_shared.wealth_core.prices import DailyBar
          from stock_strategy_shared.wealth_core.state import HoldingEpisode, PortfolioState
          from stock_strategy_shared.wealth_core.terminal import TerminalKind, TerminalTerms, apply_terminal

          identity = {
              'LIT1':'120448', 'CIT.A':'122131', 'TYC':'573113',
              'GPU':'121383', 'EFD1':'182962',
          }
          meta = {
              sid: SecurityMeta(security_id=sid, ticker=ticker, permaticker=sid, related_tickers=())
              for ticker, sid in identity.items()
          }
          terms, digest = load_frozen_terminal_terms(
              Path('backtester/data/causal-terminal-terms-v1.json'),
              Path('backtester/data/causal-terminal-terms-v1.SHA256'),
              sessions=['2001-05-30','2001-06-01','2001-11-07','2007-09-12'],
              resolve_identity=lambda ticker, session: identity.get(ticker),
              meta=meta, TerminalTerms=TerminalTerms, TerminalKind=TerminalKind)
          lit = terms['2001-05-30'][0]
          cit = terms['2001-06-01'][0]
          gpu = terms['2001-11-07'][0]
          efd = terms['2007-09-12'][0]

          def holding(sid, ticker, shares, price, cash=1000.0):
              state = PortfolioState.fresh(cash, n_slots=1)
              state.slots[0].occupied_by = sid
              state.episodes[0] = HoldingEpisode(
                  security_id=sid, ticker=ticker, issuer_id=f'P:{sid}', slot_id=0,
                  signal_date='2000-01-03', entry_date='2000-01-04',
                  entry_raw_open=price, entry_split_adjusted_price=price,
                  initial_shares=shares, current_shares=shares)
              return state

          cfg = WealthCoreConfig()
          lit_state, lit_ledger = holding('120448','LIT1',10,60.0), Ledger()
          lit_result = apply_terminal(lit_state, lit, ledger=lit_ledger,
              session='2001-05-30', cfg=cfg, last_valid_mark=79.97,
              sessions_since_last_valid_print=1)
          if not lit_result.get('applied') or lit_ledger.events[-1].event_type is not EventType.CASH_MERGER:
              raise SystemExit(f'LIT settlement failed: {lit_result}')
          if lit_state.episodes or not math.isclose(lit_state.cash,1800.0,abs_tol=1e-9):
              raise SystemExit(f'LIT economics wrong: cash={lit_state.cash}')

          cit_shares = 295584
          cit_state, cit_ledger = holding('122131','CIT.A',cit_shares,38.96), Ledger()
          cit_result = apply_terminal(cit_state, cit, ledger=cit_ledger,
              session='2001-06-01', cfg=cfg, last_valid_mark=38.95,
              sessions_since_last_valid_print=0)
          ep = cit_state.episodes.get(0)
          if not cit_result.get('converted') or ep is None or ep.security_id != '573113' or ep.current_shares != 204159:
              raise SystemExit(f'CIT conversion failed: {cit_result}, {ep}')
          expected_cil = 49.91256
          if not math.isclose(float(cit_result.get('cash_in_lieu')), expected_cil, abs_tol=1e-8):
              raise SystemExit(f'CIT CIL wrong: {cit_result}')

          manifest = {row['file']: row for row in csv.DictReader(Path('PIT input data/MANIFEST.csv').open())}
          sep_path = Path('sharadar/SHARADAR_SEP_2001.csv.gz')
          sep_sha = hashlib.sha256(sep_path.read_bytes()).hexdigest()
          if sep_sha != manifest['SEP_2001_PIT_ONLY.csv.gz']['source_sha256']:
              raise SystemExit('SEP 2001 hash mismatch')
          rows = []
          with gzip.open(sep_path,'rt',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  if row.get('ticker') == 'TYC' and row.get('date') in {'2001-05-31','2001-06-04'}:
                      rows.append(row)
          rows.sort(key=lambda row: (row['date'], row['ticker']))
          norm = list(normalise_sep_rows(rows,
              resolve_identity=lambda ticker, session: identity.get(ticker),
              dividends={}, authoritative_splits=None, report=NormalisationReport()))
          june4 = next(x for x in norm if x.vendor.session == '2001-06-04')
          tyc_bar = DailyBar(
              security_id='573113', ticker='TYC', issuer_id='P:573113', session='2001-06-04',
              signal_close_split_adj_div_unadj=float(june4.close_signal),
              raw_open=float(june4.vendor.raw_open), raw_mark_close=float(june4.vendor.raw_close),
              tradeable=bool(june4.vendor.tradeable))
          open_equity, unresolved = _resolved_open_equity(cit_state,[tyc_bar],cit_ledger)
          if unresolved or open_equity is None:
              raise SystemExit(f'CIT/TYC open unresolved: {unresolved}')

          gpu_shares = 204677
          gpu_state, gpu_ledger = holding('121383','GPU',gpu_shares,40.2,cash=0.0), Ledger()
          gpu_result = apply_terminal(gpu_state, gpu, ledger=gpu_ledger,
              session='2001-11-07', cfg=cfg, last_valid_mark=40.39,
              sessions_since_last_valid_print=1)
          expected_gpu = 7470710.50
          if not gpu_result.get('applied') or gpu_result.get('kind') != 'CASH_MERGER':
              raise SystemExit(f'GPU settlement failed: {gpu_result}')
          if gpu_state.episodes or not math.isclose(gpu_state.cash, expected_gpu, rel_tol=0, abs_tol=1e-8):
              raise SystemExit(f'GPU economics wrong: {gpu_state.cash}')
          if gpu_ledger.events[-1].event_type is not EventType.CASH_MERGER:
              raise SystemExit('GPU ledger event wrong')

          efd_shares = 100
          efd_state, efd_ledger = holding('182962','EFD1',efd_shares,35.5,cash=0.0), Ledger()
          efd_result = apply_terminal(efd_state, efd, ledger=efd_ledger,
              session='2007-09-12', cfg=cfg, last_valid_mark=36.45,
              sessions_since_last_valid_print=1)
          expected_efd = 3650.0
          if not efd_result.get('applied') or efd_result.get('kind') != 'CASH_MERGER':
              raise SystemExit(f'EFD settlement failed: {efd_result}')
          if efd_state.episodes or not math.isclose(efd_state.cash, expected_efd, rel_tol=0, abs_tol=1e-9):
              raise SystemExit(f'EFD economics wrong: {efd_state.cash}')
          if efd_ledger.events[-1].event_type is not EventType.CASH_MERGER:
              raise SystemExit('EFD ledger event wrong')

          print(json.dumps({
              'status':'PASS', 'terminal_terms_sha256':digest,
              'LIT1_cash_for_10_shares':lit_state.cash-1000.0,
              'CIT_delivered_TYC_shares':ep.current_shares,
              'CIT_cash_in_lieu':float(cit_result.get('cash_in_lieu')),
              'TYC_2001_06_04_raw_open':june4.vendor.raw_open,
              'GPU_shares':gpu_shares, 'GPU_cash_per_share':gpu.cash_per_share,
              'GPU_exact_proceeds':gpu_state.cash,
              'EFD1_shares':efd_shares, 'EFD1_cash_per_share':efd.cash_per_share,
              'EFD1_exact_proceeds':efd_state.cash,
          }, indent=2, sort_keys=True))
          PY
