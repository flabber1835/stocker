name: LD-RC ABC diagnostic
on:
  push:
    branches: [research/ldrc-abc-dynamic-2026-08-27]
    paths: ['.github/workflows/ldrc-abc-diagnostic.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            docs/Sentinel_1_1_Faithful_Reproduction_Kit_NO_SHARADAR.zip
            docs/Sentinel_1_1_Frozen_Harness_Handoff.zip
            docs/sentinel-handoff
            docs/sentinel-reference-implementation
            docs/sentinel-concordance-ldrc-authoritative-spec.md
            sentinel/controller
            research
      - name: Inspect and persist retained replay assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/faith /tmp/frozen
          mkdir -p /tmp/faith /tmp/frozen research/ldrc-abc-run
          unzip -q docs/Sentinel_1_1_Faithful_Reproduction_Kit_NO_SHARADAR.zip -d /tmp/faith
          unzip -q docs/Sentinel_1_1_Frozen_Harness_Handoff.zip -d /tmp/frozen
          OUT=research/ldrc-abc-run/diagnostic.txt
          {
            echo '=== FAITHFUL KIT INVENTORY ==='
            find /tmp/faith -type f | sort
            echo '=== FROZEN HANDOFF INVENTORY ==='
            find /tmp/frozen -type f | sort
            echo '=== EXACT CONTROL FINGERPRINT OCCURRENCES ==='
            grep -RIlE '22\.630215|0\.226302156|59\.154286' /tmp/faith /tmp/frozen docs sentinel research 2>/dev/null || true
            echo '=== RELEVANT CSV HEADERS ==='
            while IFS= read -r f; do echo "--- $f"; head -2 "$f" || true; done < <(find /tmp/faith /tmp/frozen -type f -name '*.csv' | grep -Ei 'daily|replay|parent|breadth|position|shadow|spy|bil|ldrc|concord' | sort)
          } > "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'research: persist LD-RC replay inventory'
          git push
