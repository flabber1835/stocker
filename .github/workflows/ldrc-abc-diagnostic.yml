name: LD-RC ABC diagnostic
on:
  push:
    branches: [research/ldrc-abc-dynamic-2026-08-27]
    paths: ['.github/workflows/ldrc-abc-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            PIT input data
            research/sentinel-fastgate
            docs/sentinel-handoff/04_BREADTH_ORACLES
            docs/sentinel-reference-implementation/sentinel_1p1_daily.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Inspect schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          files=[
            'docs/sentinel-handoff/04_BREADTH_ORACLES/fundamental_portfolio_health_daily.csv',
            'docs/sentinel-handoff/04_BREADTH_ORACLES/sentinel_1p1_exact_daily_with_breadth.csv',
            'docs/sentinel-reference-implementation/sentinel_1p1_daily.csv',
            'PIT input data/SFP_SPY_BIL_PIT_ONLY.csv.gz',
            'PIT input data/SEP_PRICE_2006_PIT_ONLY.csv.gz',
            'PIT input data/SEP_2006_PIT_ONLY.csv.gz',
          ]
          for f in files:
            p=Path(f); print(f'=== {f} size={p.stat().st_size} ===')
            df=pd.read_csv(p,nrows=5)
            print('columns=',list(df.columns))
            print(df.head(3).to_csv(index=False))
          PY
