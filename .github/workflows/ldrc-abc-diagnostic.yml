name: LD-RC ABC diagnostic
on:
  push:
    branches: [research/ldrc-abc-dynamic-2026-08-27]
    paths: ['.github/workflows/ldrc-abc-diagnostic.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research
            docs/sentinel-handoff
            docs/sentinel-reference-implementation
      - name: Locate exact replay inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/ldrc-abc-run
          OUT=research/ldrc-abc-run/tree_assets.txt
          {
            echo '=== PIT / PRICE / POSITION / CONTROL ASSETS ==='
            git ls-tree -r --name-only HEAD | grep -Ei 'PIT_ONLY|SEP_20|SFP.*PIT|position.*panel|held.*close|sector_diag|sentinel_1p1_daily|control.*daily|shadow.*daily|correct.*pit|sec.*sic|fastgate' | sort
          } > "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'research: locate exact ABC replay inputs'
          git push
