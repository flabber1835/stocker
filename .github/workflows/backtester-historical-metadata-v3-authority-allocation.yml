name: Backtester - historical metadata V3 authority allocation
run-name: Historical metadata V3 authority allocation — ${{ github.sha }}

on:
  push:
    branches: [research/enrich-pit-2007-2026-metadata]
    paths:
      - '.github/workflows/backtester-historical-metadata-v3-authority-allocation.yml'
      - 'backtester/admit_historical_metadata_candidates_v3.py'
      - 'tests/backtester/test_metadata_v3_authority_allocation.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  V2_RUN_ID: '33701529865'
  V2_ARTIFACT: historical-metadata-v2-resilient-indexed-evidence-431686edffef158ff61c122c977ff2c7c18b7036-3556a6c9e01410bed6af02c0bd0d42eb718d2068
  V3_RUN_ID: '33704396721'
  V3_ARTIFACT: historical-metadata-v3-candidates-5d4d826c1c295cdc0a9dde5b80208a7cdf3e14f2
  V2_ROOT: backtester-results/historical-metadata-v2-package
  V3_ROOT: backtester-results/historical-metadata-v3-candidates
  OUTPUT: backtester-results/historical-metadata-v3-authority-allocation
  ECONOMIC_SOURCE_SHA: '4c11413f8dbb8b263367022c658a303035d9156b'

jobs:
  authority:
    name: Admit only V3 evidence that passes authority and canonical episode allocation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out authority-gate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run fail-closed authority regression
        run: |
          set -euo pipefail
          python -m compileall -q \
            backtester/admit_historical_metadata_candidates_v3.py \
            tests/backtester/test_metadata_v3_authority_allocation.py
          python - <<'PY'
          import runpy
          import tempfile
          from pathlib import Path
          ns = runpy.run_path('tests/backtester/test_metadata_v3_authority_allocation.py')
          with tempfile.TemporaryDirectory() as td:
              ns['test_v3_authority_gate_is_fail_closed_and_guard_bounded'](Path(td))
          print({'status': 'PASS', 'contract': 'unknown never becomes ineligible; guard mismatches never auto-retarget'})
          PY

      - name: Download authenticated V2 metadata evidence package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.V2_ARTIFACT }}
          path: ${{ env.V2_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V2_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download merged evidence-only V3 candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.V3_ARTIFACT }}
          path: ${{ env.V3_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V3_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable input bindings
        run: |
          set -euo pipefail
          python -m backtester.historical_metadata_reconstruction_v2 verify --root "${V2_ROOT}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          v2 = Path(os.environ['V2_ROOT'])
          v3 = Path(os.environ['V3_ROOT'])
          binding = json.load(open(v2 / 'recovery_binding.json'))
          timeline = json.load(open(v2 / 'timeline' / 'timeline_coverage.json'))
          candidates = json.load(open(v3 / 'summary.json'))
          assert binding['status'] == 'PASS'
          assert binding['economic_source_sha'] == os.environ['ECONOMIC_SOURCE_SHA']
          assert int(binding['source_run_id']) == 33468938050
          assert timeline['status'] == 'PASS'
          assert int(timeline['unresolved_episode_records']) == 8353
          assert candidates['status'] == 'PASS'
          assert candidates['candidate_only'] is True
          assert candidates['admission_effect'] == 'NONE'
          assert int(candidates['merged_shards']) == 32
          assert int(candidates['candidate_rows']) == 22140
          print({
              'status': 'PASS',
              'v2_unresolved': timeline['unresolved_episode_records'],
              'v3_candidate_rows': candidates['candidate_rows'],
              'economic_source_sha': binding['economic_source_sha'],
          })
          PY

      - name: Apply authority and canonical episode allocation gate
        run: |
          set -euo pipefail
          python -m backtester.admit_historical_metadata_candidates_v3 \
            --package-root "${V2_ROOT}" \
            --candidate-root "${V3_ROOT}" \
            --output "${OUTPUT}"

      - name: Enforce fail-closed real-corpus result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['OUTPUT'])
          summary = json.load(open(root / 'summary.json'))
          assert summary['status'] == 'PASS'
          assert summary['admission_status'] == 'REVIEW_REQUIRED'
          assert summary['baseline_unresolved_episode_records'] == 8353
          assert 0 < summary['fully_resolved_episode_delta'] < 8353
          assert summary['unresolved_episode_records_after_v3'] < 8353
          assert summary['security_type_conflicts'] == 0
          assert summary['extended_form_type_candidates_admitted'] == 0
          assert summary['ownership_form_type_candidates_admitted'] == 0
          assert summary['policy']['unknown_never_means_ineligible'] is True
          assert summary['policy']['candidate_target_security_id_is_not_authority'] is True
          assert summary['policy']['guard_mismatch_never_retargets_or_admits_automatically'] is True
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write((root / 'SUMMARY.md').read_text(encoding='utf-8'))
          PY

      - name: Upload authenticated V3 authority overlay and review queue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-metadata-v3-authority-allocation-${{ github.sha }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 90
