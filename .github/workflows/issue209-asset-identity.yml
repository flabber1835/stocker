name: Apply issue 209 asset identity patch

on:
  push:
    branches:
      - fix/issue-209-financial-grade-trial
    paths:
      - tools/issue209-asset-identity.patch
      - .github/workflows/issue209-asset-identity.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/issue209-asset-identity.patch
      - .github/workflows/issue209-asset-identity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: fix/issue-209-financial-grade-trial
      - name: Apply and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue209-asset-identity.patch
          git diff --check
          python -m compileall -q sentinel/execution/journal.py sentinel/execution/reconcile.py tests/sentinel/test_issue209_asset_identity.py
      - name: Commit production patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sentinel/execution/journal.py sentinel/execution/reconcile.py tests/sentinel/test_issue209_asset_identity.py
          git rm -- tools/issue209-asset-identity.patch .github/workflows/issue209-asset-identity.yml
          git commit -m 'Enforce Alpaca asset identity end to end (#209)'
          git push origin HEAD:fix/issue-209-financial-grade-trial
