name: Fast exact 2007 Russell CDX probe

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - '.github/workflows/pit-russell-2007-cdx-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cdx:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Query exact known Russell R3000 endpoints for 2007
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          endpoint='https://web.archive.org/cdx/search/cdx'
          urls=[
            'http://www.russell.com/us/indexes/us/reconstitution/R3000.pdf',
            'http://www.russell.com/us/Indexes/US/Reconstitution/R3000.pdf',
          ]
          for source in urls:
              params=[
                  ('url',source),('output','json'),
                  ('fl','timestamp,original,statuscode,mimetype,digest,length'),
                  ('filter','statuscode:200'),('from','2007'),('to','2007'),('collapse','digest'),
              ]
              url=endpoint+'?'+urllib.parse.urlencode(params)
              print('QUERY',source,flush=True)
              req=urllib.request.Request(url,headers={'User-Agent':'stocker-pit-russell-research/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      payload=response.read().decode('utf-8','replace')
                      print('HTTP',response.status,'BYTES',len(payload),flush=True)
                      print(payload,flush=True)
              except Exception as exc:
                  print('ERROR',type(exc).__name__,str(exc),flush=True)
          PY
