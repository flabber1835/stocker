name: Codex export backtester remediation blobs

on:
  push:
    branches: [codex/fix-backtester-financial-audit-20260831]
    paths: [.github/workflows/codex-export-backtester-remediation-blobs.yml]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact backtester target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/backtester
          path: target
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-production-strict-pit-20y.yml
            /.github/workflows/backtester-production-strict-pit-year-worker.yml
            /.github/workflows/backtester-strict-pit-20y.yml
            /.github/workflows/backtester-research-only-20y.yml
            /backtester/run_production_strict_pit_20y.py
            /backtester/data/production-chain-generation.json
            /backtester/PRODUCTION_20Y_ANNUAL_CHAIN_DESIGN.md
            /backtester/production_year_checkpoint_overlay.py
            /backtester/write_production_year_certificate.py
            /tests/__init__.py
            /tests/backtester/__init__.py
            /tests/backtester/test_production_annual_chain.py
            /tests/backtester/test_canonical_pit_dataset.py
      - name: Check out reviewed remediation script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 76ed45f2b651c55ff41f5b056c2354f17b747473
          path: remediation
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/codex_backtester_financial_remediation.py
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "c6a1e253fb3b6b12fa8572d039b8c4894a1b917d"
          (cd target && python ../remediation/tools/codex_backtester_financial_remediation.py)
          (cd target && python -m unittest tests.backtester.test_production_annual_chain -v)
      - name: Check out feature branch for blob publication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/fix-backtester-financial-audit-20260831
          path: output
          fetch-depth: 1
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /.gitignore
      - name: Publish validated blobs as ordinary repository files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output/remediation-output
          mkdir -p output/remediation-output/.github/workflows output/remediation-output/backtester/data output/remediation-output/tests/backtester
          cp target/.github/workflows/backtester-production-strict-pit-year-worker.yml output/remediation-output/.github/workflows/
          cp target/.github/workflows/backtester-strict-pit-20y.yml output/remediation-output/.github/workflows/
          cp target/.github/workflows/backtester-research-only-20y.yml output/remediation-output/.github/workflows/
          cp target/backtester/__init__.py output/remediation-output/backtester/
          cp target/backtester/run_production_strict_pit_20y.py output/remediation-output/backtester/
          cp target/backtester/data/production-chain-generation.json output/remediation-output/backtester/data/
          cp target/backtester/PRODUCTION_20Y_ANNUAL_CHAIN_DESIGN.md output/remediation-output/backtester/
          cp target/tests/backtester/test_production_annual_chain.py output/remediation-output/tests/backtester/
          cp target/tests/backtester/test_canonical_pit_dataset.py output/remediation-output/tests/backtester/
          cd output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse remediation-output
          git commit -m "Export validated backtester remediation blobs"
          git push origin HEAD:refs/heads/codex/fix-backtester-financial-audit-20260831
