name: PR268 CI dispatch

on:
  push:
    branches: [ci/pr268-final-20260826]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Sentinel safety on this exact ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/sentinel-safety.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}"
