name: Validate execution flattening

on:
  push:
    branches:
      - codex/flatten-execution-remediation

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build one canonical Alpaca module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base_path = Path('sentinel/execution/_alpaca_base.py')
          public_path = Path('sentinel/execution/alpaca.py')
          base = base_path.read_text()
          addon = public_path.read_text()

          base = base.replace(
              'import logging\n',
              'import hashlib\nimport json\nimport logging\n',
              1)
          base = base.replace(
              'from dataclasses import dataclass\n',
              'from dataclasses import dataclass, replace\n',
              1)
          base = base.replace(
              'from typing import Optional, Sequence\n',
              'from typing import Mapping, Optional, Sequence\n',
              1)
          import_anchor = '''from sentinel.execution.guarded import BrokerAuthorityRefused\nfrom sentinel.execution.states import CommandState as S\n'''
          import_replacement = '''from sentinel.execution.guarded import BrokerAuthorityRefused\nfrom sentinel.execution import broker_cash, contract, journal\nfrom sentinel.execution.identity import is_sentinel_key\nfrom sentinel.execution.states import CommandState, CommandState as S, TERMINAL\nfrom sentinel.feed import calendar\n'''
          if base.count(import_anchor) != 1:
              raise RuntimeError('canonical Alpaca import seam changed')
          base = base.replace(import_anchor, import_replacement, 1)

          marker = '_ACTIVITY_BUSINESS_TIME_FLOOR = '
          if addon.count(marker) != 1:
              raise RuntimeError('flattened Alpaca addon seam changed')
          addon_body = marker + addon.split(marker, 1)[1]
          addon_body = addon_body.replace('alpaca.', '')
          for class_name in ('AccountBoundObservation', 'NativeBrokerFill'):
              old = f'\nclass {class_name}('
              new = f'\n@dataclass(frozen=True)\nclass {class_name}('
              if addon_body.count(old) != 1:
                  raise RuntimeError(f'{class_name} class seam changed')
              addon_body = addon_body.replace(old, new, 1)

          public_path.write_text(base.rstrip() + '\n\n' + addon_body.lstrip())
          base_path.unlink()
          PY

      - name: Migrate strict-recovery tests to canonical functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/sentinel/test_alpaca_boundary_overlay.py')
          text = path.read_text()
          old_compat_import = 'from sentinel.execution import reconcile as compat\n'
          new_helper_import = 'from sentinel.execution.reconcile import _is_broker_instance\n'
          if text.count(old_compat_import) != 1:
              raise RuntimeError('compatibility helper import seam changed')
          text = text.replace(old_compat_import, new_helper_import, 1)
          text = text.replace('compat._is_broker_instance(', '_is_broker_instance(')
          old_import = '''    NativeBrokerFill,\n    restore_increase_fence_reason,\n)'''
          new_import = '''    NativeBrokerFill,\n    restore_increase_fence_reason,\n    strict_advance,\n    strict_checkpoint,\n)'''
          if text.count(old_import) != 1:
              raise RuntimeError('strict recovery import seam changed')
          text = text.replace(old_import, new_import, 1)

          start = text.index('\ndef _strict_context():')
          end = text.index('\ndef test_naked_complete_observation', start)
          text = text[:start] + '\n' + text[end:]
          text = text.replace(
              '    with _strict_context():\n'
              '        assert journal.terminal_recovery_checkpoint(conn) == established\n',
              '    assert strict_checkpoint(conn) == established\n',
              1)
          text = text.replace(
              '    with _strict_context(), pytest.raises(\n'
              '            RuntimeError, match="not yet durably reconciled"):\n'
              '        journal.advance_terminal_recovery_watermark(conn, through)\n',
              '    with pytest.raises(\n'
              '            RuntimeError, match="not yet durably reconciled"):\n'
              '        strict_advance(conn, through)\n',
              1)
          if '_strict_context' in text or 'compat.' in text:
              raise RuntimeError('stale compatibility recovery helper remains')
          path.write_text(text)
          PY

      - name: Make import-order regression assert non-mutation
        shell: bash
        run: |
          cat > tests/sentinel/test_issue222_import_order.py <<'PY'
          """Import-order regression for immediate emergency authority."""
          from __future__ import annotations

          import subprocess
          import sys
          import textwrap


          def _run(program: str) -> None:
              result = subprocess.run(
                  [sys.executable, "-c", textwrap.dedent(program)],
                  text=True, capture_output=True, timeout=10, check=False)
              assert result.returncode == 0, result.stderr or result.stdout


          def test_execution_first_import_keeps_emergency_authority_native():
              _run("""
                  import sentinel.execution
                  from sentinel import authority
                  from sentinel.automation import store

                  functions = (
                      store.engage_kill,
                      authority.revoke_signed_certificate,
                      authority.revoke_signed_key,
                      authority.revoke_system_certificate,
                  )
                  assert all("alpaca_remediation" not in f.__module__ for f in functions)
              """)


          def test_automation_first_import_does_not_replace_emergency_authority():
              _run("""
                  from sentinel import authority
                  from sentinel.automation import store

                  baseline = (
                      store.engage_kill,
                      authority.revoke_signed_certificate,
                      authority.revoke_signed_key,
                      authority.revoke_system_certificate,
                  )
                  import sentinel.execution
                  current = (
                      store.engage_kill,
                      authority.revoke_signed_certificate,
                      authority.revoke_signed_key,
                      authority.revoke_system_certificate,
                  )
                  assert current == baseline
              """)
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --quiet -r sentinel/requirements.txt -e shared \
            pytest pytest-asyncio hypothesis sqlalchemy aiosqlite pyflakes

      - name: Verify canonical module and focused execution boundary
        shell: bash
        run: |
          test ! -e sentinel/execution/_alpaca_base.py
          ! grep -R "alpaca_remediation" sentinel tests/sentinel/test_issue222_import_order.py
          grep -q "assert_paper_url" sentinel/execution/alpaca.py
          python -m py_compile \
            sentinel/execution/alpaca.py \
            sentinel/execution/guarded.py \
            sentinel/execution/journal.py \
            sentinel/execution/reconcile.py \
            sentinel/execution/executor.py \
            tests/sentinel/test_issue222_import_order.py \
            tests/sentinel/test_alpaca_boundary_overlay.py
          pytest -q \
            tests/sentinel/test_adapter_and_recovery_drill.py \
            tests/sentinel/test_alpaca_boundary_overlay.py \
            tests/sentinel/test_issue222_import_order.py \
            tests/sentinel/test_paper_allowlist.py

      - name: Run broad host-safe Sentinel suite
        run: |
          pytest tests/sentinel -q -ra \
            --ignore=tests/sentinel/test_image_layout.py \
            --ignore=tests/sentinel/test_issue_149_151.py \
            --ignore=tests/sentinel/test_merge_readiness_137_149.py \
            --ignore=tests/sentinel/test_runtime_regressions_137_148_149_150.py

      - name: Lint changed execution boundary
        run: |
          python -m pyflakes \
            sentinel/execution/alpaca.py \
            sentinel/execution/guarded.py \
            sentinel/execution/journal.py \
            sentinel/execution/reconcile.py \
            sentinel/execution/executor.py \
            sentinel/execution/authority_gate.py \
            sentinel/execution/broker_cash.py

      - name: Commit validated canonical execution path
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-execution-flatten.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(execution): preserve canonical Alpaca semantics"
          git push origin HEAD:codex/flatten-execution-remediation
