name: Validate execution flattening

on:
  push:
    branches:
      - codex/flatten-execution-remediation

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore dataclass contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sentinel/execution/alpaca.py')
          text = path.read_text()
          for class_name in ('AccountBoundObservation', 'NativeBrokerFill'):
              old = f'\nclass {class_name}('
              new = f'\n@dataclass(frozen=True)\nclass {class_name}('
              if text.count(old) != 1:
                  raise RuntimeError(f'{class_name} class seam changed')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python - <<'PY'
          from dataclasses import is_dataclass
          from sentinel.execution.alpaca import AccountBoundObservation, NativeBrokerFill
          assert is_dataclass(AccountBoundObservation)
          assert is_dataclass(NativeBrokerFill)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --quiet -r sentinel/requirements.txt -e shared \
            pytest pytest-asyncio hypothesis sqlalchemy aiosqlite pyflakes
      - name: Run complete Sentinel suite
        run: |
          pytest tests/sentinel -q -ra
      - name: Lint changed execution boundary
        run: |
          python -m pyflakes \
            sentinel/execution/alpaca.py \
            sentinel/execution/_alpaca_base.py \
            sentinel/execution/guarded.py \
            sentinel/execution/journal.py \
            sentinel/execution/reconcile.py \
            sentinel/execution/executor.py \
            sentinel/execution/authority_gate.py \
            sentinel/execution/broker_cash.py
      - name: Commit validated dataclass fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-execution-flatten.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(execution): preserve flattened evidence dataclasses"
          git push origin HEAD:codex/flatten-execution-remediation
