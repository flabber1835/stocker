name: Targeted Sentinel review 149 and issue 151

on:
  push:
    branches: [codex/fix-137-148-149-150]
    paths:
      - scripts/apply_review_149_issue_151.py
      - .github/workflows/targeted-review-149-151.yml

permissions:
  contents: write

concurrency:
  group: targeted-sentinel-review-149-151
  cancel-in-progress: true

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/fix-137-148-149-150
          fetch-depth: 2

      - name: Apply reviewed fixes
        run: |
          set -euo pipefail
          python scripts/apply_review_149_issue_151.py
          git diff --check
          bash -n scripts/sentinel-emergency-kill.sh
          python -m py_compile tests/sentinel/test_issue_149_151.py

      - name: Build only the Sentinel runtime/test lens
        run: |
          set -euo pipefail
          docker build \
            --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel -t sentinel:latest .
          docker build \
            --build-arg SENTINEL_RUNTIME_BASE_IMAGE=sentinel:latest \
            --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel-authorized -t sentinel-authorized:targeted .
          docker build \
            --build-arg SENTINEL_IMAGE=sentinel-authorized:targeted \
            --build-arg SOURCE_GIT_SHA="$(git rev-parse HEAD)" \
            -f Dockerfile.sentinel-test -t sentinel-test:targeted .

      - name: Run only targeted panel and emergency-path tests
        run: |
          set -euo pipefail
          docker run --rm --network none sentinel-test:targeted \
            tests/sentinel/test_issue_149_151.py \
            tests/sentinel/test_panel.py \
            -q -ra

      - name: Publish tested product diff and remove harness
        run: |
          set -euo pipefail
          rm scripts/apply_review_149_issue_151.py
          rm .github/workflows/targeted-review-149-151.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix emergency dotenv handling and canonical panel ownership"
          git push origin HEAD:codex/fix-137-148-149-150
