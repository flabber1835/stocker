name: Issue 180 one-shot patch helper

on:
  push:
    branches:
      - fix/issue-180-execution-projection
    paths:
      - .github/workflows/issue-180-patch-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-180-execution-projection
          fetch-depth: 0
      - name: Apply exact issue 180 test/documentation corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/sentinel/test_paper_activation.py')
          text = path.read_text()
          replacements = {
              '    assert prepared.plan.target_basket[AAA.security_id] == D("10")\n':
              '    assert prepared.plan.account_nav == D("3500")\n'
              '    assert prepared.plan.target_basket[AAA.security_id] == D("35")\n',
              '        assert commands[0].filled_quantity == D("10")\n':
              '        assert commands[0].filled_quantity == D("35")\n',
              '    assert held == {AAA.security_id: D("10")}\n':
              '    assert held == {AAA.security_id: D("35")}\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)

          decision = Path('sentinel/core/decision.py')
          text = decision.read_text()
          old = ('    increase it. This is the required asymmetry: no mark may block a buy, never a\n'
                 '    required trim.\n')
          new = ('    increase it. This is the required asymmetry: a missing mark may block an\n'
                 '    increase, never a required trim.\n')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one decision-docstring match, found {count}')
          decision.write_text(text.replace(old, new))
          PY
          rm .github/workflows/issue-180-patch-helper.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- tests/sentinel/test_paper_activation.py sentinel/core/decision.py .github/workflows/issue-180-patch-helper.yml
          git commit -m 'tests: align migration path with decision-close NAV'
          git push origin HEAD:fix/issue-180-execution-projection
