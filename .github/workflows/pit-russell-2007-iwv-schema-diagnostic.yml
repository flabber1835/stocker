name: Inspect 2007 IWV historical CSV schema

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - '.github/workflows/pit-russell-2007-iwv-schema-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Fetch June 30 2007 IWV payload and inspect schema
        run: |
          python - <<'PY'
          import hashlib, urllib.parse, urllib.request
          base='https://www.ishares.com/us/products/239714/ishares-russell-3000-etf/1467271812596.ajax'
          q=urllib.parse.urlencode({'fileType':'csv','fileName':'IWV_holdings','dataType':'fund','asOfDate':'20070630'})
          url=base+'?'+q
          req=urllib.request.Request(url,headers={'User-Agent':'stocker-pit-russell-research/1.0 (+https://github.com/flabber1835/stocker)','Accept':'text/csv,text/plain,*/*;q=0.5'})
          with urllib.request.urlopen(req,timeout=20) as r:
              payload=r.read()
              print('HTTP',r.status,'TYPE',r.headers.get('Content-Type'),'BYTES',len(payload),'SHA256',hashlib.sha256(payload).hexdigest())
          text=payload.decode('utf-8-sig','replace')
          lines=text.splitlines()
          print('LINES',len(lines))
          print('=== FIRST 60 LINES ===')
          for i,line in enumerate(lines[:60],1): print(f'{i:04d}: {line[:2000]}')
          print('=== TOKEN LINES ===')
          for i,line in enumerate(lines,1):
              low=line.lower()
              if any(x in low for x in ('ticker','asset class','cusip','holdings','issuer','market value','weight')):
                  print(f'{i:04d}: {line[:2000]}')
          print('=== LAST 30 LINES ===')
          for i,line in enumerate(lines[-30:],len(lines)-29): print(f'{i:04d}: {line[:2000]}')
          PY
