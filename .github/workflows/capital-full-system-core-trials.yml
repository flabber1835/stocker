name: Full system initial multiyear Core paths
on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/full-system-core-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: full-system-search-20261029-economic
  cancel-in-progress: false
jobs:
  core-path:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        arm: [B, B0, C1, C2, C3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/capital_risk
          fetch-depth: 1
      - name: Install locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Authenticate existing frozen archive and runtime
        timeout-minutes: 8
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/full-core-staging.json'
      - name: Own canonical origin, bounded Core replay and stopped review
        timeout-minutes: 180
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/full_system_trials_job.py --request research/capital_risk/full-system-core-request.json --staging artifacts/capital-risk/full-core-staging.json --arm ${{ matrix.arm }} --output artifacts/capital-risk/full-core-${{ matrix.arm }}.json'
      - name: Preserve exact encrypted stopped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-system-core-${{ matrix.arm }}-${{ github.sha }}
          path: |
            artifacts/capital-risk/full-core-staging.json
            artifacts/capital-risk/full-core-${{ matrix.arm }}.json
            artifacts/capital-risk/full-core-${{ matrix.arm }}.tar.crseal
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
