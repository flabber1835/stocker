name: Research - Wealth Core V5 Sentinel EX3 V6 drawdown execution
run-name: V5 + EX3 V6 drawdown execution - ${{ github.sha }}

on:
  push:
    branches: [research/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1]
    paths:
      - '.github/workflows/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1.yml'
      - 'research/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: wealth-core-v5-sentinel-ex3-v6-drawdown-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'

jobs:
  replay:
    name: Drawdown execution - ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        variant:
          - split_clocks
          - global_tier
          - positive_gate
          - divergence_tier
          - native_tier
          - split_divergence_tier
          - split_divergence_tier_gate
          - split_global_tier_gate
          - split_global_tier_gate_c2
          - split_global_tier_gate_c3

    steps:
      - name: Experiment checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: experiment-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            research/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1
            research/wealth-core-v5-sentinel-ex3-impedance-v1
            research/wealth-core-v5-affordability-fix-v1

      - name: Exact economic-source authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3dc74a8e54fdfe6e8368a8db3be0ecd127ee4689
          path: open-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/champion-economic-integrity
            research/wealth-core-v1-buffer-sweep-evidence/arms/10bp

      - name: Exact Median-5 authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1c66096c1e3bd650233c630d4e9f71104ac8fc32
          path: median-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: research/median5-fullpit-recertification-v13

      - name: Exact formal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27bb992087182c42c3c051e62bf837895f5d2ab7
          path: certified-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/strategy9-e3-broad-stability
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c

      - name: Exact classifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: backtester

      - name: Exact runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Verify pins and install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C open-src rev-parse HEAD)" = 3dc74a8e54fdfe6e8368a8db3be0ecd127ee4689
          test "$(git -C median-src rev-parse HEAD)" = 1c66096c1e3bd650233c630d4e9f71104ac8fc32
          test "$(git -C certified-src rev-parse HEAD)" = 27bb992087182c42c3c051e62bf837895f5d2ab7
          test "$(git -C candidate-src rev-parse HEAD)" = ba74e79490beb8950611b1d17f5d124833b3d91e
          test "$(git -C main-src rev-parse HEAD)" = 887f479b15ad861313da666ad698034d3847121c
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" >> "$GITHUB_ENV"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "$GITHUB_ENV"
          echo "BEST_EFFORT_SECURITY_TYPES=${GITHUB_WORKSPACE}/candidate-src/backtester/data/champion-best-effort-security-types-v1.csv" >> "$GITHUB_ENV"
          echo "BEST_EFFORT_CLASSIFICATION_SCENARIO=reviewed_18" >> "$GITHUB_ENV"

      - name: Stage exact corrected economic overlays
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            champion_economic_prefix_audit.py \
            champion_full_classification_control.py \
            champion_security_truth_audit_v2.py \
            champion_security_truth_overlay_v2.py \
            champion_final_security_truth.py \
            champion_final_truth_corpus_validator.py \
            production_equivalent_economic_overlay.py \
            champion_production_equivalent_build.py \
            champion_production_equivalent_final_replay.py
          do
            cp "open-src/backtester/$f" certified-src/backtester/
          done
          cp open-src/backtester/data/champion-security-truth-factual-batch-v2.json certified-src/backtester/data/
          cp candidate-src/backtester/research_champion_corrected_classification.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_best_effort_classification.py certified-src/backtester/
          for f in \
            champion-best-effort-security-types-v1.csv \
            champion-best-effort-security-types-v1-summary.json \
            champion-reviewed-security-types-v1.csv \
            champion-historical-security-type-corrections-v1.csv
          do
            cp "candidate-src/backtester/data/$f" certified-src/backtester/data/
          done
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R open-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/
          cd certified-src
          python backtester/champion_final_truth_corpus_validator.py \
            --manual research/champion-economic-integrity/security-truth/manual-review \
            --output "${GITHUB_WORKSPACE}/final-corpus-validation.json"

      - name: Pull and verify immutable canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          POINTER=certified-src/backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "$PACKAGE" = ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE"
          cid=$(docker create "$PACKAGE" /bin/true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "$cid:/canonical-pit/." canonical-pit/
          docker rm "$cid"
          trap - EXIT
          PYTHONPATH="${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/certified-src" \
            python certified-src/backtester/canonical_pit_package.py verify \
              --pointer "$POINTER" \
              --dataset canonical-pit \
              > package-integrity.json

      - name: Validate structural harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            experiment-src/research/wealth-core-v5-affordability-fix-v1/v5_execution_harness.py \
            experiment-src/research/wealth-core-v5-sentinel-ex3-impedance-v1/run_impedance.py \
            experiment-src/research/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1/run_drawdown.py

      - name: Run full-PIT drawdown arm
        env:
          DRAWDOWN_VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          cd certified-src
          python "${GITHUB_WORKSPACE}/experiment-src/research/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1/run_drawdown.py" \
            --variant "$DRAWDOWN_VARIANT" \
            --control-source "${GITHUB_WORKSPACE}/open-src/research/wealth-core-v1-buffer-sweep-evidence/arms/10bp/buffer-10bp-generated.py" \
            --median-overlay "${GITHUB_WORKSPACE}/median-src/research/median5-fullpit-recertification-v13/experiment_overlay.py" \
            --output "${GITHUB_WORKSPACE}/experiment-results" \
            2>&1 | tee "${GITHUB_WORKSPACE}/experiment.log"
          cp "${GITHUB_WORKSPACE}/package-integrity.json" "${GITHUB_WORKSPACE}/experiment-results/package-integrity.json"
          cp "${GITHUB_WORKSPACE}/final-corpus-validation.json" "${GITHUB_WORKSPACE}/experiment-results/final-corpus-validation.json"
          cp "${GITHUB_WORKSPACE}/experiment.log" "${GITHUB_WORKSPACE}/experiment-results/experiment.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('../experiment-results/RESULT.json')
          r = json.loads(p.read_text())
          assert r['status'] == 'PASS_FRESH_CAUSAL_PIT_REPLAY'
          assert r['variant'] == os.environ['DRAWDOWN_VARIANT']
          assert r['experiment_budget'] == 10
          assert r['wealth_core_v5']['slots'] == 20
          assert r['wealth_core_v5']['entry_weight'] == 0.05
          assert r['validation']['wealth_core_v5_tape_exact_parity'] is True
          assert r['validation']['wealth_core_transactions_exact_parity'] is True
          assert r['validation']['wealth_core_close_decisions_exact_parity'] is True
          assert r['drawdown_study']['structural_contract']['performance_feedback_used_to_define_arm'] is False
          assert Path('../experiment-results/DRAWDOWN.json').exists()
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - name: Publish result summary
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('experiment-results/RESULT.json').read_text())
          w=r['sentinel_ex3']['windows']
          d=r['drawdown_study']
          cfg=r['sentinel_ex3']['configuration']
          with open(Path(os.environ['GITHUB_STEP_SUMMARY']), 'a') as f:
              f.write(f"## {r['variant']}\n\n")
              f.write(f"role={d['study_role']} divergence_r40={cfg['divergence_r40_floor']:.1%} tier_scope={cfg['tier_scope']} gate={cfg['health_gate']} confirm={cfg['tier_confirm_sessions']}\n\n")
              f.write('| Window | CAGR | Max DD | Sharpe | Multiple |\n|---|---:|---:|---:|---:|\n')
              for h in ('5','10','15','20'):
                  x=w[h]
                  f.write(f"| {h}y | {x['cagr']:.2%} | {x['max_drawdown']:.2%} | {x['sharpe_daily_252']:.3f} | {x['ending_multiple']:.2f}x |\n")
              f.write('\n### Max-DD episodes\n\n')
              f.write('| Window | Peak | Trough | Max DD | Min exposure |\n|---|---|---|---:|---:|\n')
              for h in ('5','10','15','20'):
                  x=d['episodes'][h]
                  f.write(f"| {h}y | {x['peak_date']} | {x['trough_date']} | {x['max_drawdown']:.2%} | {x['minimum_allocation_peak_to_trough']:.0%} |\n")
          PY

      - name: Preserve drawdown evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-ex3-v6-drawdown-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiment-results/
            experiment.log
            package-integrity.json
            final-corpus-validation.json
            experiment-src/research/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1/EXPERIMENT_SPEC.md
            experiment-src/research/wealth-core-v5-sentinel-ex3-v6-drawdown-execution-v1/run_drawdown.py
            experiment-src/research/wealth-core-v5-sentinel-ex3-impedance-v1/run_impedance.py
            experiment-src/research/wealth-core-v5-affordability-fix-v1/v5_execution_harness.py
          retention-days: 90
          if-no-files-found: warn
