name: Capital concentration exact extension

on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/concentration-extension-request.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: capital-concentration-extension-001
  cancel-in-progress: false

jobs:
  extension:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
            .github/workflows
          fetch-depth: 1
      - name: Install hash-locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Check exact continuation guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -q'
      - name: Retrieve the exact encrypted own predecessors
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'gh run download 40613063158 --repo flabber1835/stocker --name capital-concentration-quarter-594d2ed42f30171a3a4da05e5a0179aa82c9034f --dir "$RUNNER_TEMP/concentration-predecessor"'
      - name: Authenticate frozen inputs and runtime
        timeout-minutes: 5
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/concentration-extension-staging.json'
      - name: Resume each own book to the same quarter end
        timeout-minutes: 76
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/concentration_extension_job.py --request research/capital_risk/concentration-extension-request.json --staging-receipt artifacts/capital-risk/concentration-extension-staging.json --predecessor-download "$RUNNER_TEMP/concentration-predecessor" --output artifacts/capital-risk/concentration-extension.json'
      - name: Preserve stopped encrypted continuation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-concentration-extension-${{ github.sha }}
          path: |
            artifacts/capital-risk/concentration-extension-staging.json
            artifacts/capital-risk/concentration-extension.json
            artifacts/capital-risk/concentration-extension-*.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
