name: Step 4 repair and generate inventory

on:
  push:
    branches:
      - codex/step-4-paper-lifecycle-decomposition
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair mapper syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/step4_paper_lifecycle_inventory.py')
          text = path.read_text()
          old = '''            )
        records.append({'''
          new = '''            )
        )
        records.append({'''
          if old not in text:
              raise SystemExit('expected mapper repair point was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile tools/step4_paper_lifecycle_inventory.py

      - name: Generate responsibility map
        run: python tools/step4_paper_lifecycle_inventory.py

      - name: Verify generated inventory
        run: |
          test -s docs/paper-lifecycle-responsibility-map.md
          test -s artifacts/paper-lifecycle-responsibility-map.json
          python -m json.tool artifacts/paper-lifecycle-responsibility-map.json >/dev/null

      - name: Commit repaired mapper and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/step4_paper_lifecycle_inventory.py docs/paper-lifecycle-responsibility-map.md artifacts/paper-lifecycle-responsibility-map.json
          git commit -m "docs(step4): map paper lifecycle responsibilities"
          git push origin "HEAD:${GITHUB_REF_NAME}"
