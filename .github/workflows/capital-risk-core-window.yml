name: Capital risk short B C V windows

on:
  push:
    branches: [codex/capital-risk-research]
    paths:
      - 'research/capital_risk/core-window-request.json'

permissions:
  contents: read

concurrency:
  group: capital-risk-short-core-windows-001
  cancel-in-progress: false

jobs:
  short-window:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        window: [stress2021, recent2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
          fetch-depth: 1
      - name: Install hash-locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Verify research guards
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -v'
      - name: Authenticate exact frozen inputs and retained runtime
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/window-staging.json'
      - name: Qualify and run four distinct canonical books
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
          SELECTED_WINDOW: ${{ matrix.window }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/core_window_job.py --request research/capital_risk/core-window-request.json --staging-receipt artifacts/capital-risk/window-staging.json --window "$SELECTED_WINDOW" --output artifacts/capital-risk/window.json'
      - name: Preserve only encrypted books and nonfinancial receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-risk-short-window-${{ matrix.window }}-${{ github.sha }}
          path: |
            artifacts/capital-risk/window-staging.json
            artifacts/capital-risk/window.json
            artifacts/capital-risk/window-*.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
