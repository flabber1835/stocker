name: Champion economic integrity - offline evidence publication
run-name: Champion economic evidence publication - ${{ github.sha }}
on:
  push:
    branches: [research/champion-certification-economic-integrity]
    paths: ['.github/workflows/champion-economic-audit-publication.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: champion-economic-evidence-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Exact audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            backtester
            research/champion-economic-integrity
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Wait for the already-running preregistered prefix evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p publication-evidence
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          out=pathlib.Path('publication-evidence')
          for attempt in range(180):
              req=urllib.request.Request('https://api.github.com/repos/flabber1835/stocker/actions/runs/34042141867',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response: data=json.load(response)
              assert data['head_sha']=='b0a3033d83584541f4d6f306ecee27e318d29a59'
              if data['status']=='completed':
                  (out/'bounded-run.json').write_text(json.dumps(data,indent=2)+'\n')
                  assert data['conclusion']=='success', data['conclusion']
                  break
              print('Existing bounded run status:',data['status'],flush=True)
              time.sleep(20)
          else: raise RuntimeError('Existing prefix run did not complete inside bounded wait')
          PY
      - name: Download completed prefix evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: flabber1835/stocker
          run-id: 34042141867
          name: champion-economic-prefix-34042141867-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prefix
      - name: Source-lineage evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: flabber1835/stocker
          run-id: 34041287501
          name: champion-economic-integrity-source-34041287501-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-evidence
      - name: Original candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: flabber1835/stocker
          run-id: 34007704385
          name: champion-corrected-classification-34007704385-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-candidate
      - name: Original certificate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: flabber1835/stocker
          run-id: 34014048220
          name: research-champion-pit-v2-34014048220-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-certified
      - name: Verify retained bytes and expose exact probe sources
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,tarfile
          source=pathlib.Path('source-evidence')
          manifest=json.loads((source/'manifest.json').read_text())
          for name,entry in manifest['files'].items():
              assert hashlib.sha256((source/name).read_bytes()).hexdigest()==entry['sha256'],name
          for label in ['candidate','runtime']:
              root=pathlib.Path('probe-source')/label; root.mkdir(parents=True,exist_ok=True)
              with tarfile.open(source/f'{label}-source.tar') as archive:
                  archive.extractall(root,filter='data')
          for case in ['candidate','certified','certified_capacity_off','certified_dividend_1','certified_candidate_types']:
              root=pathlib.Path('prefix')/case
              for name,expected in json.loads((root/'SHA256.json').read_text()).items():
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,(case,name)
          PY
          python -m pip install --require-hashes -r probe-source/runtime/sentinel/requirements.lock
          python -m py_compile backtester/champion_economic_source_probes.py backtester/summarize_champion_economic_prefix.py
      - name: Exact-source defect fixtures and independent prefix attribution
        run: |
          set -euo pipefail
          python backtester/champion_economic_source_probes.py \
            --candidate prefix/candidate/economic-generated.py \
            --certified prefix/certified/economic-generated.py \
            --classifier probe-source/candidate/backtester/research_champion_corrected_classification.py \
            --corrections probe-source/candidate/backtester/data/champion-historical-security-type-corrections-v1.csv \
            --adapter probe-source/runtime/shared/stock_strategy_shared/wealth_core/adapter.py \
            --output publication-evidence/source-probes.json
          python backtester/summarize_champion_economic_prefix.py --root prefix
      - name: Build durable, hash-bound evidence bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,csv,hashlib,json,os,pathlib,shutil,urllib.request
          import pandas as pd
          dst=pathlib.Path('publication-evidence')
          shutil.copytree('prefix',dst/'bounded-prefix',dirs_exist_ok=True)
          for label,root in [('candidate',pathlib.Path('original-candidate')),('certified',pathlib.Path('original-certified/backtester-results/research-champion-20y'))]:
              out=dst/'original-paths'/label; out.mkdir(parents=True,exist_ok=True)
              for name in ['daily.csv.gz','summary.json','metrics.csv','generated-replay.py','research-champion-identity.json']:
                  p=root/name
                  if p.exists(): shutil.copy2(p,out/name)
          for group in ['pit-v2','final']:
              root=pathlib.Path('original-certified/backtester-results')/group
              out=dst/'original-certificate'/group; out.mkdir(parents=True,exist_ok=True)
              for p in root.glob('*.json'): shutil.copy2(p,out/p.name)
          lineage=dst/'source-lineage'; lineage.mkdir(exist_ok=True)
          for p in pathlib.Path('source-evidence').iterdir():
              if p.suffix in ['.json','.txt']: shutil.copy2(p,lineage/p.name)
          rules=[]
          for line in pathlib.Path('research/champion-economic-integrity/CERTIFICATION_ECONOMIC_SPEC.md').read_text().splitlines():
              cells=[c.strip() for c in line.strip('|').split('|')]
              if len(cells)==5 and cells[0].isdigit(): rules.append(cells)
          assert len(rules)==60
          with (dst/'economic-rule-inventory.csv').open('w',newline='') as f:
              w=csv.writer(f);w.writerow(['id','rule','specification','classification','authority']);w.writerows(rules)
          enumeration={}
          for case in ['candidate','certified']:
              source=pathlib.Path('prefix')/case/'economic-generated.py'; tree=ast.parse(source.read_text())
              constants={}; blocks={}
              for node in tree.body:
                  if isinstance(node,ast.Assign):
                      for target in node.targets:
                          if isinstance(target,ast.Name) and target.id.isupper():
                              try: constants[target.id]=ast.literal_eval(node.value)
                              except (ValueError,TypeError): constants[target.id]={'expression':ast.unparse(node.value)}
                  if isinstance(node,(ast.FunctionDef,ast.ClassDef)):
                      blocks[node.name]=hashlib.sha256(ast.dump(node,include_attributes=False).encode()).hexdigest()
              enumeration[case]={'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'constants':constants,'function_class_ast_sha256':blocks}
          def default(x):
              if isinstance(x,set): return sorted(x)
              raise TypeError(type(x).__name__)
          (dst/'executable-rule-enumeration.json').write_text(json.dumps(enumeration,indent=2,sort_keys=True,default=default)+'\n')
          a=pd.read_csv(dst/'original-paths/candidate/daily.csv.gz'); b=pd.read_csv(dst/'original-paths/certified/daily.csv.gz')
          assert a.date.equals(b.date)
          chronology=[]
          for col in sorted(set(a.columns)&set(b.columns)-{'date'}):
              aa,bb=a[col],b[col]
              if pd.api.types.is_numeric_dtype(aa) and pd.api.types.is_numeric_dtype(bb):
                  import numpy as np
                  diff=~np.isclose(aa,bb,rtol=1e-12,atol=1e-10,equal_nan=True)
              else: diff=~(aa.eq(bb)|(aa.isna()&bb.isna()))
              indices=__import__('numpy').flatnonzero(diff)
              if len(indices):
                  i=int(indices[0]); chronology.append({'field':col,'first_session':a.date.iloc[i],'left':str(aa.iloc[i]),'right':str(bb.iloc[i]),'differing_sessions':len(indices)})
          (dst/'full-path-first-differences.json').write_text(json.dumps(chronology,indent=2,sort_keys=True)+'\n')
          for run in [34007704385,34014048220,34041287501,34042141867]:
              req=urllib.request.Request(f'https://api.github.com/repos/flabber1835/stocker/actions/runs/{run}/artifacts',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as r: data=json.load(r)
              (dst/f'artifacts-{run}.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          manifest={'schema':'champion.economic-integrity-durable-evidence/1','audit_source_sha':os.environ['GITHUB_SHA'],'publication_run_id':os.environ['GITHUB_RUN_ID'],'bounded_replay_run_id':34042141867,'scope':'AUDIT_EVIDENCE_NOT_CERTIFICATION','files':{}}
          for p in sorted(dst.rglob('*')):
              if p.is_file(): manifest['files'][str(p.relative_to(dst))]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size}
          (dst/'MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('Durable files:',len(manifest['files']),'bytes:',sum(x['size_bytes'] for x in manifest['files'].values()))
          PY
      - name: Commit evidence only to the isolated audit branch
        run: |
          set -euo pipefail
          BRANCH=research/champion-certification-economic-integrity
          test "${GITHUB_REF_NAME}" = "${BRANCH}"
          git fetch origin "refs/heads/${BRANCH}"
          git worktree add --detach ../economic-evidence-publish FETCH_HEAD
          DEST=../economic-evidence-publish/research/champion-economic-integrity/evidence
          mkdir -p "${DEST}"
          cp -a publication-evidence/. "${DEST}/"
          cd ../economic-evidence-publish
          git add research/champion-economic-integrity/evidence
          test "$(git diff --cached --name-only | grep -vc '^research/champion-economic-integrity/evidence/' || true)" = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: retain exact-prefix attribution, source probes and original paths'
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "# Economic integrity evidence retained" >> "${GITHUB_STEP_SUMMARY}"
          echo "Publication commit: $(git rev-parse HEAD). Scope: bounded diagnostic; economic certification remains blocked." >> "${GITHUB_STEP_SUMMARY}"
      - name: Preserve offline-analysis artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champion-economic-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-evidence/
          retention-days: 90
          if-no-files-found: error
