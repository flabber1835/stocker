name: Recover 2007 Russell 3000 source

on:
  push:
    branches:
      - research/pit-russell-archive-reconstruction
    paths:
      - 'tools/pit_russell_2007_source_recovery.py'
      - '.github/workflows/pit-russell-2007-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-2007:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact research revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            .github/workflows/pit-russell-2007-recovery.yml
          sparse-checkout-cone-mode: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install Poppler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Probe exact legacy Russell endpoint and validate candidates
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/pit_russell_2007_source_recovery.py
      - name: Show recovery summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/r3000-2007-recovery/recovery.json').read_text())
          print('distinct_capture_count', data['distinct_capture_count'])
          print('qualified_candidate_count', data['qualified_candidate_count'])
          for row in data['candidates']:
              c = row['capture']
              print(c['timestamp'], c['original'], row['pdf_sha256'], row['row_count'], row['unique_tickers'], row['qualifies_as_full_membership_candidate'], row['error'])
          PY
