name: Median-5 slot occupancy forensics v16
run-name: Median-5 slot forensics - ${{ github.sha }}
on:
  push:
    branches: [research/median5-slot-forensics-v16]
    paths:
      - '.github/workflows/median5-slot-forensics-v16.yml'
      - 'research/median5-slot-forensics-v16/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: median5-slot-forensics-v16-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  PIT_OFFICIAL_BACKTEST: '0'
  CERTIFICATION_WARMUP_START: '2006-01-03'
  CERTIFICATION_MEASUREMENT_START: '2006-07-31'
  CERTIFICATION_END_SESSION: '2026-07-31'

jobs:
  forensic-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Isolated research checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: audit-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/champion-economic-integrity
            research/champion-alpha-five-run-validation-v2
            research/median5-fullpit-recertification-v13
            research/median5-slot-forensics-v16

      - name: Exact formal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27bb992087182c42c3c051e62bf837895f5d2ab7
          path: certified-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            backtester
            research/strategy9-e3-broad-stability
            research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c

      - name: Exact classifier source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ba74e79490beb8950611b1d17f5d124833b3d91e
          path: candidate-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: backtester

      - name: Exact runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 887f479b15ad861313da666ad698034d3847121c
          path: main-src
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            sentinel
            shared

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          check-latest: false

      - name: Install frozen runtime and stage certified overlays
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/certified-src:${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared" >> "$GITHUB_ENV"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/canonical-pit" >> "$GITHUB_ENV"
          for f in champion_economic_prefix_audit.py champion_full_classification_control.py champion_security_truth_audit_v2.py champion_security_truth_overlay_v2.py champion_final_security_truth.py champion_final_truth_corpus_validator.py production_equivalent_economic_overlay.py champion_production_equivalent_build.py champion_production_equivalent_final_replay.py; do
            cp "audit-src/backtester/$f" certified-src/backtester/
          done
          cp audit-src/backtester/data/champion-security-truth-factual-batch-v2.json certified-src/backtester/data/
          cp candidate-src/backtester/research_champion_corrected_classification.py certified-src/backtester/
          cp candidate-src/backtester/research_champion_best_effort_classification.py certified-src/backtester/
          for f in champion-best-effort-security-types-v1.csv champion-best-effort-security-types-v1-summary.json champion-reviewed-security-types-v1.csv champion-historical-security-type-corrections-v1.csv; do
            cp "candidate-src/backtester/data/$f" certified-src/backtester/data/
          done
          mkdir -p certified-src/research/champion-economic-integrity/security-truth
          cp -R audit-src/research/champion-economic-integrity/security-truth/manual-review certified-src/research/champion-economic-integrity/security-truth/

      - name: Pull and verify immutable canonical PIT package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          POINTER=certified-src/backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          test "$PACKAGE" = ghcr.io/flabber1835/stocker-canonical-pit@sha256:f05e40d9e1bff53ae50507719b5f589fb01b6184c79eceef800ddc2548f6209c
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE"
          cid=$(docker create "$PACKAGE" /bin/true)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p canonical-pit
          docker cp "$cid:/canonical-pit/." canonical-pit/
          docker rm "$cid"
          trap - EXIT
          PYTHONPATH="${GITHUB_WORKSPACE}/main-src:${GITHUB_WORKSPACE}/main-src/shared:${GITHUB_WORKSPACE}/certified-src" python certified-src/backtester/canonical_pit_package.py verify --pointer "$POINTER" --dataset canonical-pit > package-integrity.json

      - name: Install frozen Median-5 overlay and observer-only slot instrumentation
        run: |
          set -euo pipefail
          cp audit-src/research/median5-fullpit-recertification-v13/experiment_overlay.py audit-src/research/champion-alpha-five-run-validation-v2/experiment_overlay.py
          python audit-src/research/median5-slot-forensics-v16/instrument_slot_forensics.py
          python -m py_compile audit-src/research/champion-alpha-five-run-validation-v2/experiment_runner.py

      - name: Run exact fresh full-PIT Median-5 forensic replay
        run: |
          set -euo pipefail
          cd certified-src
          RESEARCH_REPLAY_MODE=fullpit python "${GITHUB_WORKSPACE}/audit-src/research/champion-alpha-five-run-validation-v2/experiment_runner.py" --arm MEDIAN5_CANONICAL --candidate-root "${GITHUB_WORKSPACE}/candidate-src" --output "${GITHUB_WORKSPACE}/median5-slot-forensics-output" 2>&1 | tee "${GITHUB_WORKSPACE}/median5-slot-forensics.log"

      - name: Verify economic path parity and summarize slot defect
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from collections import Counter, defaultdict
          from pathlib import Path
          import pandas as pd

          root=Path('median5-slot-forensics-output')
          daily=root/'engine'/'daily.csv'
          summary=root/'engine'/'summary.json'
          events=json.loads((root/'engine'/'slot-forensics.json').read_text())
          daily_sha=hashlib.sha256(daily.read_bytes()).hexdigest()
          summary_sha=hashlib.sha256(summary.read_bytes()).hexdigest()
          assert daily_sha=='4be426c1f92c6684d0227bf613d474ee335aeef71c6b87ac112dfffdb743f66e', daily_sha
          assert summary_sha=='fc47bc384f46ca3af0bdb4b4f053f129925c3c65b6e318611a626d2f09f54ed9', summary_sha

          reservations=[e for e in events if e['kind']=='reservation']
          fills=[e for e in events if e['kind']=='buy_fill']
          signals=[e for e in events if e['kind']=='sell_signal']
          attempts=[e for e in events if e['kind']=='sell_attempt']
          sellfills=[e for e in events if e['kind']=='sell_fill']
          states=[e for e in events if e['kind']=='target_state']
          blocked=[e for e in events if e['kind']=='candidate_if_target_slot_free']
          targets={'LLYVK':'1125757768717674484','RCUS':'700818629905779940'}

          thresholds=[0.01,0.05,0.10,0.25,0.50,0.75,0.90,0.99]
          under={str(t):sum(1 for e in fills if e.get('fill_fraction_of_nominal_open') is not None and e['fill_fraction_of_nominal_open']<t) for t in thresholds}
          target_summary={}
          for name,sid in targets.items():
              rr=[e for e in reservations if e['security_id']==sid]
              ff=[e for e in fills if e['security_id']==sid]
              ss=[e for e in signals if e['security_id']==sid]
              aa=[e for e in attempts if e['security_id']==sid]
              sf=[e for e in sellfills if e['security_id']==sid]
              st=[e for e in states if e['security_id']==sid]
              bb=[e for e in blocked if e['freed_security_id']==sid]
              target_summary[name]={
                  'reservation': rr[0] if rr else None,
                  'buy_fill': ff[0] if ff else None,
                  'first_sell_signal': ss[0] if ss else None,
                  'sell_signal_count': len(ss),
                  'sell_attempt_count': len(aa),
                  'untradeable_sell_attempt_count': sum(1 for e in aa if not e['tradeable']),
                  'sell_fill_count': len(sf),
                  'first_state': st[0] if st else None,
                  'last_state': st[-1] if st else None,
                  'sessions_observed': len({e['session'] for e in st if e.get('held')}),
                  'full_capacity_sessions': sum(1 for e in st if e.get('held') and e.get('held_count')==20),
                  'full_capacity_sessions_with_candidate_if_freed': sum(1 for e in bb if e.get('candidate')),
                  'first_candidate_if_freed': next((e for e in bb if e.get('candidate')),None),
              }

          smallest=sorted(fills,key=lambda e:e.get('fill_fraction_of_nominal_open',999))[:25]
          out={
              'status':'PASS_OBSERVER_PARITY',
              'baseline_daily_sha256':daily_sha,
              'baseline_summary_sha256':summary_sha,
              'event_counts':Counter(e['kind'] for e in events),
              'buy_fill_count':len(fills),
              'underfilled_buy_counts':under,
              'smallest_25_entry_fills':smallest,
              'targets':target_summary,
          }
          Path('SLOT_FORENSICS_SUMMARY.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Preserve exact forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: median5-slot-forensics-v16-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            SLOT_FORENSICS_SUMMARY.json
            median5-slot-forensics-output/
            median5-slot-forensics.log
            package-integrity.json
          retention-days: 90
          if-no-files-found: error
