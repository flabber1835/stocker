name: Capital risk synthetic timeout export proof

on:
  push:
    branches: [codex/capital-risk-research]
    paths: ['research/capital_risk/timeout-export-request.json']

permissions:
  contents: read

concurrency:
  group: capital-risk-timeout-export-proof-001
  cancel-in-progress: false

jobs:
  prove-timeout-export:
    if: github.repository == 'flabber1835/stocker' && github.actor == 'flabber1835' && github.ref == 'refs/heads/codex/capital-risk-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/capital_risk
          fetch-depth: 1
      - name: Install hash-locked transfer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/transfer-python"
          "$RUNNER_TEMP/transfer-python/bin/pip" install --require-hashes --only-binary=:all: -r research/capital_risk/transfer-requirements.lock
      - name: Verify targeted guards and actual prior-function falsifier
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B -m unittest discover -s research/capital_risk/tests -v'
      - name: Authenticate retained offline runtime and source mounts
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/stage.py --request research/capital_risk/stage-request.json --output artifacts/capital-risk/timeout-proof-staging.json'
      - name: Force synthetic deadline and prove stopped marker export
        env:
          CAPITAL_RISK_RESEARCH_KEY_20261027: ${{ secrets.CAPITAL_RISK_RESEARCH_KEY_20261027 }}
        run: '"$RUNNER_TEMP/transfer-python/bin/python" -B research/capital_risk/timeout_export_job.py --request research/capital_risk/timeout-export-request.json --staging-receipt artifacts/capital-risk/timeout-proof-staging.json --output artifacts/capital-risk/timeout-export.json'
      - name: Preserve encrypted proof and nonfinancial receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capital-risk-timeout-export-proof-${{ github.sha }}
          path: |
            artifacts/capital-risk/timeout-proof-staging.json
            artifacts/capital-risk/timeout-export.json
            artifacts/capital-risk/timeout-export-proof.tar.crseal
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
