name: Apply issue 209 Concordance differential

on:
  push:
    branches:
      - fix/issue-209-financial-grade-trial
    paths:
      - tools/issue209-concordance-differential.py
      - .github/workflows/issue209-concordance-differential.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/issue209-concordance-differential.py
      - .github/workflows/issue209-concordance-differential.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: fix/issue-209-financial-grade-trial
      - name: Apply and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue209-concordance-differential.py
          git diff --check
          python -m compileall -q sentinel/core/production.py tools/sentinel_concordance_differential.py tests/sentinel/test_issue209_concordance_differential.py
          bash -n scripts/sentinel-certify.sh
      - name: Commit production patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sentinel/core/production.py tools/sentinel_concordance_differential.py tests/sentinel/test_issue209_concordance_differential.py scripts/sentinel-certify.sh
          git rm -- tools/issue209-concordance-differential.py .github/workflows/issue209-concordance-differential.yml
          git commit -m 'Certify simplified LD-RC by deterministic differential (#209)'
          git pull --rebase origin fix/issue-209-financial-grade-trial
          git push origin HEAD:fix/issue-209-financial-grade-trial
