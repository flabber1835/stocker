# Wealth Core certification rig only. Stocker runtime services are retired.
# All host surfaces are loopback-bound; remote operation uses an authenticated
# SSH tunnel or reverse proxy. This graph has no scheduler or trading service.
name: stocker-bt

services:
  bt-postgres:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_USER: btuser
      POSTGRES_PASSWORD: ${BT_POSTGRES_PASSWORD:?set BT_POSTGRES_PASSWORD}
      POSTGRES_DB: backtest
    volumes:
      - bt_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btuser -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  bt-data:
    build:
      context: .
      dockerfile: services/bt-data/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8030:8000"
    environment:
      BT_DATABASE_URL: postgresql+asyncpg://btuser:${BT_POSTGRES_PASSWORD:?set BT_POSTGRES_PASSWORD}@bt-postgres:5432/backtest
      SHARADAR_API_KEY: ${SHARADAR_API_KEY:-}
      BT_MOCK_DATA: ${BT_MOCK_DATA:-}
      BT_DATA_MODE: ${BT_DATA_MODE:-sharadar}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      bt-postgres:
        condition: service_healthy

  bt-engine:
    build:
      context: .
      dockerfile: services/bt-engine/Dockerfile
    restart: unless-stopped
    mem_limit: ${BT_ENGINE_MEM_LIMIT:-4g}
    ports:
      - "127.0.0.1:8031:8000"
    environment:
      BT_DATABASE_URL: postgresql+asyncpg://btuser:${BT_POSTGRES_PASSWORD:?set BT_POSTGRES_PASSWORD}@bt-postgres:5432/backtest
      STALE_BT_RUN_HOURS: ${STALE_BT_RUN_HOURS:-12}
      BT_FACTOR_CACHE_DIR: /factor-cache
      # Injected by scripts/bt-engine-up.sh. Certification refuses an empty id.
      BT_ENGINE_IMAGE_ID: ${BT_ENGINE_IMAGE_ID:-}
      BT_ENGINE_IMAGE: ${BT_ENGINE_IMAGE:-}
      BT_ENGINE_SOURCE_REVISION: ${BT_ENGINE_SOURCE_REVISION:-}
    volumes:
      - bt_factor_cache:/factor-cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      bt-postgres:
        condition: service_healthy

volumes:
  bt_pgdata:
  bt_factor_cache:
