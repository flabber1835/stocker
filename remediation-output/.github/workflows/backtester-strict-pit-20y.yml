name: Backtester - annual chained 20-year causal certification
run-name: Causal PIT year ${{ inputs.year || '2006' }} — ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      year:
        description: Calendar year to certify
        required: true
        type: string
      previous_run_id:
        description: Prior annual workflow run containing the restart artifact
        required: false
        default: ''
        type: string
      source_sha:
        description: Frozen backtester source SHA shared by the full chain
        required: true
        type: string
  push:
    branches: [research/causal-20y-certification]
    paths:
      - backtester/data/canonical-pit-20y-certification-request.json

permissions:
  actions: write
  contents: read
  packages: read

concurrency:
  group: causal-pit-${{ inputs.source_sha || github.sha }}-${{ inputs.year || '2006' }}
  cancel-in-progress: false

jobs:
  certify_year:
    name: Causal certification through ${{ inputs.year || '2006' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CHAIN_YEAR: ${{ inputs.year || '2006' }}
      PREVIOUS_RUN_ID: ${{ inputs.previous_run_id || '' }}
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CHAIN_REF: ${{ github.ref_name }}
      CANONICAL_PIT_EXPECTED_END: '2026-07-31'
      CANONICAL_DATASET_HASH: f9fb220871ad4152549d31a5da6e0dbcdd327dc7b05843764511b0e800ddb19b
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out frozen causal-certification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/backtester-strict-pit-20y.yml
            /backtester/production_year_checkpoint_overlay.py
            /backtester/run_production_strict_pit_20y_checkpointed.py
            /backtester/run_research_strict_pit_20y_checkpointed.py
            /backtester/run_certification_parallel_20y_checkpointed.py
            /backtester/write_causal_year_certificate.py
            /backtester/research_terminal_grace_overlay.py
            /backtester/run_certification_parallel_20y_terminal_grace.py
            /backtester/run_research_strict_pit_20y_terminal_grace.py
            /backtester/run_certification_parallel_20y.py
            /backtester/run_production_strict_pit_20y.py
            /backtester/run_research_strict_pit_20y.py
            /backtester/run_certification_parallel.py
            /backtester/run_production_strict_pit_certification.py
            /backtester/run_research_strict_pit_certification.py
            /backtester/strict_pit_metadata.py
            /backtester/canonical_pit_dataset.py
            /backtester/canonical_pit_package.py
            /backtester/strict_pit_run15_diagnostics.py
            /backtester/causal_split_overrides.py
            /backtester/run_ldrc_corrected_warmup_cash.py
            /backtester/run_ldrc_nonpit_vs_pit_certified.py
            /backtester/run_sector_ad_causal_terminal_terms_v2.py
            /backtester/run_research_ldrc_corrected_warmup_cash.py
            /backtester/run_research_ldrc_nonpit_vs_fullpit.py
            /backtester/historical_cash.py
            /backtester/causal_terminal_terms.py
            /backtester/experiments/2026-08-27-sector-abc/run.py
            /backtester/data/canonical-pit-20y.json
            /backtester/data/canonical-pit-20y-certification-request.json
            /backtester/data/causal-split-overrides-v1.json
            /backtester/data/causal-split-overrides-v1.SHA256
            /backtester/data/causal-split-overrides-v1.d/**
            /backtester/data/causal-terminal-terms-v1.json
            /backtester/data/causal-terminal-terms-v1.SHA256
            /backtester/data/GS3M_1996-12_2007-05.csv
            /tests/backtester/test_canonical_pit_dataset.py
            /tests/backtester/test_research_review_basis.py
            /tests/backtester/test_production_cooldown_age_zero.py
            /tests/backtester/test_research_split_dividend_ordering.py
            /research/sentinel-fastgate/experiments/2026-08-25-pit-vs-full-c/ldrc_ab_replay_20260825.py
            /research/sentinel-fastgate/pit-evidence/ff12_sic_definition.txt
            /research/sentinel-fastgate/pit-evidence/generated/sec_cik_change_events.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/sec_sic_submissions.csv.gz
            /research/sentinel-fastgate/pit-evidence/generated/SHA256SUMS.txt
            /research/sentinel-fastgate/pit-evidence/generated/SEC_SIC_SHA256SUMS.txt
            /PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz

      - name: Enforce frozen chain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"
          case "${CHAIN_YEAR}" in
            20[0-2][0-9]) ;;
            *) echo "invalid chain year ${CHAIN_YEAR}" >&2; exit 1 ;;
          esac
          test "${CHAIN_YEAR}" -ge 2006
          test "${CHAIN_YEAR}" -le 2026
          echo "BACKTESTER_BRANCH_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"

      - name: Check out exact production strategy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c851386fa4dddcf2e2533af3a1d313c38220b7f2
          path: main-src
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            sentinel
            shared
            docs/sentinel-handoff/00_README

      - name: Verify exact unmodified production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C main-src rev-parse HEAD)" = "${PRODUCTION_MAIN_SHA:-c851386fa4dddcf2e2533af3a1d313c38220b7f2}"
          test -z "$(git -C main-src status --porcelain)"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/state.py)" = "8dd316ed28ff9b82c216f852118f8ef83d8510ad"
          test "$(git -C main-src hash-object shared/stock_strategy_shared/wealth_core/adapter.py)" = "466a8f8202692e65e08596a7a47d45bd15bb3fd3"
          test "$(git -C main-src hash-object sentinel/core/kernel.py)" = "12617af8eb954d4ae18fef2ae16977048e2e40cd"
          test "$(git -C main-src hash-object sentinel/core/production.py)" = "99e8f87aa456fc672c84b0b0ceb3d674ca7ccf4c"
          YEAR_ROOT="backtester-results/${CHAIN_YEAR:+production-year-${CHAIN_YEAR}}"
          if test -z "${CHAIN_YEAR:-}"; then YEAR_ROOT="backtester-results/strict-pit-20y-diagnostic"; fi
          mkdir -p "${YEAR_ROOT}"
          : > "${YEAR_ROOT}/production-overlay.diff"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ.get('YEAR_OUTPUT_ROOT') or (
              f"backtester-results/production-year-{os.environ['CHAIN_YEAR']}"
              if os.environ.get('CHAIN_YEAR') else
              'backtester-results/strict-pit-20y-diagnostic'))
          root.mkdir(parents=True, exist_ok=True)
          diff = root / 'production-overlay.diff'
          if not diff.exists(): diff.write_bytes(b'')
          digest = hashlib.sha256(diff.read_bytes()).hexdigest()
          evidence = {
              'schema': 'backtester.production-source-witness/1',
              'source_mode': 'exact_unmodified_main_kernel',
              'production_main_sha': os.environ.get('PRODUCTION_MAIN_SHA', 'c851386fa4dddcf2e2533af3a1d313c38220b7f2'),
              'diff_sha256': digest,
              'mutation_applied': False,
              'canonical_kernel': 'sentinel.core.kernel.advance_session',
          }
          (root / 'production-overlay.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          PRODUCTION_OVERLAY_SHA256="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          test -z "$(git -C main-src status --porcelain)"
          echo "PRODUCTION_OVERLAY_SHA256=${PRODUCTION_OVERLAY_SHA256}" >> "${GITHUB_ENV}"
          echo "BACKTESTER_MAIN_SHA=${PRODUCTION_MAIN_SHA:-c851386fa4dddcf2e2533af3a1d313c38220b7f2}" >> "${GITHUB_ENV}"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/main-src" >> "${GITHUB_ENV}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install exact production runtime closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r main-src/sentinel/requirements.lock
          python -m pip install --no-build-isolation --no-deps -e main-src/shared

      - name: Regression, source-identity, and checkpoint-transform gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            backtester/production_year_checkpoint_overlay.py \
            backtester/run_production_strict_pit_20y_checkpointed.py \
            backtester/run_research_strict_pit_20y_checkpointed.py \
            backtester/run_certification_parallel_20y_checkpointed.py \
            backtester/write_causal_year_certificate.py \
            backtester/research_terminal_grace_overlay.py \
            backtester/run_production_strict_pit_20y.py \
            backtester/run_research_strict_pit_20y.py \
            backtester/run_production_strict_pit_certification.py \
            backtester/run_research_strict_pit_certification.py
          python -m compileall -q -f main-src/sentinel main-src/shared/stock_strategy_shared
          python -m unittest tests.backtester.test_research_review_basis -v
          python -m unittest tests.backtester.test_production_cooldown_age_zero -v
          python -m unittest tests.backtester.test_research_split_dividend_ordering -v
          python - <<'PY'
          import unittest
          from tests.backtester.test_canonical_pit_dataset import CanonicalPITDatasetTests
          names = [
              name for name in unittest.defaultTestLoader.getTestCaseNames(CanonicalPITDatasetTests)
              if name != 'test_dataset_build_and_replay_are_separate_workflows'
          ]
          suite = unittest.TestSuite(CanonicalPITDatasetTests(name) for name in names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          python - <<'PY'
          import backtester.run_production_strict_pit_20y as production
          from backtester.production_year_checkpoint_overlay import transformed_main_source
          source = transformed_main_source(production.strict.runner)
          compile(source, '<checkpointed-production-main>', 'exec')
          required = (
              'PRODUCTION_RESUME_CHECKPOINT',
              'PRODUCTION_CHECKPOINT_OUTPUT',
              '[CHECKPOINT RESUME]',
              '[CHECKPOINT WRITE]',
              'SessionState.from_dict',
              'state_a.to_dict()',
          )
          for marker in required:
              assert marker in source, marker
          print('PRODUCTION ANNUAL CHECKPOINT TRANSFORM PASS')
          PY
          env -u PYTHONPATH \
            CERTIFICATION_SEGMENT_END_SESSION=2006-12-29 \
            CANONICAL_PIT_EXPECTED_END=2026-07-31 \
            python backtester/run_production_strict_pit_20y_checkpointed.py \
              --main-root main-src --self-test-source-identity

      - name: Verify full canonical PIT package pointer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          pointer = json.loads(Path('backtester/data/canonical-pit-20y.json').read_text())
          assert pointer['status'] == 'PASS'
          assert pointer['dataset_hash'] == 'f9fb220871ad4152549d31a5da6e0dbcdd327dc7b05843764511b0e800ddb19b'
          assert pointer['source_run_id'] == '33331951602'
          assert pointer['window'] == {
              'warmup_start': '2006-01-03',
              'measurement_start': '2006-07-31',
              'end': '2026-07-31',
          }
          assert int(pointer['counts']['unresolved_corporate_actions']) == 0
          print('FULL CANONICAL PIT POINTER PASS', pointer['dataset_id'])
          PY

      - name: Pull and certify stored full 20-year PIT dataset
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CANONICAL_PATH=backtester-results/canonical-pit-20y
          POINTER=backtester/data/canonical-pit-20y.json
          PACKAGE=$(python -c "import json; print(json.load(open('${POINTER}'))['package'])")
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker pull "${PACKAGE}"
          CONTAINER=$(docker create "${PACKAGE}" /bin/true)
          trap 'docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true' EXIT
          mkdir -p "${CANONICAL_PATH}"
          docker cp "${CONTAINER}:/canonical-pit/." "${CANONICAL_PATH}"
          docker rm "${CONTAINER}"
          trap - EXIT
          python backtester/canonical_pit_package.py verify \
            --pointer "${POINTER}" --dataset "${CANONICAL_PATH}"
          echo "CANONICAL_PIT_DATASET=${GITHUB_WORKSPACE}/${CANONICAL_PATH}" >> "${GITHUB_ENV}"

      - name: Resolve exact annual boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_ENV}"
          import os
          import pandas as pd
          year = int(os.environ['CHAIN_YEAR'])
          final_end = '2026-07-31'
          cap = final_end if year == 2026 else f'{year}-12-31'
          hashes = pd.read_csv(
              'backtester-results/canonical-pit-20y/session-hashes.csv',
              dtype=str,
          )
          sessions = hashes.loc[hashes.session.le(cap), 'session']
          if sessions.empty:
              raise SystemExit(f'no canonical session on or before {cap}')
          end = str(sessions.iloc[-1])
          if not end.startswith(str(year)):
              raise SystemExit(f'annual boundary {end} does not belong to {year}')
          print(f'CERTIFICATION_SEGMENT_END_SESSION={end}')
          print(f'PRODUCTION_CHECKPOINT_OUTPUT={os.getcwd()}/backtester-results/causal-year-{year}/production-checkpoint.json')
          print(f'YEAR_OUTPUT_ROOT={os.getcwd()}/backtester-results/causal-year-{year}')
          PY

      - name: Download prior annual checkpoint
        if: ${{ inputs.previous_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: causal-checkpoint
          path: previous-causal-year
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate prior handoff
        if: ${{ inputs.previous_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_YEAR=$((CHAIN_YEAR - 1))
          test -f previous-causal-year/production-checkpoint.json
          test -f previous-causal-year/production-checkpoint.json.sha256
          test -f previous-causal-year/causal-year-certificate.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          previous_year = int(os.environ['CHAIN_YEAR']) - 1
          certificate = json.loads(
              Path('previous-causal-year/causal-year-certificate.json').read_text()
          )
          if certificate.get('status') != 'PASS' or int(certificate.get('year', -1)) != previous_year:
              raise SystemExit('prior annual certificate is not the contiguous PASS handoff')
          if certificate.get('source_sha') != os.environ['SOURCE_SHA']:
              raise SystemExit('prior annual certificate source SHA mismatch')
          if certificate.get('dataset_hash') != os.environ['CANONICAL_DATASET_HASH']:
              raise SystemExit('prior annual certificate dataset mismatch')
          PY
          echo "PRODUCTION_RESUME_CHECKPOINT=${GITHUB_WORKSPACE}/previous-causal-year/production-checkpoint.json" >> "${GITHUB_ENV}"
          echo "PREVIOUS_CERTIFICATE=${GITHUB_WORKSPACE}/previous-causal-year/causal-year-certificate.json" >> "${GITHUB_ENV}"

      - name: Run annual corrected-production versus repaired-research certification
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${YEAR_OUTPUT_ROOT}"
          set +e
          python backtester/run_certification_parallel_20y_checkpointed.py \
            --end-session "${CERTIFICATION_SEGMENT_END_SESSION}" \
            --canonical-dataset "${CANONICAL_PIT_DATASET}" \
            --output-root "${YEAR_OUTPUT_ROOT}" \
            --spy-factors 'PIT input data/SFP_SPY_BIL_PRICE_FACTORS_PIT_ONLY.csv.gz' \
            --lab-root . \
            --main-root main-src \
            2>&1 | tee "backtester-causal-year-${CHAIN_YEAR}.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "${STATUS}" > "${YEAR_OUTPUT_ROOT}/runner-exit-code.txt"
          exit "${STATUS}"

      - name: Issue content-addressed annual causal certificate
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_ARGS=()
          if test -n "${PREVIOUS_CERTIFICATE:-}"; then
            PREVIOUS_ARGS=(--previous-certificate "${PREVIOUS_CERTIFICATE}")
          fi
          python backtester/write_causal_year_certificate.py \
            --output-root "${YEAR_OUTPUT_ROOT}" \
            --checkpoint "${PRODUCTION_CHECKPOINT_OUTPUT}" \
            --year "${CHAIN_YEAR}" \
            --segment-end "${CERTIFICATION_SEGMENT_END_SESSION}" \
            --source-sha "${SOURCE_SHA}" \
            --dataset-hash "${CANONICAL_DATASET_HASH}" \
            "${PREVIOUS_ARGS[@]}" \
            --output "${YEAR_OUTPUT_ROOT}/causal-year-certificate.json"
          cp "${PRODUCTION_CHECKPOINT_OUTPUT}" ./production-checkpoint.json
          cp "${PRODUCTION_CHECKPOINT_OUTPUT}.sha256" ./production-checkpoint.json.sha256
          cp "${YEAR_OUTPUT_ROOT}/causal-year-certificate.json" ./causal-year-certificate.json

      - name: Upload durable annual handoff and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: causal-checkpoint
          path: |
            production-checkpoint.json
            production-checkpoint.json.sha256
            causal-year-certificate.json
            backtester-results/causal-year-${{ env.CHAIN_YEAR }}/**
            backtester-causal-year-${{ env.CHAIN_YEAR }}.log
            backtester/data/canonical-pit-20y.json
            backtester/data/canonical-pit-20y-certification-request.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Dispatch the next annual segment
        if: ${{ success() && env.CHAIN_YEAR != '2026' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEXT_YEAR=$((CHAIN_YEAR + 1))
          python - <<'PY' > /tmp/next-year-dispatch.json
          import json, os
          payload = {
              'ref': os.environ['CHAIN_REF'],
              'inputs': {
                  'year': str(int(os.environ['CHAIN_YEAR']) + 1),
                  'previous_run_id': os.environ['GITHUB_RUN_ID'],
                  'source_sha': os.environ['SOURCE_SHA'],
              },
          }
          print(json.dumps(payload, separators=(',', ':')))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/backtester-strict-pit-20y.yml/dispatches" \
            --data-binary @/tmp/next-year-dispatch.json
          echo "Dispatched causal certification year ${NEXT_YEAR} from run ${GITHUB_RUN_ID}"
