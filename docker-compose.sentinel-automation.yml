# Explicit signed-authority overlay. Do not pass this file for ordinary manual
# CLI or panel operation: required immutable artifact facts intentionally make
# merged Compose resolution fail until an operator names reviewed artifacts.
x-sentinel-authorized-environment: &sentinel-authorized-environment
  ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
  ALPACA_API_KEY: ${ALPACA_API_KEY:-}
  ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
  SENTINEL_DATABASE_URL: postgresql://sentinel:${SENTINEL_POSTGRES_PASSWORD:?set SENTINEL_POSTGRES_PASSWORD}@sentinel-postgres:5432/sentinel
  SHARADAR_API_KEY: ${SHARADAR_API_KEY:-}
  SENTINEL_GIT_COMMIT: ${SENTINEL_GIT_COMMIT:?set exact built Git commit}
  SENTINEL_RUNTIME_IMAGE_DIGEST: ${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable runtime image digest}
  SENTINEL_TEST_IMAGE_DIGEST: ${SENTINEL_TEST_IMAGE_DIGEST:?set immutable certification test image digest}
  SENTINEL_AUTHORIZED_RUNTIME: SIGNED_DIGEST_SERVICE_V1
  SENTINEL_RUNTIME_BACKUP_AUTHORITY: REQUIRED_V1
  SENTINEL_RECOVERED_ORDER_AUTHORITY: STRICT_V1
  SENTINEL_AUTOMATION_PUBLICATION_DELAY_SECONDS: ${SENTINEL_AUTOMATION_PUBLICATION_DELAY_SECONDS:-900}
  SENTINEL_AUTOMATION_PUBLICATION_TIMING_POLICY: ${SENTINEL_AUTOMATION_PUBLICATION_TIMING_POLICY:-SHARADAR_SEP_SFP_SECOND_UPDATE_PLUS_15M_2345_AMERICA_NEW_YORK_V1}
  SENTINEL_AUTOMATION_EXECUTION_DELAY_SECONDS: ${SENTINEL_AUTOMATION_EXECUTION_DELAY_SECONDS:-60}
  SENTINEL_AUTOMATION_LEASE_SECONDS: ${SENTINEL_AUTOMATION_LEASE_SECONDS:-12}
  SENTINEL_AUTOMATION_HEARTBEAT_SECONDS: ${SENTINEL_AUTOMATION_HEARTBEAT_SECONDS:-3}
  SENTINEL_AUTOMATION_CONTROL_POLL_SECONDS: ${SENTINEL_AUTOMATION_CONTROL_POLL_SECONDS:-3}
  SENTINEL_AUTOMATION_RETRY_BASE_SECONDS: ${SENTINEL_AUTOMATION_RETRY_BASE_SECONDS:-5}
  SENTINEL_AUTOMATION_RETRY_MAX_SECONDS: ${SENTINEL_AUTOMATION_RETRY_MAX_SECONDS:-900}
  SENTINEL_AUTOMATION_CALLBACK_DEADLINE_SECONDS: ${SENTINEL_AUTOMATION_CALLBACK_DEADLINE_SECONDS:-900}
  SENTINEL_AUTOMATION_REFRESH_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_REFRESH_MAX_ATTEMPTS:-8}
  SENTINEL_AUTOMATION_PREFLIGHT_RECOVER_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_PREFLIGHT_RECOVER_MAX_ATTEMPTS:-8}
  SENTINEL_AUTOMATION_PREPARE_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_PREPARE_MAX_ATTEMPTS:-8}
  SENTINEL_AUTOMATION_EXECUTE_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_EXECUTE_MAX_ATTEMPTS:-8}
  SENTINEL_AUTOMATION_RECOVER_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_RECOVER_MAX_ATTEMPTS:-8}
  SENTINEL_AUTOMATION_ALERT_CLAIM_SECONDS: ${SENTINEL_AUTOMATION_ALERT_CLAIM_SECONDS:-60}
  SENTINEL_AUTOMATION_ALERT_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_ALERT_MAX_ATTEMPTS:-1000000}
  SENTINEL_AUTOMATION_SUPERVISOR_POLL_SECONDS: ${SENTINEL_AUTOMATION_SUPERVISOR_POLL_SECONDS:-2}
  SENTINEL_AUTOMATION_SUPERVISOR_STARTUP_GRACE_SECONDS: ${SENTINEL_AUTOMATION_SUPERVISOR_STARTUP_GRACE_SECONDS:-20}
  SENTINEL_SHADOW_OBSERVATION_ENABLED: ${SENTINEL_SHADOW_OBSERVATION_ENABLED:-0}
  SENTINEL_SHADOW_OBSERVATION_ID: ${SENTINEL_SHADOW_OBSERVATION_ID:-primary}
  SENTINEL_SHADOW_STARTING_CASH: ${SENTINEL_SHADOW_STARTING_CASH:-100000}
  SENTINEL_SHADOW_REGENESIS_APPROVAL_SHA256: ${SENTINEL_SHADOW_REGENESIS_APPROVAL_SHA256:-}
  SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256: ${SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256:-}
  SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256: ${SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256:-}
  SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256: ${SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256:-}
  SENTINEL_REVIEWED_VALIDATION_BUNDLE_SHA256: ${SENTINEL_REVIEWED_VALIDATION_BUNDLE_SHA256:-}
  SENTINEL_REVIEWED_DEPLOYMENT_MODE: ${SENTINEL_REVIEWED_DEPLOYMENT_MODE:-}

services:
  # A narrow, networkless root helper repairs only the access bits required to
  # present public signed certificates to the fixed uid/gid 10001 runtime. The
  # deployment attempt directories themselves are intentionally 0700, so file
  # chmod alone is insufficient. Receipts, command logs and candidates remain
  # unreadable; directories gain execute-only traversal and signed certificate
  # JSON gains read permission. No broker/database credentials enter this helper.
  sentinel-authority-permissions:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    profiles: ["authorized-cli"]
    restart: "no"
    network_mode: "none"
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["sh", "-ceu"]
    command:
      - |
        find /authority -type d -exec chmod 0711 {} +
        find /authority -type f -name '*-certificate.json' -exec chmod 0644 {} +
    volumes:
      - type: bind
        source: ${SENTINEL_AUTHORITY_ARTIFACTS_DIR:-./artifacts/authority}
        target: /authority

  sentinel-authorized-cli:
    image: ${SENTINEL_RUNTIME_IMAGE_REPOSITORY:-sentinel-authorized}@${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable SENTINEL_RUNTIME_IMAGE_DIGEST}
    profiles: ["authorized-cli"]
    restart: "no"
    mem_limit: 2g
    cpus: 1.0
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["status"]
    environment:
      <<: *sentinel-authorized-environment
      SENTINEL_AUTHORITY_ARTIFACTS_DIR: /var/lib/sentinel-authority
    volumes:
      - sentinel_state:/var/lib/sentinel
      - type: bind
        source: ${SENTINEL_AUTHORITY_ARTIFACTS_DIR:-./artifacts/authority}
        target: /var/lib/sentinel-authority
        read_only: true
    depends_on:
      sentinel-postgres:
        condition: service_healthy
      sentinel-authority-permissions:
        condition: service_completed_successfully

  sentinel-automation:
    image: ${SENTINEL_RUNTIME_IMAGE_REPOSITORY:-sentinel-authorized}@${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable SENTINEL_RUNTIME_IMAGE_DIGEST}
    profiles: ["automation"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "-m", "sentinel.automation_supervisor"]
    environment:
      <<: *sentinel-authorized-environment
      SENTINEL_FEED_AUTHORIZED: DEPLOYED_REVIEWED_IMAGE_V1
      SENTINEL_FEED_SERVICE_MODE: AUTOMATION
      SENTINEL_FEED_GIT_COMMIT: ${SENTINEL_GIT_COMMIT:?set exact built Git commit}
      SENTINEL_FEED_RUNTIME_IMAGE_DIGEST: ${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable runtime image digest}
      SENTINEL_SHADOW_OBSERVATION_ENABLED: "0"
    healthcheck:
      test: ["CMD", "python", "-m", "sentinel.automation_liveness"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s
    depends_on:
      sentinel-postgres:
        condition: service_healthy

  sentinel-alert-dispatcher:
    image: ${SENTINEL_RUNTIME_IMAGE_REPOSITORY:-sentinel-authorized}@${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable SENTINEL_RUNTIME_IMAGE_DIGEST}
    profiles: ["automation"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "-m", "sentinel.alert_service"]
    environment:
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      SENTINEL_DATABASE_URL: postgresql://sentinel:${SENTINEL_POSTGRES_PASSWORD:?set SENTINEL_POSTGRES_PASSWORD}@sentinel-postgres:5432/sentinel
      SENTINEL_AUTOMATION_ALERT_WEBHOOK_URL: ${SENTINEL_AUTOMATION_ALERT_WEBHOOK_URL:?set external HTTPS alert webhook}
      SENTINEL_AUTOMATION_ALERT_DISPATCHER_ID: primary
      SENTINEL_AUTOMATION_ALERT_WEBHOOK_TIMEOUT_SECONDS: ${SENTINEL_AUTOMATION_ALERT_WEBHOOK_TIMEOUT_SECONDS:-10}
      SENTINEL_AUTOMATION_ALERT_POLL_SECONDS: ${SENTINEL_AUTOMATION_ALERT_POLL_SECONDS:-2}
      SENTINEL_AUTOMATION_ALERT_PROBE_SECONDS: ${SENTINEL_AUTOMATION_ALERT_PROBE_SECONDS:-300}
      SENTINEL_AUTOMATION_ALERT_MAX_CONSECUTIVE_FAILURES: ${SENTINEL_AUTOMATION_ALERT_MAX_CONSECUTIVE_FAILURES:-3}
      SENTINEL_AUTOMATION_ALERT_HEALTH_MAX_AGE_SECONDS: ${SENTINEL_AUTOMATION_ALERT_HEALTH_MAX_AGE_SECONDS:-30}
      SENTINEL_AUTOMATION_ALERT_STARTUP_GRACE_SECONDS: ${SENTINEL_AUTOMATION_ALERT_STARTUP_GRACE_SECONDS:-330}
      SENTINEL_AUTOMATION_ALERT_CLAIM_SECONDS: ${SENTINEL_AUTOMATION_ALERT_CLAIM_SECONDS:-60}
      SENTINEL_AUTOMATION_ALERT_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_ALERT_MAX_ATTEMPTS:-1000000}
      SENTINEL_AUTOMATION_RETRY_BASE_SECONDS: ${SENTINEL_AUTOMATION_RETRY_BASE_SECONDS:-5}
      SENTINEL_AUTOMATION_RETRY_MAX_SECONDS: ${SENTINEL_AUTOMATION_RETRY_MAX_SECONDS:-900}
      SENTINEL_AUTOMATION_CALLBACK_DEADLINE_SECONDS: ${SENTINEL_AUTOMATION_CALLBACK_DEADLINE_SECONDS:-900}
      SENTINEL_AUTOMATION_REFRESH_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_REFRESH_MAX_ATTEMPTS:-8}
      SENTINEL_AUTOMATION_PREFLIGHT_RECOVER_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_PREFLIGHT_RECOVER_MAX_ATTEMPTS:-8}
      SENTINEL_AUTOMATION_PREPARE_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_PREPARE_MAX_ATTEMPTS:-8}
      SENTINEL_AUTOMATION_EXECUTE_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_EXECUTE_MAX_ATTEMPTS:-8}
      SENTINEL_AUTOMATION_RECOVER_MAX_ATTEMPTS: ${SENTINEL_AUTOMATION_RECOVER_MAX_ATTEMPTS:-8}
    healthcheck:
      test: ["CMD", "python", "-m", "sentinel.alert_liveness"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 20s
    depends_on:
      sentinel-postgres:
        condition: service_healthy

  sentinel-shadow:
    image: ${SENTINEL_RUNTIME_IMAGE_REPOSITORY:-sentinel-authorized}@${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable SENTINEL_RUNTIME_IMAGE_DIGEST}
    profiles: ["shadow"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "-m", "sentinel.shadow_supervisor"]
    environment:
      SENTINEL_DATABASE_URL: postgresql://sentinel:${SENTINEL_POSTGRES_PASSWORD:?set SENTINEL_POSTGRES_PASSWORD}@sentinel-postgres:5432/sentinel
      SHARADAR_API_KEY: ${SHARADAR_API_KEY:-}
      SENTINEL_GIT_COMMIT: ${SENTINEL_GIT_COMMIT:?set exact built Git commit}
      SENTINEL_RUNTIME_IMAGE_DIGEST: ${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable runtime image digest}
      SENTINEL_RUNTIME_BACKUP_AUTHORITY: REQUIRED_V1
      SENTINEL_FEED_AUTHORIZED: DEPLOYED_REVIEWED_IMAGE_V1
      SENTINEL_FEED_SERVICE_MODE: SHADOW
      SENTINEL_FEED_GIT_COMMIT: ${SENTINEL_GIT_COMMIT:?set exact built Git commit}
      SENTINEL_FEED_RUNTIME_IMAGE_DIGEST: ${SENTINEL_RUNTIME_IMAGE_DIGEST:?set immutable runtime image digest}
      SENTINEL_SHADOW_OBSERVATION_ENABLED: ${SENTINEL_SHADOW_OBSERVATION_ENABLED:-0}
      SENTINEL_SHADOW_OBSERVATION_ID: ${SENTINEL_SHADOW_OBSERVATION_ID:-primary}
      SENTINEL_SHADOW_STARTING_CASH: ${SENTINEL_SHADOW_STARTING_CASH:-100000}
      SENTINEL_SHADOW_POLL_SECONDS: ${SENTINEL_SHADOW_POLL_SECONDS:-300}
      SENTINEL_SHADOW_ADVANCE_DEADLINE_SECONDS: ${SENTINEL_SHADOW_ADVANCE_DEADLINE_SECONDS:-7200}
      SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256: ${SENTINEL_VALIDATED_SOURCE_IDENTITY_SHA256:-}
      SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256: ${SENTINEL_VALIDATED_SHADOW_CONFIG_SHA256:-}
      SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256: ${SENTINEL_VALIDATED_DATA_PUBLICATION_SHA256:-}
      SENTINEL_SHADOW_PUBLICATION_TIMING_POLICY: ${SENTINEL_SHADOW_PUBLICATION_TIMING_POLICY:-SHARADAR_SEP_SFP_SECOND_UPDATE_PLUS_15M_2345_AMERICA_NEW_YORK_V1}
      SENTINEL_REVIEWED_VALIDATION_BUNDLE_SHA256: ${SENTINEL_REVIEWED_VALIDATION_BUNDLE_SHA256:-}
      SENTINEL_REVIEWED_DEPLOYMENT_MODE: ${SENTINEL_REVIEWED_DEPLOYMENT_MODE:-}
    healthcheck:
      test: ["CMD", "python", "-m", "sentinel.shadow_supervisor", "--health"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 20s
    depends_on:
      sentinel-postgres:
        condition: service_healthy
